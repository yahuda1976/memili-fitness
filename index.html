<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMILI FITNESS - TAMİR MODU</title>
    <style>
        :root { --p: #ff4500; --s: #2ecc71; --bg: #121212; --card: #1e1e1e; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        .main-card { background: var(--card); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; cursor: pointer; border: 1px solid #333; }
        .icon { font-size: 2.5rem; }
        
        .flow-btn { width: 100%; background: linear-gradient(45deg, #ff4500, #ff8c00); color: white; border: none; padding: 18px; border-radius: 15px; font-weight: bold; font-size: 1.1rem; margin: 15px 0; cursor: pointer; }

        .sub-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); padding: 20px; box-sizing: border-box; overflow-y: auto; z-index: 100; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-btn { background: var(--p); color: white; border: none; padding: 10px 15px; border-radius: 10px; font-weight: bold; }
        
        .input-group { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #444; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: none; background: #333; color: white; box-sizing: border-box; }
        .add-btn { width: 100%; background: var(--s); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        ul { list-style: none; padding: 0; }
        li { background: #2a2a2a; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid var(--p); }
        .del-btn { color: #ff3b30; cursor: pointer; font-weight: bold; }
        
        .flow-item { background: #1e1e1e; border-left: 5px solid var(--s); margin-bottom: 15px; padding: 15px; border-radius: 12px; }
        .flow-time { color: var(--p); font-weight: bold; }
        .backup-btns { display: flex; gap: 5px; margin-bottom: 10px; }
        .backup-btn { flex: 1; font-size: 0.6rem; padding: 5px; background: #222; color: #777; border: 1px solid #333; border-radius: 5px; }
    </style>
</head>
<body>

    <h1 style="text-align: center; color: var(--p);">MEMILI FITNESS 🚀</h1>
    
    <div class="input-group">
        <label>Günü Seç:</label>
        <input type="date" id="globalDate" onchange="updateAll()">
    </div>

    <button class="flow-btn" onclick="openFlow()">📅 BUGÜNKÜ AKIŞIM</button>

    <div class="grid-container">
        <div class="main-card" onclick="openSub('mutfak')"><span class="icon">🍳</span><h2>MUTFAK</h2></div>
        <div class="main-card" onclick="openSub('egzersiz')"><span class="icon">🏋️</span><h2>EGZERSİZ</h2></div>
        <div class="main-card" onclick="openSub('supplement')"><span class="icon">💊</span><h2>SUPP</h2></div>
        <div class="main-card" onclick="openSub('su')"><span class="icon">💧</span><h2>SU/ALARM</h2></div>
    </div>

    <div class="backup-btns" style="margin-top:20px;">
        <button class="backup-btn" onclick="exportData()">YEDEKLE</button>
        <button class="backup-btn" onclick="importData()">GERİ YÜKLE</button>
    </div>

    <div id="sub-page-container" class="sub-page">
        <div class="header">
            <button class="back-btn" onclick="closeSub()">← GERİ</button>
            <h2 id="sub-title">BÖLÜM</h2>
        </div>
        <div id="item-input-ui">
            <div class="input-group">
                <input type="time" id="itemTime">
                <input type="text" id="itemDesc" placeholder="Detay yaz kankam...">
                <button class="add-btn" onclick="saveData()">KAYDET</button>
            </div>
        </div>
        <ul id="main-list"></ul>
    </div>
