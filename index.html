<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Pro V2</title>
<style>
body{margin:0;font-family:Arial;background:#0b0b0b;color:#fff}
.header{display:flex;justify-content:space-around;background:#111;padding:10px}
.tab{cursor:pointer;padding:10px 15px;border-radius:10px}
.tab.active{background:#00ffc3;color:#000}
.section{display:none;padding:10px}
.section.active{display:block}
.card{background:#1e1e1e;margin:10px;padding:15px;border-radius:10px;text-align:center;cursor:pointer}
input{padding:10px;margin:5px;width:90%;border-radius:8px;border:none}
button{padding:10px 15px;border:none;border-radius:10px;background:#00ffc3;color:#000;font-weight:bold;cursor:pointer}
</style>
</head>
<body><div class="header">
<div class="tab active" onclick="showTab('antrenman')">🏋️</div>
<div class="tab" onclick="showTab('tracking')">📈</div>
<div class="tab" onclick="showTab('program')">🔥</div>
</div><div id="antrenman" class="section active">
<h2>Antrenman Planı</h2>
<p>Buraya mevcut app gelecek (dokunmadık)</p>
</div><div id="tracking" class="section">
<h2>Kilo & Güç Takip</h2>
<input id="kilo" placeholder="Kilo">
<input id="bench" placeholder="Bench kg">
<input id="squat" placeholder="Squat kg">
<button onclick="saveData()">Kaydet</button>
<p id="output"></p>
</div><div id="program" class="section">
<h2>Program Seç</h2>
<div class="card" onclick="selectProgram('level1')">💥 Level 1</div>
<div class="card" onclick="selectProgram('level2')">🔥 Level 2</div>
<div class="card" onclick="selectProgram('def')">🧊 Definasyon</div>
<div class="card" onclick="selectProgram('bulk')">🍚 Bulk</div>
<p id="programSec"></p>
</div><script>
function showTab(tab){
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 event.target.classList.add('active');
 document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
 document.getElementById(tab).classList.add('active');
}

function saveData(){
 let kilo=document.getElementById('kilo').value;
 let bench=document.getElementById('bench').value;
 let squat=document.getElementById('squat').value;
 localStorage.setItem('kilo',kilo);
 localStorage.setItem('bench',bench);
 localStorage.setItem('squat',squat);
 document.getElementById('output').innerText="Kaydedildi ✔";
}

function selectProgram(p){
 localStorage.setItem('program',p);
 document.getElementById('programSec').innerText="Seçilen: "+p;
}
</script></body>
</html>
