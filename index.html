    else if (product.protein >= 5) { score += 1; tags.push("👍 Orta protein"); }
    else tags.push("❌ Düşük protein");
    if (product.carbs > 20) tags.push("⚡ Yüksek karbonhidrat");
    else tags.push("🥗 Düşük karbonhidrat");
    if (product.fat > 15) { score -= 1; tags.push("⚠️ Yüksek yağ"); }
    else { score += 1; tags.push("👌 Dengeli yağ"); }
    let verdict = score >= 3 ? "💪 SPORCU ÜRÜNÜ" : (score >= 1 ? "👌 İdare eder" : "❌ Çöp ürün");
    return { score, tags, verdict };
}
function generateMealSuggestion(currentMacros) {
    let remaining = {
        protein: DAILY_TARGET.protein - currentMacros.p,
        carbs: DAILY_TARGET.carbs - currentMacros.k,
        fat: DAILY_TARGET.fat - currentMacros.f
    };
    let priority = "protein";
    if (remaining.carbs > remaining.protein) priority = "carbs";
    if (remaining.fat > remaining.protein && remaining.fat > remaining.carbs) priority = "fat";
    // Basit besin veritabanı (100g başına yaklaşık makro)
    const foodSuggestions = {
        protein: [{ name: "Tavuk Göğsü", protein: 31, carbs: 0, fat: 3.6 }, { name: "Ton Balığı", protein: 30, carbs: 0, fat: 1 }, { name: "Yumurta", protein: 13, carbs: 0.6, fat: 11 }, { name: "Whey Protein", protein: 80, carbs: 5, fat: 2 }],
        carbs: [{ name: "Pirinç", protein: 2.7, carbs: 28, fat: 0.3 }, { name: "Yulaf", protein: 13, carbs: 68, fat: 7 }, { name: "Muz", protein: 1.1, carbs: 23, fat: 0.3 }],
        fat: [{ name: "Zeytinyağı", protein: 0, carbs: 0, fat: 100 }, { name: "Fındık", protein: 14, carbs: 17, fat: 54 }, { name: "Ceviz", protein: 15, carbs: 14, fat: 65 }]
    };
    let best = foodSuggestions[priority][0];
    let message = priority === "protein" ? "💪 Protein eksiğin var" : (priority === "carbs" ? "⚡ Karbonhidrat lazım" : "🥑 Yağ eksiğin var");
    return { best, message, remaining };
}
function getCurrentMacrosForDay(day) {
    let total = { cal:0, p:0, k:0, f:0 };
    let items = currentWeekData[day];
    if (items) items.forEach((item,idx)=>{
        let key = `${day}|meal|${idx}`;
        if (doneState[key] && typeof item === "string" && !item.includes("💧")) {
            let m = parseFoodMacros(item);
            total.p += m.p; total.k += m.k; total.f += m.f;
        }
    });
    return total;
}

function getCurrentWeekKey(){ let now=new Date(); let startOfYear=new Date(now.getFullYear(),0,1); let days=Math.floor((now-startOfYear)/(24*60*60*1000)); let week=Math.ceil((days+startOfYear.getDay()+1)/7); return `${now.getFullYear()}-W${week}`; }

function saveDataToLocal(){ let archiveToSave={}; for(let k in weekArchive) archiveToSave[k]={ weekData:weekArchive[k].weekData, weekStartDate:weekArchive[k].weekStartDate }; localStorage.setItem("weekArchive",JSON.stringify(archiveToSave)); localStorage.setItem("currentWeekKey",currentWeekKey); localStorage.setItem("doneState",JSON.stringify(doneState)); localStorage.setItem("waterIntake",JSON.stringify(waterIntake)); localStorage.setItem("totalSetCount",totalSetCount); localStorage.setItem("setLogs",JSON.stringify(setLogs)); localStorage.setItem("muscleLastTrained",JSON.stringify(muscleLastTrained)); localStorage.setItem("supplements",JSON.stringify(supplements)); localStorage.setItem("bodyMeasurements",JSON.stringify(bodyMeasurements)); if(beforePhoto) localStorage.setItem("beforePhoto",beforePhoto); if(afterPhoto) localStorage.setItem("afterPhoto",afterPhoto); }
function loadDataFromLocal(){ let archive=localStorage.getItem("weekArchive"); if(archive) weekArchive=JSON.parse(archive); let savedKey=localStorage.getItem("currentWeekKey"); let currentKey=getCurrentWeekKey(); if(savedKey===currentKey&&weekArchive[currentKey]){ currentWeekKey=currentKey; currentWeekData=weekArchive[currentKey].weekData; } else initNewWeek(); let ds=localStorage.getItem("doneState"); if(ds) doneState=JSON.parse(ds); let wi=localStorage.getItem("waterIntake"); if(wi) waterIntake=JSON.parse(wi); let tsc=localStorage.getItem("totalSetCount"); if(tsc) totalSetCount=parseInt(tsc); let sl=localStorage.getItem("setLogs"); if(sl) setLogs=JSON.parse(sl); let ml=localStorage.getItem("muscleLastTrained"); if(ml) muscleLastTrained=JSON.parse(ml); let sup=localStorage.getItem("supplements"); if(sup) supplements=JSON.parse(sup); let bm=localStorage.getItem("bodyMeasurements"); if(bm) bodyMeasurements=JSON.parse(bm); let bf=localStorage.getItem("beforePhoto"); if(bf) beforePhoto=bf; let af=localStorage.getItem("afterPhoto"); if(af) afterPhoto=af; }

function getDayStats(day){ let items=currentWeekData[day]; if(!items) return {total:0,completed:0,percent:0}; let total=0,comp=0; items.forEach((item,idx)=>{ if(typeof item==="string"){ total++; if(doneState[`${day}|meal|${idx}`]) comp++; }else if(item&&typeof item==="object"&&item.sets){ for(let s=1;s<=item.sets;s++){ total++; if(doneState[`${day}|set|${item.ex}|${s}`]) comp++; } } }); let percent=total===0?0:(comp/total)*100; return {total,completed:comp,percent}; }

function refreshExerciseList(){ let day=document.getElementById("exerciseManageDay").value, cont=document.getElementById("exerciseList"); if(!day||!currentWeekData[day]){ cont.innerHTML="<i>Gün seçin</i>"; return; } cont.innerHTML=""; currentWeekData[day].forEach((it,idx)=>{ if(it&&typeof it==="object"&&it.ex){ let div=document.createElement("div"); div.style.display="flex"; div.style.justifyContent="space-between"; div.style.padding="10px"; div.style.margin="5px 0"; div.style.background="#2C2C2E"; div.style.borderRadius="12px"; div.innerHTML=`<span style="flex:1;">💪 ${it.ex} (${it.sets} set)</span><div><button class="move-btn" onclick="moveItemUp('${day}',${idx})">⬆️</button><button class="move-btn" onclick="moveItemDown('${day}',${idx})">⬇️</button><button onclick="deleteExercise('${day}',${idx})" style="background:#FF3B30; border:none; padding:4px 8px;">Sil</button></div>`; cont.appendChild(div); } }); }
function deleteExercise(day,idx){ if(confirm("Sil?")){ currentWeekData[day].splice(idx,1); saveDataToLocal(); refreshExerciseList(); if(currentDayOpen===day) renderDayItems(day); buildHome(); showToast("Silindi"); } }
function addExerciseToDay(){ let day=document.getElementById("exerciseManageDay").value, name=document.getElementById("newExerciseName").value, sets=parseInt(document.getElementById("newExerciseSets").value); if(!day||!name||!sets){ showToast("Gün, hareket ve set sayısı girin"); return; } currentWeekData[day].push({ex:name, sets:sets, link:"", notes:""}); saveDataToLocal(); document.getElementById("newExerciseName").value=""; document.getElementById("newExerciseSets").value=""; refreshExerciseList(); if(currentDayOpen===day) renderDayItems(day); buildHome(); showToast(`✅ "${name}" eklendi`); }
function updateSupplementsDisplay(){ let cont=document.getElementById("supplementList"); if(!cont) return; cont.innerHTML=""; supplements.forEach((sup,idx)=>{ let div=document.createElement("div"); div.style.display="flex"; div.style.justifyContent="space-between"; div.style.padding="8px"; div.style.borderBottom="1px solid rgba(255,255,255,0.1)"; div.innerHTML=`<span>💊 ${sup.name} - ${sup.time}</span><button onclick="deleteSupplement(${idx})" style="background:#FF3B30; border:none; padding:4px 8px;">Sil</button>`; cont.appendChild(div); }); }
function deleteSupplement(idx){ if(confirm("Sil?")){ supplements.splice(idx,1); saveDataToLocal(); updateSupplementsDisplay(); showToast("Silindi"); } }
function addSupplement(){ let name=document.getElementById("newSupplementName").value, time=document.getElementById("newSupplementTime").value; if(!name||!time){ showToast("Ad ve zaman girin"); return; } supplements.push({name,time}); saveDataToLocal(); document.getElementById("newSupplementName").value=""; document.getElementById("newSupplementTime").value=""; updateSupplementsDisplay(); showToast(`✅ "${name}" eklendi`); }
function backupData(){ let exp={weekArchive,currentWeekKey,doneState,waterIntake,totalSetCount,setLogs,muscleLastTrained,supplements,bodyMeasurements,beforePhoto,afterPhoto}; let str=JSON.stringify(exp); let a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([str])); a.download=`fitness_backup_${new Date().toISOString().slice(0,19)}.json`; a.click(); showToast("Yedek alındı"); }
function restoreData(){ let inp=document.createElement("input"); inp.type="file"; inp.accept="application/json"; inp.onchange=e=>{ let file=e.target.files[0]; let reader=new FileReader(); reader.onload=ev=>{ try{ let imp=JSON.parse(ev.target.result); if(imp.weekArchive) weekArchive=imp.weekArchive; if(imp.currentWeekKey) currentWeekKey=imp.currentWeekKey; if(imp.doneState) doneState=imp.doneState; if(imp.waterIntake) waterIntake=imp.waterIntake; if(imp.totalSetCount!==undefined) totalSetCount=imp.totalSetCount; if(imp.setLogs) setLogs=imp.setLogs; if(imp.muscleLastTrained) muscleLastTrained=imp.muscleLastTrained; if(imp.supplements) supplements=imp.supplements; if(imp.bodyMeasurements) bodyMeasurements=imp.bodyMeasurements; if(imp.beforePhoto) beforePhoto=imp.beforePhoto; if(imp.afterPhoto) afterPhoto=imp.afterPhoto; if(weekArchive[currentWeekKey]) currentWeekData=weekArchive[currentWeekKey].weekData; else initNewWeek(); saveDataToLocal(); if(currentDayOpen) renderDayItems(currentDayOpen); buildHome(); showToast("Yedek yüklendi"); }catch(err){ alert("Hatalı dosya"); } }; reader.readAsText(file); }; inp.click(); }
function saveBodyMeasurements(){ bodyMeasurements.weight=parseFloat(document.getElementById("bodyWeight").value)||0; bodyMeasurements.waist=parseFloat(document.getElementById("bodyWaist").value)||0; bodyMeasurements.chest=parseFloat(document.getElementById("bodyChest").value)||0; bodyMeasurements.arm=parseFloat(document.getElementById("bodyArm").value)||0; bodyMeasurements.leg=parseFloat(document.getElementById("bodyLeg").value)||0; saveDataToLocal(); showToast("Ölçüler kaydedildi"); }
function uploadPhoto(type){ let inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.onchange=e=>{ let file=e.target.files[0]; if(file){ let reader=new FileReader(); reader.onload=ev=>{ if(type==="before") beforePhoto=ev.target.result; else afterPhoto=ev.target.result; saveDataToLocal(); updateBodyMeasurementsUI(); showToast(`📸 ${type==="before"?"Önce":"Sonra"} fotoğraf eklendi`); }; reader.readAsDataURL(file); } }; inp.click(); }
function updateBodyMeasurementsUI(){ document.getElementById("bodyWeight").value=bodyMeasurements.weight||""; document.getElementById("bodyWaist").value=bodyMeasurements.waist||""; document.getElementById("bodyChest").value=bodyMeasurements.chest||""; document.getElementById("bodyArm").value=bodyMeasurements.arm||""; document.getElementById("bodyLeg").value=bodyMeasurements.leg||""; let cont=document.getElementById("photoContainer"); if(cont) cont.innerHTML=`<div><strong>📸 ÖNCE</strong><br>${beforePhoto?`<img src="${beforePhoto}" style="max-width:100%; border-radius:20px;">`:"Fotoğraf yok"}<br><button onclick="uploadPhoto('before')">Değiştir</button></div><div><strong>📸 SONRA</strong><br>${afterPhoto?`<img src="${afterPhoto}" style="max-width:100%; border-radius:20px;">`:"Fotoğraf yok"}<br><button onclick="uploadPhoto('after')">Değiştir</button></div>`; let sliderDiv=document.getElementById("sliderContainer"); if(beforePhoto&&afterPhoto){ sliderDiv.style.display="block"; if(!document.getElementById("photoSlider")){ sliderDiv.innerHTML='<input type="range" id="photoSlider" min="0" max="100" value="0" step="1"><div style="display:flex; justify-content:space-between;"><span>🔘 ÖNCE</span><span>🔘 SONRA</span></div>'; let slider=document.getElementById("photoSlider"); slider.addEventListener("input",(e)=>{ let val=e.target.value; let imgs=document.querySelectorAll("#photoContainer img"); if(imgs[0]) imgs[0].style.opacity=(100-val)/100; if(imgs[1]) imgs[1].style.opacity=val/100; }); } }else sliderDiv.style.display="none"; }

// ========== DÜZELTİLMİŞ BARKOD KAMERA + AI ANALİZ ==========
function openBarcodeFoodModal() {
    let modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML = `
        <div class="modal-content">
            <h3>📷 Barkod ile Besin Ekle</h3>
            <div class="modal-buttons">
                <button class="modal-btn confirm" onclick="openCameraBarcode()">📷 KAMERA İLE OKU</button>
                <button class="modal-btn cancel" onclick="showManualBarcodeInput()">✏️ MANUEL GİRİŞ</button>
            </div>
            <div id="barcodeManualArea" style="display:none; margin-top:12px;">
                <input type="text" id="manualBarcode" placeholder="Barkod numarası">
                <button class="modal-btn confirm" onclick="fetchManualBarcode()">ARA</button>
            </div>
            <div id="barcodeResult"></div>
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="this.closest('.modal').remove()">Kapat</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
}
function showManualBarcodeInput() { document.getElementById("barcodeManualArea").style.display = "block"; }
async function fetchManualBarcode() {
    let barcode = document.getElementById("manualBarcode").value.trim();
    if (!barcode) { showToast("Barkod girin"); return; }
    await fetchAndShowProduct(barcode);
}
async function fetchAndShowProduct(barcode) {
    try {
        let res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
        let data = await res.json();
        let resultDiv = document.getElementById("barcodeResult");
        if (data.status === 1) {
            let p = data.product;
            let name = p.product_name || "Bilinmiyor";
            let nut = p.nutriments || {};
            // Farklı anahtar isimlerini dene
            let kcal = nut["energy-kcal"] || nut["energy_value"] || 0;
            let prot = nut.proteins || nut["proteins_value"] || 0;
            let carb = nut.carbohydrates || nut["carbohydrates_value"] || 0;
            let fat = nut.fat || nut["fat_value"] || 0;
            let productObj = { name: name, calories: kcal, protein: prot, carbs: carb, fat: fat };
            // AI ANALİZ
            let analysis = analyzeProduct(productObj);
            // Günlük makro toplamını al (mevcut gün için)
            let currentMacros = getCurrentMacrosForDay(currentDayOpen || "PAZARTESI");
            let aiSuggestion = generateMealSuggestion(currentMacros);
            let suggestionHtml = `
                <div class="ai-analysis-box">
                    <strong>🧠 AI Analiz</strong><br>
                    ${analysis.tags.map(t => `<span class="ai-tag">${t}</span>`).join(' ')}<br>
                    <strong>🎯 Karar:</strong> ${analysis.verdict}
                    <hr style="margin:8px 0; border-color:#444;">
                    <strong>🍽️ AI Yemek Önerisi</strong><br>
                    ${aiSuggestion.message}<br>
                    Önerilen: <strong>${aiSuggestion.best.name}</strong> (${aiSuggestion.best.protein}g protein, ${aiSuggestion.best.carbs}g karb, ${aiSuggestion.best.fat}g yağ)<br>
                    Kalan: Protein ${Math.max(0,aiSuggestion.remaining.protein)}g, Karb ${Math.max(0,aiSuggestion.remaining.carbs)}g, Yağ ${Math.max(0,aiSuggestion.remaining.fat)}g
                </div>
            `;
            let daysHtml = Object.keys(currentWeekData).map(day => `<option value="${day}">${day}</option>`).join('');
            resultDiv.innerHTML = `
                <div style="margin:12px 0; padding:12px; background:#2C2C2E; border-radius:16px;">
                    <strong>${escapeHtml(name)}</strong><br>
                    🔥 ${kcal} kcal &nbsp; 💪 ${prot}g &nbsp; 🌾 ${carb}g &nbsp; 🥑 ${fat}g
                </div>
                ${suggestionHtml}
                <select id="targetDaySelect" class="input-number-only">${daysHtml}</select>
                <button class="modal-btn confirm" style="margin-top:8px;" onclick="addProductToSelectedDay('${escapeHtml(name)}', ${kcal}, ${prot}, ${carb}, ${fat})">Seçilen Güne Ekle</button>
                <button class="modal-btn confirm" style="margin-top:8px; background:#e67e22;" onclick="addProductAndEat('${escapeHtml(name)}', ${kcal}, ${prot}, ${carb}, ${fat})">✅ Yedim Ekle (Bugün)</button>
            `;
        } else {
            resultDiv.innerHTML = `<div style="margin:12px 0; padding:12px; background:#c0392b; border-radius:16px;">❌ Ürün bulunamadı. Manuel giriş yapmayı deneyin.</div>`;
        }
    } catch(e) {
        document.getElementById("barcodeResult").innerHTML = `<div style="margin:12px 0; padding:12px; background:#c0392b; border-radius:16px;">Hata oluştu. Lütfen manuel giriş yapın.</div>`;
    }
}
function addProductToSelectedDay(name, kcal, prot, carb, fat) {
    let selectedDay = document.getElementById("targetDaySelect").value;
    if (!selectedDay || !currentWeekData[selectedDay]) {
        showToast("Geçerli gün seçin");
        return;
    }
    let newItem = `${name} | Kalori: ${kcal} | Protein: ${prot} g | Karb: ${carb} g | Yag: ${fat} g`;
    currentWeekData[selectedDay].push(newItem);
    saveDataToLocal();
    if (currentDayOpen === selectedDay) {
        renderDayItems(selectedDay);
        updateDailyMacros();
    }
    showToast(`${name} ${selectedDay} gününe eklendi`);
    document.querySelector(".modal").remove();
}
// Yedim Ekle (direkt bugünün yemeklerine ekler ve işaretler)
function addProductAndEat(name, kcal, prot, carb, fat) {
    let targetDay = currentDayOpen || "PAZARTESI";
    let newItem = `${name} | Kalori: ${kcal} | Protein: ${prot} g | Karb: ${carb} g | Yag: ${fat} g`;
    currentWeekData[targetDay].push(newItem);
    // Otomatik işaretle (tamamlanmış say)
    let newIdx = currentWeekData[targetDay].length - 1;
    let key = `${targetDay}|meal|${newIdx}`;
    doneState[key] = true;
    // Makro toplamını güncelle (işaretli olduğu için sonraki updateDailyMacros da onu sayar)
    saveDataToLocal();
    if (currentDayOpen === targetDay) {
        renderDayItems(targetDay);
        updateDailyMacros();
    }
    showToast(`✅ ${name} yendi! Makrolar eklendi.`);
    document.querySelector(".modal").remove();
}
function openCameraBarcode() {
    let modal = document.querySelector(".modal");
    if (modal) modal.remove();

    let camModal = document.createElement("div");
    camModal.className = "modal";
    camModal.style.justifyContent = "center";
    camModal.style.alignItems = "center";
    camModal.style.flexDirection = "column";
    camModal.innerHTML = `
        <div style="width:90%; max-width:500px; background:#000; border-radius:40px; overflow:hidden;">
            <video id="barcodeCameraVideo" autoplay muted playsinline style="width:100%;"></video>
        </div>
        <button id="closeBarcodeCameraBtn" style="background:#c0392b; margin-top:20px; padding:12px 25px; border-radius:40px; color:white;">✖ KAPAT</button>
        <div id="barcodeCameraStatus" style="color:#ffaa88; margin-top:12px;">📷 KAMERA BAŞLATILIYOR...</div>
    `;
    document.body.appendChild(camModal);

    let video = document.getElementById("barcodeCameraVideo");
    let statusDiv = document.getElementById("barcodeCameraStatus");

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => {
            video.srcObject = stream;
            currentStream = stream;
            video.play();
            if (quaggaActive) Quagga.stop();
            Quagga.init({
                inputStream: { name: "LiveStream", type: "LiveStream", target: video },
                decoder: { readers: ["ean_reader", "ean_8_reader", "upc_reader"] }
            }, err => {
                if (err) { statusDiv.innerHTML = "HATA"; return; }
                Quagga.start();
                quaggaActive = true;
                statusDiv.innerHTML = "🎥 BARKODU GÖSTER...";
            });
            Quagga.onDetected(async (data) => {
                let code = data.codeResult.code;
                Quagga.stop();
                quaggaActive = false;
                if (currentStream) currentStream.getTracks().forEach(t => t.stop());
                camModal.remove();
                await fetchAndShowProduct(code);
            });
        })
        .catch(err => {
            statusDiv.innerHTML = "❌ KAMERA İZNİ GEREKLİ";
            setTimeout(() => camModal.remove(), 2000);
        });
    document.getElementById("closeBarcodeCameraBtn").onclick = () => {
        if (quaggaActive) Quagga.stop();
        if (currentStream) currentStream.getTracks().forEach(t => t.stop());
        camModal.remove();
    };
}

function showToast(msg){ let t=document.createElement("div"); t.className="toast"; t.innerText=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1600); }
function playBeep(){ try{ let ctx=new (window.AudioContext||window.webkitAudioContext)(); let o=ctx.createOscillator(); o.frequency.value=880; let g=ctx.createGain(); g.gain.value=0.1; o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.1); ctx.resume(); }catch(e){} }
function stopTimer(){ if(timerInterval) clearInterval(timerInterval); let tb=document.getElementById("timerBox"); if(tb) tb.style.display="none"; if(currentSound) currentSound.close(); soundStopFlag=false; }
function startTimer(sec){ stopTimer(); let rem=sec; let tb=document.getElementById("timerBox"), tn=document.getElementById("timerNum"); if(!tb||!tn) return; tb.style.display="block"; tn.innerText=rem; timerInterval=setInterval(()=>{ if(rem<=1){ clearInterval(timerInterval); tb.style.display="none"; playLongBeep(); showToast("🔔 Dinlenme bitti!"); }else{ rem--; tn.innerText=rem; } },1000); }
function playLongBeep(){ if(soundStopFlag) return; try{ if(currentSound) currentSound.close(); const ctx=new (window.AudioContext||window.webkitAudioContext)(); currentSound=ctx; const dur=10,int=0.4; let start=ctx.currentTime; const osc=ctx.createOscillator(); const gain=ctx.createGain(); osc.type="square"; osc.frequency.value=880; gain.gain.value=0.18; osc.connect(gain); gain.connect(ctx.destination); osc.start(); for(let i=0;i<dur/int;i++){ let t=start+i*int; gain.gain.setValueAtTime(0.18,t); gain.gain.setValueAtTime(0.00001,t+0.15); } osc.stop(start+dur); ctx.resume(); currentSound={close:()=>{ try{ osc.stop(); ctx.close(); }catch(e){} } }; }catch(e){} }
function customTimer(){ let s=prompt("Saniye:","90"); if(s && !isNaN(parseInt(s)) && parseInt(s)>0) startTimer(parseInt(s)); }
function escapeHtml(s){ if(!s) return ''; return s.replace(/[&<>]/g, m=> m==='&'?'&amp;':m==='<'?'&lt;':'>'?'&gt;':m); }
loadDataFromLocal(); buildHome(); document.getElementById("timerCloseBtn").onclick=stopTimer; document.getElementById("timerCustomBtn").onclick=customTimer; document.getElementById("stopSoundBtn").onclick=()=>{ soundStopFlag=true; if(currentSound) currentSound.close(); };
</script>
