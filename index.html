<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MEMILI FITNESS PRO V2 🚀</title><style>
:root{
  --p:#ff4500;
  --s:#2ecc71;
  --bg:#121212;
  --card:#1e1e1e;
  --text:#fff;
  --muted:#aaa;
}
body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
  padding:10px;
}

h2{color:var(--p); text-align:center;}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.card{
  background:var(--card);
  padding:15px;
  border-radius:15px;
  text-align:center;
  cursor:pointer;
  border:1px solid #333;
}
.card:active{transform:scale(0.97)}

.btn{
  width:100%;
  padding:12px;
  margin:5px 0;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}
.primary{background:var(--p);color:#fff;}
.green{background:var(--s);color:#fff;}

.page{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:var(--bg);
  overflow:auto;
  padding:15px;
}

.item{
  background:var(--card);
  padding:10px;
  border-radius:10px;
  margin:8px 0;
  border-left:4px solid var(--p);
}

.done{
  opacity:0.5;
  text-decoration:line-through;
}

small{color:var(--muted)}

</style></head>
<body><h2>MEMILI FITNESS PRO V2 🚀</h2><button class="btn primary" onclick="openFlow()">🔥 GÜN AKIŞI</button>

<div class="grid">
  <div class="card" onclick="openPage('egzersiz')">🏋️ Egzersiz</div>
  <div class="card" onclick="openPage('mutfak')">🍳 Mutfak</div>
  <div class="card" onclick="openPage('supp')">💊 Supplement</div>
  <div class="card" onclick="openPage('su')">💧 Su Takip</div>
</div><div id="page" class="page">
  <button class="btn" onclick="closePage()">← GERİ</button>
  <h3 id="title"></h3>  <input id="time" type="time" style="width:100%;padding:10px;margin:5px 0" />
  <input id="desc" type="text" placeholder="Ne yapıyoruz kankam?" style="width:100%;padding:10px" /><button class="btn green" onclick="addItem()">+ EKLE</button>

  <div id="list"></div>
</div><div id="flow" class="page">
  <button class="btn" onclick="closeFlow()">← GERİ</button>
  <h3>GÜN AKIŞI</h3>
  <div id="flowList"></div>
</div><script>
let type="";
const cats=["egzersiz","mutfak","supp","su"];
const db=()=>JSON.parse(localStorage.getItem("db")||"{}");
const save=d=>localStorage.setItem("db",JSON.stringify(d));

function openPage(t){
  type=t;
  document.getElementById("title").innerText=t.toUpperCase();
  document.getElementById("page").style.display="block";
  render();
}
function closePage(){document.getElementById("page").style.display="none"}

function addItem(){
  let d=db();
  let date=new Date().toISOString().split('T')[0];
  if(!d[type])d[type]={};
  if(!d[type][date])d[type][date]=[];
  d[type][date].push({
    time:time.value,
    desc:desc.value,
    done:false
  });
  save(d);
  time.value="";
  desc.value="";
  render();
}

function render(){
  let d=db();
  let date=new Date().toISOString().split('T')[0];
  let list=(d[type]&&d[type][date])||[];
  list.sort((a,b)=>a.time.localeCompare(b.time));

  document.getElementById("list").innerHTML=list.map((i,idx)=>`
    <div class="item ${i.done?'done':''}" onclick="toggle(${idx})">
      <b>${i.time}</b> - ${i.desc}
    </div>
  `).join("");
}

function toggle(i){
  let d=db();
  let date=new Date().toISOString().split('T')[0];
  d[type][date][i].done=!d[type][date][i].done;
  save(d);
  render();
  updateStreak();
}

function openFlow(){
  let d=db();
  let date=new Date().toISOString().split('T')[0];
  let all=[];

  cats.forEach(c=>{
    if(d[c]&&d[c][date]){
      d[c][date].forEach(i=>all.push({...i,cat:c}));
    }
  });

  all.sort((a,b)=>a.time.localeCompare(b.time));

  document.getElementById("flowList").innerHTML=
  all.map(i=>`
    <div class="item">
      <small>${i.cat}</small><br>
      <b>${i.time}</b> - ${i.desc}
    </div>
  `).join("");

  document.getElementById("flow").style.display="block";
}

function closeFlow(){document.getElementById("flow").style.display="none"}

// STREAK SYSTEM
function updateStreak(){
  let d=db();
  let streak=parseInt(localStorage.getItem("streak")||"0");
  streak++;
  localStorage.setItem("streak",streak);
}

// NOTIFICATION SIMULATION
setInterval(()=>{
  let now=new Date().toTimeString().slice(0,5);
  let d=db();
  let date=new Date().toISOString().split('T')[0];
  cats.forEach(c=>{
    if(d[c]&&d[c][date]){
      d[c][date].forEach(i=>{
        if(i.time===now && !i.done){
          console.log("ALARM:",i.desc);
        }
      })
    }
  });
},60000);

</script></body>
</html>
