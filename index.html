<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Fitness Pro | Gelişmiş Ayar & Rozetler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #0c111f 0%, #02060c 100%);
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            color: #f0f3fa;
            padding-bottom: 80px;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            text-align: center;
            padding: 28px 20px 16px;
            background: rgba(0, 20, 30, 0.4);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 255, 200, 0.3);
        }
        .header h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #FEE190, #FFB347, #FF6B6B);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .sub {
            font-size: 0.75rem;
            color: #aad0ff;
            margin-top: 6px;
        }

        /* ANA GRID (günler) - SARI ZEMİN + MAVİ KART */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 18px;
            padding: 30px 20px;
        }
        .day-card {
            background: #FFD966;  /* sarı zemin */
            border-radius: 36px;
            padding: 22px 8px;
            text-align: center;
            font-weight: 800;
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.1s linear;
            color: #0a2f4d;
            box-shadow: 0 12px 18px -8px rgba(0,0,0,0.5);
            border: none;
        }
        .day-card:active {
            transform: scale(0.96);
            background: #FFC107;
        }

        /* GÜN DETAY */
        .day-detail {
            padding: 18px 16px 100px;
        }
        .detail-header {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 28px;
        }
        .btn {
            border: none;
            border-radius: 60px;
            padding: 12px 26px;
            font-weight: bold;
            cursor: pointer;
            background: #1f6392;
            color: white;
            font-size: 0.9rem;
            transition: 0.08s linear;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .btn:active { transform: scale(0.96); background: #0e4a70; }
        .day-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0 0 20px;
            background: linear-gradient(120deg, #FFE5B4, #FFA559);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* item kartları */
        .item-card, .set-card {
            background: #14232e;
            margin: 12px 0;
            padding: 16px 20px;
            border-radius: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.05s linear;
            border-left: 6px solid #FFB347;
            box-shadow: 0 5px 10px #00000030;
        }
        .item-card:active, .set-card:active { transform: scale(0.98); background: #1f3a48; }
        .item-card.done, .set-card.done {
            background: #1c6d3fcc;
            text-decoration: line-through;
            border-left-color: gold;
        }
        .ex-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 24px 0 5px 8px;
            color: #FFB347;
            border-left: 4px solid cyan;
            padding-left: 14px;
        }

        /* AYARLAR BUTONU (8. buton) */
        .settings-big-btn {
            background: #ff884d;
            margin: 8px 20px 16px;
            border-radius: 60px;
            padding: 16px;
            text-align: center;
            font-weight: bold;
            font-size: 1.3rem;
            cursor: pointer;
            color: #1f2a0e;
            box-shadow: 0 6px 12px black;
        }
        .settings-big-btn:active { transform: scale(0.97); background: #ffaa66; }

        /* AYARLAR PANELİ */
        .settings-panel {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000000dd;
            backdrop-filter: blur(16px);
            z-index: 1000;
            padding: 24px;
            overflow-y: auto;
        }
        .settings-card {
            background: #0f1a24;
            border-radius: 48px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .settings-card h3 { color: #FFB347; margin-bottom: 12px; }
        .custom-item {
            background: #1e2f3c;
            margin: 8px 0;
            padding: 10px 14px;
            border-radius: 50px;
            display: flex;
            justify-content: space-between;
        }
        .add-input-group {
            display: flex;
            gap: 8px;
            margin: 12px 0;
            flex-wrap: wrap;
        }
        .add-input-group input, .add-input-group select {
            flex: 1;
            padding: 10px;
            border-radius: 60px;
            border: none;
            background: #2c3e44;
            color: white;
        }
        .small-btn {
            background: #2ecc71;
            border: none;
            border-radius: 40px;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .delete-btn {
            background: #e67e22;
            border: none;
            border-radius: 40px;
            padding: 4px 12px;
            cursor: pointer;
        }

        /* BAŞARILAR (en altta, küçük) */
        .achievement-footer {
            background: #0a111acc;
            margin: 20px 16px 10px;
            padding: 12px;
            border-radius: 48px;
            text-align: center;
            backdrop-filter: blur(4px);
        }
        .medals-area {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 8px;
        }
        .medal {
            background: #2c2a24;
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .earned {
            background: #f7b32b;
            color: #1e2a1f;
        }
        .timer-panel {
            position: fixed;
            bottom: 100px;
            right: 16px;
            background: #000000bb;
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 10px 18px;
            text-align: center;
            border: 1px solid #FFB347;
        }
        .hidden { display: none; }
        .toast {
            position: fixed;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2a36;
            border: 1px solid #2ecc71;
            padding: 10px 24px;
            border-radius: 60px;
            z-index: 1200;
            animation: fadeOut 1.4s forwards;
        }
        @keyframes fadeOut {
            0% { opacity: 1; bottom: 25%;}
            100% { opacity: 0; bottom: 15%; display: none;}
        }
    </style>
</head>
<body>

<div class="header">
    <h1><span>🏋️</span> FITNESS PRO</h1>
    <div class="sub">Premium | Ayarlar + Rozetler</div>
</div>

<!-- ANA EKRAN -->
<div id="homeScreen">
    <div class="days-grid" id="daysGrid"></div>
    <!-- AYARLAR BUTONU (8. buton) -->
    <div class="settings-big-btn" id="openSettingsBtn">⚙️ TÜM AYARLAR (Ekle / Çıkar)</div>
    <!-- BAŞARILAR BÖLÜMÜ (en altta küçük) -->
    <div class="achievement-footer">
        <div>🏆 BAŞARILARIM <span id="medalCount">0</span></div>
        <div id="medalsList" class="medals-area"></div>
        <div id="progressText" style="font-size:0.7rem;">Setler: 0/0</div>
    </div>
</div>

<!-- GÜN DETAY -->
<div id="dayScreen" class="day-detail hidden">
    <div class="detail-header">
        <button class="btn" id="backHomeBtn">◀ Geri</button>
        <button class="btn" id="daySummaryBtn">📊 Özet</button>
    </div>
    <div id="dayTitle" class="day-title"></div>
    <div id="dayContent"></div>
    <div id="summaryBox" style="background:#0f1a24; margin-top:16px; padding:14px; border-radius:36px;" class="hidden"></div>
</div>

<!-- AYARLAR PANELİ (Ekle + Çıkar) -->
<div id="settingsPanel" class="settings-panel hidden">
    <div style="text-align:right;"><button class="btn" id="closeSettingsBtn">Kapat</button></div>
    
    <div class="settings-card">
        <h3>🍽️ YEMEKLER</h3>
        <div class="add-input-group">
            <input type="text" id="newMealName" placeholder="Yemek adı">
            <button class="small-btn" id="addMealBtn">EKLE</button>
        </div>
        <div id="mealsList"></div>
    </div>
    
    <div class="settings-card">
        <h3>💪 EGZERSİZLER</h3>
        <div class="add-input-group">
            <input type="text" id="newExName" placeholder="Egzersiz adı">
            <input type="number" id="newExSets" placeholder="Set" value="3" style="width:80px;">
            <button class="small-btn" id="addExBtn">EKLE</button>
        </div>
        <div id="exList"></div>
    </div>
    
    <div class="settings-card">
        <h3>💊 SUPPLEMENTLER</h3>
        <div class="add-input-group">
            <input type="text" id="newSuppName" placeholder="Supplement adı">
            <button class="small-btn" id="addSuppBtn">EKLE</button>
        </div>
        <div id="suppList"></div>
    </div>
</div>

<div id="timerPanel" class="timer-panel hidden">
    <div id="timerNumber" style="font-size:28px;font-weight:bold;">90</div>
    <div>⏱️ Dinlenme</div>
    <div style="display:flex; gap:6px; margin-top:6px;">
        <button id="timer60Btn" class="small-btn">60sn</button>
        <button id="timer90Btn" class="small-btn">90sn</button>
        <button id="timer120Btn" class="small-btn">120sn</button>
        <button id="closeTimerBtn" style="background:#ff8855;">Kapat</button>
    </div>
</div>

<script>
    // ========== VERİLER ==========
    let programData = {
        "Pazartesi": ["07:00 Kahve + Omega-3","💧 2 bardak","07:30 Skyr + chia","1 muz","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı","💧 2 bardak","14:00 Pirinç + tavuk","💧 2 bardak","14:45 Whey","15:30 Kahve","💧 2 bardak","18:00 Yoğurt","💧 2 bardak","🏋️ GÖĞÜS",{ex:"Bench Press",sets:4},{ex:"Incline Press",sets:4},"💧 2 bardak","21:00 Whey","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
        "Salı": ["07:00 Kahve","💧 2 bardak","07:30 Skyr","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı","💧 2 bardak","14:00 Pirinç + tavuk","💧 2 bardak","14:45 Whey","15:30 Kahve","💧 2 bardak","18:00 Skyr","💧 2 bardak","🏋️ SIRT",{ex:"Lat Pulldown",sets:4},{ex:"Row",sets:4},"💧 2 bardak","21:00 Whey","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
        "Çarşamba": ["07:30 Skyr","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı","💧 2 bardak","14:00 Tavuk + pirinç","💧 2 bardak","18:00 Skyr","💧 2 bardak","20:00 Et + salata","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
        "Perşembe": ["07:00 Kahve","💧 2 bardak","07:30 Skyr","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı","💧 2 bardak","14:00 Pirinç + tavuk","💧 2 bardak","14:45 Whey","15:30 Kahve","💧 2 bardak","18:00 Yoğurt","💧 2 bardak","🏋️ BACAK",{ex:"Leg Press",sets:4},{ex:"Squat",sets:3},"💧 2 bardak","21:00 Whey","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
        "Cuma": ["07:00 Kahve + Omega","💧 2 bardak","07:30 Skyr","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı","💧 2 bardak","14:00 Pirinç + kebap","💧 2 bardak","14:45 Whey","15:30 Kahve","💧 2 bardak","18:00 Skyr","💧 2 bardak","🏋️ OMUZ",{ex:"Shoulder Press",sets:4},{ex:"Lateral Raise",sets:4},"💧 2 bardak","21:00 Whey","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
        "Cumartesi": ["07:30 Skyr","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı","💧 2 bardak","14:00 Tavuk + pirinç","💧 2 bardak","18:00 Skyr","💧 2 bardak","20:00 Et + salata","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
        "Pazar": ["08:00 Kahve","💧 2 bardak","08:30 Skyr","💧 2 bardak","11:00 Yoğurt","💧 2 bardak","14:00 Tavuk + az pirinç","💧 2 bardak","18:00 Skyr","💧 2 bardak","20:00 Et + salata","💧 2 bardak","22:30 Skyr","💧 2 bardak","🧘 AKTİF DİNLENME"]
    };

    let completedState = {};
    let waterIntake = {};
    let medalsEarned = [];

    // Ses & titreşim
    function playStrongBeep() {
        try {
            let ctx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = ctx.createOscillator();
            let gain = ctx.createGain();
            osc.type = "square";
            osc.frequency.value = 880;
            gain.gain.value = 0.3;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.7);
            osc.stop(ctx.currentTime + 0.7);
            setTimeout(() => ctx.close(), 800);
        } catch(e) {}
        if(navigator.vibrate) navigator.vibrate(500);
    }

    // Timer (60-120 arası)
    let timerInt = null;
    const timerPanel = document.getElementById("timerPanel");
    const timerNumSpan = document.getElementById("timerNumber");
    function stopTimer() { if(timerInt) clearInterval(timerInt); timerPanel.classList.add("hidden"); }
    function startTimer(seconds) {
        stopTimer();
        let remaining = seconds;
        timerNumSpan.innerText = remaining;
        timerPanel.classList.remove("hidden");
        timerInt = setInterval(() => {
            remaining--;
            timerNumSpan.innerText = remaining;
            if(remaining <= 0) {
                clearInterval(timerInt);
                playStrongBeep();
                timerPanel.classList.add("hidden");
            }
        }, 1000);
    }
    document.getElementById("timer60Btn").onclick = () => startTimer(60);
    document.getElementById("timer90Btn").onclick = () => startTimer(90);
    document.getElementById("timer120Btn").onclick = () => startTimer(120);
    document.getElementById("closeTimerBtn").onclick = stopTimer;

    // LocalStorage
    function persist() {
        localStorage.setItem("fit_prog", JSON.stringify(programData));
        localStorage.setItem("fit_done", JSON.stringify(completedState));
        localStorage.setItem("fit_water", JSON.stringify(waterIntake));
        localStorage.setItem("fit_medals", JSON.stringify(medalsEarned));
    }
    function loadAll() {
        let p = localStorage.getItem("fit_prog"); if(p) programData = JSON.parse(p);
        let d = localStorage.getItem("fit_done"); if(d) completedState = JSON.parse(d);
        let w = localStorage.getItem("fit_water"); if(w) waterIntake = JSON.parse(w);
        let m = localStorage.getItem("fit_medals"); if(m) medalsEarned = JSON.parse(m);
    }

    // İstatistik & Madalya
    function calcStats() {
        let totalSets=0, doneSets=0, totalMeals=0, doneMeals=0;
        for(let day in programData) {
            programData[day].forEach((item, idx) => {
                if(typeof item === "string") {
                    totalMeals++;
                    if(completedState[`${day}|meal|${idx}`]) doneMeals++;
                } else if(item.sets) {
                    for(let i=1;i<=item.sets;i++) {
                        totalSets++;
                        if(completedState[`${day}|set|${item.ex}|${i}`]) doneSets++;
                    }
                }
            });
        }
        return { totalSets, doneSets, totalMeals, doneMeals };
    }
    function updateMedals() {
        const { doneSets } = calcStats();
        if(doneSets >= 5 && !medalsEarned.includes("5_set")) { medalsEarned.push("5_set"); showToast("🏅 5 Set Madalyası!"); }
        if(doneSets >= 15 && !medalsEarned.includes("15_set")) { medalsEarned.push("15_set"); showToast("🏅 15 Set Ustası!"); }
        if(doneSets >= 30 && !medalsEarned.includes("30_set")) { medalsEarned.push("30_set"); showToast("🏆 30 SET EFSANESİ!"); }
        persist();
        const medalsDiv = document.getElementById("medalsList");
        if(medalsDiv) {
            medalsDiv.innerHTML = medalsEarned.map(m => `<div class="medal earned">🏋️ ${m}</div>`).join("");
            document.getElementById("medalCount").innerText = medalsEarned.length;
        }
        let { doneSets:ds, totalSets:ts, doneMeals:dm, totalMeals:tm } = calcStats();
        document.getElementById("progressText").innerHTML = `🏋️ Set: ${ds}/${ts} &nbsp;&nbsp; 🍽️ Öğün: ${dm}/${tm}`;
    }

    function addWater(day, amt=2) {
        let key = day+"_water";
        waterIntake[key] = (waterIntake[key]||0)+amt;
        persist();
        if(currentDay===day) renderDayDetails(day);
        updateMedals();
        showToast(`💧 +${amt} su`);
    }

    // GÜN DETAY RENDER
    let currentDay = null;
    function renderDayDetails(day) {
        const container = document.getElementById("dayContent");
        container.innerHTML = "";
        programData[day].forEach((item, idx) => {
            if(typeof item === "string") {
                let div = document.createElement("div");
                div.className = "item-card";
                let isWater = item.includes("💧");
                div.innerHTML = `<span>${item}</span>${isWater ? '<span style="background:#1f6e8c; border-radius:30px; padding:2px 10px;">+2 su</span>' : ''}`;
                let key = `${day}|meal|${idx}`;
                if(completedState[key]) div.classList.add("done");
                div.onclick = () => {
                    if(isWater) addWater(day,2);
                    else {
                        if(completedState[key]) delete completedState[key];
                        else completedState[key]=true;
                        persist();
                        renderDayDetails(day);
                        updateMedals();
                        showToast(completedState[key]?"✅ Tamam":"❌ Geri");
                    }
                };
                container.appendChild(div);
            } else if(item.ex) {
                let title = document.createElement("div");
                title.className = "ex-title";
                title.innerText = `💪 ${item.ex}`;
                container.appendChild(title);
                for(let s=1;s<=item.sets;s++) {
                    let setDiv = document.createElement("div");
                    setDiv.className = "set-card";
                    setDiv.innerHTML = `<span>Set ${s}</span><span style="background:#2c5a4a; border-radius:30px; padding:2px 12px;">⏱️ dinlenme</span>`;
                    let setKey = `${day}|set|${item.ex}|${s}`;
                    if(completedState[setKey]) setDiv.classList.add("done");
                    setDiv.onclick = () => {
                        if(completedState[setKey]) delete completedState[setKey];
                        else { completedState[setKey]=true; startTimer(90); playStrongBeep(); }
                        persist();
                        renderDayDetails(day);
                        updateMedals();
                        showToast(completedState[setKey]?`Set ${s} tamam!`:"Set iptal");
                    };
                    container.appendChild(setDiv);
                }
            }
        });
        let sumDiv = document.getElementById("summaryBox");
        if(!sumDiv.classList.contains("hidden")) updateDaySummary(day);
    }
    function updateDaySummary(day) {
        let total=0, done=0;
        programData[day].forEach((item,idx)=>{
            if(typeof item === "string") { total++; if(completedState[`${day}|meal|${idx}`]) done++; }
            else if(item.sets) { for(let i=1;i<=item.sets;i++) { total++; if(completedState[`${day}|set|${item.ex}|${i}`]) done++; } }
        });
        document.getElementById("summaryBox").innerHTML = `📊 Gün: ${done}/${total} tamamlandı | 💧 Su: ${waterIntake[day+"_water"]||0} bardak`;
    }

    function openDay(day) {
        currentDay=day;
        document.getElementById("homeScreen").classList.add("hidden");
        document.getElementById("dayScreen").classList.remove("hidden");
        document.getElementById("dayTitle").innerText=day;
        renderDayDetails(day);
        stopTimer();
    }
    function closeDay() { stopTimer(); document.getElementById("homeScreen").classList.remove("hidden"); document.getElementById("dayScreen").classList.add("hidden"); updateMedals(); }

    function buildHome() {
        const grid = document.getElementById("daysGrid");
        grid.innerHTML = "";
        Object.keys(programData).forEach(day => {
            let card = document.createElement("div");
            card.className = "day-card";
            card.innerText = day;
            card.onclick = () => openDay(day);
            grid.appendChild(card);
        });
        updateMedals();
    }

    // AYARLAR (Ekle + Çıkar) dinamik
    let currentSettingsType = "";
    function refreshSettingsUI() {
        // yemekler
        let mealsDiv = document.getElementById("mealsList");
        mealsDiv.innerHTML = "";
        let allMeals = [];
        for(let day in programData) {
            programData[day].forEach(item => { if(typeof item === "string" && !item.includes("💧") && !item.includes("🏋️") && !item.includes("🧘")) allMeals.push(item); });
        }
        let uniqueMeals = [...new Set(allMeals)];
        uniqueMeals.forEach(meal => {
            let div = document.createElement("div"); div.className="custom-item";
            div.innerHTML = `<span>🍽️ ${meal}</span><button class="delete-btn" data-type="meal" data-value="${meal}">Sil</button>`;
            mealsDiv.appendChild(div);
        });
        // egzersizler
        let exDiv = document.getElementById("exList");
        exDiv.innerHTML = "";
        let exSet = new Set();
        for(let day in programData) {
            programData[day].forEach(item => { if(item.ex) exSet.add(JSON.stringify({name:item.ex, sets:item.sets})); });
        }
        [...exSet].forEach(exStr => {
            let ex = JSON.parse(exStr);
            let div = document.createElement("div"); div.className="custom-item";
            div.innerHTML = `<span>💪 ${ex.name} (${ex.sets} set)</span><button class="delete-btn" data-type="ex" data-name="${ex.name}">Sil</button>`;
            exDiv.appendChild(div);
        });
        // supplement
        let suppDiv = document.getElementById("suppList");
        suppDiv.innerHTML = "";
        let supps = new Set();
        for(let day in programData) {
            programData[day].forEach(item => { if(typeof item === "string" && item.includes("💊")) supps.add(item); });
        }
        supps.forEach(supp => {
            let div = document.createElement("div"); div.className="custom-item";
            div.innerHTML = `<span>💊 ${supp}</span><button class="delete-btn" data-type="supp" data-value="${supp}">Sil</button>`;
            suppDiv.appendChild(div);
        });

        document.querySelectorAll(".delete-btn").forEach(btn => {
            btn.onclick = (e) => {
                let type = btn.dataset.type;
                let value = btn.dataset.value || btn.dataset.name;
                for(let day in programData) {
                    if(type === "meal") programData[day] = programData[day].filter(i => !(typeof i === "string" && i===value));
                    if(type === "ex") programData[day] = programData[day].filter(i => !(i.ex && i.ex===value));
                    if(type === "supp") programData[day] = programData[day].filter(i => !(typeof i === "string" && i===value));
                }
                persist();
                refreshSettingsUI();
                if(currentDay && !document.getElementById("homeScreen").classList.contains("hidden")===false) renderDayDetails(currentDay);
                else buildHome();
                showToast("Silindi!");
            };
        });
    }

    document.getElementById("addMealBtn").onclick = () => {
        let name = document.getElementById("newMealName").value.trim();
        if(name) { for(let day in programData) programData[day].push(name); persist(); refreshSettingsUI(); buildHome(); showToast("Yemek eklendi"); }
    };
    document.getElementById("addExBtn").onclick = () => {
        let name = document.getElementById("newExName").value.trim();
        let sets = parseInt(document.getElementById("newExSets").value);
        if(name && sets>0) { for(let day in programData) programData[day].push({ex:name, sets}); persist(); refreshSettingsUI(); buildHome(); showToast("Egzersiz eklendi"); }
    };
    document.getElementById("addSuppBtn").onclick = () => {
        let name = document.getElementById("newSuppName").value.trim();
        if(name) { for(let day in programData) programData[day].push(`💊 ${name}`); persist(); refreshSettingsUI(); buildHome(); showToast("Supplement eklendi"); }
    };

    function showToast(msg) {
        let t = document.createElement("div"); t.className="toast"; t.innerText=msg; document.body.appendChild(t);
        setTimeout(()=>t.remove(),1500);
    }

    document.getElementById("openSettingsBtn").onclick = () => { document.getElementById("settingsPanel").classList.remove("hidden"); refreshSettingsUI(); };
    document.getElementById("closeSettingsBtn").onclick = () => document.getElementById("settingsPanel").classList.add("hidden");
    document.getElementById("backHomeBtn").onclick = closeDay;
    document.getElementById("daySummaryBtn").onclick = () => { if(currentDay) updateDaySummary(currentDay); let sb=document.getElementById("summaryBox"); sb.classList.toggle("hidden"); };

    loadAll();
    buildHome();
    updateMedals();
</script>
</body>
</html>
