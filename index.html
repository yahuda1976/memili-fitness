<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>Power Program | 90 saniye dinlenme</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0f1a;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
      color: #edf2ff;
      padding: 1rem 0.8rem 2rem;
      line-height: 1.4;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    /* header & tabs */
    .app-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .app-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #facc15, #ef4444);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
    }

    .app-header p {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-top: 6px;
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .day-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.8rem;
      justify-content: center;
      background: #0f1422;
      padding: 0.6rem 0.8rem;
      border-radius: 60px;
      backdrop-filter: blur(2px);
    }

    .day-btn {
      background: #1e293b;
      border: none;
      color: #b9c7dd;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.45rem 1rem;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .day-btn.active {
      background: #dc2626;
      color: white;
      box-shadow: 0 4px 12px rgba(220,38,38,0.3);
    }

    .day-btn.rest-badge {
      background: #2d3a4e;
      color: #a0b3d9;
    }

    /* gün içerik wrapper */
    .day-panel {
      display: none;
      animation: fade 0.2s ease;
    }

    .day-panel.active-panel {
      display: block;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(6px);}
      to { opacity: 1; transform: translateY(0);}
    }

    /* Yemek & su kartı */
    .meal-card {
      background: #0f172ad9;
      backdrop-filter: blur(4px);
      border-radius: 28px;
      padding: 1rem 1rem;
      margin-bottom: 1.5rem;
      border: 1px solid #2d3a5e;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    }

    .meal-title {
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-left: 4px solid #facc15;
      padding-left: 0.7rem;
      margin-bottom: 0.8rem;
    }

    .meal-grid {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .meal-item {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.85rem;
      border-bottom: 1px dashed #2d3a60;
      padding-bottom: 0.5rem;
    }

    .meal-time {
      font-weight: 700;
      background: #1e293b;
      padding: 0.2rem 0.6rem;
      border-radius: 30px;
      min-width: 65px;
      text-align: center;
      color: #facc15;
    }

    .meal-desc {
      flex: 1;
      color: #cbd5f0;
    }

    .water {
      color: #7aa2f7;
      font-weight: 500;
    }

    /* egzersiz kartları */
    .exercise-card {
      background: #111927;
      border-radius: 32px;
      margin-bottom: 1.8rem;
      border: 1px solid #283044;
      overflow: hidden;
      transition: all 0.1s;
    }

    .exercise-header {
      padding: 0.9rem 1rem 0.5rem;
      background: #0e1622;
      border-bottom: 1px solid #273043;
    }

    .exercise-name {
      font-size: 1.35rem;
      font-weight: 700;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: space-between;
    }

    .rep-badge {
      background: #ef444430;
      padding: 0.2rem 0.8rem;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #facc15;
      font-family: monospace;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin-top: 0.6rem;
      margin-bottom: 0.2rem;
    }

    .action-btn {
      background: #1f2a44;
      border: none;
      font-size: 0.7rem;
      color: #cad2ff;
      padding: 0.25rem 0.8rem;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.1s;
      font-weight: 500;
    }

    .action-btn:active {
      background: #ef4444;
      color: white;
    }

    /* set listesi */
    .set-list {
      padding: 0.7rem 1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .set-row {
      background: #0f172f;
      border-radius: 28px;
      padding: 0.5rem 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.6rem;
      border: 1px solid #26304a;
    }

    .set-number {
      font-weight: 700;
      min-width: 55px;
      background: #00000044;
      padding: 0.2rem 0.5rem;
      border-radius: 40px;
      text-align: center;
      font-size: 0.85rem;
    }

    .weight-input {
      background: #010514;
      border: 1px solid #3b4870;
      padding: 0.45rem 0.7rem;
      border-radius: 36px;
      width: 105px;
      color: white;
      font-weight: 500;
      text-align: center;
      font-size: 0.85rem;
    }

    .weight-input:focus {
      outline: none;
      border-color: #facc15;
    }

    .rest-set-btn {
      background: #2a3655;
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.8rem;
      transition: 0.1s;
    }

    .rest-set-btn:active {
      background: #dc2626;
      transform: scale(0.97);
    }

    .rep-text {
      font-size: 0.75rem;
      color: #9eb0e0;
      background: #010a1a;
      padding: 0.2rem 0.6rem;
      border-radius: 30px;
    }

    /* Timer panel */
    .timer-global {
      position: sticky;
      bottom: 0.8rem;
      background: #030614dd;
      backdrop-filter: blur(12px);
      border-radius: 60px;
      margin-top: 1.2rem;
      padding: 0.6rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.8rem;
      border: 1px solid #ef444455;
      z-index: 20;
    }

    .timer-label {
      font-weight: 600;
      font-size: 0.85rem;
    }

    .timer-digits {
      font-size: 2rem;
      font-weight: 800;
      font-family: monospace;
      letter-spacing: 3px;
      background: #000000aa;
      padding: 0 0.8rem;
      border-radius: 48px;
      color: #facc15;
    }

    .timer-actions button {
      background: #2c385c;
      border: none;
      color: white;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      margin: 0 0.2rem;
      font-weight: 500;
      cursor: pointer;
    }

    .rest-day-message {
      background: #0f172a;
      border-radius: 40px;
      text-align: center;
      padding: 2rem 1rem;
      margin: 1rem 0;
      border: 1px dashed #facc1555;
    }

    footer {
      font-size: 0.7rem;
      text-align: center;
      color: #4b5679;
      margin-top: 1rem;
    }

    @media (max-width: 550px) {
      .set-row {
        flex-direction: column;
        align-items: stretch;
      }
      .weight-input {
        width: 100%;
      }
      .rest-set-btn {
        justify-content: center;
      }
      .timer-digits {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="app-header">
    <h1>⚡ IRON PACT</h1>
    <p>✅ 90 saniye dinlenme | Her set sonrası "Dinlenme" butonu</p>
  </div>

  <div class="day-tabs" id="dayTabs"></div>

  <!-- Tüm günlerin paneli dinamik olarak doldurulacak -->
  <div id="daysContainer"></div>

  <!-- Global timer -->
  <div class="timer-global" id="globalTimerPanel">
    <div class="timer-label">⏱️ SET ARASI DİNLENME</div>
    <div class="timer-digits" id="timerDisplay">01:30</div>
    <div class="timer-actions">
      <button id="stopTimerBtn">⏹️ Durdur</button>
      <button id="resetTimerBtn" class="reset-timer">⟳ Sıfırla</button>
    </div>
  </div>
  <footer>📝 Not / 1RM / Video / Link / Alternatif butonları egzersiz başlığında | Ağırlık girin, dinlenme butonu 90sn geri sayım başlatır</footer>
</div>

  // ----------------------------- TÜM GÜNCEL ANTRENMAN + YEMEK ZAMANLARI ---------------------------------

    ],
    carsamba: [

      { time: "09:30", text: "Meyve + kuruyemiş", water: "—" },

      { time: "22:00", text: "20-30 dk yürüyüş", water: "" }
    ],
    persembe: [
      { time: "07:45", text: "Oats + Omega-3", water: "500 ml" },
      { time: "09:30", text: "Ekmek + peynir", water: "—" },
      { time: "14:00", text: "Tavuk + pilav", water: "—" },
      { time: "18:00", text: "Whey + Kreatin", water: "300 ml" },
      { time: "19:00", text: "🏋️ ANTRENMAN" },
      { time: "20:30", text: "Whey" },
      { time: "21:00", text: "Köfte + patates + Skyr", water: "400 ml" }
    ],
    cuma: [
      { time: "07:45", text: "Enerji oats + Omega-3", water: "500 ml" },
      { time: "09:30", text: "Peynir + ekmek", water: "—" },
      { time: "14:00", text: "Et + pilav", water: "—" },
      { time: "18:00", text: "Whey + Kreatin", water: "300 ml" },
      { time: "19:00", text: "🏋️ ANTRENMAN" },
      { time: "20:30", text: "Whey" },
      { time: "21:00", text: "Tavuk + patates + yoğurt", water: "400 ml" }
    ],
    cumartesi: [
      { time: "07:45", text: "Oats + Omega-3", water: "500 ml" },
      { time: "09:30", text: "Ton balığı + ekmek", water: "400 ml" },
      { time: "14:00", text: "Tavuk + pilav", water: "—" },
      { time: "18:00", text: "Whey + Kreatin", water: "300 ml" },
      { time: "19:00", text: "🏋️ ANTRENMAN" },
      { time: "20:30", text: "Whey" },
      { time: "21:00", text: "Yumurta + peynir + Skyr", water: "400 ml" }
    ],
    pazar: [
      { time: "07:45", text: "Hafif oats + Omega-3", water: "500 ml" },
      { time: "09:30", text: "Meyve", water: "—" },
      { time: "14:00", text: "Tavuk + salata", water: "—" },
      { time: "20:30", text: "Yumurta + yoğurt", water: "—" }
    ]
  };

  // Egzersiz verisi (gün bazlı)
  const exercisesMap = {
    pazartesi: {
      name: "PAZARTESİ",
      isRest: false,
      exercises: [
        { name: "🏋️ Incline Dumbbell Press (30-45°)", sets: 4, rep: "6-8", noteExtra: "3 sn indir" },
        { name: "🏋️ Dumbbell Bench Press", sets: 3, rep: "6-10", noteExtra: "Kürek kemikleri sık" },
        { name: "🔻 Chest Dip (öne eğilerek)", sets: 3, rep: "8-12", noteExtra: "Alt göğüs odak" },
        { name: "🎯 Cable Chest Fly", sets: 3, rep: "12-15", noteExtra: "Sıkıştır" },
        { name: "🔥 Triceps Pushdown (Rope)", sets: 3, rep: "10-12", noteExtra: "Dirsek sabit" },
        { name: "💪 Overhead Triceps Extension", sets: 3, rep: "10-12", noteExtra: "Gerilimi hisset" }
      ]
    },
    sali: {
      name: "SALI",
      isRest: false,
      exercises: [
        { name: "🔵 Lat Pulldown (göğse)", sets: 4, rep: "8-12", noteExtra: "Arkaya çekme" },
        { name: "🔵 Barbell Row", sets: 3, rep: "6-10", noteExtra: "Bel sabit" },
        { name: "🔵 Seated Cable Row", sets: 3, rep: "10-12", noteExtra: "Kürek sık" },
        { name: "📌 Straight Arm Cable Pulldown", sets: 3, rep: "12-15", noteExtra: "Lat odak" },
        { name: "🎯 Face Pull", sets: 3, rep: "12-15", noteExtra: "Arka omuz" },
        { name: "💪 Barbell Curl", sets: 3, rep: "8-12", noteExtra: "Sallama yok" },
        { name: "💪 Hammer Curl", sets: 3, rep: "10-12", noteExtra: "Kontrol" }
      ]
    },
    carsamba: { name: "ÇARŞAMBA", isRest: true, exercises: [] },
    persembe: {
      name: "PERŞEMBE",
      isRest: false,
      exercises: [
        { name: "🎯 Dumbbell Shoulder Press", sets: 4, rep: "6-10", noteExtra: "Bel boşluk verme" },
        { name: "🎯 Dumbbell Lateral Raise", sets: 4, rep: "12-15", noteExtra: "Omuz hizası" },
        { name: "🎯 Reverse Pec Deck", sets: 3, rep: "12-15", noteExtra: "Arka omuz" },
        { name: "🎯 Cable Lateral Raise", sets: 3, rep: "12-15", noteExtra: "Sabit" },
        { name: "💪 Cable Curl (pump)", sets: 2, rep: "12-15", noteExtra: "Yavaş" },
        { name: "💪 Hammer Curl (pump)", sets: 2, rep: "12-15", noteExtra: "Kontrol" }
      ]
    },
    cuma: {
      name: "CUMA",
      isRest: false,
      exercises: [
        { name: "🏋️ Barbell Back Squat", sets: 4, rep: "6-8", noteExtra: "Derin squat" },
        { name: "🦵 Seated Leg Curl", sets: 3, rep: "12-15", noteExtra: "" },
        { name: "🦵 Leg Extension", sets: 3, rep: "12-15", noteExtra: "" },
        { name: "🏋️ Romanian Deadlift", sets: 3, rep: "8-12", noteExtra: "Kalçadan kır" },
        { name: "🏃 Walking Lunge", sets: 3, rep: "10-12 (her bacak)", noteExtra: "" },
        { name: "🦵 Standing Calf Raise", sets: 4, rep: "15-20", noteExtra: "" }
      ]
    },
    cumartesi: {
      name: "CUMARTESİ",
      isRest: false,
      exercises: [
        { name: "📌 Incline Chest Press Machine", sets: 3, rep: "10-12", noteExtra: "" },
        { name: "🎯 Low to High Cable Fly", sets: 3, rep: "12-15", noteExtra: "" },
        { name: "🦾 Pec Deck Machine", sets: 3, rep: "12-15", noteExtra: "" },
        { name: "💪 Push-Up", sets: 2, rep: "failure", noteExtra: "son sete kadar" },
        { name: "🔥 Triceps Pushdown (Rope)", sets: 2, rep: "12-15", noteExtra: "" },
        { name: "🔥 Cable Overhead Triceps Extension", sets: 2, rep: "12-15", noteExtra: "" }
      ]
    },
    pazar: { name: "PAZAR", isRest: true, exercises: [] }
  };

  const daysOrder = ["pazartesi", "sali", "carsamba", "persembe", "cuma", "cumartesi", "pazar"];
  const dayDisplayNames = { pazartesi:"PZT", sali:"SAL", carsamba:"ÇAR", persembe:"PER", cuma:"CUM", cumartesi:"CMT", pazar:"PAZ" };

  let activeDayKey = "pazartesi";
  let timerInterval = null;
  let remainingSeconds = 90;
  const timerDisplayElem = document.getElementById("timerDisplay");

  function updateTimerUI() {
    const mins = Math.floor(remainingSeconds / 60);
    const secs = remainingSeconds % 60;
    timerDisplayElem.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
  }

  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  function startTimer(seconds = 90) {
    stopTimer();
    remainingSeconds = seconds;
    updateTimerUI();
    timerInterval = setInterval(() => {
      if (remainingSeconds <= 1) {
        stopTimer();
        remainingSeconds = 0;
        updateTimerUI();
        // optional ses? sessiz
      } else {
        remainingSeconds--;
        updateTimerUI();
      }
    }, 1000);
  }

  function resetTimerToDefault() {
    stopTimer();
    remainingSeconds = 90;
    updateTimerUI();
  }

  // Egzersiz kartlarını oluştur (setler + weight input + dinlenme butonu)
  function renderWorkoutPanel(dayKey) {
    const dayData = exercisesMap[dayKey];
    if (!dayData) return `<div class="rest-day-message">❓ Gün bulunamadı</div>`;
    if (dayData.isRest) {
      return `<div class="rest-day-message">🧘‍♂️ AKTİF DİNLENME GÜNÜ<br>Yürüyüş / esneme | Standart beslenme planı uygulanır 💧</div>`;
    }
    let html = '';
    for (let exIdx = 0; exIdx < dayData.exercises.length; exIdx++) {
      const ex = dayData.exercises[exIdx];
      const repTarget = ex.rep === "failure" ? "failure" : `${ex.rep} tekrar`;
      html += `
        <div class="exercise-card" data-ex="${exIdx}">
          <div class="exercise-header">
            <div class="exercise-name">
              <span>${ex.name}</span>
              <span class="rep-badge">🎯 ${repTarget}</span>
            </div>
            <div class="action-row">
              <button class="action-btn" data-action="not" data-exname="${ex.name}">📝 Not</button>
              <button class="action-btn" data-action="1rm" data-exname="${ex.name}">📊 1RM</button>
              <button class="action-btn" data-action="video" data-exname="${ex.name}">🎥 Video</button>
              <button class="action-btn" data-action="link" data-exname="${ex.name}">🔗 Link</button>
              <button class="action-btn" data-action="alternatif" data-exname="${ex.name}">🔄 Alternatif</button>
            </div>
            ${ex.noteExtra ? `<div style="font-size:0.7rem; margin-top:5px; color:#b9c8ff;">💡 ${ex.noteExtra}</div>` : ''}
          </div>
          <div class="set-list" id="setlist-${dayKey}-${exIdx}">
      `;
      for (let s = 1; s <= ex.sets; s++) {
        html += `
          <div class="set-row">
            <div class="set-number">Set ${s}</div>
            <input type="text" class="weight-input" placeholder="Ağırlık (kg)" autocomplete="off">
            <div class="rep-text">${ex.rep}</div>
            <button class="rest-set-btn" data-day="${dayKey}" data-exercise="${ex.name}" data-set="${s}">⏱️ Dinlenme</button>
          </div>
        `;
      }
      html += `</div></div>`;
    }
    return html;
  }

  function renderMealSection(dayKey) {
    const meals = mealsData[dayKey];
    if (!meals) return `<div class="meal-card">🍽️ Beslenme bilgisi eklenmemiş</div>`;
    let mealHtml = `<div class="meal-card"><div class="meal-title">🍱 GÜNLÜK BESLENME & SU</div><div class="meal-grid">`;
    meals.forEach(m => {
      const waterHtml = m.water ? `<span class="water">💧 ${m.water}</span>` : '';
      mealHtml += `<div class="meal-item"><span class="meal-time">${m.time}</span><span class="meal-desc">${m.text} ${waterHtml ? ` ${waterHtml}` : ''}</span></div>`;
    });
    mealHtml += `</div></div>`;
    return mealHtml;
  }

  function buildFullDayPanel(dayKey) {
    const mealSection = renderMealSection(dayKey);
    const workoutHtml = renderWorkoutPanel(dayKey);
    return `
      <div class="day-panel" id="panel-${dayKey}">
        ${mealSection}
        <div style="margin-bottom: 0.5rem;"><span style="background:#dc2626; padding:0.2rem 0.7rem; border-radius: 30px;">🏋️ ANTRENMAN</span></div>
        ${workoutHtml}
      </div>
    `;
  }

  function renderAllDays() {
    const container = document.getElementById("daysContainer");
    let allPanelsHtml = '';
    for (let d of daysOrder) {
      allPanelsHtml += buildFullDayPanel(d);
    }
    container.innerHTML = allPanelsHtml;
    // aktif panel göster
    for (let d of daysOrder) {
      const panel = document.getElementById(`panel-${d}`);
      if (panel) {
        if (d === activeDayKey) panel.classList.add("active-panel");
        else panel.classList.remove("active-panel");
      }
    }
    attachSetRestEvents();
    attachActionButtonsEvents();
  }

  // set dinlenme eventleri
  function attachSetRestEvents() {
    document.querySelectorAll('.rest-set-btn').forEach(btn => {
      btn.removeEventListener('click', restHandler);
      btn.addEventListener('click', restHandler);
    });
  }
  function restHandler(e) {
    e.stopPropagation();
    startTimer(90);
  }

  // action butonlar (Not, 1RM, video, link, alternatif)
  function attachActionButtonsEvents() {
    document.querySelectorAll('.action-btn').forEach(btn => {
      btn.removeEventListener('click', actionHandler);
      btn.addEventListener('click', actionHandler);
    });
  }
  function actionHandler(e) {
    const action = e.currentTarget.getAttribute('data-action');
    const exName = e.currentTarget.getAttribute('data-exname');
    if (action === 'not') {
      const userNote = prompt(`📝 "${exName}" için not gir:`, "Örn: 3 saniye iniş");
      if (userNote) alert(`Not kaydedildi: ${userNote}`);
      else alert("Not boş");
    } else if (action === '1rm') {
      let weight = prompt(`🏋️ "${exName}" için kaldırdığın max ağırlık (kg):`, "100");
      if (weight) alert(`Tahmini 1RM: ${weight} kg (hesaplama için antrenöre danış)`);
    } else if (action === 'video') {
      alert(`🎥 "${exName}" için video önerisi: YouTube'da araştırabilirsin.`);
    } else if (action === 'link') {
      alert(`🔗 "${exName}" için faydalı link: https://exrx.net (egzersiz kütüphanesi)`);
    } else if (action === 'alternatif') {
      alert(`🔄 "${exName}" alternatifi: Dumbell versiyonu / kablo / makine varyasyonu denenebilir.`);
    }
  }

  // tab butonlarını oluştur
  function buildTabs() {
    const tabsContainer = document.getElementById("dayTabs");
    tabsContainer.innerHTML = '';
    for (let d of daysOrder) {
      const isRest = exercisesMap[d]?.isRest || false;
      const btn = document.createElement("button");
      btn.textContent = dayDisplayNames[d];
      btn.classList.add("day-btn");
      if (isRest) btn.classList.add("rest-badge");
      if (d === activeDayKey) btn.classList.add("active");
      btn.addEventListener("click", () => {
        activeDayKey = d;
        document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.day-panel').forEach(panel => panel.classList.remove('active-panel'));
        const targetPanel = document.getElementById(`panel-${d}`);
        if (targetPanel) targetPanel.classList.add('active-panel');
        // timer reset yok, sadece görünüm
        stopTimer();
        resetTimerToDefault();
      });
      tabsContainer.appendChild(btn);
    }
  }

  // timer kontrol butonları
  document.getElementById("stopTimerBtn").addEventListener("click", () => stopTimer());
  document.getElementById("resetTimerBtn").addEventListener("click", () => {
    stopTimer();
    resetTimerToDefault();
  });

  function init() {
    renderAllDays();
    buildTabs();
    resetTimerToDefault();
  }
  init();
</script>
</body>
</html>
