<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kankam Fit – Su & Set Takibi</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f0f4f8;
            color: #1e2a3e;
            padding-bottom: 80px;
        }
        /* Ana grid (ana sayfa) */
        .home-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 28px;
            padding: 18px 12px;
            text-align: center;
            box-shadow: 0 6px 14px rgba(0,0,0,0.05);
            transition: 0.2s;
            cursor: pointer;
            border: 1px solid #e2edf2;
        }
        .card:active { transform: scale(0.97); background: #f9f9ff; }
        .card-emoji { font-size: 42px; margin-bottom: 10px; }
        .card-title { font-weight: 700; font-size: 1.2rem; margin: 8px 0 4px; }
        .card-sub { font-size: 0.75rem; color: #5a6e7c; }

        /* Sayfa görünümleri */
        .page {
            display: none;
            padding: 20px;
            animation: fade 0.2s ease;
        }
        .active-page { display: block; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

        /* Su çemberi */
        .water-circle {
            width: 180px;
            height: 180px;
            margin: 20px auto;
            border-radius: 50%;
            background: #e0f2fe;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            box-shadow: inset 0 0 0 4px white, 0 10px 20px rgba(0,0,0,0.1);
            cursor: pointer;
        }
        .water-liters { font-size: 38px; font-weight: 800; color: #0284c7; }
        .water-target { font-size: 14px; color: #0f4c5f; }

        /* Butonlar */
        button, .btn {
            background: #1e3a5f;
            border: none;
            color: white;
            padding: 12px 18px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1rem;
            margin: 6px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button:active { transform: scale(0.96); background: #0f2b44; }
        .btn-outline {
            background: transparent;
            border: 2px solid #1e3a5f;
            color: #1e3a5f;
        }
        .timer-display {
            font-size: 48px;
            font-weight: 800;
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 60px;
            margin: 20px 0;
            font-family: monospace;
        }
        .stats-panel {
            background: white;
            border-radius: 32px;
            padding: 16px;
            margin: 16px 0;
        }
        .flex-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0; }
        .back-btn { background: #6c757d; margin-bottom: 20px; }
        .chart {
            background: white;
            border-radius: 28px;
            padding: 12px;
            margin: 16px 0;
            text-align: center;
        }
        .water-log {
            display: flex;
            justify-content: space-between;
            background: white;
            border-radius: 32px;
            padding: 12px 18px;
            margin: 8px 0;
        }
    </style>
</head>
<body>

<!-- ANA GRİD (HOME) -->
<div id="homeGrid" class="home-grid">
    <div class="card" data-page="water">
        <div class="card-emoji">💧</div>
        <div class="card-title">Su Takibi</div>
        <div class="card-sub">Günlük hedef + grafik</div>
    </div>
    <div class="card" data-page="workout">
        <div class="card-emoji">💪</div>
        <div class="card-title">Set Takibi</div>
        <div class="card-sub">Egzersiz, tekrar, ağırlık</div>
    </div>
    <div class="card" data-page="timer">
        <div class="card-emoji">⏱️</div>
        <div class="card-title">Timer</div>
        <div class="card-sub">Set arası süre tut</div>
    </div>
    <div class="card" data-page="stats">
        <div class="card-emoji">📊</div>
        <div class="card-title">İstatistikler</div>
        <div class="card-sub">XP & Rozetler</div>
    </div>
    <div class="card" data-page="settings">
        <div class="card-emoji">⚙️</div>
        <div class="card-title">Ayarlar</div>
        <div class="card-sub">Bildirim & Ses</div>
    </div>
    <div class="card" id="videoBtn">
        <div class="card-emoji">🎥</div>
        <div class="card-title">Video</div>
        <div class="card-sub">Motivasyon</div>
    </div>
</div>

<!-- SAYFALAR -->
<div id="waterPage" class="page">
    <button class="back-btn" onclick="showHome()">← Ana Sayfa</button>
    <div class="water-circle" id="waterCircle">
        <div class="water-liters" id="waterAmount">0</div>
        <div class="water-target">/ 2.5 L</div>
    </div>
    <div class="flex-btns">
        <button onclick="addWater(200)">+200 ml</button>
        <button onclick="addWater(500)">+500 ml</button>
        <button onclick="resetWater()">Sıfırla</button>
    </div>
    <div class="chart">
        <div style="display: flex; justify-content: space-between;">
            <strong>📈 Su Grafiği</strong>
            <button onclick="setWaterChartType('day')">Günlük</button>
            <button onclick="setWaterChartType('week')">Haftalık</button>
        </div>
        <canvas id="waterChart" width="300" height="150" style="max-width:100%; background:#fff; border-radius:20px; margin-top:12px;"></canvas>
    </div>
</div>

<div id="workoutPage" class="page">
    <button class="back-btn" onclick="showHome()">← Ana Sayfa</button>
    <div class="stats-panel">
        <div id="totalSetCount">Toplam Set: 0</div>
        <button onclick="addWorkoutSet()">➕ Yeni Set Ekle</button>
        <div id="workoutList"></div>
    </div>
</div>

<div id="timerPage" class="page">
    <button class="back-btn" onclick="showHome()">← Ana Sayfa</button>
    <div class="timer-display" id="timerDisplay">00:00</div>
    <div class="flex-btns">
        <button onclick="startTimer(60)">1 dk</button>
        <button onclick="startTimer(90)">1:30 dk</button>
        <button onclick="startTimer(120)">2 dk</button>
        <button onclick="stopTimer()">Durdur</button>
    </div>
</div>

<div id="statsPage" class="page">
    <button class="back-btn" onclick="showHome()">← Ana Sayfa</button>
    <div class="stats-panel">
        <h3>🏆 XP: <span id="xpValue">0</span></h3>
        <div>🌟 Rozetler: <span id="badgesList">Henüz yok</span></div>
        <button onclick="exportBackup()">📁 Yedek Al</button>
        <input type="file" id="restoreFile" accept=".json" style="margin-top:10px;">
        <button onclick="importBackup()">Geri Yükle</button>
    </div>
</div>

<div id="settingsPage" class="page">
    <button class="back-btn" onclick="showHome()">← Ana Sayfa</button>
    <div class="stats-panel">
        <label>🔔 Su Hatırlatıcı (saat):</label>
        <input type="time" id="waterAlarmTime" value="10:00">
        <button onclick="setWaterReminder()">Kaydet</button>
        <hr>
        <label>🔊 Ses Efekti:</label>
        <button id="soundToggleBtn" class="btn-outline">Ses: AÇIK</button>
        <hr>
        <button onclick="requestNotificationPermission()">📢 Bildirim İzni İste</button>
    </div>
</div>

<script>
    // --------------------- GLOBAL DEĞİŞKENLER -------------------------
    let data = { water: 0, xp: 0, badges: [], workouts: [], waterHistory: [] };
    let doneState = {};
    let waterIntake = 0;
    let totalSetCount = 0;
    let supplements = [];
    let currentDayOpen = null;
    let timerInterval = null;
    let waterAlarmInterval = null;
    let soundEnabled = true;
    let currentChartType = 'day';

    // Load & Save
    function loadData() {
        const saved = localStorage.getItem('fitnessAppData');
        if(saved) {
            try {
                const parsed = JSON.parse(saved);
                data = parsed;
                waterIntake = data.water || 0;
                totalSetCount = data.workouts?.reduce((sum,w) => sum + (w.sets || 0),0) || 0;
                if(!data.waterHistory) data.waterHistory = [];
                if(!data.workouts) data.workouts = [];
                if(!data.xp) data.xp = 0;
                if(!data.badges) data.badges = [];
            } catch(e) {}
        } else {
            resetWater(); // başlangıç
        }
        updateUI();
        updateWaterChart();
        saveToLocal();
    }
    function saveToLocal() {
        data.water = waterIntake;
        data.xp = parseInt(document.getElementById('xpValue')?.innerText || data.xp);
        localStorage.setItem('fitnessAppData', JSON.stringify(data));
    }
    function updateUI() {
        document.getElementById('waterAmount').innerText = (waterIntake/1000).toFixed(1);
        document.getElementById('totalSetCount').innerHTML = `Toplam Set: ${totalSetCount}`;
        document.getElementById('xpValue').innerText = data.xp;
        if(data.badges.length>0) document.getElementById('badgesList').innerText = data.badges.join(', ');
        else document.getElementById('badgesList').innerText = 'Henüz yok';
        renderWorkouts();
        updateBadges();
    }
    function addXP(amount) {
        data.xp += amount;
        updateUI();
        saveToLocal();
        sendNotification(`🎉 +${amount} XP kazandın!`);
    }
    function updateBadges() {
        if(waterIntake >= 2500 && !data.badges.includes('💧 Su Kahramanı')) {
            data.badges.push('💧 Su Kahramanı');
            sendNotification('🏅 Rozet kazandın: Su Kahramanı!');
        }
        if(totalSetCount >= 10 && !data.badges.includes('💪 Set Canavarı')) {
            data.badges.push('💪 Set Canavarı');
            sendNotification('🏅 Rozet kazandın: Set Canavarı!');
        }
        updateUI();
        saveToLocal();
    }

    // SU İŞLEMLERİ
    function addWater(ml) {
        waterIntake += ml;
        if(waterIntake > 5000) waterIntake = 5000;
        updateUI();
        saveToLocal();
        const today = new Date().toISOString().slice(0,10);
        const existing = data.waterHistory.find(w => w.date === today);
        if(existing) existing.amount = waterIntake;
        else data.waterHistory.push({ date: today, amount: waterIntake });
        updateWaterChart();
        if(waterIntake >= 2500) sendNotification('💧 Tebrikler! Günlük su hedefini tamamladın.');
        addXP(5);
    }
    function resetWater() {
        waterIntake = 0;
        updateUI();
        saveToLocal();
        updateWaterChart();
    }
    function updateWaterChart() {
        const canvas = document.getElementById('waterChart');
        if(!canvas) return;
        const ctx = canvas.getContext('2d');
        let history = [...data.waterHistory];
        if(currentChartType === 'day') {
            history = history.slice(-7);
        } else {
            history = history.slice(-30);
        }
        ctx.clearRect(0,0,canvas.width,canvas.height);
        if(history.length === 0) {
            ctx.fillText("Veri yok", 10,50);
            return;
        }
        const maxWater = Math.max(3000, ...history.map(h=>h.amount||0));
        const w = canvas.width / history.length;
        for(let i=0;i<history.length;i++) {
            let h = (history[i].amount / maxWater) * canvas.height;
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(i*w, canvas.height-h, w-2, h);
        }
    }
    function setWaterChartType(type) {
        currentChartType = type;
        updateWaterChart();
    }

    // WORKOUT
    function addWorkoutSet() {
        const name = prompt('Egzersiz adı', 'Bench Press');
        if(!name) return;
        const reps = parseInt(prompt('Tekrar sayısı', '10'));
        const weight = parseInt(prompt('Ağırlık (kg)', '50'));
        data.workouts.push({ name, reps, weight, date: new Date().toISOString(), sets:1 });
        totalSetCount++;
        addXP(10);
        updateUI();
        saveToLocal();
        sendNotification(`🏋️ ${name} ${reps}x${weight}kg kaydedildi!`);
    }
    function renderWorkouts() {
        const container = document.getElementById('workoutList');
        if(!container) return;
        container.innerHTML = data.workouts.slice().reverse().slice(0,10).map(w => `<div class="water-log">${w.name} - ${w.reps} tekrar ${w.weight}kg</div>`).join('');
    }

    // TIMER
    function startTimer(seconds) {
        stopTimer();
        let remaining = seconds;
        const display = document.getElementById('timerDisplay');
        function tick() {
            const mins = Math.floor(remaining/60);
            const secs = remaining%60;
            display.innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
            if(remaining <= 0) {
                stopTimer();
                sendNotification('⏰ Timer bitti!');
                if(soundEnabled) {
                    const audio = new Audio('data:audio/wav;base64,U3RlYWx0aCBzb3VuZA==');
                    audio.play().catch(e=>console.log);
                }
                return;
            }
            remaining--;
            timerInterval = setTimeout(tick,1000);
        }
        tick();
    }
    function stopTimer() {
        if(timerInterval) clearTimeout(timerInterval);
        timerInterval = null;
    }

    // BİLDİRİM SİSTEMİ
    async function requestNotificationPermission() {
        if('Notification' in window) {
            const perm = await Notification.requestPermission();
            if(perm === 'granted') alert('Bildirim izni verildi ✅');
            else alert('İzin reddedildi, tarayıcı ayarlarından açabilirsin.');
        } else alert('Bu tarayıcı bildirim desteklemiyor.');
    }
    function sendNotification(message) {
        if('Notification' in window && Notification.permission === 'granted') {
            new Notification('Kankam Fit', { body: message, icon: 'https://cdn-icons-png.flaticon.com/512/1674/1674729.png' });
        }
    }
    function setWaterReminder() {
        const time = document.getElementById('waterAlarmTime').value;
        if(waterAlarmInterval) clearInterval(waterAlarmInterval);
        const [hour, minute] = time.split(':');
        const now = new Date();
        let alarm = new Date();
        alarm.setHours(hour, minute, 0);
        if(alarm <= now) alarm.setDate(alarm.getDate()+1);
        const delay = alarm - now;
        setTimeout(() => {
            sendNotification('💧 Su içme zamanı! Hedefine bir adım daha.');
            setWaterReminder(); // sonraki gün tekrar kur
        }, delay);
        alert(`Su alarmı ${time} için kuruldu.`);
    }
    function loadWorkoutReminder() { /* basit placeholder */ }
    
    // YEDEKLEME
    function exportBackup() {
        const backup = JSON.stringify(data);
        const blob = new Blob([backup], {type:'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'fitness_backup.json';
        a.click();
    }
    function importBackup() {
        const file = document.getElementById('restoreFile').files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            const imported = JSON.parse(e.target.result);
            data = imported;
            waterIntake = data.water || 0;
            totalSetCount = data.workouts?.reduce((s,w)=>s+(w.sets||0),0) || 0;
            saveToLocal();
            loadData();
            sendNotification('Yedek geri yüklendi.');
        };
        reader.readAsText(file);
    }

    // SES TOGGLE
    function toggleSound() {
        soundEnabled = !soundEnabled;
        const btn = document.getElementById('soundToggleBtn');
        if(btn) btn.innerText = soundEnabled ? 'Ses: AÇIK' : 'Ses: KAPALI';
    }

    // NAVIGASYON
    function showHome() {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById('homeGrid').style.display = 'grid';
    }
    function showPage(pageId) {
        document.getElementById('homeGrid').style.display = 'none';
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        const target = document.getElementById(pageId + 'Page');
        if(target) target.classList.add('active-page');
    }
    function initNavigation() {
        document.querySelectorAll('.card[data-page]').forEach(card => {
            card.addEventListener('click', (e) => {
                const page = card.getAttribute('data-page');
                if(page) showPage(page);
            });
        });
        document.getElementById('videoBtn')?.addEventListener('click', () => {
            window.open('https://www.youtube.com/watch?v=dQw4w9WgXcQ', '_blank');
            addXP(2);
        });
        const soundBtn = document.getElementById('soundToggleBtn');
        if(soundBtn) soundBtn.addEventListener('click', toggleSound);
    }
    // İlk yükleme
    loadData();
    requestNotificationPermission(); // ilk izin iste
    initNavigation();
    showHome();
    setWaterChartType('day');
    loadWorkoutReminder();
</script>
</body>
</html>
