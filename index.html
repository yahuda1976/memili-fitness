<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memili Fitness PRO 🔥</title><style>
body {
    font-family: Arial;
    background:#000;
    color:#fff;
    margin:0;
}

.header {
    text-align:center;
    padding:15px;
    font-weight:bold;
    font-size:22px;
}

.card {
    background:#e8e6e1;
    color:#000;
    margin:10px;
    padding:15px;
    border-radius:20px;
}

.item {
    padding:12px;
    margin:6px 0;
    border-radius:12px;
    background:#ddd;
    cursor:pointer;
}

.done {
    background:#a8d5a8;
    text-decoration:line-through;
}
</style></head><body><div class="header">🔥 MEMİLİ FITNESS PRO</div><div id="app"></div><script>

// ===== SENİN DATA (AYNEN KORUNDU) =====
let data = {
"PAZARTESI":[
"07:00 Yulaf + whey",
"💧 Su",
"🏋️ Dumbbell bench press (4 set)",
"💧 Su"
],
"SALI":[
"Ton balığı",
"💧 Su",
"🏋️ Sırt",
"💧 Su"
]
};

// ===== STORAGE =====
let done = JSON.parse(localStorage.getItem("memili_done") || "{}");

// ===== SES (APK UYUMLU) =====
function beep(){
    try{
        let a = new Audio("beep.mp3");
        a.play();
    }catch(e){}
}

// ===== KAYDET =====
function save(){
    localStorage.setItem("memili_done", JSON.stringify(done));
}

// ===== RENDER =====
function render(){
    let app = document.getElementById("app");
    app.innerHTML="";

    Object.keys(data).forEach(day=>{
        let card = document.createElement("div");
        card.className="card";
        card.innerHTML="<h3>"+day+"</h3>";

        data[day].forEach((item,i)=>{
            let div = document.createElement("div");
            div.className="item";

            let key = day+"_"+i;

            if(done[key]) div.classList.add("done");

            div.innerText=item;

            div.onclick=()=>{
                done[key]=!done[key];

                if(done[key]){
                    beep();
                }

                save();
                render();
            };

            card.appendChild(div);
        });

        app.appendChild(card);
    });
}

render();

</script></body>
</html>
