<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>Fitness Pro 🔥</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; background:#000; color:#fff; min-height:100vh; padding-bottom:160px; }
.app-header { background:rgba(0,0,0,0.9); backdrop-filter:blur(20px); padding:12px; text-align:center; position:sticky; top:0; z-index:100; }
.app-header h1 { font-size:1.5rem; font-weight:800; background:linear-gradient(135deg,#007aff,#5856d6); -webkit-background-clip:text; color:transparent; }
.grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; padding:20px; max-width:500px; margin:0 auto; }
.card { background:#e8e6e1; color:#1c1c1e; border-radius:28px; padding:20px 12px; text-align:center; cursor:pointer; transition:0.2s; }
.card:active { transform:scale(0.96); }
.card h3 { font-size:1.25rem; font-weight:900; color:#d93f3f; }
.day-view { position:fixed; top:0; left:0; right:0; bottom:0; background:#000; z-index:1000; overflow-y:auto; }
.day-header { background:rgba(0,0,0,0.9); backdrop-filter:blur(20px); padding:15px 20px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:10; }
.back-btn, .add-item-btn { background:#ff3b30; border:none; padding:12px 24px; border-radius:40px; color:white; font-weight:800; cursor:pointer; }
.item, .set { background:#e8e6e1; margin:10px 16px; padding:14px; border-radius:20px; cursor:pointer; display:flex; align-items:center; gap:12px; color:#1c1c1e; }
.item.done, .set.done { background:#a8d5a8; text-decoration:line-through; opacity:0.85; }
.bottom-quest { position:fixed; bottom:0; left:0; right:0; background:#e8e6e1; padding:12px 20px; z-index:100; color:#1c1c1e; }
.toast { position:fixed; bottom:30%; left:50%; transform:translateX(-50%); background:#1c1c1e; color:white; padding:12px 24px; border-radius:60px; z-index:2000; animation:fade 1.8s forwards; }
@keyframes fade { to { opacity:0; } }
.hidden { display:none; }
</style>
</head>
<body>

<div id="appContent">
  <div class="app-header"><h1>🔥 FITNESS PRO v2</h1></div>
  <div id="homeGrid" class="grid"></div>

  <div style="text-align:center;padding:10px;">
    <button onclick="exportData()" style="background:#34c759;color:white;border:none;padding:12px 24px;border-radius:30px;margin:5px;">📤 Export</button>
    <button onclick="importData()" style="background:#007aff;color:white;border:none;padding:12px 24px;border-radius:30px;margin:5px;">📥 Import</button>
  </div>
</div>

<div id="dayView" class="day-view hidden">
  <div class="day-header">
    <button class="back-btn" onclick="closeDay()">← Geri</button>
    <div class="day-title" id="dayTitle" style="font-weight:800;font-size:1.4rem;"></div>
    <button class="add-item-btn" onclick="showToast('Ekleme yakında geliyor...')">+ Ekle</button>
  </div>
  <div id="dayItems"></div>
</div>

<div class="bottom-quest">
  <div style="font-weight:800;text-align:center;margin-bottom:8px;color:#007aff;">✨ GÜNLÜK GÖREVLER ✨</div>
  <div id="questArea" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;"></div>
</div>

<script>
// ==================== VERİ ====================
let data = {
"PAZARTESI": ["07:00 Yulaf + süt + kahve - Whey (1 ölçek) - Omega 3 + çörek otu yağı","💧 1 bardak","07:30 💧 1 bardak","08:00 💧 1 bardak","09:00 Skyr + chia","💧 1 bardak","🏋️ GÖĞÜS + TRICEPS (HEAVY)",{ex:"Incline Dumbbell Press",sets:4},{ex:"Dumbbell Bench Press",sets:4},{ex:"Dips",sets:3},{ex:"Triceps Pushdown",sets:3},"20:15 Whey + Kreatin"],
"SALI": ["07:00 Yulaf + süt + kahve","💧 1 bardak","🏋️ SIRT + BICEPS",{ex:"Lat Pulldown",sets:4},{ex:"Seated Cable Row",sets:4},{ex:"Dumbbell Curl",sets:3}],
"CARSAMBA": ["07:00 Yulaf","🏋️ BACAK",{ex:"Leg Press",sets:4},{ex:"Leg Extension",sets:3},{ex:"Calf Raise",sets:4}],
"PERSEMBE": ["07:00 Yulaf","🏋️ OMUZ",{ex:"Shoulder Press",sets:4},{ex:"Lateral Raise",sets:4}],
"CUMA": ["07:00 Yulaf","🏋️ GÖĞÜS + KOL",{ex:"Machine Chest Press",sets:3},{ex:"Triceps Pushdown",sets:3}],
"CUMARTESI": ["Rest Day - Aktif dinlenme"],
"PAZAR": ["Rest Day"]
};

let doneState = {};
let currentDayOpen = null;

// ==================== EXPORT / IMPORT ====================
function exportData() {
  const backup = {data: data, doneState: doneState};
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(backup, null, 2)], {type: "application/json"}));
  a.download = "fitness-yedek.json";
  a.click();
  showToast("📤 Yedek indirildi");
}

function importData() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json";
  inp.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const imp = JSON.parse(ev.target.result);
        if (imp.data) data = imp.data;
        if (imp.doneState) doneState = imp.doneState;
        showToast("✅ Yedek yüklendi");
        location.reload();
      } catch(err) { showToast("❌ Dosya okunamadı"); }
    };
    reader.readAsText(file);
  };
  inp.click();
}

function showToast(msg) {
  let t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1600);
}

// ==================== ANA FONKSİYONLAR ====================
function buildHome() {
  const grid = document.getElementById("homeGrid");
  grid.innerHTML = "";
  Object.keys(data).forEach(day => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<h3>${day}</h3><small>Antrenman günü</small>`;
    card.onclick = () => openDay(day);
    grid.appendChild(card);
  });
}

function openDay(day) {
  currentDayOpen = day;
  document.getElementById("appContent").style.display = "none";
  document.getElementById("dayView").classList.remove("hidden");
  document.getElementById("dayTitle").textContent = day;
  renderDayItems(day);
}

function closeDay() {
  document.getElementById("dayView").classList.add("hidden");
  document.getElementById("appContent").style.display = "block";
}

function renderDayItems(day) {
  const cont = document.getElementById("dayItems");
  cont.innerHTML = "";

  const items = data[day] || [];
  items.forEach((item, idx) => {
    if (typeof item === "string") {
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `<span>${item}</span>`;
      const key = `\( {day}|item| \){idx}`;
      if (doneState[key]) div.classList.add("done");

      div.onclick = (e) => {
        e.stopImmediatePropagation();
        if (doneState[key]) {
          delete doneState[key];
        } else {
          doneState[key] = true;
        }
        renderDayItems(day);
        showToast("✅ Güncellendi");
      };
      cont.appendChild(div);
    } 
    else if (item && item.ex) {
      const title = document.createElement("div");
      title.style = "padding:16px 16px 8px 20px; font-weight:900; color:#ff3b30; font-size:1.1rem;";
      title.innerHTML = `💪 \( {item.ex} ( \){item.sets} set)`;
      cont.appendChild(title);

      for (let s = 1; s <= item.sets; s++) {
        const setDiv = document.createElement("div");
        setDiv.className = "set";
        setDiv.innerHTML = `<span>Set ${s}</span>`;
        const setKey = `\( {day}|set| \){item.ex}|${s}`;
        if (doneState[setKey]) setDiv.classList.add("done");

        setDiv.onclick = (e) => {
          e.stopImmediatePropagation();
          if (doneState[setKey]) {
            delete doneState[setKey];
          } else {
            doneState[setKey] = true;
            showToast(`✅ Set ${s} tamamlandı`);
          }
          renderDayItems(day);
        };
        cont.appendChild(setDiv);
      }
    }
  });
}

function showAddItemToDay() {
  showToast("Yeni öğe ekleme yakında aktif olacak");
}

// Başlangıç
buildHome();
showToast("Fitness Pro v2 Yüklendi");
</script>
</body>
</html>
