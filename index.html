    function openDB() { return new Promise((res,rej)=>{ let req=indexedDB.open(DB_NAME,2); req.onerror=rej; req.onsuccess=e=>{ db=e.target.result; res(); }; req.onupgradeneeded=e=>{ let d=e.target.result; if(!d.objectStoreNames.contains(STORE_NAME)) d.createObjectStore(STORE_NAME,{keyPath:"id"}); }; }); }
    async function saveVideoToDB(id,blob){ let db=await openDB(); return new Promise((res,rej)=>{ let tx=db.transaction(STORE_NAME,"readwrite"); tx.objectStore(STORE_NAME).put({id:id,video:blob}).onsuccess=res; tx.onerror=rej; }); }
    async function getVideoFromDB(id){ let db=await openDB(); return new Promise(res=>{ db.transaction(STORE_NAME,"readonly").objectStore(STORE_NAME).get(id).onsuccess=e=>res(e.target.result?.video||null); }); }
    async function deleteVideoFromDB(id){ let db=await openDB(); return new Promise(res=>{ db.transaction(STORE_NAME,"readwrite").objectStore(STORE_NAME).delete(id).onsuccess=res; }); }

    function showToast(msg){ let t=document.createElement("div"); t.className="toast"; t.innerText=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1600); }
    function playBeep(){ try{ let ctx=new (window.AudioContext||window.webkitAudioContext)(); let o=ctx.createOscillator(); o.frequency.value=880; let g=ctx.createGain(); g.gain.value=0.1; o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.1); ctx.resume(); } catch(e){} }
    function stopTimer(){ if(timerInterval) clearInterval(timerInterval); let tb=document.getElementById("timerBox"); if(tb) tb.style.display="none"; if(currentSound) currentSound.close(); soundStopFlag=false; }
    function startTimer(sec){ stopTimer(); let rem=sec; let tb=document.getElementById("timerBox"), tn=document.getElementById("timerNum"); if(!tb||!tn) return; tb.style.display="block"; tn.innerText=rem; timerInterval=setInterval(()=>{ if(rem<=1){ clearInterval(timerInterval); tb.style.display="none"; playLongBeep(); showToast("🔔 Dinlenme bitti!"); } else { rem--; tn.innerText=rem; } },1000); }
    function playLongBeep(){ if(soundStopFlag) return; try{ if(currentSound) currentSound.close(); const ctx=new (window.AudioContext||window.webkitAudioContext)(); currentSound=ctx; const dur=10,int=0.4; let start=ctx.currentTime; const osc=ctx.createOscillator(); const gain=ctx.createGain(); osc.type="square"; osc.frequency.value=880; gain.gain.value=0.18; osc.connect(gain); gain.connect(ctx.destination); osc.start(); for(let i=0;i<dur/int;i++){ let t=start+i*int; gain.gain.setValueAtTime(0.18,t); gain.gain.setValueAtTime(0.00001,t+0.15); } osc.stop(start+dur); ctx.resume(); currentSound={close:()=>{ try{ osc.stop(); ctx.close(); }catch(e){} } }; } catch(e){} }
    function customTimer(){ let s=prompt("Dinlenme süresi (saniye):","90"); if(s && !isNaN(parseInt(s)) && parseInt(s)>0) startTimer(parseInt(s)); }
    function getSetLog(day,ex,setNo){ return setLogs[day]?.[ex]?.[setNo]||null; }
    function saveSetLog(day,ex,setNo,weight,reps){ if(!setLogs[day]) setLogs[day]={}; if(!setLogs[day][ex]) setLogs[day][ex]={}; setLogs[day][ex][setNo]={weight,reps}; localStorage.setItem("fitnessSetLogs",JSON.stringify(setLogs)); let m=muscleGroupMap[ex]; if(m){ muscleLastTrained[m]=new Date().toISOString(); localStorage.setItem("muscleLastTrained",JSON.stringify(muscleLastTrained)); renderRecoveryPanel(); } }
    function promptWeightAndReps(day,ex,setNo,defaultW,defaultR,onSave){ let sugg=getSetLog(day,ex,setNo); let defW=defaultW||(sugg?sugg.weight:0); let defR=defaultR||(sugg?sugg.reps:8); let modal=document.createElement("div"); modal.className="modal"; modal.innerHTML=`<div class="modal-content"><h3>⚡ ${ex} - Set ${setNo}</h3><div><label>🔄 Tekrar Sayısı</label><input type="number" id="repsInput" class="input-number-only" value="${defR}" step="1" min="1"></div><div><label>⚖️ Ağırlık (kg)</label><input type="number" id="weightInput" class="input-number-only" value="${defW}" step="1" min="0"></div><div class="modal-buttons"><button class="modal-btn confirm" id="saveBtn">Kaydet</button><button class="modal-btn cancel" onclick="this.closest('.modal').remove()">İptal</button></div></div>`; document.body.appendChild(modal); modal.querySelector("#saveBtn").onclick=()=>{ let w=parseInt(modal.querySelector("#weightInput").value)||0; let r=parseInt(modal.querySelector("#repsInput").value)||1; saveSetLog(day,ex,setNo,w,r); modal.remove(); if(onSave) onSave(w,r); showToast(`✅ Set ${setNo}: ${r} tekrar x ${w} kg kaydedildi`); let setKey=`${day}|set|${ex}|${setNo}`; if(!doneState[setKey]){ doneState[setKey]=true; totalSetCount++; saveDataToLocal(); updateAllStats(); if(currentDayOpen===day) renderDayItems(day); buildHome(); startTimer(90); showToast(`✅ Set ${setNo} tamamlandı! +30 XP 🔥`); } else { saveDataToLocal(); if(currentDayOpen===day) renderDayItems(day); } }; }
    function saveDataToLocal(){ localStorage.setItem("fitnessDataUltimate",JSON.stringify(data)); localStorage.setItem("fitnessDoneUltimate",JSON.stringify(doneState)); localStorage.setItem("fitnessWaterUltimate",JSON.stringify(waterIntake)); localStorage.setItem("fitnessSetLogs",JSON.stringify(setLogs)); localStorage.setItem("muscleLastTrained",JSON.stringify(muscleLastTrained)); }
    function loadDataFromLocal(){ let sd=localStorage.getItem("fitnessDataUltimate"); if(sd) data=JSON.parse(sd); let s=localStorage.getItem("fitnessDoneUltimate"); if(s) doneState=JSON.parse(s); let sw=localStorage.getItem("fitnessWaterUltimate"); if(sw) waterIntake=JSON.parse(sw); let logs=localStorage.getItem("fitnessSetLogs"); if(logs) setLogs=JSON.parse(logs); let ml=localStorage.getItem("muscleLastTrained"); if(ml) muscleLastTrained=JSON.parse(ml); }
    function updateAllStats(){ let totalWater=Object.values(waterIntake).reduce((a,b)=>a+b,0); let bestDayScore=0,bestDayName=""; Object.keys(data).forEach(day=>{ let ds=0; Object.keys(doneState).forEach(k=>{ if(k.includes(day)){ if(k.includes("set")) ds+=2; if(k.includes("meal")) ds+=1; } }); if(ds>bestDayScore){ bestDayScore=ds; bestDayName=day; } }); document.getElementById("totalSets").innerText=totalSetCount; document.getElementById("totalWater").innerText=totalWater; document.getElementById("bestDay").innerText=bestDayName||"-"; document.getElementById("totalXP").innerText=totalSetCount*30; let badges=[]; if(totalSetCount>=20) badges.push("🔥 Alev Rozeti"); if(totalSetCount>=50) badges.push("💪 Demir Rozet"); if(totalSetCount>=100) badges.push("👑 Efsane Rozeti"); if(badges.length===0) badges.push("🔒 20 set yaparak ilk rozeti kazan!"); document.getElementById("badgesContainer").innerHTML=badges.map(b=>`<div class="badge">${b}</div>`).join(''); }
    function getDayStats(day){ let total=0,comp=0; let items=data[day]; if(!items) return {total,comp,percent:0}; items.forEach((item,idx)=>{ if(typeof item==="string"){ total++; if(doneState[`${day}|meal|${idx}`]) comp++; } else if(item&&typeof item==="object"&&item.sets){ for(let s=1;s<=item.sets;s++){ total++; if(doneState[`${day}|set|${item.ex}|${s}`]) comp++; } } }); return {total,comp,percent:total===0?0:(comp/total)*100}; }
    function buildHome(){ let grid=document.getElementById("homeGrid"); grid.innerHTML=""; Object.keys(data).forEach(day=>{ let stats=getDayStats(day); let card=document.createElement("div"); card.className="card"; card.innerHTML=`<h3>${day}</h3><div class="progress-bar"><div class="progress-fill" style="width:${stats.percent}%"></div></div><small>${stats.completed}/${stats.total} tamamlandı</small>`; card.onclick=()=>openDay(day); grid.appendChild(card); }); let setCard=document.createElement("div"); setCard.className="card settings-card"; setCard.innerHTML=`<h3>AYARLAR</h3><div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div><small>Yönetim & Yedekleme</small>`; setCard.onclick=()=>openSettings(); grid.appendChild(setCard); }
    function openDay(day){ currentDayOpen=day; document.getElementById("homeGrid").style.display="none"; document.getElementById("statsPanel").style.display="none"; document.getElementById("dayView").classList.remove("hidden"); document.getElementById("settingsView").classList.add("hidden"); document.getElementById("dayTitle").innerText=day; renderDayItems(day); updateDailyMacros(); renderRecoveryPanel(); }
    function closeDay(){ stopTimer(); document.getElementById("dayView").classList.add("hidden"); document.getElementById("homeGrid").style.display="grid"; document.getElementById("statsPanel").style.display="block"; updateAllStats(); buildHome(); }
    function openSettings(){ stopTimer(); document.getElementById("homeGrid").style.display="none"; document.getElementById("statsPanel").style.display="none"; document.getElementById("dayView").classList.add("hidden"); document.getElementById("settingsView").classList.remove("hidden"); updateWaterChart(); updateWeeklyChart(); }
    function closeSettings(){ document.getElementById("settingsView").classList.add("hidden"); document.getElementById("homeGrid").style.display="grid"; document.getElementById("statsPanel").style.display="block"; buildHome(); }
    function updateDailyMacros(){ if(!currentDayOpen) return; let macros={protein:0,carb:0,fat:0,cal:0}; let items=data[currentDayOpen]; items.forEach((item,idx)=>{ let key=`${currentDayOpen}|meal|${idx}`; if(doneState[key] && typeof item==="string" && !item.includes("💧") && !item.includes("👉")){ let m=parseFoodAndCalcMacros(item); macros.protein+=m.p; macros.carb+=m.k; macros.fat+=m.f; macros.cal+=m.cal; } }); dailyMacros=macros; renderMacroBar(); }
    function renderMacroBar(){ let bar=document.getElementById("macroBar"); if(!bar){ bar=document.createElement("div"); bar.id="macroBar"; bar.className="macro-bar"; let dh=document.getElementById("dayView"); if(dh && dh.querySelector(".day-header")) dh.querySelector(".day-header").after(bar); } bar.innerHTML=`<div class="macro-item"><span>🔥</span><b>${Math.round(dailyMacros.cal)}</b><small>Kalori</small></div><div class="macro-item"><span>💪</span><b>${Math.round(dailyMacros.protein)}g</b><small>Protein</small></div><div class="macro-item"><span>🌾</span><b>${Math.round(dailyMacros.carb)}g</b><small>Karb</small></div><div class="macro-item"><span>🥑</span><b>${Math.round(dailyMacros.fat)}g</b><small>Yağ</small></div>`; }
    function getRecoveryStatus(last){ if(!last) return "green"; let h=(new Date()-new Date(last))/(1000*3600); if(h<24) return "red"; if(h<48) return "orange"; return "green"; }
    function renderRecoveryPanel(){ let p=document.getElementById("recoveryPanel"); if(!p) return; let muscles=["Göğüs","Sırt","Omuz","Biceps","Triceps","Bacak"]; p.innerHTML=muscles.map(m=>{ let l=muscleLastTrained[m]; let s=getRecoveryStatus(l); let t=m+(l?` (${Math.floor((new Date()-new Date(l))/(1000*3600))}s)`:" (yok)"); return `<div class="recovery-item recovery-${s}">${t}</div>`; }).join(''); }
    function updateQuests(day){ let water=0,meals=0,sets=0; Object.keys(doneState).forEach(k=>{ if(k.includes(day)){ if(k.includes("meal")){ meals++; let idx=parseInt(k.split("|")[2]); let txt=data[day]?.[idx]; if(typeof txt==="string" && txt.includes("💧")) water++; } if(k.includes("set")) sets++; } }); let wk=`${day}_water`; let totalWater=(waterIntake[wk]||0)+water; document.getElementById("questWater").innerHTML=`${Math.min(totalWater,8)}/8`; document.getElementById("questMeal").innerHTML=`${Math.min(meals,12)}/12`; document.getElementById("questSet").innerHTML=`${Math.min(sets,20)}/20`; let score=Math.min(totalWater*5+meals*3+sets*2,100); document.getElementById("dailyScoreText").innerText=score; document.getElementById("scoreFill").style.width=score+"%"; document.getElementById("questScore").innerHTML=`${score}/100`; }
    function moveItemUp(day,idx){ if(idx>0){ [data[day][idx],data[day][idx-1]]=[data[day][idx-1],data[day][idx]]; saveDataToLocal(); if(currentDayOpen===day) renderDayItems(day); buildHome(); showToast("⬆️ Yukarı taşındı"); } }
    function moveItemDown(day,idx){ if(idx<data[day].length-1){ [data[day][idx],data[day][idx+1]]=[data[day][idx+1],data[day][idx]]; saveDataToLocal(); if(currentDayOpen===day) renderDayItems(day); buildHome(); showToast("⬇️ Aşağı taşındı"); } }
    function showAddItemToDay(){ if(!currentDayOpen) return; let modal=document.createElement("div"); modal.className="modal"; modal.innerHTML=`<div class="modal-content"><h3>➕ ${currentDayOpen}</h3><select id="itemTypeSelect"><option value="meal">🍽️ Yemek</option><option value="exercise">💪 Hareket</option></select><input id="itemNameInput" placeholder="Ad"><div id="setsContainer" style="display:none"><input id="itemSetsInput" type="number" placeholder="Set sayısı"></div><div class="modal-buttons"><button class="modal-btn confirm" onclick="addItemToCurrentDay()">Ekle</button><button class="modal-btn cancel" onclick="this.closest('.modal').remove()">İptal</button></div></div>`; document.body.appendChild(modal); let typeSel=document.getElementById("itemTypeSelect"), setsCont=document.getElementById("setsContainer"); typeSel.onchange=()=>{ setsCont.style.display=typeSel.value==="exercise"?"block":"none"; }; }
    function addItemToCurrentDay(){ let type=document.getElementById("itemTypeSelect").value, name=document.getElementById("itemNameInput").value; if(!name){ showToast("Ad girin"); return; } if(type==="meal"){ data[currentDayOpen].push(name); showToast(`✅ "${name}" eklendi`); } else { let sets=parseInt(document.getElementById("itemSetsInput").value); if(!sets){ showToast("Set sayısı girin"); return; } data[currentDayOpen].push({ex:name, sets:sets, link:"", notes:"", localVideo:null}); showToast(`✅ "${name}" (${sets} set) eklendi`); } saveDataToLocal(); renderDayItems(currentDayOpen); buildHome(); document.querySelector(".modal").remove(); }
    function resetWeek(){ if(confirm("⚠️ Tüm haftayı sıfırla? İşaretler gider, içerikler kalır.")){ doneState={}; waterIntake={}; totalSetCount=0; saveDataToLocal(); if(currentDayOpen) renderDayItems(currentDayOpen); buildHome(); updateAllStats(); updateWaterChart(); updateWeeklyChart(); showToast("✅ Hafta sıfırlandı"); } }
    function getWaterData(){ let days=["PAZARTESI","SALI","CARSAMBA","PERSEMBE","CUMA","CUMARTESI","PAZAR"]; return days.map(d=>({day:d.substring(0,3), amount:waterIntake[`${d}_water`]||0})); }
    function setWaterChartType(t){ currentChartType=t; document.querySelectorAll('.chart-tab').forEach(tab=>tab.classList.remove('active')); if(event && event.target) event.target.classList.add('active'); updateWaterChart(); }
    function updateWaterChart(){ let cont=document.getElementById("waterChartContainer"), msg=document.getElementById("waterChartMessage"); if(!cont) return; if(currentChartType==='daily'){ let wd=getWaterData(), maxW=Math.max(...wd.map(d=>d.amount),1); cont.innerHTML='<h4>📊 Günlük Su (bardak)</h4>'; wd.forEach(d=>{ let p=(d.amount/maxW)*100; cont.innerHTML+=`<div class="chart-bar-item"><div class="bar-label">${d.day}</div><div class="bar-fill"><div class="bar" style="width:${p}%">${d.amount}</div></div></div>`; }); msg.innerHTML=`💧 Toplam: ${wd.reduce((a,b)=>a+b.amount,0)} bardak`; } else if(currentChartType==='weekly'){ let tot=Object.values(waterIntake).reduce((a,b)=>a+b,0); cont.innerHTML='<h4>📆 Haftalık Su</h4><div class="chart-bar-item"><div class="bar-label">Bu Hafta</div><div class="bar-fill"><div class="bar" style="width:${Math.min((tot/100)*100,100)}%">${tot}</div></div></div>'; msg.innerHTML=`💧 Bu hafta: ${tot} bardak`; } else { let tot=Object.values(waterIntake).reduce((a,b)=>a+b,0); cont.innerHTML='<h4>📊 Aylık Su</h4><div class="chart-bar-item"><div class="bar-label">Bu Ay</div><div class="bar-fill"><div class="bar" style="width:${Math.min((tot/200)*100,100)}%">${tot}</div></div></div>'; msg.innerHTML=`💧 Bu ay: ${tot} bardak`; } }
    function updateWeeklyChart(){ let cont=document.getElementById("weeklyChartContainer"); if(!cont) return; let days=["PAZARTESI","SALI","CARSAMBA","PERSEMBE","CUMA","CUMARTESI","PAZAR"]; cont.innerHTML="<h4>📈 Haftalık Set Grafiği</h4>"; days.forEach(day=>{ let sets=0; Object.keys(doneState).forEach(k=>{ if(k.includes(day) && k.includes("set")) sets++; }); let w=Math.min((sets/20)*100,100); cont.innerHTML+=`<div class="chart-bar-item"><div class="bar-label">${day.substring(0,3)}</div><div class="bar-fill"><div class="bar" style="width:${w}%">${sets}</div></div></div>`; }); }
    function backupData(){ let exp={data,doneState,waterIntake,totalSetCount,setLogs,muscleLastTrained}; let str=JSON.stringify(exp,null,2); let a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([str])); a.download=`fitness_backup_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.json`; a.click(); showToast("💾 Yedek alındı"); }
    function restoreData(){ let inp=document.createElement("input"); inp.type="file"; inp.accept="application/json"; inp.onchange=e=>{ let file=e.target.files[0]; if(!file) return; let reader=new FileReader(); reader.onload=ev=>{ try{ let imp=JSON.parse(ev.target.result); if(imp.data) data=imp.data; if(imp.doneState) doneState=imp.doneState; if(imp.waterIntake) waterIntake=imp.waterIntake; if(imp.totalSetCount!==undefined) totalSetCount=imp.totalSetCount; if(imp.setLogs) setLogs=imp.setLogs; if(imp.muscleLastTrained) muscleLastTrained=imp.muscleLastTrained; saveDataToLocal(); if(currentDayOpen) renderDayItems(currentDayOpen); buildHome(); updateAllStats(); updateWaterChart(); updateWeeklyChart(); showToast("✅ Yedek başarıyla yüklendi"); } catch(err){ alert("Hatalı dosya"); } }; reader.readAsText(file); }; inp.click(); }

    function openExerciseVideo(ex,link){ let url=link || `https://www.youtube.com/results?search_query=${encodeURIComponent(ex+" egzersizi")}`; window.open(url,'_blank'); }
    async function addLocalVideo(ex,day,idx){ let input=document.createElement("input"); input.type="file"; input.accept="video/*"; input.onchange=async(e)=>{ let file=e.target.files[0]; if(file && file.type.startsWith("video/")){ let videoId=`${day}_${ex}_${idx}`; try{ await saveVideoToDB(videoId,file); showToast(`✅ "${ex}" için yerel video kaydedildi.`); } catch(err){ showToast("Video kaydedilemedi."); } } else { showToast("Lütfen geçerli bir video dosyası seçin."); } }; input.click(); }
    async function playLocalVideo(ex,day,idx){ let videoId=`${day}_${ex}_${idx}`; try{ let blob=await getVideoFromDB(videoId); if(blob){ let url=URL.createObjectURL(blob); let modal=document.createElement("div"); modal.className="video-modal"; modal.innerHTML=`<div class="video-modal-content"><video controls autoplay src="${url}"></video><div><button class="close-video-btn">Kapat</button></div></div>`; document.body.appendChild(modal); modal.querySelector(".close-video-btn").onclick=()=>{ modal.remove(); URL.revokeObjectURL(url); }; modal.onclick=(e)=>{ if(e.target===modal){ modal.remove(); URL.revokeObjectURL(url); } }; } else { showToast("Bu hareket için kayıtlı yerel video yok."); } } catch(e){ showToast("Video oynatılamadı."); } }
    async function removeLocalVideo(ex,day,idx){ let videoId=`${day}_${ex}_${idx}`; let existing=await getVideoFromDB(videoId); if(!existing){ showToast("Kayıtlı video yok."); return; } if(confirm(`"${ex}" için videoyu sil?`)){ await deleteVideoFromDB(videoId); showToast(`✅ "${ex}" için video silindi.`); } }
    function setVideoLink(ex,day,idx){ let link=prompt(`${ex} için YouTube linki:`, data[day][idx].link || ""); if(link!==null){ data[day][idx].link=link; saveDataToLocal(); if(currentDayOpen===day) renderDayItems(day); showToast("✅ Link kaydedildi!"); } }
    function showOneRMForExercise(ex){ let logs=setLogs; let last=null; for(let day in logs){ for(let e in logs[day]){ if(e===ex){ let sets=logs[day][e]; let maxSet=Object.values(sets).reduce((max,log)=>((log.weight||0)>(max.weight||0)?log:max),{weight:0,reps:0}); if(maxSet.weight>0) last=maxSet; } } } if(last && last.weight>0){ let oneRM=Math.round(last.weight * (36/(37-last.reps))); showToast(`🏆 ${ex} 1RM: ${oneRM} kg (${last.reps} tekrar × ${last.weight} kg)`); } else { showToast(`⚠️ ${ex} için henüz ağırlık kaydı yok.`); } }
    function showAlternatives(ex){ let altList={ "Incline Dumbbell Press":["Incline Barbell Press","Smith Machine Incline Press"], "Dumbbell Bench Press":["Barbell Bench Press","Chest Press Machine"], "Chest Dip":["Assisted Dip Machine","Decline Bench Press"], "Cable Fly":["Pec Deck Machine","Dumbbell Fly"], "Rope Pushdown":["Straight Bar Pushdown","V-Bar Pushdown"], "Overhead Extension":["Dumbbell Overhead Extension","Cable Overhead Extension"], "Lat Pulldown":["Pull-Up","Assisted Pull-Up Machine"], "Barbell Row":["T-Bar Row","Dumbbell Row"], "Seated Cable Row":["Machine Row","Dumbbell Row"], "Straight Arm Pulldown":["Dumbbell Pullover","Resistance Band Pulldown"], "Face Pull":["Reverse Pec Deck","Dumbbell Rear Delt Raise"], "Barbell Curl":["EZ Bar Curl","Dumbbell Curl"], "Hammer Curl":["Rope Hammer Curl","Cross Body Dumbbell Curl"], "Dumbbell Shoulder Press":["Barbell Shoulder Press","Machine Shoulder Press"], "Lateral Raise":["Cable Lateral Raise","Machine Lateral Raise"], "Reverse Pec Deck":["Cable Rear Delt Fly","Dumbbell Rear Delt Raise"], "Cable Lateral Raise":["Dumbbell Lateral Raise","Machine Lateral Raise"], "Cable Curl":["Dumbbell Curl","EZ Bar Curl"], "Squat":["Hack Squat Machine","Leg Press Machine"], "Leg Curl":["Lying Leg Curl","Seated Leg Curl"], "Leg Extension":["Sissy Squat","Step Up"], "Romanian Deadlift":["Dumbbell Romanian Deadlift","Hip Thrust"], "Walking Lunge":["Static Lunge","Bulgarian Split Squat"], "Calf Raise":["Seated Calf Raise","Leg Press Calf Raise"], "Incline Machine Chest Press":["Incline Dumbbell Press","Barbell Incline Press"], "Low to High Cable Fly":["Incline Dumbbell Fly","Pec Deck Machine"], "Pec Deck Machine":["Cable Fly","Dumbbell Fly"], "Push-Up":["Barbell Bench Press","Chest Press Machine"], "Cable Overhead Extension":["Dumbbell Overhead Extension","EZ Bar Skullcrusher"] }; let alts=altList[ex]; if(!alts||alts.length===0){ showToast("Alternatif bulunamadı"); return; } let msg="Alternatifler:\n"+alts.join("\n"); alert(msg); }
    function showExerciseNote(ex,day,idx){ let note=data[day][idx].notes||""; let modal=document.createElement("div"); modal.className="modal"; modal.innerHTML=`<div class="modal-content"><h3>📝 ${ex} - Notlar</h3><textarea id="exerciseNoteText" rows="6">${note}</textarea><div class="modal-buttons"><button class="modal-btn confirm" onclick="saveExerciseNote('${day}',${idx},'${ex}')">Kaydet</button><button class="modal-btn cancel" onclick="this.closest('.modal').remove()">İptal</button></div></div>`; document.body.appendChild(modal); }
    function saveExerciseNote(day,idx,ex){ let note=document.getElementById("exerciseNoteText").value; data[day][idx].notes=note; saveDataToLocal(); document.querySelector(".modal").remove(); showToast(`✅ ${ex} notu kaydedildi`); }

    function renderDayItems(day){
        let cont=document.getElementById("dayItems"); cont.innerHTML="";
        let items=data[day]; if(!items) return;
        items.forEach((item,idx)=>{
            if(typeof item==="string"){
                let div=document.createElement("div"); div.className="item";
                div.innerHTML=`<div class="move-buttons"><button class="move-btn" onclick="moveItemUp('${day}',${idx})">⬆️</button><button class="move-btn" onclick="moveItemDown('${day}',${idx})">⬇️</button></div><span>${item}</span>`;
                let key=`${day}|meal|${idx}`;
                if(doneState[key]) div.classList.add("done");
                div.onclick=(e)=>{ if(e.target.classList.contains('move-btn')) return; if(doneState[key]){ delete doneState[key]; div.classList.remove("done"); showToast("❌ Kaldırıldı"); } else { doneState[key]=true; div.classList.add("done"); if(item.includes("💧")){ let wk=`${day}_water`; waterIntake[wk]=(waterIntake[wk]||0)+1; updateWaterChart(); updateWeeklyChart(); showToast("💧 +1 bardak su!"); } else showToast("✅ Tamamlandı!"); } saveDataToLocal(); updateQuests(day); updateAllStats(); buildHome(); updateDailyMacros(); };
                cont.appendChild(div);
            } else if(item && typeof item==="object" && item.ex){
                let titleDiv=document.createElement("div"); titleDiv.className="ex-title";
                titleDiv.innerHTML=`<span>💪 ${item.ex}</span><div class="ex-title-buttons">
                    <button onclick="openExerciseVideo('${item.ex}','${item.link||""}')">📹 Video</button>
                    <button onclick="addLocalVideo('${item.ex}','${day}',${idx})">📂 Yerel Ekle</button>
                    <button onclick="playLocalVideo('${item.ex}','${day}',${idx})">▶️ Yerel Oynat</button>
                    <button onclick="removeLocalVideo('${item.ex}','${day}',${idx})">🗑️ Yerel Sil</button>
                    <button onclick="setVideoLink('${item.ex}','${day}',${idx})">🔗 Link</button>
                    <button onclick="showAlternatives('${item.ex}')">Diğer</button>
                    <button class="note-btn" onclick="showExerciseNote('${item.ex}','${day}',${idx})">Not</button>
                    <button class="oneRM-btn" onclick="showOneRMForExercise('${item.ex}')">1RM</button>
                </div>`;
                cont.appendChild(titleDiv);
                for(let s=1; s<=item.sets; s++){
                    let setDiv=document.createElement("div"); setDiv.className="set";
                    let log=getSetLog(day,item.ex,s);
                    let weightInfo=log?`${log.reps} tekrar × ${log.weight} kg`:"Ağırlık gir";
                    setDiv.innerHTML=`<div class="move-buttons"><button class="move-btn" onclick="moveItemUp('${day}',${idx})">⬆️</button><button class="move-btn" onclick="moveItemDown('${day}',${idx})">⬇️</button></div><span>Set ${s}</span><span class="set-info">${weightInfo}</span><span>⏱️ Dinlenme</span>`;
                    let setKey=`${day}|set|${item.ex}|${s}`;
                    if(doneState[setKey]) setDiv.classList.add("done");
                    setDiv.onclick=(function(snum,exName){ return function(ev){ if(ev.target.classList.contains('move-btn')) return; if(doneState[setKey]){ if(confirm("Bu seti tamamlanmamış saymak istiyor musunuz?")){ delete doneState[setKey]; totalSetCount--; saveDataToLocal(); updateAllStats(); renderDayItems(day); buildHome(); updateDailyMacros(); showToast("❌ Set iptal edildi"); } return; } let existing=getSetLog(day,exName,snum); promptWeightAndReps(day,exName,snum,existing?.weight,existing?.reps||8,()=>{ renderDayItems(day); updateAllStats(); buildHome(); updateDailyMacros(); }); }; })(s,item.ex);
                    cont.appendChild(setDiv);
                }
            }
        });
        updateQuests(day);
    }

    loadDataFromLocal();
    openDB().then(()=>console.log("DB hazır")).catch(e=>console.warn(e));
    buildHome();
    updateAllStats();
    updateWaterChart();
    updateWeeklyChart();
    document.getElementById("timerCloseBtn").onclick=stopTimer;
    document.getElementById("timerCustomBtn").onclick=customTimer;
    document.getElementById("stopSoundBtn").onclick=()=>{ soundStopFlag=true; if(currentSound) currentSound.close(); };
</script>
</body>
</html>
