<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Fitness Pro Ultimate 🔥</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
    color: #fff;
    min-height: 100vh;
    padding-bottom: 170px;
}

/* GİRİŞ EKRANI */
.login-container {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.login-box {
    background: linear-gradient(145deg, #2a2a3e, #1e1e2e);
    border-radius: 30px;
    padding: 40px 30px;
    text-align: center;
    max-width: 350px;
    width: 100%;
    border: 2px solid #00ffc3;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}
.login-box h2 {
    color: #00ffc3;
    margin-bottom: 10px;
    font-size: 1.8rem;
}
.login-box input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    background: #2a2a3e;
    border: 1px solid #00ffc3;
    border-radius: 25px;
    color: white;
    font-size: 1rem;
}
.login-box button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    background: linear-gradient(135deg, #00ffc3, #00b894);
    border: none;
    border-radius: 25px;
    color: #000;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
}
.login-error {
    color: #ff0055;
    margin-top: 10px;
    font-size: 0.8rem;
}

.app-header {
    background: linear-gradient(135deg, #00ffc3 0%, #00b894 100%);
    padding: 10px 15px;
    text-align: center;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,255,195,0.2);
}
.app-header h1 {
    font-size: 1.2rem;
    letter-spacing: 1px;
}
.sound-toggle {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    right: 10px;
    background: rgba(0,0,0,0.3);
    border: none;
    border-radius: 30px;
    padding: 4px 10px;
    cursor: pointer;
    color: white;
    font-weight: bold;
    font-size: 0.7rem;
}
.add-buttons {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    left: 10px;
    display: flex;
    gap: 5px;
}
.add-btn {
    background: rgba(0,0,0,0.3);
    border: none;
    border-radius: 30px;
    padding: 4px 10px;
    cursor: pointer;
    color: white;
    font-weight: bold;
    font-size: 0.7rem;
}
.backup-buttons {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    right: 80px;
    display: flex;
    gap: 5px;
}
.backup-btn {

    border: none;
    border-radius: 30px;
    padding: 4px 8px;
    cursor: pointer;
    color: white;
    font-size: 0.7rem;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    padding: 15px;
    max-width: 800px;
    margin: 0 auto;
}
.card {
    background: linear-gradient(145deg, #2a2a3e, #1e1e2e);
    border-radius: 16px;
    padding: 15px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    border: 1px solid rgba(0,255,195,0.2);
}
.card:hover {
    transform: translateY(-3px);
    border-color: #00ffc3;
}
.card h3 {
    font-size: 1.1rem;

    color: #00ffc3;
}
.progress-bar {
    width: 100%;
    height: 6px;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 8px;
}
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #00ffc3, #00b894);

}
small {
    font-size: 0.7rem;
}

.day-view {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: #0f0f1a;
    z-index: 1000;
    overflow-y: auto;

}
.day-header {
    background: linear-gradient(135deg, #00ffc3, #00b894);
    padding: 12px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
}
.back-btn, .add-item-btn {
    background: rgba(0,0,0,0.3);
    border: none;
    padding: 6px 12px;
    border-radius: 30px;
    color: white;
    font-size: 0.8rem;
    cursor: pointer;
}
.day-title {
    font-size: 1.2rem;
    font-weight: bold;
}
.item, .set {
    background: #1e1e2e;
    margin: 8px;
    padding: 12px;
    border-radius: 14px;
    cursor: pointer;
    transition: 0.1s;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.item:active, .set:active { transform: scale(0.98); }
.item.done, .set.done {
    background: linear-gradient(135deg, #00b89444, #00ffc344);
    text-decoration: line-through;
    opacity: 0.8;
}
.ex-title {
    color: #00ffc3;
    font-size: 1rem;
    margin: 12px 10px 3px;
    font-weight: bold;
    padding-left: 8px;
    border-left: 3px solid #00ffc3;
}

.bottom-quest {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
    border-top: 2px solid #00ffc3;
    padding: 8px 12px;
    z-index: 100;
}
.quest-title {
    font-size: 0.85rem;
    font-weight: bold;
    text-align: center;
    margin-bottom: 5px;
    color: #00ffc3;
}
.quest-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 5px;
}
.quest-item {
    text-align: center;
    background: #2a2a3e;
    padding: 4px;
    border-radius: 10px;
}
.quest-icon {
    font-size: 1.2rem;
}
.quest-progress {
    font-size: 0.7rem;
    font-weight: bold;
}
.daily-score {

}
.score-bar {

    height: 5px;
    background: #333;
    border-radius: 10px;
    margin-top: 4px;
    overflow: hidden;
}
.score-fill {
    height: 100%;
    background: linear-gradient(90deg, #ffd700, #ffaa00);
    transition: width 0.3s;
}

.stats-panel {
    background: #1a1a2e;
    margin: 15px;
    padding: 12px;
    border-radius: 16px;
    border: 1px solid #00ffc3;
}
.stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-top: 8px;
}
.stat-card {
    text-align: center;
    background: #2a2a3e;
    padding: 8px;
    border-radius: 12px;
    font-size: 0.8rem;
}
.chart-bars {
    margin-top: 12px;
}
.chart-bar-item {
    margin: 5px 0;
    display: flex;
    align-items: center;
    gap: 6px;
}
.bar-label {
    width: 40px;
    font-size: 0.7rem;
}
.bar-fill {
    flex: 1;
    height: 18px;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
}
.bar {
    height: 100%;
    background: linear-gradient(90deg, #00ffc3, #00b894);
    transition: width 0.5s;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 5px;
    color: #000;
    font-weight: bold;
    font-size: 0.65rem;
}
.badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 10px;
}
.badge {

    padding: 3px 10px;
    border-radius: 30px;
    font-size: 0.7rem;
    font-weight: bold;
    color: #000;
}
.toast {
    position: fixed;
    bottom: 30%;
    left: 50%;
    transform: translateX(-50%);
    background: #00ffc3;
    color: #000;
    padding: 8px 16px;
    border-radius: 50px;
    font-weight: bold;
    z-index: 2000;
    animation: fadeOut 1.5s forwards;
    font-size: 0.85rem;
}
@keyframes fadeOut {
    0% { opacity: 1; bottom: 30%; }
    70% { opacity: 1; }
    100% { opacity: 0; bottom: 40%; display: none; }
}
.hidden { display: none; }
.timer-box {
    position: fixed;
    bottom: 160px;
    right: 10px;
    background: #0a0a0a;
    border: 2px solid #00ffc3;
    border-radius: 14px;
    padding: 10px;
    text-align: center;
    z-index: 200;
    min-width: 100px;
}
.timer-num {

}
.timer-buttons {

.timer-btn {

    border: none;

.modal {

.modal-content {

.modal-btn.confirm {

    color: #000;
}
.modal-btn.cancel {
    background: #ff0055;
    color: white;
}
</style>
</head>

<script>
// ==================== ORİJİNAL İÇERİK ====================
let data = {
"Pazartesi":["07:00 Kahve + Omega-3","💧 2 bardak","07:30 Skyr 500g + chia + keten","1 muz","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı + lavaş + zeytinyağı","💧 2 bardak","14:00 Pirinç + tavuk/kebap + salata","💧 2 bardak","14:45 Whey","15:30 Kahve + EAA","💧 2 bardak","18:00 Yoğurt + muz","💧 2 bardak","🏋️ GÖĞÜS + TRİCEPS",{ex:"Dumbbell Bench Press",sets:4},{ex:"Incline Dumbbell Press",sets:4},{ex:"Dumbbell Fly",sets:3},{ex:"Cable Crossover",sets:3},{ex:"Rope Pushdown",sets:4},{ex:"Overhead DB Extension",sets:3},{ex:"Dips",sets:3},"💧 2 bardak","21:00 Whey + skyr + yulaf","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
"Salı":["07:00 Kahve + Omega-3","💧 2 bardak","07:30 Skyr + muz + chia","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı + lavaş","💧 2 bardak","14:00 Pirinç + tavuk","💧 2 bardak","14:45 Whey","15:30 Kahve + EAA","💧 2 bardak","18:00 Skyr + meyve","💧 2 bardak","🏋️ SIRT + BİCEPS",{ex:"Lat Pulldown",sets:4},{ex:"Seated Row",sets:4},{ex:"Dumbbell Row",sets:3},{ex:"Straight Arm Pulldown",sets:3},{ex:"Face Pull",sets:3},{ex:"DB Curl",sets:4},{ex:"Hammer Curl",sets:3},{ex:"Incline Curl",sets:3},"💧 2 bardak","21:00 Whey + skyr + yulaf","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
"Çarşamba":["07:30 Skyr + keten + muz","💧 2 bardak","09:30 Yoğurt + meyve","💧 2 bardak","12:30 Ton balığı + lavaş","💧 2 bardak","14:00 Tavuk + az pirinç","💧 2 bardak","18:00 Skyr","💧 2 bardak","20:00 Et + salata + zeytinyağı","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
"Perşembe":["07:00 Kahve + Omega-3","💧 2 bardak","07:30 Skyr + muz","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı + lavaş","💧 2 bardak","14:00 Pirinç + tavuk","💧 2 bardak","14:45 Whey","15:30 Kahve + EAA","💧 2 bardak","18:00 Yoğurt + muz","💧 2 bardak","🏋️ BACAK",{ex:"Leg Press",sets:4},{ex:"Squat",sets:3},{ex:"Leg Curl",sets:3},{ex:"Leg Extension",sets:3},{ex:"Calf Raise",sets:4},"💧 2 bardak","21:00 Whey + skyr + yulaf","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
"Cuma":["07:00 Kahve + Omega-3","💧 2 bardak","07:30 Skyr + chia","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı + lavaş","💧 2 bardak","14:00 Pirinç + kebap","💧 2 bardak","14:45 Whey","15:30 Kahve + EAA","💧 2 bardak","18:00 Skyr + muz","💧 2 bardak","🏋️ OMUZ + TRİCEPS",{ex:"Shoulder Press",sets:4},{ex:"Lateral Raise",sets:4},{ex:"Rear Delt Fly",sets:3},{ex:"Upright Row",sets:3},{ex:"Pushdown",sets:3},{ex:"Dips",sets:2},"💧 2 bardak","21:00 Whey + skyr + yulaf","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
"Cumartesi":["07:30 Skyr + muz","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı + lavaş","💧 2 bardak","14:00 Tavuk + pirinç","💧 2 bardak","18:00 Skyr","💧 2 bardak","20:00 Et + salata","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
"Pazar":["08:00 Kahve + Omega-3","💧 2 bardak","08:30 Skyr + muz","💧 2 bardak","11:00 Yoğurt + meyve","💧 2 bardak","14:00 Tavuk + az pirinç","💧 2 bardak","18:00 Skyr","💧 2 bardak","20:00 Et + salata","💧 2 bardak","22:30 Skyr","💧 2 bardak","🧘 AKTİF DİNLENME"]
};

// ==================== DEĞİŞKENLER ====================
let doneState = {};
let waterIntake = {};
let totalSetCount = 0;
let soundEnabled = true;
let currentTimer = null;
let currentDayOpen = null;
let currentUser = null;

// ==================== GİRİŞ SİSTEMİ ====================
function login() {
    const username = document.getElementById("loginUsername").value;
    const password = document.getElementById("loginPassword").value;
    
    // Demo kullanıcı kontrolü
    if(username === "kullanici" && password === "sifre123") {
        currentUser = username;
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("appContent").style.display = "block";
        loadDataFromLocal();
        buildHome();
        updateAllStats();
        showToast(`Hoş geldin ${username}! 💪`);
    } else {
        document.getElementById("loginError").innerText = "Hatalı kullanıcı adı veya şifre!";
    }
}

// ==================== YEDEKLEME SİSTEMLERİ ====================
function exportData() {
    const exportData = {
        data: data,
        doneState: doneState,
        waterIntake: waterIntake,
        totalSetCount: totalSetCount
    };
    const dataStr = JSON.stringify(exportData, null, 2);
    const blob = new Blob([dataStr], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `fitness_backup_${new Date().toISOString().slice(0,19)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast("✅ Veriler yedeklendi!");
}

function importData() {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "application/json";
    input.onchange = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const imported = JSON.parse(event.target.result);
                if(imported.data) data = imported.data;
                if(imported.doneState) doneState = imported.doneState;
                if(imported.waterIntake) waterIntake = imported.waterIntake;
                if(imported.totalSetCount !== undefined) totalSetCount = imported.totalSetCount;
                saveDataToLocal();
                buildHome();
                if(currentDayOpen) renderDayItems(currentDayOpen);
                updateAllStats();
                showToast("✅ Yedek geri yüklendi!");
            } catch(err) {
                showToast("❌ Hatalı dosya!");
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

function backupToDrive() {
    showToast("📱 Google Drive bağlantısı açılıyor...");
    const exportData = {
        data: data,
        doneState: doneState,
        waterIntake: waterIntake,
        totalSetCount: totalSetCount,
        user: currentUser,
        date: new Date().toISOString()
    };
    const dataStr = JSON.stringify(exportData, null, 2);
    const blob = new Blob([dataStr], {type: "application/json"});
    const file = new File([blob], `fitness_backup_${currentUser}.json`, {type: "application/json"});
    
    // Google Drive API için basit bir indirme linki
    const driveUrl = `https://drive.google.com/drive/search?q=fitness_backup`;
    window.open(driveUrl, "_blank");
    showToast("💾 Veriyi kaydettik, Google Drive'a yükleyebilirsin!");
}

// ==================== TIMER FONKSİYONLARI (ÇALIŞIYOR!) ====================
function beep() {
    if(!soundEnabled) return;
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.connect(ctx.destination);
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, 200);
    } catch(e) { console.log("ses hatası"); }
}

function stopTimer() {
    if(currentTimer) {
        clearInterval(currentTimer);
        currentTimer = null;
    }
    document.getElementById("timerBox").style.display = "none";
}

function startTimer(seconds) {
    stopTimer();
    let timerSeconds = seconds;
    const timerBox = document.getElementById("timerBox");
    const timerNum = document.getElementById("timerNum");
    timerBox.style.display = "block";
    timerNum.innerText = timerSeconds;
    
    currentTimer = setInterval(() => {
        if(timerSeconds <= 1) {
            stopTimer();
            beep();
            showToast("🔔 Dinlenme bitti! Devam et! 🔥");
        } else {
            timerSeconds--;
            timerNum.innerText = timerSeconds;
        }
    }, 1000);
}

function customTimer() {
    let sec = prompt("Dinlenme süresi (saniye):", "90");
    if(sec && !isNaN(parseInt(sec)) && parseInt(sec) > 0) {
        startTimer(parseInt(sec));
    }
}

// ==================== LOCALSTORAGE ====================
function saveDataToLocal() {
    localStorage.setItem("fitnessDataUltimate", JSON.stringify(data));
    localStorage.setItem("fitnessDoneUltimate", JSON.stringify(doneState));
    localStorage.setItem("fitnessWaterUltimate", JSON.stringify(waterIntake));
    localStorage.setItem("fitnessSetsUltimate", JSON.stringify(totalSetCount));
}

function loadDataFromLocal() {
    let savedData = localStorage.getItem("fitnessDataUltimate");
    if(savedData) data = JSON.parse(savedData);
    let saved = localStorage.getItem("fitnessDoneUltimate");
    if(saved) doneState = JSON.parse(saved);
    let savedWater = localStorage.getItem("fitnessWaterUltimate");
    if(savedWater) waterIntake = JSON.parse(savedWater);
    let savedSets = localStorage.getItem("fitnessSetsUltimate");
    if(savedSets) totalSetCount = JSON.parse(savedSets);
}

// ==================== DİĞER FONKSİYONLAR ====================
function getDayStats(day) {
    let total = 0, completed = 0;
    const items = data[day];
    if(!items) return { total, completed, percent: 0 };
    items.forEach((item, idx) => {
        if(typeof item === "string") {
            total++;
            if(doneState[`${day}|meal|${idx}`]) completed++;
        } else if(item && typeof item === "object" && item.sets) {
            for(let s = 1; s <= item.sets; s++) {
                total++;
                if(doneState[`${day}|set|${item.ex}|${s}`]) completed++;
            }
        }
    });
    return { total, completed, percent: total === 0 ? 0 : (completed/total)*100 };
}

function buildHome() {
    const grid = document.getElementById("homeGrid");
    if(!grid) return;
    grid.innerHTML = "";
    Object.keys(data).forEach(day => {
        const stats = getDayStats(day);
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <h3>${day}</h3>
            <div class="progress-bar"><div class="progress-fill" style="width:${stats.percent}%"></div></div>
            <small>${stats.completed}/${stats.total} tamamlandı</small>
        `;
        card.onclick = () => openDay(day);
        grid.appendChild(card);
    });
}

function openDay(day) {
    currentDayOpen = day;
    document.getElementById("homeGrid").style.display = "none";
    document.getElementById("statsPanel").style.display = "none";
    document.getElementById("dayView").classList.remove("hidden");
    document.getElementById("dayTitle").innerText = day;
    renderDayItems(day);
}

function closeDay() {
    stopTimer();
    document.getElementById("dayView").classList.add("hidden");
    document.getElementById("homeGrid").style.display = "grid";
    document.getElementById("statsPanel").style.display = "block";
    updateAllStats();
    buildHome();
}

function renderDayItems(day) {
    const container = document.getElementById("dayItems");
    if(!container) return;
    container.innerHTML = "";
    const items = data[day];
    if(!items) return;
    
    items.forEach((item, idx) => {
        if(typeof item === "string") {
            const div = document.createElement("div");
            div.className = "item";
            div.innerHTML = `<span>${item}</span>`;
            const key = `${day}|meal|${idx}`;
            if(doneState[key]) div.classList.add("done");
            
            div.onclick = () => {
                if(doneState[key]) {
                    delete doneState[key];
                    div.classList.remove("done");
                    showToast("❌ İşaret kaldırıldı");
                } else {
                    doneState[key] = true;
                    div.classList.add("done");
                    showToast(item.includes("💧") ? "💧 +2 bardak su!" : "✅ Tamamlandı!");
                    if(item.includes("💧")) {
                        const waterKey = `${day}_water`;
                        waterIntake[waterKey] = (waterIntake[waterKey] || 0) + 2;
                    }
                }
                saveDataToLocal();
                updateQuests(day);
                updateAllStats();
                buildHome();
            };
            container.appendChild(div);
        } 
        else if(item && typeof item === "object" && item.ex) {
            const title = document.createElement("div");
            title.className = "ex-title";
            title.innerText = `💪 ${item.ex}`;
            container.appendChild(title);
            
            for(let s = 1; s <= item.sets; s++) {
                const setDiv = document.createElement("div");
                setDiv.className = "set";
                setDiv.innerHTML = `<span>Set ${s}</span><span style="font-size:10px;">⏱️ Dinlenme</span>`;
                const setKey = `${day}|set|${item.ex}|${s}`;
                if(doneState[setKey]) setDiv.classList.add("done");
                
                setDiv.onclick = () => {
                    if(doneState[setKey]) {
                        delete doneState[setKey];
                        setDiv.classList.remove("done");
                        totalSetCount--;
                        showToast("❌ Set iptal edildi");
                    } else {
                        doneState[setKey] = true;
                        setDiv.classList.add("done");
                        totalSetCount++;
                        showToast(`✅ Set ${s} tamamlandı! +30 XP 🔥`);
                        startTimer(90);  // TIMER ÇALIŞIYOR!
                    }
                    saveDataToLocal();
                    updateQuests(day);
                    updateAllStats();
                    buildHome();
                };
                container.appendChild(setDiv);
            }
        }
    });
    updateQuests(day);
}

function updateQuests(day) {
    let water = 0, meals = 0, sets = 0;
    
    Object.keys(doneState).forEach(key => {
        if(key.includes(day)) {
            if(key.includes("meal")) {
                meals++;
                const idx = parseInt(key.split("|")[2]);
                const itemText = data[day]?.[idx];
                if(typeof itemText === "string" && itemText.includes("💧")) water += 2;
            }
            if(key.includes("set")) sets++;
        }
    });
    
    const waterKey = `${day}_water`;
    const totalWater = (waterIntake[waterKey] || 0) + water;
    
    const questWater = document.getElementById("questWater");
    const questMeal = document.getElementById("questMeal");
    const questSet = document.getElementById("questSet");
    const questScore = document.getElementById("questScore");
    const dailyScoreText = document.getElementById("dailyScoreText");
    const scoreFill = document.getElementById("scoreFill");
    
    if(questWater) questWater.innerHTML = `${Math.min(totalWater,8)}/8`;
    if(questMeal) questMeal.innerHTML = `${Math.min(meals,12)}/12`;
    if(questSet) questSet.innerHTML = `${Math.min(sets,20)}/20`;
    
    let score = Math.min(totalWater * 5 + meals * 3 + sets * 2, 100);
    if(dailyScoreText) dailyScoreText.innerText = score;
    if(scoreFill) scoreFill.style.width = score + "%";
    if(questScore) questScore.innerHTML = `${score}/100`;
}

function updateAllStats() {
    let totalSets = totalSetCount;
    let totalWater = 0;
    Object.values(waterIntake).forEach(v => totalWater += v);
    
    let bestDayScore = 0, bestDayName = "";
    Object.keys(data).forEach(day => {
        let dayScore = 0;
        Object.keys(doneState).forEach(key => {
            if(key.includes(day)) {
                if(key.includes("set")) dayScore += 2;
                if(key.includes("meal")) dayScore += 1;
            }
        });
        if(dayScore > bestDayScore) { bestDayScore = dayScore; bestDayName = day; }
    });
    
    const totalSetsEl = document.getElementById("totalSets");
    const totalWaterEl = document.getElementById("totalWater");
    const bestDayEl = document.getElementById("bestDay");
    const totalXPEl = document.getElementById("totalXP");
    
    if(totalSetsEl) totalSetsEl.innerText = totalSets;
    if(totalWaterEl) totalWaterEl.innerText = totalWater;
    if(bestDayEl) bestDayEl.innerText = bestDayName || "-";
    if(totalXPEl) totalXPEl.innerText = totalSets * 30;
    
    const badgesDiv = document.getElementById("badgesContainer");
    if(badgesDiv) {
        let badges = [];
        if(totalSets >= 20) badges.push("🔥 Alev Rozeti");
        if(totalSets >= 50) badges.push("💪 Demir Rozet");
        if(totalSets >= 100) badges.push("👑 Efsane Rozeti");
        if(totalSets >= 200) badges.push("⚡ Spor Tanrısı");
        if(badges.length === 0) badges.push("🔒 20 set yaparak ilk rozeti kazan!");
        badgesDiv.innerHTML = badges.map(b => `<div class="badge">${b}</div>`).join('');
    }
    
    const chartDiv = document.getElementById("weeklyChart");
    if(chartDiv) {
        chartDiv.innerHTML = "<h4 style='font-size:0.85rem;'>📈 Haftalık Set Grafiği</h4>";
        Object.keys(data).forEach(day => {
            let setsDone = 0;
            Object.keys(doneState).forEach(key => {
                if(key.includes(day) && key.includes("set")) setsDone++;
            });
            const maxSets = 25;
            const width = Math.min((setsDone / maxSets) * 100, 100);
            chartDiv.innerHTML += `
                <div class="chart-bar-item">
                    <div class="bar-label">${day.substring(0,3)}</div>
                    <div class="bar-fill"><div class="bar" style="width:${width}%">${setsDone}</div></div>
                </div>
            `;
        });
    }
}

function showAddMealModal() { /* önceki gibi */ 
    const modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML = `
        <div class="modal-content">
            <h3>🍽️ Yeni Yemek Ekle</h3>
            <select id="mealDaySelect">${Object.keys(data).map(day => `<option value="${day}">${day}</option>`).join('')}</select>
            <input type="text" id="mealNameInput" placeholder="Yemek adı" />
            <div class="modal-buttons"><button class="modal-btn confirm" onclick="addNewMeal()">Ekle</button><button class="modal-btn cancel" onclick="this.closest('.modal').remove()">İptal</button></div>
        </div>
    `;
    document.body.appendChild(modal);
}
function addNewMeal() {
    const day = document.getElementById("mealDaySelect").value;
    const name = document.getElementById("mealNameInput").value;
    if(!name) { showToast("Yemek adı girin!"); return; }
    data[day].push(name);
    saveDataToLocal();
    if(currentDayOpen === day) renderDayItems(day);
    buildHome();
    document.querySelector(".modal").remove();
    showToast(`✅ "${name}" eklendi!`);
}
function showAddExerciseModal() {
    const modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML = `
        <div class="modal-content">
            <h3>💪 Yeni Hareket Ekle</h3>
            <select id="exDaySelect">${Object.keys(data).map(day => `<option value="${day}">${day}</option>`).join('')}</select>
            <input type="text" id="exNameInput" placeholder="Hareket adı" />
            <input type="number" id="exSetsInput" placeholder="Set sayısı" min="1" max="10" />
            <div class="modal-buttons"><button class="modal-btn confirm" onclick="addNewExercise()">Ekle</button><button class="modal-btn cancel" onclick="this.closest('.modal').remove()">İptal</button></div>
        </div>
    `;
    document.body.appendChild(modal);
}
function addNewExercise() {
    const day = document.getElementById("exDaySelect").value;
    const name = document.getElementById("exNameInput").value;
    const sets = parseInt(document.getElementById("exSetsInput").value);
    if(!name || !sets) { showToast("Tüm alanları doldurun!"); return; }
    data[day].push({ex: name, sets: sets});
    saveDataToLocal();
    if(currentDayOpen === day) renderDayItems(day);
    buildHome();
    document.querySelector(".modal").remove();
    showToast(`✅ "${name}" (${sets} set) eklendi!`);
}
function showAddItemToDay() {
    if(!currentDayOpen) return;
    const modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML = `
        <div class="modal-content">
            <h3>➕ ${currentDayOpen} gününe ekle</h3>
            <select id="itemTypeSelect"><option value="meal">🍽️ Yemek/Öğün</option><option value="exercise">💪 Antrenman Hareketi</option></select>
            <input type="text" id="itemNameInput" placeholder="İçerik adı" />
            <div id="setsContainer" style="display:none;"><input type="number" id="itemSetsInput" placeholder="Set sayısı" min="1" max="10" /></div>
            <div class="modal-buttons"><button class="modal-btn confirm" onclick="addItemToCurrentDay()">Ekle</button><button class="modal-btn cancel" onclick="this.closest('.modal').remove()">İptal</button></div>
        </div>
    `;
    document.body.appendChild(modal);
    const typeSelect = document.getElementById("itemTypeSelect");
    const setsContainer = document.getElementById("setsContainer");
    typeSelect.onchange = () => { setsContainer.style.display = typeSelect.value === "exercise" ? "block" : "none"; };
}
function addItemToCurrentDay() {
    const type = document.getElementById("itemTypeSelect").value;
    const name = document.getElementById("itemNameInput").value;
    if(!name) { showToast("İçerik adı girin!"); return; }
    if(type === "meal") {
        data[currentDayOpen].push(name);
        showToast(`✅ "${name}" eklendi!`);
    } else {
        const sets = parseInt(document.getElementById("itemSetsInput").value);
        if(!sets) { showToast("Set sayısı girin!"); return; }
        data[currentDayOpen].push({ex: name, sets: sets});
        showToast(`✅ "${name}" (${sets} set) eklendi!`);
    }
    saveDataToLocal();
    renderDayItems(currentDayOpen);
    buildHome();
    document.querySelector(".modal").remove();
}

function showToast(msg) {
    const toast = document.createElement("div");
    toast.className = "toast";
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 1600);
}

function toggleSound() {
    soundEnabled = !soundEnabled;
    const btn = document.getElementById("soundToggle");
    if(btn) btn.innerText = soundEnabled ? "🔊 Ses Açık" : "🔇 Ses Kapalı";
    showToast(soundEnabled ? "Ses açıldı 🔔" : "Ses kapatıldı 🔇");
}
