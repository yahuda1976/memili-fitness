<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Fitness Pro - Hedef Takip & Kameralı Barkod</title>
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: system-ui, sans-serif; font-size: 17px; padding-bottom: 120px; font-weight: 500; }
        .app-header { background: #000; padding: 16px 20px; text-align: center; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .app-header h1 { font-size: 1.8rem; background: linear-gradient(135deg,#007aff,#5856d6); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 16px; max-width: 550px; margin: 0 auto; }
        .card { background: #1C1C1E; border-radius: 16px; padding: 16px 8px; text-align: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
        .card:active { transform: scale(0.97); background: #2C2C2E; }
        .card h3 { font-size: 1.4rem; font-weight: 900; color: #ffffff; margin-bottom: 8px; letter-spacing: 0.5px; }
        .card.settings-card h3 { color: #007AFF; }
        .progress-bar { width: 100%; height: 4px; background: #2C2C2E; border-radius: 4px; overflow: hidden; margin-top: 10px; }
        .progress-fill { height: 100%; background: #34C759; transition: width 0.3s; }
        small { font-size: 0.7rem; color: #8E8E93; display: block; margin-top: 6px; }
        .day-view { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 1000; overflow-y: auto; padding-bottom: 120px; }
        .day-header { background: #000; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .back-btn, .add-item-btn { background: #007AFF; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 600; font-size: 1rem; color: white; cursor: pointer; }
        .day-title { font-size: 1.4rem; font-weight: 700; color: #fff; }
        .item, .set { background: #1C1C1E; margin: 10px 16px; padding: 14px; border-radius: 14px; display: flex; align-items: center; gap: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .set { cursor: pointer; border-left: 4px solid #34C759; }
        .set.done, .item.done { background: #007AFF; text-decoration: line-through; opacity: 0.9; }
        .set.done::after, .item.done::after { content: "✓"; margin-left: 8px; }
        .set span, .item span { font-weight: 600; flex: 1; color: #fff; }
        .ex-title { background: #1C1C1E; border-radius: 12px; padding: 12px 16px; margin: 16px 16px 8px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .ex-title > span { flex: 1; font-weight: 600; color: #34C759; font-size: 1.1rem; }
        .ex-title-buttons { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; width: 100%; margin-top: 8px; }
        .ex-title-buttons button { background: #2C2C2E; border: 1px solid rgba(255,255,255,0.2); padding: 8px 0; border-radius: 40px; color: #FFCC33; font-size: 0.7rem; font-weight: 700; cursor: pointer; }
        .move-buttons { display: flex; flex-direction: column; gap: 4px; }
        .move-btn { background: rgba(255,255,255,0.15); border: none; font-size: 1rem; cursor: pointer; padding: 4px 6px; border-radius: 10px; color: #FFF; }
        .bottom-quest { position: fixed; bottom: 0; left: 0; right: 0; background: #1C1C1E; padding: 12px 20px; border-top: 0.5px solid rgba(255,255,255,0.1); }
        .quest-title { font-size: 0.9rem; font-weight: 600; text-align: center; color: #007AFF; }
        .quest-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin: 10px 0; }
        .quest-item { text-align: center; background: #2C2C2E; padding: 8px; border-radius: 12px; }
        .quest-icon { font-size: 1.3rem; }
        .quest-progress { font-size: 0.8rem; font-weight: 600; }
        .daily-score { text-align: center; font-size: 0.8rem; color: #8E8E93; }
        .score-bar { width: 100%; height: 4px; background: #2C2C2E; border-radius: 4px; margin-top: 6px; overflow: hidden; }
        .score-fill { height: 100%; background: #34C759; }
        .modal { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.95); backdrop-filter: blur(8px); z-index:3000; display:flex; align-items:center; justify-content:center; padding:20px; }
        .modal-content { background:#1C1C1E; border-radius:20px; padding:24px; max-width:550px; width:100%; color:white; max-height:80vh; overflow-y:auto; }
        .modal-content input, .modal-content select, .modal-content textarea { width:100%; padding:12px; margin:8px 0; background:#2C2C2E; border:none; border-radius:10px; color:white; }
        .modal-buttons { display:flex; gap:12px; margin-top:20px; }
        .modal-btn { flex:1; padding:12px; border:none; border-radius:40px; font-weight:600; cursor:pointer; }
        .modal-btn.confirm { background:#007AFF; color:white; }
        .modal-btn.cancel { background:#FF3B30; color:white; }
        .timer-box { position:fixed; bottom:180px; right:20px; background:rgba(28,28,30,0.98); border-radius:20px; padding:16px 20px; text-align:center; z-index:2000; min-width:140px; }
        .timer-num { font-size:40px; font-weight:700; font-family:monospace; color:#007AFF; }
        .timer-buttons { display:flex; gap:12px; margin-top:10px; justify-content:center; }
        .timer-btn { background:#3a3a3c; border:none; padding:6px 16px; border-radius:20px; font-weight:600; color:#007AFF; cursor:pointer; }
        .stop-sound-btn { background:#FF3B30; color:white; border:none; padding:6px 12px; border-radius:20px; font-size:0.7rem; cursor:pointer; margin-top:8px; }
        .hidden { display:none; }
        .toast { position:fixed; bottom:30%; left:50%; transform:translateX(-50%); background:#1c1c1e; color:white; padding:12px 24px; border-radius:60px; font-weight:600; z-index:2000; animation:fadeOut 1.5s forwards; }
        @keyframes fadeOut { 0% { opacity:1; } 70% { opacity:1; } 100% { opacity:0; display:none; } }
        .input-number-only { width:100%; padding:12px; text-align:center; background:#2C2C2E; color:white; border:none; border-radius:10px; }
        .set-info { font-size:0.8rem; color:#FF9500; background:#2C2C2E; padding:4px 10px; border-radius:20px; margin-left:8px; }
        .macro-bar { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; background: #1C1C1E; border-radius: 14px; padding: 12px; margin: 12px 16px; border: 1px solid rgba(255,255,255,0.1); }
        .macro-item { text-align: center; }
        .macro-item span { font-size: 1.2rem; display: block; }
        .macro-item b { display: block; font-size: 1rem; font-weight: 700; margin: 2px 0; color: #FFF; }
        .macro-item small { color: #8E8E93; font-size: 0.6rem; text-transform: uppercase; }
        .recovery-panel { background: #1C1C1E; border-radius: 14px; padding: 12px; margin: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; }
        .recovery-item { flex: 1; text-align: center; padding: 8px; border-radius: 12px; font-weight: 600; font-size: 0.75rem; }
        .kas-red { background: rgba(255,59,48,0.2); color: #FF3B30; border-left: 4px solid #FF3B30; }
        .kas-orange { background: rgba(255,149,0,0.2); color: #FF9500; border-left: 4px solid #FF9500; }
        .kas-green { background: rgba(52,199,89,0.2); color: #34C759; border-left: 4px solid #34C759; }
        .kas-no-data { background: rgba(150,150,150,0.2); color: #aaa; }
        .weekly-history-list { background: #1C1C1E; border-radius: 14px; padding: 12px; margin: 12px; }
        .week-item { background: #2C2C2E; border-radius: 12px; padding: 10px; margin-bottom: 8px; cursor: pointer; }
        .week-date { font-weight: bold; color: #007AFF; }
        .body-stats { background:#1C1C1E; border-radius:14px; padding:16px; margin-bottom:20px; }
        .measure-input { display:flex; justify-content:space-between; align-items:center; margin:12px 0; }
        .measure-input label { flex:1; }
        .measure-input input { flex:2; padding:10px; background:#2C2C2E; border:none; border-radius:10px; color:white; text-align:center; }
        .photo-upload button { background:#007AFF; border:none; padding:10px 20px; border-radius:12px; color:white; font-weight:600; margin:5px; cursor:pointer; }
        .before-after { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
        .before-after div { text-align:center; background:#2C2C2E; border-radius:14px; padding:12px; width:45%; }
        .before-after img { max-width:100%; border-radius:12px; margin-top:8px; }
        .full-width-bottom-btn { display: block; width: 90%; max-width: 400px; margin: 20px auto 20px auto; background: #34C759; border: none; padding: 14px; border-radius: 40px; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; text-align: center; }
        .full-width-bottom-btn:active { transform: scale(0.97); }
        .target-panel { background: #1C1C1E; border-radius: 16px; padding: 12px; margin: 12px 16px; border-left: 5px solid #007AFF; }
        .target-progress-bar { width: 100%; height: 8px; background: #2C2C2E; border-radius: 4px; overflow: hidden; margin: 4px 0; }
        .target-progress-fill { height: 100%; background: #34C759; width: 0%; transition: width 0.3s; }
        .target-status { font-size: 0.75rem; color: #aaa; }
        .warning { color: #ffaa33; }
        .success { color: #2ecc71; }
        .danger { color: #e74c3c; }
    </style>
</head>
<body>
<div id="appContent">
    <div class="app-header"><h1>🔥 FITNESS PRO</h1></div>
    <div id="homeGrid" class="grid"></div>
    <button class="full-width-bottom-btn" onclick="openWeekHistory()">📅 HAFTA GEÇMİŞİ</button>
    <div id="dayView" class="day-view hidden">
        <div class="day-header"><button class="back-btn" onclick="closeDay()">← Geri</button><div class="day-title" id="dayTitle"></div><button class="add-item-btn" onclick="showAddItemToDay()">+ Ekle</button></div>
        <div id="targetPanel" class="target-panel"></div>
        <div id="recoveryPanel" class="recovery-panel"></div>
        <div id="macroBar" class="macro-bar"></div>
        <div id="dayItems"></div>
    </div>
    <div id="settingsView" class="day-view hidden">
        <div class="day-header"><button class="back-btn" onclick="closeSettings()">← Geri</button><div class="day-title">AYARLAR</div><div style="width:50px;"></div></div>
        <div style="padding:16px;">
            <div style="background:#1C1C1E; border-radius:14px; padding:16px; margin-bottom:20px;">
                <h3 style="color:#FF9500;">🎯 GÜNLÜK HEDEFLER</h3>
                <div class="measure-input"><label>Protein (g)</label><input type="number" id="targetProtein" value="160" step="5"></div>
                <div class="measure-input"><label>Karbonhidrat (g)</label><input type="number" id="targetCarbs" value="250" step="5"></div>
                <div class="measure-input"><label>Yağ (g)</label><input type="number" id="targetFat" value="70" step="5"></div>
                <div class="measure-input"><label>Kalori (kcal)</label><input type="number" id="targetCalories" value="2500" step="50"></div>
                <button onclick="saveTargets()" class="modal-btn confirm" style="width:100%; margin-top:8px;">💾 Hedefleri Kaydet</button>
                <button onclick="resetDailyFoodList()" class="modal-btn confirm" style="width:100%; margin-top:8px; background:#e67e22;">🔄 Yeni Günlük Liste</button>
            </div>
            <div style="background:#1C1C1E; border-radius:14px; padding:16px; margin-bottom:20px;"><h3 style="color:#FF9500;">📷 BARKOD İLE BESİN EKLE</h3><button onclick="openBarcodeFoodModal()" style="width:100%; background:#2C2C2E; border:none; padding:12px; border-radius:12px; color:#fff;">📷 KAMERA İLE BARKOD OKU</button></div>
            <div class="body-stats"><h3 style="color:#007AFF;">📏 VÜCUT ÖLÇÜLERİ</h3>
                <div class="measure-input"><label>Kilo (kg)</label><input type="number" id="bodyWeight" step="0.1"></div>
                <div class="measure-input"><label>Bel (cm)</label><input type="number" id="bodyWaist" step="0.5"></div>
                <div class="measure-input"><label>Göğüs (cm)</label><input type="number" id="bodyChest" step="0.5"></div>
                <div class="measure-input"><label>Kol (cm)</label><input type="number" id="bodyArm" step="0.5"></div>
                <div class="measure-input"><label>Bacak (cm)</label><input type="number" id="bodyLeg" step="0.5"></div>
                <button onclick="saveBodyMeasurements()" style="background:#34C759; border:none; padding:12px; border-radius:12px; color:white; width:100%;">💾 Ölçüleri Kaydet</button>
                <h3 style="color:#007AFF; margin-top:20px;">📸 FOTOĞRAF TAKİBİ</h3>
                <div class="photo-upload"><button onclick="uploadPhoto('before')">📷 ÖNCE FOTOĞRAF EKLE</button><button onclick="uploadPhoto('after')">📷 SONRA FOTOĞRAF EKLE</button></div>
                <div class="before-after" id="photoContainer"></div><div id="sliderContainer" style="margin-top:12px;"></div>
            </div>
            <div style="background:#1C1C1E; border-radius:14px; padding:16px; margin-bottom:20px;"><h3 style="color:#007AFF;">🍽️ Yemek Yönetimi</h3>
                <select id="mealManageDay" style="width:100%; padding:14px; background:#2C2C2E; border-radius:10px; color:white;"></select>
                <div id="mealList" style="max-height:300px; overflow-y:auto; margin:12px 0;"></div>
                <input type="text" id="newMealName" placeholder="Yeni yemek adı" style="width:100%; padding:14px; background:#2C2C2E; border-radius:10px; color:white;">
                <button onclick="addMealToDay()" style="width:100%; margin-top:10px; background:#34C759; border:none; padding:12px; border-radius:12px; color:white;">+ Yemek Ekle</button>
            </div>
            <div style="background:#1C1C1E; border-radius:14px; padding:16px; margin-bottom:20px;"><h3 style="color:#007AFF;">💪 Egzersiz Yönetimi</h3>
                <select id="exerciseManageDay" style="width:100%; padding:14px; background:#2C2C2E; border-radius:10px; color:white;"></select>
                <div id="exerciseList" style="max-height:300px; overflow-y:auto; margin:12px 0;"></div>
                <input type="text" id="newExerciseName" placeholder="Hareket adı" style="width:100%; padding:14px; background:#2C2C2E; border-radius:10px; color:white; margin-bottom:8px;">
                <input type="number" id="newExerciseSets" placeholder="Set sayısı" style="width:100%; padding:14px; background:#2C2C2E; border-radius:10px; color:white;">
                <button onclick="addExerciseToDay()" style="width:100%; margin-top:10px; background:#34C759; border:none; padding:12px; border-radius:12px; color:white;">+ Hareket Ekle</button>
            </div>
            <div style="background:#1C1C1E; border-radius:14px; padding:16px; margin-bottom:20px;"><h3 style="color:#007AFF;">💊 Supplement Takviye</h3>
                <div id="supplementList" style="margin-bottom:12px;"></div>
                <input type="text" id="newSupplementName" placeholder="Takviye adı" style="width:100%; padding:14px; background:#2C2C2E; border-radius:10px; color:white; margin-bottom:8px;">
                <input type="text" id="newSupplementTime" placeholder="Kullanım zamanı" style="width:100%; padding:14px; background:#2C2C2E; border-radius:10px; color:white;">
                <button onclick="addSupplement()" style="width:100%; margin-top:10px; background:#34C759; border:none; padding:12px; border-radius:12px; color:white;">+ Takviye Ekle</button>
            </div>
            <div style="background:#1C1C1E; border-radius:14px; padding:16px; margin-bottom:20px;"><h3 style="color:#007AFF;">💾 VERİ YEDEKLEME</h3>
                <button onclick="backupData()" style="width:100%; background:#007AFF; border:none; padding:14px; border-radius:12px; color:white; margin-bottom:8px;">💾 YEDEK AL</button>
                <button onclick="restoreData()" style="width:100%; background:#34C759; border:none; padding:14px; border-radius:12px; color:white;">📂 GERİ YÜKLE</button>
            </div>
        </div>
    </div>
    <div id="weekHistoryModal" class="modal hidden"><div class="modal-content"><div class="modal-header"><span class="modal-title">📅 HAFTA GEÇMİŞİ</span><button class="close-modal-btn" onclick="closeWeekHistory()">✖</button></div><div id="weekHistoryList" class="weekly-history-list"></div></div></div>
    <div class="bottom-quest"><div class="quest-title">✨ GÜNLÜK GÖREVLER ✨</div><div class="quest-grid"><div class="quest-item"><div class="quest-icon">💧</div><div class="quest-progress" id="questWater">0/8</div></div><div class="quest-item"><div class="quest-icon">🍽️</div><div class="quest-progress" id="questMeal">0/12</div></div><div class="quest-item"><div class="quest-icon">🏋️</div><div class="quest-progress" id="questSet">0/20</div></div><div class="quest-item"><div class="quest-icon">⭐</div><div class="quest-progress" id="questScore">0/100</div></div></div>
    <div class="daily-score">🎯 Günlük Puan: <span id="dailyScoreText">0</span>/100<div class="score-bar"><div class="score-fill" id="scoreFill" style="width:0%"></div></div></div></div>
    <div id="timerBox" class="timer-box" style="display:none;"><div class="timer-num" id="timerNum">90</div><div style="font-size:10px;">⏱️ Dinlenme</div><div class="timer-buttons"><button class="timer-btn" id="timerCloseBtn">Kapat</button><button class="timer-btn" id="timerCustomBtn">Ayarla</button><button class="stop-sound-btn" id="stopSoundBtn">🔇 Sesi Durdur</button></div></div>
</div>

<script>
// ========== HEDEF YÖNETİMİ ==========
let dailyTargets = { protein: 160, carbs: 250, fat: 70, calories: 2500 };
function loadTargets() {
    const p = localStorage.getItem("dailyTargets");
    if (p) dailyTargets = JSON.parse(p);
    document.getElementById("targetProtein").value = dailyTargets.protein;
    document.getElementById("targetCarbs").value = dailyTargets.carbs;
    document.getElementById("targetFat").value = dailyTargets.fat;
    document.getElementById("targetCalories").value = dailyTargets.calories;
}
function saveTargets() {
    dailyTargets = {
        protein: parseInt(document.getElementById("targetProtein").value) || 160,
        carbs: parseInt(document.getElementById("targetCarbs").value) || 250,
        fat: parseInt(document.getElementById("targetFat").value) || 70,
        calories: parseInt(document.getElementById("targetCalories").value) || 2500
    };
    localStorage.setItem("dailyTargets", JSON.stringify(dailyTargets));
    showToast("Hedefler kaydedildi");
    if (currentDayOpen) updateTargetPanel();
}
function getCurrentDayMacros() {
    let total = { p:0, k:0, f:0, cal:0 };
    let items = currentWeekData[currentDayOpen];
    if (items) items.forEach((item, idx) => {
        let key = `${currentDayOpen}|meal|${idx}`;
        if (doneState[key] && typeof item === "string" && !item.includes("💧")) {
            let m = parseFoodMacros(item);
            total.p += m.p; total.k += m.k; total.f += m.f; total.cal += m.cal;
        }
    });
    return total;
}
function updateTargetPanel() {
    let panel = document.getElementById("targetPanel");
    if (!panel) return;
    let current = getCurrentDayMacros();
    let pPercent = Math.min(100, (current.p / dailyTargets.protein) * 100);
    let cPercent = Math.min(100, (current.k / dailyTargets.carbs) * 100);
    let fPercent = Math.min(100, (current.f / dailyTargets.fat) * 100);
    let calPercent = Math.min(100, (current.cal / dailyTargets.calories) * 100);
    let pRem = dailyTargets.protein - current.p;
    let cRem = dailyTargets.carbs - current.k;
    let fRem = dailyTargets.fat - current.f;
    let calRem = dailyTargets.calories - current.cal;
    let message = "";
    if (pRem <= 0 && cRem <= 0 && fRem <= 0 && calRem <= 0) message = "✅ Tebrikler! Günlük hedefine ulaştın!";
    else if (pRem < 0) message += `⚠️ Protein hedefini ${Math.abs(pRem)}g aştın. `;
    else if (cRem < 0) message += `⚠️ Karbonhidrat hedefini ${Math.abs(cRem)}g aştın. `;
    else if (fRem < 0) message += `⚠️ Yağ hedefini ${Math.abs(fRem)}g aştın. `;
    else if (calRem < 0) message += `⚠️ Kalori hedefini ${Math.abs(calRem)} kcal aştın. `;
    panel.innerHTML = `
        <div><strong>🎯 GÜNLÜK HEDEFLER</strong></div>
        <div>💪 Protein: ${current.p}/${dailyTargets.protein}g <div class="target-progress-bar"><div class="target-progress-fill" style="width:${pPercent}%"></div></div> ${pRem>0 ? `Kalan: ${pRem}g` : (pRem<0 ? `<span class="danger">Aşım: ${-pRem}g</span>` : "Tamam")}</div>
        <div>🌾 Karb: ${current.k}/${dailyTargets.carbs}g <div class="target-progress-bar"><div class="target-progress-fill" style="width:${cPercent}%"></div></div> ${cRem>0 ? `Kalan: ${cRem}g` : (cRem<0 ? `<span class="danger">Aşım: ${-cRem}g</span>` : "Tamam")}</div>
        <div>🥑 Yağ: ${current.f}/${dailyTargets.fat}g <div class="target-progress-bar"><div class="target-progress-fill" style="width:${fPercent}%"></div></div> ${fRem>0 ? `Kalan: ${fRem}g` : (fRem<0 ? `<span class="danger">Aşım: ${-fRem}g</span>` : "Tamam")}</div>
        <div>🔥 Kalori: ${current.cal}/${dailyTargets.calories} kcal <div class="target-progress-bar"><div class="target-progress-fill" style="width:${calPercent}%"></div></div> ${calRem>0 ? `Kalan: ${calRem} kcal` : (calRem<0 ? `<span class="danger">Aşım: ${-calRem} kcal</span>` : "Tamam")}</div>
        <div class="target-status">${message}</div>
    `;
}
function resetDailyFoodList() {
    if (!currentDayOpen) { showToast("Bir gün açın"); return; }
    if (confirm(`"${currentDayOpen}" günündeki TÜM yiyecekleri ve işaretleri silip yeni bir gün olarak başlatmak istediğinize emin misiniz?`)) {
        let items = currentWeekData[currentDayOpen];
        let newItems = [];
        for (let i of items) {
            if (typeof i === "object" && i.ex) newItems.push(i);
            else if (typeof i === "string" && (i.includes("💧") || i.includes("🏋️") || i.includes("🟥") || i.includes("🔥") || i.includes("💪") || i.includes("🔵") || i.includes("🟩") || i.includes("🟪") || i.includes("🟦"))) newItems.push(i);
        }
        currentWeekData[currentDayOpen] = newItems;
        for (let k in doneState) if (k.startsWith(currentDayOpen+"|meal")) delete doneState[k];
        saveDataToLocal();

function parseFoodMacros(text) {
    let kcal=0,prot=0,carb=0,fat=0;
    let kcalMatch=text.match(/Kalori:\s*(\d+)/i); if(kcalMatch) kcal=parseInt(kcalMatch[1]);
    let protMatch=text.match(/Protein:\s*(\d+)\s*g/i); if(protMatch) prot=parseInt(protMatch[1]);
    let carbMatch=text.match(/Karb:\s*(\d+)\s*g/i); if(carbMatch) carb=parseInt(carbMatch[1]);
    let fatMatch=text.match(/Yag:\s*(\d+)\s*g/i); if(fatMatch) fat=parseInt(fatMatch[1]);
    return {cal:kcal,p:prot,k:carb,f:fat};
}
