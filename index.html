<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Demir Günlüğü | 90sn Dinlenme</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0f1a;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
      color: #f0f3fa;
      padding: 1rem 0.8rem 5rem;
      line-height: 1.45;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    /* başlık */
    .baslik {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .baslik h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #facc15, #ef4444);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .baslik p {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* gün butonları */
    .gunler {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1.8rem;
      background: #111827;
      padding: 0.6rem;
      border-radius: 60px;
    }
    .gun-btn {
      background: #1e293b;
      border: none;
      color: #cbd5e6;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.2s;
    }
    .gun-btn.active {
      background: #dc2626;
      color: white;
    }
    .gun-btn.dinlenme {
      background: #2d3a4e;
      color: #9ca3af;
    }

    /* yemek kartı - eski usül düz liste */
    .yemek-kutu {
      background: #111827;
      border-radius: 24px;
      padding: 1rem;
      margin-bottom: 1.8rem;
      border: 1px solid #2d3748;
    }
    .yemek-baslik {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 0.8rem;
      border-left: 4px solid #facc15;
      padding-left: 0.6rem;
    }
    .yemek-listesi {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .yemek-satir {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.5rem;
      font-size: 0.85rem;
      border-bottom: 1px dashed #2d3a60;
      padding-bottom: 0.4rem;
    }
    .yemek-saat {
      font-weight: 700;
      background: #1e293b;
      padding: 0.1rem 0.7rem;
      border-radius: 30px;
      min-width: 65px;
      text-align: center;
      color: #facc15;
      font-size: 0.8rem;
    }
    .yemek-metin {
      flex: 1;
      color: #e2e8f0;
    }
    .su-miktar {
      color: #7aa2f7;
      font-weight: 500;
    }

    /* egzersizler */
    .egzersiz {
      background: #111827;
      border-radius: 24px;
      margin-bottom: 1.5rem;
      border: 1px solid #2d3748;
      overflow: hidden;
    }
    .egz-header {
      background: #0f172a;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid #2d3a5a;
    }
    .egz-isim {
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: baseline;
    }
    .tekrar {
      background: #ef444430;
      padding: 0.2rem 0.7rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 500;
      color: #facc15;
    }
    .egz-butonlar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .egz-buton {
      background: #1f2a44;
      border: none;
      font-size: 0.7rem;
      color: #cad2ff;
      padding: 0.2rem 0.7rem;
      border-radius: 40px;
      cursor: pointer;
    }
    .not-extra {
      font-size: 0.7rem;
      margin-top: 0.4rem;
      color: #b9c8ff;
    }
    .set-list {
      padding: 0.8rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .set-satir {
      background: #0f172f;
      border-radius: 28px;
      padding: 0.5rem 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.6rem;
      border: 1px solid #26304a;
    }
    .set-num {
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 55px;
    }
    .weight-input {
      background: #010514;
      border: 1px solid #3b4870;
      padding: 0.4rem 0.7rem;
      border-radius: 36px;
      width: 110px;
      color: white;
      text-align: center;
      font-size: 0.85rem;
    }
    .dinlen-buton {
      background: #2a3655;
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .dinlen-buton:active {
      background: #dc2626;
      transform: scale(0.96);
    }

    /* boş gün mesajı */
    .dinlenme-mesaj {
      background: #0f172a;
      text-align: center;
      padding: 1.8rem;
      border-radius: 32px;
      margin: 1rem 0;
      border: 1px dashed #facc1566;
    }

    /* timer altta sabit */
    .timer-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #020617ee;
      backdrop-filter: blur(12px);
      border-top: 1px solid #ef4444aa;
      padding: 0.6rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.6rem;
      z-index: 100;
    }
    .timer-label {
      font-weight: 600;
      font-size: 0.8rem;
    }
    .timer-sayi {
      font-size: 1.8rem;
      font-weight: 800;
      font-family: monospace;
      letter-spacing: 3px;
      background: #000000aa;
      padding: 0 0.8rem;
      border-radius: 60px;
      color: #facc15;
    }
    .timer-btn {
      background: #334155;
      border: none;
      color: white;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.8rem;
    }
    footer {
      font-size: 0.7rem;
      text-align: center;
      color: #4b5679;
      margin-top: 1rem;
    }
    @media (max-width: 550px) {
      .set-satir {
        flex-direction: column;
        align-items: stretch;
      }
      .timer-sayi {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="baslik">
    <h1>🏋️ DEMİR GÜNLÜĞÜ</h1>
    <p>set arası 90 saniye • her set sonrası "DİNLENME" butonu</p>
  </div>

  <div class="gunler" id="gunTabs"></div>
  <div id="gunIcerik"></div>
  <footer>📝 Not / 1RM / Video / Link / Alternatif butonları çalışır. Ağırlık gir, set bitince dinlenme butonuna tıkla.</footer>
</div>

<div class="timer-panel">
  <div class="timer-label">⏱️ DİNLENME SÜRESİ</div>
  <div class="timer-sayi" id="timerDisplay">01:30</div>
  <div>
    <button class="timer-btn" id="stopTimer">Durdur</button>
    <button class="timer-btn" id="resetTimer">Sıfırla</button>
  </div>
</div>

<script>
  // ---------- TÜM VERİ (YEMEKLER + HAREKETLER) GÜNCEL ----------
  const yemekler = {
    pazartesi: [
      { saat: "07:45", metin: "Overnight oats (yulaf + süt + Skyr + muz) + Omega-3 (2 kapsül)", su: "500 ml" },
      { saat: "09:30", metin: "Ekmek + peynir", su: "400 ml" },
      { saat: "12:30", metin: "Su", su: "500 ml" },
      { saat: "14:00", metin: "Tavuk + pilav + yoğurt", su: "400 ml" },
      { saat: "16:30", metin: "Su", su: "400 ml" },
      { saat: "18:00", metin: "Whey + Kreatin (5g)", su: "300 ml" },
      { saat: "19:00", metin: "🏋️ ANTRENMAN" },
      { saat: "20:30", metin: "Whey", su: "300 ml" },
      { saat: "21:00", metin: "Tavuk + patates + salata + Skyr", su: "400 ml" }
    ],
    sali: [
      { saat: "07:45", metin: "Oats + Omega-3", su: "500 ml" },
      { saat: "09:30", metin: "Ton balığı + ekmek", su: "400 ml" },
      { saat: "14:00", metin: "Et döner + pilav", su: "500 ml" },
      { saat: "18:00", metin: "Whey + Kreatin", su: "300 ml" },
      { saat: "19:00", metin: "🏋️ ANTRENMAN" },
      { saat: "20:30", metin: "Whey" },
      { saat: "21:00", metin: "Yumurta + ekmek + Skyr", su: "400 ml" }
    ],
    carsamba: [
      { saat: "07:45", metin: "Hafif oats + Omega-3", su: "500 ml" },
      { saat: "09:30", metin: "Meyve + kuruyemiş", su: "" },
      { saat: "14:00", metin: "Ton balığı + salata", su: "" },
      { saat: "18:00", metin: "Su", su: "500 ml" },
      { saat: "20:30", metin: "Yumurta + yoğurt", su: "" },
      { saat: "22:00", metin: "20-30 dk yürüyüş", su: "" }
    ],
    persembe: [
      { saat: "07:45", metin: "Oats + Omega-3", su: "500 ml" },
      { saat: "09:30", metin: "Ekmek + peynir", su: "" },
      { saat: "14:00", metin: "Tavuk + pilav", su: "" },
      { saat: "18:00", metin: "Whey + Kreatin", su: "300 ml" },
      { saat: "19:00", metin: "🏋️ ANTRENMAN" },
      { saat: "20:30", metin: "Whey" },
      { saat: "21:00", metin: "Köfte + patates + Skyr", su: "400 ml" }
    ],
    cuma: [
      { saat: "07:45", metin: "Enerji oats + Omega-3", su: "500 ml" },
      { saat: "09:30", metin: "Peynir + ekmek", su: "" },
      { saat: "14:00", metin: "Et + pilav", su: "" },
      { saat: "18:00", metin: "Whey + Kreatin", su: "300 ml" },
      { saat: "19:00", metin: "🏋️ ANTRENMAN" },
      { saat: "20:30", metin: "Whey" },
      { saat: "21:00", metin: "Tavuk + patates + yoğurt", su: "400 ml" }
    ],
    cumartesi: [
      { saat: "07:45", metin: "Oats + Omega-3", su: "500 ml" },
      { saat: "09:30", metin: "Ton balığı + ekmek", su: "400 ml" },
      { saat: "14:00", metin: "Tavuk + pilav", su: "" },
      { saat: "18:00", metin: "Whey + Kreatin", su: "300 ml" },
      { saat: "19:00", metin: "🏋️ ANTRENMAN" },
      { saat: "20:30", metin: "Whey" },
      { saat: "21:00", metin: "Yumurta + peynir + Skyr", su: "400 ml" }
    ],
    pazar: [
      { saat: "07:45", metin: "Hafif oats + Omega-3", su: "500 ml" },
      { saat: "09:30", metin: "Meyve", su: "" },
      { saat: "14:00", metin: "Tavuk + salata", su: "" },
      { saat: "20:30", metin: "Yumurta + yoğurt", su: "" }
    ]
  };

  const hareketler = {
    pazartesi: [
      { ad: "🏋️ Incline Dumbbell Press (30-45°)", set: 4, tekrar: "6-8", not: "3 sn indir" },
      { ad: "🏋️ Dumbbell Bench Press", set: 3, tekrar: "6-10", not: "Kürek kemikleri sık" },
      { ad: "🔻 Chest Dip (öne eğilerek)", set: 3, tekrar: "8-12", not: "Alt göğüs odak" },
      { ad: "🎯 Cable Chest Fly", set: 3, tekrar: "12-15", not: "Sıkıştır" },
      { ad: "🔥 Triceps Pushdown (Rope)", set: 3, tekrar: "10-12", not: "Dirsek sabit" },
      { ad: "💪 Overhead Triceps Extension", set: 3, tekrar: "10-12", not: "Gerilimi hisset" }
    ],
    sali: [
      { ad: "🔵 Lat Pulldown (göğse)", set: 4, tekrar: "8-12", not: "Arkaya çekme" },
      { ad: "🔵 Barbell Row", set: 3, tekrar: "6-10", not: "Bel sabit" },
      { ad: "🔵 Seated Cable Row", set: 3, tekrar: "10-12", not: "Kürek sık" },
      { ad: "📌 Straight Arm Cable Pulldown", set: 3, tekrar: "12-15", not: "Lat odak" },
      { ad: "🎯 Face Pull", set: 3, tekrar: "12-15", not: "Arka omuz" },
      { ad: "💪 Barbell Curl", set: 3, tekrar: "8-12", not: "Sallama yok" },
      { ad: "💪 Hammer Curl", set: 3, tekrar: "10-12", not: "Kontrol" }
    ],
    carsamba: [],
    persembe: [
      { ad: "🎯 Dumbbell Shoulder Press", set: 4, tekrar: "6-10", not: "Bel boşluk verme" },
      { ad: "🎯 Dumbbell Lateral Raise", set: 4, tekrar: "12-15", not: "Omuz hizası" },
      { ad: "🎯 Reverse Pec Deck", set: 3, tekrar: "12-15", not: "Arka omuz" },
      { ad: "🎯 Cable Lateral Raise", set: 3, tekrar: "12-15", not: "Sabit" },
      { ad: "💪 Cable Curl (pump)", set: 2, tekrar: "12-15", not: "Yavaş" },
      { ad: "💪 Hammer Curl (pump)", set: 2, tekrar: "12-15", not: "Kontrol" }
    ],
    cuma: [
      { ad: "🏋️ Barbell Back Squat", set: 4, tekrar: "6-8", not: "Derin squat" },
      { ad: "🦵 Seated Leg Curl", set: 3, tekrar: "12-15", not: "" },
      { ad: "🦵 Leg Extension", set: 3, tekrar: "12-15", not: "" },
      { ad: "🏋️ Romanian Deadlift", set: 3, tekrar: "8-12", not: "Kalçadan kır" },
      { ad: "🏃 Walking Lunge", set: 3, tekrar: "10-12 (her bacak)", not: "" },
      { ad: "🦵 Standing Calf Raise", set: 4, tekrar: "15-20", not: "" }
    ],
    cumartesi: [
      { ad: "📌 Incline Chest Press Machine", set: 3, tekrar: "10-12", not: "" },
      { ad: "🎯 Low to High Cable Fly", set: 3, tekrar: "12-15", not: "" },
      { ad: "🦾 Pec Deck Machine", set: 3, tekrar: "12-15", not: "" },
      { ad: "💪 Push-Up", set: 2, tekrar: "failure", not: "son sete kadar" },
      { ad: "🔥 Triceps Pushdown (Rope)", set: 2, tekrar: "12-15", not: "" },
      { ad: "🔥 Cable Overhead Triceps Extension", set: 2, tekrar: "12-15", not: "" }
    ],
    pazar: []
  };

  const gunSirasi = ["pazartesi", "sali", "carsamba", "persembe", "cuma", "cumartesi", "pazar"];
  const gunKisa = { pazartesi:"PZT", sali:"SAL", carsamba:"ÇAR", persembe:"PER", cuma:"CUM", cumartesi:"CMT", pazar:"PAZ" };
  let aktifGun = "pazartesi";

  // timer
  let timerInterval = null;
  let kalan = 90;
  const timerSpan = document.getElementById("timerDisplay");
  function guncelleTimer() {
    const dk = Math.floor(kalan / 60);
    const sn = kalan % 60;
    timerSpan.textContent = `${dk.toString().padStart(2,'0')}:${sn.toString().padStart(2,'0')}`;
  }
  function durdurTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  }
  function baslatTimer(sn = 90) {
    durdurTimer();
    kalan = sn;
    guncelleTimer();
    timerInterval = setInterval(() => {
      if (kalan <= 1) {
        durdurTimer();
        kalan = 0;
        guncelleTimer();
      } else {
        kalan--;
        guncelleTimer();
      }
    }, 1000);
  }
  function sifirlaTimer() { durdurTimer(); kalan = 90; guncelleTimer(); }

  // yemekleri bas
  function yemekHtml(gun) {
    const liste = yemekler[gun] || [];
    let html = `<div class="yemek-kutu"><div class="yemek-baslik">🍱 GÜNLÜK BESLENME & SU</div><div class="yemek-listesi">`;
    for (let o of liste) {
      const suText = o.su ? `<span class="su-miktar">💧 ${o.su}</span>` : '';
      html += `<div class="yemek-satir"><span class="yemek-saat">${o.saat}</span><span class="yemek-metin">${o.metin} ${suText ? ` ${suText}` : ''}</span></div>`;
    }
    html += `</div></div>`;
    return html;
  }

  // hareketleri bas
  function hareketHtml(gun) {
    const hareketDizi = hareketler[gun] || [];
    if (hareketDizi.length === 0) {
      return `<div class="dinlenme-mesaj">🧘‍♂️ AKTİF DİNLENME GÜNÜ<br>Yürüyüş / esneme | Standart beslenme planı</div>`;
    }
    let html = ``;
    for (let idx = 0; idx < hareketDizi.length; idx++) {
      const ex = hareketDizi[idx];
      const repGoster = ex.tekrar === "failure" ? "failure" : `${ex.tekrar} tekrar`;
      html += `<div class="egzersiz">
        <div class="egz-header">
          <div class="egz-isim"><span>${ex.ad}</span><span class="tekrar">🎯 ${repGoster}</span></div>
          <div class="egz-butonlar">
            <button class="egz-buton" data-action="not" data-name="${ex.ad}">📝 Not</button>
            <button class="egz-buton" data-action="1rm" data-name="${ex.ad}">📊 1RM</button>
            <button class="egz-buton" data-action="video" data-name="${ex.ad}">🎥 Video</button>
            <button class="egz-buton" data-action="link" data-name="${ex.ad}">🔗 Link</button>
            <button class="egz-buton" data-action="alternatif" data-name="${ex.ad}">🔄 Alternatif</button>
          </div>
          ${ex.not ? `<div class="not-extra">💡 ${ex.not}</div>` : ''}
        </div>
        <div class="set-list" data-gun="${gun}" data-exidx="${idx}">`;
      for (let s = 1; s <= ex.set; s++) {
        html += `<div class="set-satir">
          <div class="set-num">Set ${s}</div>
          <input type="text" class="weight-input" placeholder="Ağırlık (kg)" autocomplete="off">
          <button class="dinlen-buton" data-gun="${gun}" data-exad="${ex.ad}" data-set="${s}">⏱️ 90sn Dinlen</button>
        </div>`;
      }
      html += `</div></div>`;
    }
    return html;
  }

  function gunPanel(gun) {
    return `<div id="panel-${gun}" class="gun-paneli" style="${gun === aktifGun ? 'display:block' : 'display:none'}">${yemekHtml(gun)}${hareketHtml(gun)}</div>`;
  }

  function tumGunleriGoster() {
    let all = '';
    for (let g of gunSirasi) all += gunPanel(g);
    document.getElementById("gunIcerik").innerHTML = all;
    attachDinlenmeButonlari();
    attachActionButonlari();
  }

  function attachDinlenmeButonlari() {
    document.querySelectorAll('.dinlen-buton').forEach(btn => {
      btn.removeEventListener('click', dinlenmeHandler);
      btn.addEventListener('click', dinlenmeHandler);
    });
  }
  function dinlenmeHandler(e) {
    e.stopPropagation();
    baslatTimer(90);
  }

  function attachActionButonlari() {
    document.querySelectorAll('.egz-buton').forEach(btn => {
      btn.removeEventListener('click', actionHandler);
      btn.addEventListener('click', actionHandler);
    });
  }
  function actionHandler(e) {
    const act = e.currentTarget.getAttribute('data-action');
    const exName = e.currentTarget.getAttribute('data-name');
    if (act === 'not') {
      const notu = prompt(`📝 "${exName}" için not:`, "Örn: 3 sn iniş");
      if (notu) alert(`Not kaydedildi: ${notu}`);
    } else if (act === '1rm') {
      let kg = prompt(`🏋️ "${exName}" tahmini 1RM (kg):`, "100");
      if (kg) alert(`1RM: ${kg} kg`);
    } else if (act === 'video') {
      alert(`🎥 "${exName}" için YouTube'da araştır.`);
    } else if (act === 'link') {
      alert(`🔗 "${exName}" için exrx.net adresini ziyaret edebilirsin.`);
    } else if (act === 'alternatif') {
      alert(`🔄 "${exName}" alternatifi: dumbell / kablo / makine varyasyonu.`);
    }
  }

  function tablariOlustur() {
    const tabDiv = document.getElementById("gunTabs");
    tabDiv.innerHTML = '';
    for (let g of gunSirasi) {
      const bosGun = (hareketler[g] && hareketler[g].length === 0);
      const btn = document.createElement("button");
      btn.textContent = gunKisa[g];
      btn.classList.add("gun-btn");
      if (bosGun) btn.classList.add("dinlenme");
      if (g === aktifGun) btn.classList.add("active");
      btn.addEventListener("click", () => {
        aktifGun = g;
        document.querySelectorAll('.gun-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.gun-paneli').forEach(panel => panel.style.display = 'none');
        const aktifPanel = document.getElementById(`panel-${g}`);
        if (aktifPanel) aktifPanel.style.display = 'block';
        durdurTimer();
        sifirlaTimer();
      });
      tabDiv.appendChild(btn);
    }
  }

  // timer düğmeleri
  document.getElementById("stopTimer").addEventListener("click", () => durdurTimer());
  document.getElementById("resetTimer").addEventListener("click", () => { durdurTimer(); sifirlaTimer(); });

  // Başlat
  tumGunleriGoster();
  tablariOlustur();
  sifirlaTimer();
</script>
</body>
</html>
