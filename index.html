<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MEMILI FITNESS V4 - PRO TRACKER 🚀</title>
<style>
body{margin:0;font-family:Arial;background:#121212;color:#fff;padding:10px}
h2{text-align:center;color:#ff4500}
.topbar{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:10px}
.btn{padding:10px;border:none;border-radius:10px;cursor:pointer}
.daybtn{background:#1e1e1e;color:#fff}
.active{background:#ff4500}
.card{background:#1e1e1e;padding:10px;border-radius:10px;margin:8px 0;border-left:4px solid #ff4500;cursor:pointer}
.small{color:#aaa;font-size:12px}
.done{opacity:0.5;text-decoration:line-through}
.stats{background:#1e1e1e;padding:10px;border-radius:10px;margin:10px 0;text-align:center}
</style>
</head>
<body><h2>MEMILI FITNESS V4 🚀 PRO TRACKER</h2><div class="topbar" id="days"></div><div class="stats" id="stats">Streak: 0 gün 🔥</div><h3 id="title"></h3>
<div id="timeline"></div><script>
const days=[
{
name:"Pazartesi",
plan:[
{t:"07:00",type:"meal",text:"Yumurta + peynir + zeytin"},
{t:"07:30",type:"water",text:"1 bardak su"},
{t:"10:00",type:"supp",text:"Whey + Omega3"},
{t:"12:30",type:"meal",text:"Tavuk döner + pilav"},
{t:"15:30",type:"training",text:"Göğüs + Triceps (DB Press 4x10)"},
{t:"20:00",type:"meal",text:"Skyr + yulaf"}
]
},
{
name:"Salı",
plan:[
{t:"07:00",type:"meal",text:"Yumurta + lor"},
{t:"10:00",type:"supp",text:"Whey"},
{t:"15:30",type:"training",text:"Sırt + Biceps"},
{t:"20:00",type:"meal",text:"Et + pilav"}
]
},
{
name:"Çarşamba",
plan:[
{t:"07:00",type:"meal",text:"Kahvaltı"},
{t:"15:30",type:"training",text:"Omuz + Core"},
{t:"20:00",type:"meal",text:"Skyr"}
]
},
{
name:"Perşembe",
plan:[
{t:"08:00",type:"rest",text:"Aktif dinlenme / yürüyüş"},
{t:"12:00",type:"meal",text:"Ev yemeği"},
{t:"20:00",type:"meal",text:"Hafif protein"}
]
},
{
name:"Cuma",
plan:[
{t:"07:00",type:"meal",text:"Kahvaltı"},
{t:"15:30",type:"training",text:"Göğüs + Triceps 2"},
{t:"20:00",type:"meal",text:"Skyr + yulaf"}
]
},
{
name:"Cumartesi",
plan:[
{t:"08:00",type:"meal",text:"Yumurta"},
{t:"15:00",type:"training",text:"Bacak"},
{t:"20:00",type:"meal",text:"Protein öğünü"}
]
},
{
name:"Pazar",
plan:[
{t:"09:00",type:"rest",text:"Dinlenme"},
{t:"14:00",type:"meal",text:"Serbest"}
]
}
];

let current=0;
let db=JSON.parse(localStorage.getItem("v4")||"{}");

function save(){localStorage.setItem("v4",JSON.stringify(db))}

function renderDays(){
let d=document.getElementById("days");
d.innerHTML="";
days.forEach((x,i)=>{
let b=document.createElement("button");
b.innerText=x.name;
b.className="btn daybtn"+(i===current?" active":"");
b.onclick=()=>{current=i;render()};
d.appendChild(b);
});
}

function toggle(dayIndex,itemIndex){
let key=days[dayIndex].name;
if(!db[key])db[key]={};
db[key][itemIndex]=!db[key][itemIndex];
save();
render();
updateStreak();
}

function updateStreak(){
let streak=parseInt(localStorage.getItem("streak")||"0");
streak++;
localStorage.setItem("streak",streak);
document.getElementById("stats").innerText="Streak: "+streak+" gün 🔥";
}

function render(){
let day=days[current];
document.getElementById("title").innerText=day.name+" PLAN";
let t=document.getElementById("timeline");
t.innerHTML="";

let saved=db[day.name]||{};

day.plan.forEach((i,idx)=>{
let done=saved[idx];
let div=document.createElement("div");
div.className="card"+(done?" done":"");
div.innerHTML=`<b>${i.t}</b> - ${i.text}<div class='small'>${i.type}</div>`;
div.onclick=()=>toggle(current,idx);
t.appendChild(div);
});
}

renderDays();
render();
</script></body>
</html>
