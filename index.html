<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MEMILI FITNESS FINAL APP 🚀</title>
<style>
body{margin:0;font-family:Arial;background:#121212;color:#fff;padding:10px}
h2{text-align:center;color:#ff4500}
.top{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.btn{padding:10px;border:none;border-radius:10px;cursor:pointer;background:#1e1e1e;color:#fff}
.active{background:#ff4500}
.card{background:#1e1e1e;padding:12px;border-radius:12px;margin:10px 0;border-left:4px solid #ff4500;cursor:pointer}
.done{opacity:0.4;text-decoration:line-through}
.small{color:#aaa;font-size:12px}
.page{display:none}
</style>
</head>
<body><h2>MEMILI FITNESS FINAL SYSTEM 🚀</h2><div class="top" id="days"></div><h3 id="title"></h3>
<div id="content"></div><script>
const days=[
{
name:"Pazartesi",
plan:[
{t:"07:45",type:"meal",text:"Trende kahvaltı: yumurta + peynir"},
{t:"08:00",type:"water",text:"1 bardak su iç"},
{t:"09:00",type:"meal",text:"Ekstra kahve + hafif atıştırma"},
{t:"11:00",type:"supp",text:"Omega 3 + vitamin"},
{t:"14:00",type:"meal",text:"Tavuk döner + pilav + salata"},
{t:"17:00",type:"supp",text:"Whey protein"},
{t:"18:30",type:"preworkout",text:"Muz + kahve"},
{t:"19:30",type:"training",text:"Göğüs + Triceps: Dumbbell Press 4x10 / Incline 4x10 / Fly 3x12 / Pushdown 4x12"},
{t:"21:00",type:"meal",text:"Skyr + yulaf"}
]
},
{
name:"Salı",
plan:[
{t:"07:30",type:"meal",text:"Kahvaltı"},
{t:"11:00",type:"supp",text:"Whey"},
{t:"14:00",type:"meal",text:"Et + pilav"},
{t:"18:00",type:"training",text:"Sırt: Lat Pulldown 4x10 / Row 4x10 / Seated Row 3x12 / Curl 3x12"},
{t:"21:00",type:"meal",text:"Skyr"}
]
},
{
name:"Çarşamba",
plan:[
{t:"07:30",type:"meal",text:"Kahvaltı"},
{t:"11:00",type:"supp",text:"Whey"},
{t:"18:00",type:"training",text:"Omuz + Core"},
{t:"21:00",type:"meal",text:"Protein"}
]
},
{
name:"Perşembe",
plan:[
{t:"08:00",type:"rest",text:"Aktif dinlenme"},
{t:"12:00",type:"meal",text:"Ev yemeği"},
{t:"20:00",type:"meal",text:"Hafif protein"}
]
},
{
name:"Cuma",
plan:[
{t:"07:30",type:"meal",text:"Kahvaltı"},
{t:"18:00",type:"training",text:"Göğüs + Triceps 2"},
{t:"21:00",type:"meal",text:"Skyr"}
]
},
{
name:"Cumartesi",
plan:[
{t:"08:00",type:"meal",text:"Kahvaltı"},
{t:"17:00",type:"training",text:"Bacak"},
{t:"21:00",type:"meal",text:"Protein"}
]
},
{
name:"Pazar",
plan:[
{t:"09:00",type:"rest",text:"Dinlenme günü"},
{t:"14:00",type:"meal",text:"Serbest"}
]
}
];

let current=0;
let db=JSON.parse(localStorage.getItem("final_app")||"{}");

function save(){localStorage.setItem("final_app",JSON.stringify(db));}

function renderDays(){
let d=document.getElementById("days");
d.innerHTML="";
days.forEach((x,i)=>{
let b=document.createElement("button");
b.innerText=x.name;
b.className="btn"+(i===current?" active":"");
b.onclick=()=>{current=i;render()};
d.appendChild(b);
});
}

function toggle(i){
let key=days[current].name;
if(!db[key])db[key]={};
db[key][i]=!db[key][i];
save();render();
}

function render(){
let day=days[current];
document.getElementById("title").innerText=day.name+" GÜN PLANI";
let c=document.getElementById("content");
c.innerHTML="";

let saved=db[day.name]||{};

day.plan.forEach((p,i)=>{
let done=saved[i];
c.innerHTML+=`
<div class='card ${done?"done":""}' onclick='toggle(${i})'>
<b>${p.t}</b> - ${p.text}
<div class='small'>${p.type}</div>
</div>
`;
});
}

renderDays();render();
</script></body>
</html>
