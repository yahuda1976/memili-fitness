<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Fitness Pro - Kameralı Barkod (TAM ENTEGRE)</title>
    <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: system-ui, sans-serif; font-size: 16px; padding-bottom: 120px; }
        .header { background: #000; padding: 16px; text-align: center; border-bottom: 1px solid #222; }
        .header h1 { background: linear-gradient(135deg,#34C759,#007AFF); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; padding: 16px; max-width: 550px; margin: auto; }
        .card { background: #1C1C1E; border-radius: 16px; padding: 16px 8px; text-align: center; cursor: pointer; border: 1px solid #2C2C2E; }
        .card h3 { color: #34C759; }
        .day-view { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 100; overflow-y: auto; }
        .day-header { display: flex; justify-content: space-between; padding: 16px; background: #000; border-bottom: 1px solid #222; }
        .btn-back, .btn-add { background: #007AFF; border: none; padding: 8px 16px; border-radius: 12px; color: white; cursor: pointer; }
        .item, .set { background: #1C1C1E; margin: 8px 12px; padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 8px; }
        .set { border-left: 4px solid #34C759; }
        .done { background: #007AFF; text-decoration: line-through; }
        .hidden { display: none; }
        .toast { position: fixed; bottom: 30%; left: 50%; transform: translateX(-50%); background: #1C1C1E; padding: 10px 20px; border-radius: 40px; z-index: 1000; animation: fadeOut 1.5s forwards; }
        @keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; display: none; } }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(8px); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #1C1C1E; border-radius: 24px; padding: 24px; max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto; }
        .modal-content input, .modal-content select { width: 100%; padding: 12px; margin: 8px 0; background: #2C2C2E; border: none; border-radius: 12px; color: white; }
        .modal-btn { padding: 12px; border-radius: 40px; font-weight: bold; border: none; margin: 4px; cursor: pointer; }
        .confirm-btn { background: #007AFF; color: white; flex: 1; }
        .cancel-btn { background: #FF3B30; color: white; flex: 1; }
        video { width: 100%; border-radius: 20px; margin-top: 12px; background: #000; }
        .liste-item { background: #2C2C2E; border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .aktif-badge { background: #34C759; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .urun-card { background: #2C2C2E; border-radius: 12px; padding: 12px; margin-top: 12px; }
        .button-group { display: flex; gap: 12px; margin-top: 12px; }
        macro-bar { display: flex; gap: 8px; background: #1C1C1E; padding: 12px; margin: 12px; border-radius: 16px; }
        .progress-bar { height: 4px; background: #2C2C2E; border-radius: 4px; margin: 8px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: #34C759; width: 0%; }
    </style>
</head>
<body>

<!-- ANA EKRAN -->
<div id="homeScreen">
    <div class="header"><h1>🔥 FITNESS PRO</h1></div>
    <div id="homeGrid" class="grid"></div>
    <button id="haftaBtn" style="width:90%; margin:20px auto; display:block; background:#34C759; border:none; padding:14px; border-radius:40px; color:white; font-weight:bold;">📅 HAFTA GEÇMİŞİ</button>
</div>

<!-- GÜN EKRANI -->
<div id="dayScreen" class="day-view hidden">
    <div class="day-header">
        <button class="btn-back" onclick="closeDay()">← Geri</button>
        <span id="dayTitle"></span>
        <button class="btn-add" onclick="showAddItem()">+ Ekle</button>
    </div>
    <div id="targetPanel" style="background:#1C1C1E; margin:12px; padding:12px; border-radius:16px;"></div>
    <div id="recoveryPanel" style="display:flex; gap:8px; margin:12px; flex-wrap:wrap;"></div>
    <div id="macroBar" style="display:flex; gap:8px; background:#1C1C1E; margin:12px; padding:12px; border-radius:16px; justify-content:space-around;"></div>
    <div id="dayItems"></div>
</div>

<!-- AYARLAR EKRANI -->
<div id="settingsScreen" class="day-view hidden">
    <div class="day-header">
        <button class="btn-back" onclick="closeSettings()">← Geri</button>
        <span>AYARLAR</span>
        <div style="width:50px;"></div>
    </div>
    <div style="padding:16px;">
        <!-- LİSTE BÖLÜMÜ -->
        <div style="background:#1C1C1E; border-radius:20px; padding:16px; margin-bottom:16px;">
            <h3 style="color:#34C759;">📋 YEMEK LİSTEM</h3>
            <div id="listeContainer"></div>
            <button id="yeniListeBtn" style="background:#FF9500; border:none; padding:10px; border-radius:40px; color:white; width:100%; margin-top:8px;">➕ Yeni Liste Oluştur</button>
            <div id="aktifGosterge" style="margin-top:12px; padding:8px; background:#2C2C2E; border-radius:12px; text-align:center;"></div>
        </div>

        <!-- KAMERA BÖLÜMÜ -->
        <div style="background:#1C1C1E; border-radius:20px; padding:16px; margin-bottom:16px;">
            <h3 style="color:#007AFF;">📷 KAMERA İLE BARKOD OKU</h3>
            <button id="kameraAcBtn" style="background:#007AFF; border:none; padding:12px; border-radius:40px; color:white; width:100%;">📷 Kamerayı Aç</button>
            <button id="kameraKapatBtn" class="hidden" style="background:#FF3B30; border:none; padding:12px; border-radius:40px; color:white; width:100%;">⏹️ Kamerayı Kapat</button>
            <video id="barcodeVideo" autoplay playsinline muted style="display:none; margin-top:12px;"></video>
            <div id="kameraDurum" style="font-size:12px; color:#FF9500; margin-top:8px;"></div>
            <div id="urunSonuc" style="margin-top:12px;"></div>
        </div>

        <!-- SEÇİLİ LİSTEDEKİ ÜRÜNLER -->
        <div style="background:#1C1C1E; border-radius:20px; padding:16px; margin-bottom:16px;">
            <h3 style="color:#34C759;">🍽️ SEÇİLİ LİSTEDEKİLER</h3>
            <div id="secilenUrunler"></div>
            <div id="secilenToplam" style="margin-top:12px; font-size:12px; color:#aaa;"></div>
        </div>

        <!-- HEDEFLER -->
        <div style="background:#1C1C1E; border-radius:20px; padding:16px; margin-bottom:16px;">
            <h3 style="color:#FF9500;">🎯 GÜNLÜK HEDEFLER</h3>
            <div><label>Protein (g)</label><input type="number" id="targetProtein" value="160"></div>
            <div><label>Karbonhidrat (g)</label><input type="number" id="targetCarbs" value="250"></div>
            <div><label>Yağ (g)</label><input type="number" id="targetFat" value="70"></div>
            <div><label>Kalori</label><input type="number" id="targetCal" value="2500"></div>
            <button id="hedefKaydetBtn" class="confirm-btn" style="width:100%; margin-top:12px;">Kaydet</button>
        </div>

        <!-- VÜCUT ÖLÇÜLERİ -->
        <div style="background:#1C1C1E; border-radius:20px; padding:16px; margin-bottom:16px;">
            <h3 style="color:#007AFF;">📏 VÜCUT ÖLÇÜLERİ</h3>
            <div><label>Kilo (kg)</label><input type="number" id="bodyWeight" step="0.1"></div>
            <div><label>Bel (cm)</label><input type="number" id="bodyWaist" step="0.5"></div>
            <div><label>Göğüs (cm)</label><input type="number" id="bodyChest" step="0.5"></div>
            <div><label>Kol (cm)</label><input type="number" id="bodyArm" step="0.5"></div>
            <div><label>Bacak (cm)</label><input type="number" id="bodyLeg" step="0.5"></div>
            <button id="vucutKaydetBtn" class="confirm-btn" style="width:100%; margin-top:12px;">Kaydet</button>
        </div>

        <!-- FOTOĞRAF -->
        <div style="background:#1C1C1E; border-radius:20px; padding:16px; margin-bottom:16px;">
            <h3 style="color:#007AFF;">📸 FOTOĞRAF</h3>
            <button id="onceFotoBtn" style="background:#007AFF; border:none; padding:10px; border-radius:40px; color:white;">Önce</button>
            <button id="sonraFotoBtn" style="background:#007AFF; border:none; padding:10px; border-radius:40px; color:white;">Sonra</button>
            <div id="fotoContainer" style="display:flex; gap:12px; margin-top:12px;"></div>
        </div>

        <!-- TAKVİYELER -->
        <div style="background:#1C1C1E; border-radius:20px; padding:16px; margin-bottom:16px;">
            <h3 style="color:#007AFF;">💊 TAKVİYELER</h3>
            <div id="supplementList"></div>
            <input type="text" id="newSupName" placeholder="Takviye adı"><input type="text" id="newSupTime" placeholder="Zaman">
            <button id="supEkleBtn" class="confirm-btn" style="width:100%; margin-top:8px;">Ekle</button>
        </div>

        <!-- YEDEK -->
        <div style="background:#1C1C1E; border-radius:20px; padding:16px;">
            <h3 style="color:#007AFF;">💾 YEDEKLEME</h3>
            <button id="yedekAlBtn" style="background:#007AFF; border:none; padding:12px; border-radius:40px; color:white; width:100%; margin-bottom:8px;">Yedek Al</button>
            <button id="yedekYukleBtn" style="background:#34C759; border:none; padding:12px; border-radius:40px; color:white; width:100%;">Geri Yükle</button>
        </div>
    </div>
</div>

<script>
// ========== 1. LİSTE YÖNETİMİ (BASİT) ==========
let listeler = [];
let aktifListeId = null;
let scanner = null;

function initListeler() {
    let kayit = localStorage.getItem("fitness_listeler_v2");
    if (kayit) {
        listeler = JSON.parse(kayit);
    } else {
        listeler = [
            { id: "l1", ad: "🍽️ Liste 1", urunler: [], toplam: { protein:0, karbonhidrat:0, yag:0, kalori:0 } },
            { id: "l2", ad: "🍽️ Liste 2", urunler: [], toplam: { protein:0, karbonhidrat:0, yag:0, kalori:0 } },
            { id: "l3", ad: "🍽️ Liste 3", urunler: [], toplam: { protein:0, karbonhidrat:0, yag:0, kalori:0 } }
        ];
    }
    aktifListeId = localStorage.getItem("fitness_aktif_liste_v2");
    if (!aktifListeId || !listeler.find(l=>l.id===aktifListeId)) aktifListeId = listeler[0]?.id;
    renderListeler();
    renderAktifGosterge();
    renderSecilenUrunler();
}
function saveListeler() {
    localStorage.setItem("fitness_listeler_v2", JSON.stringify(listeler));
    if (aktifListeId) localStorage.setItem("fitness_aktif_liste_v2", aktifListeId);
}
function renderListeler() {
    const container = document.getElementById("listeContainer");
    if (!container) return;
    if (!listeler.length) { container.innerHTML = "<div>Liste yok</div>"; return; }
    let html = "";
    listeler.forEach(l => {
        html += `<div class="liste-item">
            <div><strong>${l.ad}</strong><br><small>${l.urunler.length} ürün</small></div>
            <div><button class="secButon" data-id="${l.id}" style="background:${aktifListeId===l.id?'#34C759':'#007AFF'}; border:none; padding:6px 12px; border-radius:20px; color:white;">${aktifListeId===l.id?'✅ Seçili':'Seç'}</button>
            <button class="silButon" data-id="${l.id}" style="background:#FF3B30; border:none; padding:6px 12px; border-radius:20px; margin-left:8px;">Sil</button></div>
        </div>`;
    });
    container.innerHTML = html;
    document.querySelectorAll(".secButon").forEach(btn => {
        btn.addEventListener("click", () => { aktifListeId = btn.dataset.id; saveListeler(); renderListeler(); renderAktifGosterge(); renderSecilenUrunler(); gosterMesaj("Liste seçildi"); });
    });
    document.querySelectorAll(".silButon").forEach(btn => {
        btn.addEventListener("click", () => {
            if (listeler.length === 1) { gosterMesaj("En az 1 liste olmalı"); return; }
            listeler = listeler.filter(l => l.id !== btn.dataset.id);
            if (aktifListeId === btn.dataset.id) aktifListeId = listeler[0]?.id;
            saveListeler(); renderListeler(); renderAktifGosterge(); renderSecilenUrunler(); gosterMesaj("Liste silindi");
        });
    });
}
function renderAktifGosterge() {
    let aktif = listeler.find(l=>l.id===aktifListeId);
    let el = document.getElementById("aktifGosterge");
    if(el) el.innerHTML = aktif ? `✅ AKTİF: ${aktif.ad}` : "❌ Liste seçilmedi";
}
function hesaplaToplam(liste) {
    let t = { protein:0, karbonhidrat:0, yag:0, kalori:0 };
    liste.urunler.forEach(u => { t.protein+=u.protein; t.karbonhidrat+=u.karbonhidrat; t.yag+=u.yag; t.kalori+=u.kalori; });
    liste.toplam = t;
}
function urunEkle(listeId, urun) {
    let liste = listeler.find(l=>l.id===listeId);
    if(!liste) return false;
    liste.urunler.push(urun);
    hesaplaToplam(liste);
    saveListeler();
    renderSecilenUrunler();
    return true;
}
function renderSecilenUrunler() {
    let aktif = listeler.find(l=>l.id===aktifListeId);
    let container = document.getElementById("secilenUrunler");
    let toplamDiv = document.getElementById("secilenToplam");
    if(!aktif) { if(container) container.innerHTML="<div>Liste seçilmedi</div>"; return; }
    if(!aktif.urunler.length) { container.innerHTML="<div style='color:#aaa'>Henüz ürün yok</div>"; }
    else {
        let html = "";
        aktif.urunler.forEach((u,idx) => {
            html += `<div class="liste-item" style="flex-direction:column; align-items:flex-start;">
                <div style="display:flex; justify-content:space-between; width:100%;"><strong>${u.isim}</strong><button class="urunSil" data-idx="${idx}" style="background:#FF3B30; border:none; padding:4px 12px; border-radius:20px;">Sil</button></div>
                <small>🔥 ${u.kalori} kcal | 💪 ${u.protein}g | 🌾 ${u.karbonhidrat}g | 🥑 ${u.yag}g</small>
            </div>`;
        });
        container.innerHTML = html;
        document.querySelectorAll(".urunSil").forEach(btn => {
            btn.addEventListener("click", (e) => {
                let idx = parseInt(btn.dataset.idx);
                aktif.urunler.splice(idx,1);
                hesaplaToplam(aktif);
                saveListeler();
                renderSecilenUrunler();
                gosterMesaj("Ürün silindi");
            });
        });
    }
    toplamDiv.innerHTML = `📊 Toplam: 🔥 ${aktif.toplam.kalori} kcal | 💪 ${aktif.toplam.protein}g | 🌾 ${aktif.toplam.karbonhidrat}g | 🥑 ${aktif.toplam.yag}g`;
}
document.getElementById("yeniListeBtn")?.addEventListener("click", () => {
    let ad = prompt("Liste adı:", `Liste ${listeler.length+1}`);
    if(ad) {
        listeler.push({ id: "l"+Date.now(), ad: ad, urunler: [], toplam: {protein:0,karbonhidrat:0,yag:0,kalori:0} });
        saveListeler(); renderListeler(); renderAktifGosterge(); gosterMesaj("Liste oluşturuldu");
    }
});

// ========== 2. KAMERALI BARKOD ==========
const kameraAcBtn = document.getElementById("kameraAcBtn");
const kameraKapatBtn = document.getElementById("kameraKapatBtn");
const video = document.getElementById("barcodeVideo");
const kameraDurum = document.getElementById("kameraDurum");
const urunSonuc = document.getElementById("urunSonuc");
async function kamerayiBaslat() {
    if(!aktifListeId) { kameraDurum.innerHTML = "❌ Önce bir liste seçin!"; return; }
    kameraAcBtn.classList.add("hidden");
    kameraKapatBtn.classList.remove("hidden");
    video.style.display = "block";
    kameraDurum.innerHTML = "📱 Barkodu göster... otomatik okunacak";
    urunSonuc.innerHTML = "";
    try {
        scanner = new ZXing.BrowserMultiFormatReader();
        await scanner.decodeFromVideoDevice(null, video, async (result, err) => {
            if(result) {
                let barcode = result.getText();
                kameraDurum.innerHTML = `✅ Barkod: ${barcode} - Ürün aranıyor...`;
                urunSonuc.innerHTML = '<div style="color:#FF9500;">⏳ OpenFoodFacts aranıyor...</div>';
                try {
                    let res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
                    let data = await res.json();
                    if(data.status===1 && data.product) {
                        let p = data.product;
                        let isim = p.product_name || "Ürün adı yok";
                        let nut = p.nutriments || {};
                        let kalori = Math.round(nut['energy-kcal'] || nut['energy_value'] || 0);
                        let protein = Math.round(nut.proteins || nut['proteins_value'] || 0);
                        let karbonhidrat = Math.round(nut.carbohydrates || nut['carbohydrates_value'] || 0);
                        let yag = Math.round(nut.fat || nut['fat_value'] || 0);
                        urunSonuc.innerHTML = `
                            <div class="urun-card">
                                <strong>📦 ${isim}</strong><br>
                                🔥 ${kalori} kcal | 💪 ${protein}g | 🌾 ${karbonhidrat}g | 🥑 ${yag}g
                                <div class="button-group">
                                    <button id="ekleBtnKamera" class="confirm-btn">✅ Listeye Ekle</button>
                                    <button id="iptalBtnKamera" class="cancel-btn">❌ İptal</button>
                                </div>
                            </div>
                        `;
                        document.getElementById("ekleBtnKamera")?.addEventListener("click", () => {
                            urunEkle(aktifListeId, { isim, kalori, protein, karbonhidrat, yag });
                            urunSonuc.innerHTML = `<div style="color:#34C759;">✅ "${isim}" eklendi!</div>`;
                            setTimeout(() => { if(urunSonuc.innerHTML.includes('eklendi')) urunSonuc.innerHTML=''; }, 2000);
                        });
                        document.getElementById("iptalBtnKamera")?.addEventListener("click", () => {
                            urunSonuc.innerHTML = `<div style="color:#FF9500;">❌ İptal edildi</div>`;
                            setTimeout(() => { if(urunSonuc.innerHTML.includes('İptal')) urunSonuc.innerHTML=''; }, 1500);
                        });
                    } else { urunSonuc.innerHTML = `<div style="color:#FF3B30;">❌ Ürün bulunamadı: ${barcode}</div>`; }
                } catch(e) { urunSonuc.innerHTML = `<div style="color:#FF3B30;">⚠️ Bağlantı hatası</div>`; }
            }
        });
    } catch(e) { kameraDurum.innerHTML = "❌ Kamera izni gerekli"; kamerayiKapat(); }
}
function kamerayiKapat() {
    if(scanner) { try{ scanner.reset(); }catch(e){} scanner=null; }
    video.style.display = "none";
    kameraAcBtn.classList.remove("hidden");
    kameraKapatBtn.classList.add("hidden");
    kameraDurum.innerHTML = "";
}
kameraAcBtn?.addEventListener("click", kamerayiBaslat);
kameraKapatBtn?.addEventListener("click", kamerayiKapat);

// ========== 3. ESKİ FITNESS VERİLERİ (Haftalık plan, egzersizler vs) ==========
let dailyTargets = { protein:160, carbs:250, fat:70, calories:2500 };
let currentWeekData={}, weekArchive={}, currentWeekKey=null, doneState={}, waterIntake={}, totalSetCount=0, timerInterval=null, currentDayOpen=null, setLogs={}, muscleLastTrained={}, supplements=[{name:"Omega-3",time:"Sabah"},{name:"Whey",time:"Antrenman sonrası"},{name:"Kreatin",time:"Antrenman öncesi"}], bodyMeasurements={weight:0,waist:0,chest:0,arm:0,leg:0}, beforePhoto=null, afterPhoto=null;
const plan1Meals=["07:00 Yulaf + sut + muz + whey | Kalori: 420 | Protein: 30 g | Karb: 55 g | Yag: 10 g","09:00 Skyr + meyve | Kalori: 250 | Protein: 20 g | Karb: 30 g | Yag: 8 g","14:00 Tavuk + pirinc | Kalori: 550 | Protein: 40 g | Karb: 60 g | Yag: 15 g","17:00 Tavuk + pirinc | Kalori: 400 | Protein: 30 g | Karb: 45 g | Yag: 8 g","20:15 Whey | Kalori: 200 | Protein: 25 g | Karb: 20 g | Yag: 2 g","21:00 Kiyma + patates | Kalori: 500 | Protein: 35 g | Karb: 40 g | Yag: 18 g"];
const plan2Meals=["07:00 Yulaf + whey | Kalori: 420 | Protein: 30 g | Karb: 50 g | Yag: 10 g","09:00 Skyr | Kalori: 260 | Protein: 20 g | Karb: 30 g | Yag: 8 g","14:00 Kiyma + pirinc | Kalori: 600 | Protein: 35 g | Karb: 60 g | Yag: 20 g","17:00 Tavuk + pirinc | Kalori: 400 | Protein: 30 g | Karb: 45 g | Yag: 8 g","20:15 Whey | Kalori: 200 | Protein: 25 g | Karb: 20 g | Yag: 2 g","21:00 Tavuk + kinoa | Kalori: 400 | Protein: 35 g | Karb: 35 g | Yag: 10 g"];
const offMeals=["07:00 Yulaf + Skyr | Kalori: 350 | Protein: 25 g | Karb: 40 g | Yag: 8 g","09:00 Skyr | Kalori: 220 | Protein: 20 g | Karb: 25 g | Yag: 7 g","14:00 Tavuk + salata | Kalori: 350 | Protein: 40 g | Karb: 10 g | Yag: 15 g","17:00 Ton baligi | Kalori: 250 | Protein: 30 g | Karb: 5 g | Yag: 10 g","21:00 Tavuk + salata | Kalori: 400 | Protein: 35 g | Karb: 10 g | Yag: 15 g"];
const workoutPlans={"PAZARTESI":{title:"🏋️ GÖĞÜS", muscleGroups:[{name:"GÖĞÜS",exercises:[{ex:"Incline Press",sets:4},{ex:"Flat Press",sets:4}]}]},"SALI":{title:"🏋️ SIRT", muscleGroups:[{name:"SIRT",exercises:[{ex:"Lat Pulldown",sets:4},{ex:"Row",sets:4}]}]},"CARSAMBA":{title:"🏋️ BACAK", muscleGroups:[{name:"BACAK",exercises:[{ex:"Squat",sets:4},{ex:"Leg Press",sets:4}]}]}};
function getCurrentWeekKey(){ let now=new Date(); let start=new Date(now.getFullYear(),0,1); let days=Math.floor((now-start)/(24*3600000)); return `${now.getFullYear()}-W${Math.ceil((days+start.getDay()+1)/7)}`; }
function initNewWeek(){ let key=getCurrentWeekKey(); if(!weekArchive[key]){ let data={}, days=["PAZARTESI","SALI","CARSAMBA","PERSEMBE","CUMA","CUMARTESI","PAZAR"]; for(let i=0;i<days.length;i++){ let day=days[i]; let meals= i<3 ? plan1Meals : (i<5 ? plan2Meals : offMeals); let w=workoutPlans[day]; let items=[...meals]; if(w){ items.push(w.title); for(let g of w.muscleGroups) for(let ex of g.exercises) items.push({ex:ex.ex, sets:ex.sets, link:"", notes:""}); } data[day]=items; } weekArchive[key]={weekData:data,weekStartDate:new Date().toISOString()}; } currentWeekKey=key; currentWeekData=weekArchive[key].weekData; doneState={}; waterIntake={}; }
function loadDataFromLocal(){ let ar=localStorage.getItem("weekArchive"); if(ar) weekArchive=JSON.parse(ar); let saved=localStorage.getItem("currentWeekKey"); if(saved===getCurrentWeekKey() && weekArchive[saved]) currentWeekData=weekArchive[saved].weekData; else initNewWeek(); let ds=localStorage.getItem("doneState"); if(ds) doneState=JSON.parse(ds); let wi=localStorage.getItem("waterIntake"); if(wi) waterIntake=JSON.parse(wi); let sup=localStorage.getItem("supplements"); if(sup) supplements=JSON.parse(sup); let bm=localStorage.getItem("bodyMeasurements"); if(bm) bodyMeasurements=JSON.parse(bm); let bf=localStorage.getItem("beforePhoto"); if(bf) beforePhoto=bf; let af=localStorage.getItem("afterPhoto"); if(af) afterPhoto=af; }
function saveDataToLocal(){ localStorage.setItem("weekArchive",JSON.stringify(weekArchive)); localStorage.setItem("currentWeekKey",currentWeekKey); localStorage.setItem("doneState",JSON.stringify(doneState)); localStorage.setItem("waterIntake",JSON.stringify(waterIntake)); localStorage.setItem("supplements",JSON.stringify(supplements)); localStorage.setItem("bodyMeasurements",JSON.stringify(bodyMeasurements)); if(beforePhoto) localStorage.setItem("beforePhoto",beforePhoto); if(afterPhoto) localStorage.setItem("afterPhoto",afterPhoto); }
function buildHome(){ let grid=document.getElementById("homeGrid"); grid.innerHTML=""; let days=["PAZARTESI","SALI","CARSAMBA","PERSEMBE","CUMA","CUMARTESI","PAZAR"]; days.forEach(day=>{ let stats=getDayStats(day); let card=document.createElement("div"); card.className="card"; card.innerHTML=`<h3>${day}</h3><div class="progress-bar"><div class="progress-fill" style="width:${stats.percent}%"></div></div><small>${stats.completed}/${stats.total}</small>`; card.onclick=()=>openDay(day); grid.appendChild(card); }); let setCard=document.createElement("div"); setCard.className="card"; setCard.innerHTML=`<h3>⚙️ AYARLAR</h3>`; setCard.onclick=()=>openSettings(); grid.appendChild(setCard); }
function getDayStats(day){ let items=currentWeekData[day]; if(!items) return {total:0,completed:0,percent:0}; let total=0,comp=0; items.forEach((it,idx)=>{ if(typeof it==="string"){ total++; if(doneState[`${day}|meal|${idx}`]) comp++; } else if(it.sets){ for(let s=1;s<=it.sets;s++){ total++; if(doneState[`${day}|set|${it.ex}|${s}`]) comp++; } } }); return {total,completed:comp,percent:total? (comp/total*100):0}; }
function openDay(day){ currentDayOpen=day; document.getElementById("homeScreen").classList.add("hidden"); document.getElementById("settingsScreen").classList.add("hidden"); document.getElementById("dayScreen").classList.remove("hidden"); document.getElementById("dayTitle").innerText=day; renderDayItems(day); updateTargetPanel(); }
function closeDay(){ document.getElementById("dayScreen").classList.add("hidden"); document.getElementById("homeScreen").classList.remove("hidden"); buildHome(); }
function openSettings(){ document.getElementById("homeScreen").classList.add("hidden"); document.getElementById("dayScreen").classList.add("hidden"); document.getElementById("settingsScreen").classList.remove("hidden"); loadTargetsToUI(); updateBodyUI(); renderSupplementList(); }
function closeSettings(){ document.getElementById("settingsScreen").classList.add("hidden"); document.getElementById("homeScreen").classList.remove("hidden"); buildHome(); }
function renderDayItems(day){ let cont=document.getElementById("dayItems"); if(!cont) return; let items=currentWeekData[day]; if(!items) return; cont.innerHTML=""; items.forEach((it,idx)=>{ if(typeof it==="string"){ let div=document.createElement("div"); div.className="item"; div.innerHTML=`<span>${it}</span><button class="move-btn" onclick="moveItem('${day}',${idx},-1)">⬆️</button><button class="move-btn" onclick="moveItem('${day}',${idx},1)">⬇️</button>`; let key=`${day}|meal|${idx}`; if(doneState[key]) div.classList.add("done"); div.onclick=()=>{ if(doneState[key]) delete doneState[key]; else doneState[key]=true; saveDataToLocal(); renderDayItems(day); updateTargetPanel(); }; cont.appendChild(div); } else if(it.ex){ let title=document.createElement("div"); title.className="ex-title"; title.innerHTML=`<span>💪 ${it.ex}</span>`; cont.appendChild(title); for(let s=1;s<=it.sets;s++){ let setDiv=document.createElement("div"); setDiv.className="set"; setDiv.innerHTML=`<span>Set ${s}</span>`; let key=`${day}|set|${it.ex}|${s}`; if(doneState[key]) setDiv.classList.add("done"); setDiv.onclick=()=>{ if(doneState[key]) delete doneState[key]; else doneState[key]=true; saveDataToLocal(); renderDayItems(day); updateTargetPanel(); }; cont.appendChild(setDiv); } } }); }
function moveItem(day,idx,dir){ let items=currentWeekData[day]; let newIdx=idx+dir; if(newIdx<0||newIdx>=items.length) return; [items[idx],items[newIdx]]=[items[newIdx],items[idx]]; saveDataToLocal(); renderDayItems(day); }
function updateTargetPanel(){ let panel=document.getElementById("targetPanel"); if(!panel||!currentDayOpen) return; let total={p:0,k:0,f:0,cal:0}; let items=currentWeekData[currentDayOpen]; items?.forEach((it,idx)=>{ if(typeof it==="string" && doneState[`${currentDayOpen}|meal|${idx}`]){ let kcalMatch=it.match(/Kalori:\s*(\d+)/); let pMatch=it.match(/Protein:\s*(\d+)/); let cMatch=it.match(/Karb:\s*(\d+)/); let fMatch=it.match(/Yag:\s*(\d+)/); total.cal+=kcalMatch?parseInt(kcalMatch[1]):0; total.p+=pMatch?parseInt(pMatch[1]):0; total.k+=cMatch?parseInt(cMatch[1]):0; total.f+=fMatch?parseInt(fMatch[1]):0; } }); panel.innerHTML=`<div>💪 Protein: ${total.p}/${dailyTargets.protein}g</div><div>🌾 Karb: ${total.k}/${dailyTargets.carbs}g</div><div>🥑 Yağ: ${total.f}/${dailyTargets.fat}g</div><div>🔥 Kalori: ${total.cal}/${dailyTargets.calories}kcal</div>`; }
function loadTargetsToUI(){ let t=localStorage.getItem("dailyTargets"); if(t) dailyTargets=JSON.parse(t); document.getElementById("targetProtein").value=dailyTargets.protein; document.getElementById("targetCarbs").value=dailyTargets.carbs; document.getElementById("targetFat").value=dailyTargets.fat; document.getElementById("targetCal").value=dailyTargets.calories; }
document.getElementById("hedefKaydetBtn")?.addEventListener("click",()=>{ dailyTargets={ protein:parseInt(document.getElementById("targetProtein").value)||160, carbs:parseInt(document.getElementById("targetCarbs").value)||250, fat:parseInt(document.getElementById("targetFat").value)||70, calories:parseInt(document.getElementById("targetCal").value)||2500 }; localStorage.setItem("dailyTargets",JSON.stringify(dailyTargets)); gosterMesaj("Hedefler kaydedildi"); if(currentDayOpen) updateTargetPanel(); });
function updateBodyUI(){ document.getElementById("bodyWeight").value=bodyMeasurements.weight||""; document.getElementById("bodyWaist").value=bodyMeasurements.waist||""; document.getElementById("bodyChest").value=bodyMeasurements.chest||""; document.getElementById("bodyArm").value=bodyMeasurements.arm||""; document.getElementById("bodyLeg").value=bodyMeasurements.leg||""; let cont=document.getElementById("fotoContainer"); if(cont) cont.innerHTML=`${beforePhoto?`<img src="${beforePhoto}" style="width:100px; border-radius:12px;">`:"Önce yok"} ${afterPhoto?`<img src="${afterPhoto}" style="width:100px; border-radius:12px;">`:"Sonra yok"}`; }
document.getElementById("vucutKaydetBtn")?.addEventListener("click",()=>{ bodyMeasurements={ weight:parseFloat(document.getElementById("bodyWeight").value)||0, waist:parseFloat(document.getElementById("bodyWaist").value)||0, chest:parseFloat(document.getElementById("bodyChest").value)||0, arm:parseFloat(document.getElementById("bodyArm").value)||0, leg:parseFloat(document.getElementById("bodyLeg").value)||0 }; localStorage.setItem("bodyMeasurements",JSON.stringify(bodyMeasurements)); gosterMesaj("Ölçüler kaydedildi"); });
document.getElementById("onceFotoBtn")?.addEventListener("click",()=>{ let inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.onchange=e=>{ let f=e.target.files[0]; if(f){ let r=new FileReader(); r.onload=ev=>{ beforePhoto=ev.target.result; localStorage.setItem("beforePhoto",beforePhoto); updateBodyUI(); }; r.readAsDataURL(f); } }; inp.click(); });
document.getElementById("sonraFotoBtn")?.addEventListener("click",()=>{ let inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.onchange=e=>{ let f=e.target.files[0]; if(f){ let r=new FileReader(); r.onload=ev=>{ afterPhoto=ev.target.result; localStorage.setItem("afterPhoto",afterPhoto); updateBodyUI(); }; r.readAsDataURL(f); } }; inp.click(); });
function renderSupplementList(){ let cont=document.getElementById("supplementList"); if(!cont) return; cont.innerHTML=""; supplements.forEach((s,i)=>{ cont.innerHTML+=`<div style="display:flex; justify-content:space-between; padding:8px; background:#2C2C2E; margin:4px 0; border-radius:12px;"><span>💊 ${s.name} - ${s.time}</span><button class="supSil" data-idx="${i}" style="background:#FF3B30; border:none; padding:4px 12px; border-radius:20px;">Sil</button></div>`; }); document.querySelectorAll(".supSil").forEach(btn=>{ btn.addEventListener("click",()=>{ supplements.splice(parseInt(btn.dataset.idx),1); localStorage.setItem("supplements",JSON.stringify(supplements)); renderSupplementList(); gosterMesaj("Silindi"); }); }); }
document.getElementById("supEkleBtn")?.addEventListener("click",()=>{ let n=document.getElementById("newSupName").value; let t=document.getElementById("newSupTime").value; if(n&&t){ supplements.push({name:n,time:t}); localStorage.setItem("supplements",JSON.stringify(supplements)); renderSupplementList(); document.getElementById("newSupName").value=""; document.getElementById("newSupTime").value=""; gosterMesaj("Eklendi"); } });
document.getElementById("yedekAlBtn")?.addEventListener("click",()=>{ let data={listeler,aktifListeId,weekArchive,currentWeekKey,doneState,waterIntake,supplements,bodyMeasurements,beforePhoto,afterPhoto,dailyTargets}; let a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(data)])); a.download=`fitness_${Date.now()}.json`; a.click(); gosterMesaj("Yedek alındı"); });
document.getElementById("yedekYukleBtn")?.addEventListener("click",()=>{ let inp=document.createElement("input"); inp.type="file"; inp.accept="application/json"; inp.onchange=e=>{ let f=e.target.files[0]; let r=new FileReader(); r.onload=ev=>{ try{ let d=JSON.parse(ev.target.result); if(d.listeler) listeler=d.listeler; if(d.aktifListeId) aktifListeId=d.aktifListeId; if(d.weekArchive) weekArchive=d.weekArchive; if(d.currentWeekKey) currentWeekKey=d.currentWeekKey; if(d.doneState) doneState=d.doneState; if(d.waterIntake) waterIntake=d.waterIntake; if(d.supplements) supplements=d.supplements; if(d.bodyMeasurements) bodyMeasurements=d.bodyMeasurements; if(d.beforePhoto) beforePhoto=d.beforePhoto; if(d.afterPhoto) afterPhoto=d.afterPhoto; if(d.dailyTargets) dailyTargets=d.dailyTargets; saveListeler(); saveDataToLocal(); localStorage.setItem("dailyTargets",JSON.stringify(dailyTargets)); location.reload(); }catch(e){ alert("Hatalı dosya"); } }; r.readAsText(f); }; inp.click(); });
function gosterMesaj(msg){ let t=document.createElement("div"); t.className="toast"; t.innerText=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1500); }
loadDataFromLocal(); initListeler(); buildHome();
</script>
</body>
</html>
