<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Fitness PRO - Çalışan Versiyon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #b8b0a4;
            font-family: system-ui, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 16px;
            padding-bottom: 80px;
        }
        .header {
            background: rgba(184,176,164,0.95);
            padding: 12px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 16px;
            font-weight: bold;
            font-size: 24px;
            color: #e8372a;
        }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .day-card {
            background: white;
            border-radius: 20px;
            padding: 16px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .day-name {
            font-weight: bold;
            font-size: 18px;
            color: #e8372a;
        }
        .progress-bar {
            height: 6px;
            background: #eee;
            border-radius: 4px;
            margin: 8px 0;
        }
        .progress-fill {
            height: 100%;
            background: #1a73e8;
            border-radius: 4px;
            width: 0%;
        }
        .page {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #b8b0a4;
            overflow-y: auto;
            display: none;
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
        }
        .page.active {
            display: block;
        }
        .back-btn {
            background: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            margin-bottom: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .item, .exercise {
            background: white;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .move-buttons {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .move-btn {
            background: #ddd;
            border: none;
            padding: 4px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }
        .content {
            flex: 1;
        }
        .sets {
            margin-left: 40px;
        }
        .set-item {
            background: #f0f0f5;
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .add-btn {
            background: #34a853;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 20px;
            width: 100%;
            margin-top: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .toast {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: #1c1c1e;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            z-index: 999;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="homePage">
    <div class="header">🔥 FITNESS PRO</div>
    <div class="days-grid" id="daysGrid"></div>
</div>

<div id="dayPage" class="page">
    <button class="back-btn" onclick="closeDay()">← Geri</button>
    <h2 id="dayTitle" style="margin-bottom: 12px;"></h2>
    <div id="dayItems"></div>
    <button class="add-btn" onclick="addNewItem()">+ Yeni Ekle</button>
</div>

<script>
    // === BAŞLANGIÇ VERİLERİ ===
    let data = {
        "PAZARTESI": [
            "☕ Kahve",
            "💧 Su",
            { ex: "Bench Press", sets: 3 },
            { ex: "Incline Dumbbell Press", sets: 4 },
            "🍗 Tavuk + Pilav"
        ],
        "SALI": [
            "💧 Su",
            { ex: "Squat", sets: 4 },
            { ex: "Leg Press", sets: 3 },
            "🥩 Kıyma + Makarna"
        ],
        "CARSAMBA": [
            "💧 Su",
            { ex: "Lat Pulldown", sets: 4 },
            "🥚 Yumurta"
        ]
    };

    let done = {};      // Tamamlanan öğeler
    let setLogs = {};   // Set ağırlık/tekrar kayıtları
    let curDay = null;

    // === KAYDETME ===
    function saveAll() {
        localStorage.setItem("fitness_data", JSON.stringify(data));
        localStorage.setItem("fitness_done", JSON.stringify(done));
        localStorage.setItem("fitness_logs", JSON.stringify(setLogs));
    }

    function loadAll() {
        let d = localStorage.getItem("fitness_data");
        if (d) data = JSON.parse(d);
        let dn = localStorage.getItem("fitness_done");
        if (dn) done = JSON.parse(dn);
        let lg = localStorage.getItem("fitness_logs");
        if (lg) setLogs = JSON.parse(lg);
    }

    // === TOAST MESAJI ===
    function toast(msg) {
        let t = document.createElement("div");
        t.className = "toast";
        t.innerText = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 1500);
    }

    // === ANA EKRAN ===
    function getDayStats(day) {
        let items = data[day] || [];
        let total = 0, comp = 0;
        items.forEach((item, idx) => {
            if (typeof item === "string") {
                total++;
                if (done[day + "|" + idx]) comp++;
            } else if (item.ex) {
                for (let s = 1; s <= item.sets; s++) {
                    total++;
                    if (done[day + "|set|" + item.ex + "|" + s]) comp++;
                }
            }
        });
        return { total, comp, pct: total === 0 ? 0 : Math.round(comp / total * 100) };
    }

    function buildHome() {
        let grid = document.getElementById("daysGrid");
        if (!grid) return;
        grid.innerHTML = "";
        for (let day in data) {
            let stats = getDayStats(day);
            let card = document.createElement("div");
            card.className = "day-card";
            card.innerHTML = `
                <div class="day-name">${day}</div>
                <div class="progress-bar"><div class="progress-fill" style="width: ${stats.pct}%"></div></div>
                <div>${stats.comp}/${stats.total} tamamlandı</div>
            `;
            card.onclick = () => openDay(day);
            grid.appendChild(card);
        }
    }

    // === GÜN SAYFASI ===
    function openDay(day) {
        curDay = day;
        document.getElementById("dayTitle").innerText = day;
        renderDayItems();
        document.getElementById("dayPage").classList.add("active");
        document.getElementById("homePage").style.display = "none";
    }

    function closeDay() {
        document.getElementById("dayPage").classList.remove("active");
        document.getElementById("homePage").style.display = "block";
        buildHome();
        curDay = null;
    }

    // === TAŞIMA FONKSİYONLARI (EGZERSİZ + SETLER) ===
    function moveExerciseUp(day, idx) {
        if (idx > 0) {
            let temp = data[day][idx];
            data[day][idx] = data[day][idx - 1];
            data[day][idx - 1] = temp;
            saveAll();
            renderDayItems();
            buildHome();
        }
    }

    function moveExerciseDown(day, idx) {
        if (idx < data[day].length - 1) {
            let temp = data[day][idx];
            data[day][idx] = data[day][idx + 1];
            data[day][idx + 1] = temp;
            saveAll();
            renderDayItems();
            buildHome();
        }
    }

    // Yemek/su için taşıma
    function moveItemUp(day, idx) {
        if (idx > 0) {
            let temp = data[day][idx];
            data[day][idx] = data[day][idx - 1];
            data[day][idx - 1] = temp;
            saveAll();
            renderDayItems();
            buildHome();
        }
    }

    function moveItemDown(day, idx) {
        if (idx < data[day].length - 1) {
            let temp = data[day][idx];
            data[day][idx] = data[day][idx + 1];
            data[day][idx + 1] = temp;
            saveAll();
            renderDayItems();
            buildHome();
        }
    }

    // === GÜN İÇİNDEKİ ÖĞELERİ GÖSTER ===
    function renderDayItems() {
        let container = document.getElementById("dayItems");
        if (!container || !curDay) return;
        container.innerHTML = "";
        let items = data[curDay] || [];

        items.forEach((item, idx) => {
            if (typeof item === "string") {
                // YEMEK / SU
                let div = document.createElement("div");
                div.className = "item";
                let doneKey = curDay + "|" + idx;
                if (done[doneKey]) div.style.opacity = "0.5";

                div.innerHTML = `
                    <div class="move-buttons">
                        <button class="move-btn" onclick="moveItemUp('${curDay}', ${idx})">⬆</button>
                        <button class="move-btn" onclick="moveItemDown('${curDay}', ${idx})">⬇</button>
                    </div>
                    <div class="content" style="cursor:pointer">${item}</div>
                `;
                div.querySelector(".content").onclick = () => {
                    if (done[doneKey]) delete done[doneKey];
                    else done[doneKey] = true;
                    saveAll();
                    renderDayItems();
                    buildHome();
                };
                container.appendChild(div);
            } 
            else if (item.ex) {
                // EGZERSİZ (tüm setleriyle birlikte taşınabilir)
                let exDiv = document.createElement("div");
                exDiv.className = "exercise";
                exDiv.innerHTML = `
                    <div class="move-buttons">
                        <button class="move-btn" onclick="moveExerciseUp('${curDay}', ${idx})">⬆</button>
                        <button class="move-btn" onclick="moveExerciseDown('${curDay}', ${idx})">⬇</button>
                    </div>
                    <div class="content">
                        <strong>💪 ${item.ex}</strong> (${item.sets} set)
                    </div>
                `;
                container.appendChild(exDiv);

                // Setleri göster
                let setsDiv = document.createElement("div");
                setsDiv.className = "sets";
                for (let s = 1; s <= item.sets; s++) {
                    let setKey = curDay + "|set|" + item.ex + "|" + s;
                    let log = setLogs[curDay]?.[item.ex]?.[s];
                    let info = log ? `${log.reps} x ${log.weight}kg` : "Kaydet";
                    let setEl = document.createElement("div");
                    setEl.className = "set-item";
                    setEl.innerHTML = `<span>Set ${s}</span><span style="cursor:pointer;background:#1a73e8;color:white;padding:2px 8px;border-radius:12px">${info}</span>`;
                    setEl.onclick = () => promptWeightReps(curDay, item.ex, s, log?.weight, log?.reps);
                    if (done[setKey]) setEl.style.opacity = "0.5";
                    setsDiv.appendChild(setEl);
                }
                container.appendChild(setsDiv);
            }
        });
    }

    // === SET KAYDI ===
    function promptWeightReps(day, ex, setNum, oldWeight, oldReps) {
        let w = prompt("Ağırlık (kg):", oldWeight || 0);
        let r = prompt("Tekrar sayısı:", oldReps || 8);
        if (w !== null && r !== null) {
            if (!setLogs[day]) setLogs[day] = {};
            if (!setLogs[day][ex]) setLogs[day][ex] = {};
            setLogs[day][ex][setNum] = { weight: parseFloat(w) || 0, reps: parseInt(r) || 0 };
            let setKey = day + "|set|" + ex + "|" + setNum;
            done[setKey] = true;
            saveAll();
            renderDayItems();
            buildHome();
            toast(`✅ Set ${setNum}: ${r}x${w}kg kaydedildi`);
        }
    }

    // === YENİ ÖĞE EKLE ===
    function addNewItem() {
        let type = prompt("Ne eklemek istiyorsun?\n1 - Yemek/Su/Not\n2 - Egzersiz");
        if (type === "1") {
            let text = prompt("Yemek/Su/Not metni:");
            if (text) {
                data[curDay].push(text);
                saveAll();
                renderDayItems();
                buildHome();
                toast("✅ Eklendi");
            }
        } else if (type === "2") {
            let exName = prompt("Egzersiz adı:");
            let sets = parseInt(prompt("Set sayısı:"));
            if (exName && sets > 0) {
                data[curDay].push({ ex: exName, sets: sets });
                saveAll();
                renderDayItems();
                buildHome();
                toast(`✅ ${exName} eklendi`);
            }
        } else {
            toast("Geçersiz seçim");
        }
    }

    // === BAŞLAT ===
    loadAll();
    buildHome();

    // Global fonksiyonları tanımla (butonlar için)
    window.moveItemUp = moveItemUp;
    window.moveItemDown = moveItemDown;
    window.moveExerciseUp = moveExerciseUp;
    window.moveExerciseDown = moveExerciseDown;
    window.openDay = openDay;
    window.closeDay = closeDay;
    window.addNewItem = addNewItem;
    window.promptWeightReps = promptWeightReps;
</script>

</body>
</html>
