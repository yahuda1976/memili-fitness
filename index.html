<!DOCTYPE html><html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Haftalık Fitness Takip</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .day {
      background: #1c1c1c;
      margin-bottom: 15px;
      border-radius: 12px;
      padding: 15px;
    }
    .day h2 {
      margin: 0 0 10px 0;
      color: #00ff99;
    }
    .item {
      padding: 8px;
      margin: 5px 0;
      background: #2a2a2a;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
      user-select: none;
    }
    .item.done {
      opacity: 0.4;
      text-decoration: line-through;
      background: #004d3a;
    }
    .section-title {
      margin-top: 10px;
      font-weight: bold;
      color: #00c2ff;
    }
  </style>
</head>
<body><h1>💪 Haftalık Fitness & Beslenme Takip</h1><div id="app"></div><script>
const data = {
  "Pazartesi - Göğüs + Triceps": [
    "07:00 Kahve + Omega-3",
    "07:30 Skyr + chia + muz",
    "09:30 Yoğurt",
    "12:30 Ton balığı + lavaş",
    "14:00 Pirinç + tavuk",
    "14:45 Whey",
    "15:30 Kahve + EAA",
    "18:00 Yoğurt + muz",
    "19:30 Göğüs + Triceps antrenman",
    "21:00 Whey + skyr + yulaf",
    "22:30 Skyr"
  ],
  "Salı - Sırt + Biceps": [
    "07:00 Kahve + Omega-3",
    "07:30 Skyr + muz",
    "09:30 Yoğurt",
    "12:30 Ton balığı + lavaş",
    "14:00 Pirinç + tavuk",
    "14:45 Whey",
    "15:30 Kahve + EAA",
    "18:00 Skyr + meyve",
    "19:30 Sırt + Biceps antrenman",
    "21:00 Whey + skyr + yulaf",
    "22:30 Skyr"
  ],
  "Çarşamba - Dinlenme": [
    "07:30 Skyr + muz",
    "09:30 Yoğurt",
    "12:30 Ton balığı + lavaş",
    "14:00 Tavuk + pirinç",
    "18:00 Skyr",
    "20:00 Et + salata",
    "22:30 Skyr"
  ],
  "Perşembe - Bacak": [
    "07:00 Kahve + Omega-3",
    "07:30 Skyr + muz",
    "09:30 Yoğurt",
    "12:30 Ton balığı + lavaş",
    "14:00 Pirinç + tavuk",
    "14:45 Whey",
    "15:30 Kahve + EAA",
    "18:00 Yoğurt + muz",
    "19:30 Bacak antrenman",
    "21:00 Whey + skyr + yulaf",
    "22:30 Skyr"
  ],
  "Cuma - Omuz + Triceps": [
    "07:00 Kahve + Omega-3",
    "07:30 Skyr + chia",
    "09:30 Yoğurt",
    "12:30 Ton balığı + lavaş",
    "14:00 Pirinç + kebap",
    "14:45 Whey",
    "15:30 Kahve + EAA",
    "18:00 Skyr + muz",
    "19:30 Omuz + Triceps antrenman",
    "21:00 Whey + skyr + yulaf",
    "22:30 Skyr"
  ],
  "Cumartesi - Aktif": [
    "07:30 Skyr + muz",
    "09:30 Yoğurt",
    "12:30 Ton balığı + lavaş",
    "14:00 Tavuk + pirinç",
    "18:00 Skyr",
    "20:00 Et + salata",
    "22:30 Skyr"
  ],
  "Pazar - Dinlenme": [
    "08:00 Kahve + Omega-3",
    "08:30 Skyr + muz",
    "11:00 Yoğurt",
    "14:00 Tavuk + pirinç",
    "18:00 Skyr",
    "20:00 Et + salata",
    "22:30 Skyr"
  ]
};

const app = document.getElementById("app");

Object.entries(data).forEach(([day, items]) => {
  const dayDiv = document.createElement("div");
  dayDiv.className = "day";

  const title = document.createElement("h2");
  title.textContent = day;
  dayDiv.appendChild(title);

  items.forEach(text => {
    const div = document.createElement("div");
    div.className = "item";
    div.textContent = text;

    div.addEventListener("click", () => {
      div.classList.toggle("done");
    });

    dayDiv.appendChild(div);
  });

  app.appendChild(dayDiv);
});
</script></body>
</html>
