<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MEMILI FITNESS V5 🚀 PRO MAX SYSTEM</title>
<style>
body{margin:0;font-family:Arial;background:#121212;color:#fff;padding:10px}
h2{text-align:center;color:#ff4500}
.topbar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.btn{padding:10px;border:none;border-radius:10px;cursor:pointer}
.daybtn{background:#1e1e1e;color:#fff}
.active{background:#ff4500}
.card{background:#1e1e1e;padding:10px;border-radius:10px;margin:10px 0;border-left:4px solid #ff4500}
.small{color:#aaa;font-size:12px}
.setrow{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.set{padding:6px 10px;border-radius:8px;background:#333;cursor:pointer;font-size:12px}
.set.done{background:#2ecc71}
.stats{background:#1e1e1e;padding:10px;border-radius:10px;margin:10px 0;text-align:center}
canvas{background:#1e1e1e;border-radius:10px;margin-top:10px}
</style>
</head>
<body><h2>MEMILI FITNESS V5 🚀 PRO MAX</h2><div class="topbar" id="days"></div><div class="stats" id="stats">📊 Loading...</div><canvas id="chart" height="120"></canvas>

<h3 id="title"></h3>
<div id="timeline"></div><script>
const days=[
{
name:"Pazartesi",
exercises:[
{name:"Dumbbell Bench Press",sets:4},
{name:"Incline Press",sets:4},
{name:"Chest Fly",sets:3},
{name:"Triceps Pushdown",sets:4}
]
},
{
name:"Salı",
exercises:[
{name:"Lat Pulldown",sets:4},
{name:"One Arm Row",sets:4},
{name:"Seated Row",sets:3},
{name:"Biceps Curl",sets:3}
]
},
{
name:"Çarşamba",
exercises:[
{name:"Shoulder Press",sets:4},
{name:"Lateral Raise",sets:4},
{name:"Rear Delt",sets:3}
]
},
{
name:"Perşembe",
exercises:[
{name:"Walking",sets:1}]
},
{
name:"Cuma",
exercises:[
{name:"Incline Press",sets:4},
{name:"Flat Press",sets:4},
{name:"Dip",sets:3}
]
},
{
name:"Cumartesi",
exercises:[
{name:"Leg Press",sets:4},
{name:"Leg Curl",sets:3},
{name:"Lunge",sets:3}
]
},
{
name:"Pazar",
exercises:[
{name:"Rest",sets:1}]
}
];

let current=0;
let db=JSON.parse(localStorage.getItem("v5")||"{}");

function save(){localStorage.setItem("v5",JSON.stringify(db));updateStats();drawChart();}

function renderDays(){
let d=document.getElementById("days");
d.innerHTML="";
days.forEach((x,i)=>{
let b=document.createElement("button");
b.innerText=x.name;
b.className="btn daybtn"+(i===current?" active":"");
b.onclick=()=>{current=i;render()};
d.appendChild(b);
});
}

function toggleSet(dayIndex,exIndex,setIndex){
let key=days[dayIndex].name;
if(!db[key])db[key]={};
if(!db[key][exIndex])db[key][exIndex]={};
db[key][exIndex][setIndex]=!db[key][exIndex][setIndex];
save();
render();
}

function render(){
let day=days[current];
document.getElementById("title").innerText=day.name+" ANTR.ÖZET";
let t=document.getElementById("timeline");
t.innerHTML="";
let saved=db[day.name]||{};

day.exercises.forEach((ex,ei)=>{
let div=document.createElement("div");
div.className="card";

let setHTML="<div class='setrow'>";
for(let s=0;s<ex.sets;s++){
let done=saved?.[ei]?.[s];
setHTML+=`<div class='set ${done?"done":""}' onclick='toggleSet(${current},${ei},${s})'>S${s+1}</div>`;
}
setHTML+="</div>";

div.innerHTML=`<b>${ex.name}</b><div class='small'>Set: ${ex.sets}</div>${setHTML}`;
t.appendChild(div);
});
}

function updateStats(){
let total=0,done=0;
for(let d in db){
for(let e in db[d]){
for(let s in db[d][e]){
total++;
if(db[d][e][s])done++;
}
}
}
let pct=total?Math.round((done/total)*100):0;
document.getElementById("stats").innerText=`📊 Completion: %${pct} | Total sets: ${done}/${total}`;
}

function drawChart(){
let c=document.getElementById("chart");
let ctx=c.getContext("2d");
ctx.clearRect(0,0,c.width,c.height);

let vals=days.map(d=>{
let total=0,done=0;
let s=db[d.name]||{};
(d.exercises||[]).forEach((ex,ei)=>{
for(let i=0;i<ex.sets;i++){
total++;
if(s?.[ei]?.[i])done++;
}
});
return total?done/total:0;
});

ctx.fillStyle="#ff4500";
vals.forEach((v,i)=>{
ctx.fillRect(i*40+10,100,20,-v*80);
});
}

renderDays();render();updateStats();drawChart();
</script></body>
</html>
