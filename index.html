<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memili Fitness Pro</title><style>
body {
  font-family: Arial;
  background: #111;
  color: white;
}

h1 {
  text-align: center;
}

.day {
  background: #eee;
  color: black;
  margin: 15px;
  padding: 15px;
  border-radius: 15px;
}

.task {
  background: #ddd;
  padding: 10px;
  margin: 8px 0;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
}

.done {
  text-decoration: line-through;
  opacity: 0.5;
}
</style></head><body><h1>🔥 MEMİLİ FITNESS PRO</h1><div id="app"></div><script>

const days = [
  {
    name: "Pazartesi",
    tasks: ["Yulaf + whey", "2L Su", "Göğüs Antrenmanı", "Whey"]
  },
  {
    name: "Salı",
    tasks: ["Ton balığı", "2L Su", "Sırt Antrenmanı", "Whey"]
  },
  {
    name: "Çarşamba",
    tasks: ["Yumurta + Peynir", "2L Su", "Omuz + Biceps", "Whey"]
  },
  {
    name: "Perşembe",
    tasks: ["Tavuk + Pilav", "2L Su", "Dinlenme", "Yürüyüş"]
  },
  {
    name: "Cuma",
    tasks: ["Yulaf + whey", "2L Su", "Göğüs + Triceps", "Whey"]
  },
  {
    name: "Cumartesi",
    tasks: ["Ton balığı", "2L Su", "Sırt", "Whey"]
  },
  {
    name: "Pazar",
    tasks: ["Serbest Gün", "Hafif yürüyüş", "Esneme"]
  }
];

const app = document.getElementById("app");

days.forEach((day, dIndex) => {
  const dayDiv = document.createElement("div");
  dayDiv.className = "day";

  const title = document.createElement("h2");
  title.innerText = day.name;
  dayDiv.appendChild(title);

  day.tasks.forEach((task, tIndex) => {
    const taskDiv = document.createElement("div");
    taskDiv.className = "task";

    const span = document.createElement("span");
    span.innerText = task;

    const btn = document.createElement("button");
    btn.innerText = "✔";

    // kayıt sistemi
    const key = dIndex + "-" + tIndex;
    if (localStorage.getItem(key) === "done") {
      span.classList.add("done");
    }

    btn.onclick = () => {
      span.classList.toggle("done");

      if (span.classList.contains("done")) {
        localStorage.setItem(key, "done");
      } else {
        localStorage.removeItem(key);
      }
    };

    taskDiv.appendChild(span);
    taskDiv.appendChild(btn);

    dayDiv.appendChild(taskDiv);
  });

  app.appendChild(dayDiv);
});

</script></body>
</html>
