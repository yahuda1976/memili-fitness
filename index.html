<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Fitness Pro Ultimate 🔥</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
    color: #fff;
    min-height: 100vh;
    padding-bottom: 220px;
}

.app-header {
    background: linear-gradient(135deg, #00ffc3 0%, #00b894 100%);
    padding: 20px;
    text-align: center;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,255,195,0.2);
}
.app-header h1 {
    font-size: 1.8rem;
    letter-spacing: 2px;
}
.mode-toggle {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(0,0,0,0.3);
    border: none;
    border-radius: 30px;
    padding: 8px 15px;
    cursor: pointer;
    color: white;
    font-weight: bold;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 16px;
    padding: 20px;
    max-width: 800px;
    margin: 0 auto;
}
.card {
    background: linear-gradient(145deg, #2a2a3e, #1e1e2e);
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    border: 1px solid rgba(0,255,195,0.2);
}
.card:hover {
    transform: translateY(-5px);
    border-color: #00ffc3;
    box-shadow: 0 10px 30px rgba(0,255,195,0.2);
}
.card h3 {
    font-size: 1.3rem;
    margin-bottom: 10px;
    color: #00ffc3;
}
.progress-bar {
    width: 100%;
    height: 8px;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 10px;
}
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #00ffc3, #00b894);
    transition: width 0.3s;
}

.day-view {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: #0f0f1a;
    z-index: 1000;
    overflow-y: auto;
    padding-bottom: 100px;
}
.day-header {
    background: linear-gradient(135deg, #00ffc3, #00b894);
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
}
.back-btn {
    background: rgba(0,0,0,0.3);
    border: none;
    padding: 10px 20px;
    border-radius: 30px;
    color: white;
    font-size: 1rem;
    cursor: pointer;
}
.day-title {
    font-size: 1.8rem;
    font-weight: bold;
}
.item, .set {
    background: #1e1e2e;
    margin: 12px;
    padding: 16px;
    border-radius: 16px;
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.item:active, .set:active { transform: scale(0.98); }
.item.done, .set.done {
    background: linear-gradient(135deg, #00b89444, #00ffc344);
    text-decoration: line-through;
    opacity: 0.8;
}
.ex-title {
    color: #00ffc3;
    font-size: 1.2rem;
    margin: 15px 12px 5px;
    font-weight: bold;
    padding-left: 8px;
    border-left: 4px solid #00ffc3;
}

.bottom-quest {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
    border-top: 2px solid #00ffc3;
    padding: 15px 20px;
    z-index: 100;
    box-shadow: 0 -5px 30px rgba(0,255,195,0.1);
}
.quest-title {
    font-size: 1.2rem;
    font-weight: bold;
    text-align: center;
    margin-bottom: 12px;
    color: #00ffc3;
}
.quest-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 12px;
}
.quest-item {
    text-align: center;
    background: #2a2a3e;
    padding: 10px;
    border-radius: 16px;
}
.quest-icon {
    font-size: 1.8rem;
}
.quest-progress {
    font-size: 1rem;
    font-weight: bold;
    margin-top: 5px;
}
.daily-score {
    text-align: center;
    margin-top: 10px;
    font-size: 1rem;
}
.score-bar {
    width: 100%;
    height: 10px;
    background: #333;
    border-radius: 10px;
    margin-top: 8px;
    overflow: hidden;
}
.score-fill {
    height: 100%;
    background: linear-gradient(90deg, #ffd700, #ffaa00);
    transition: width 0.3s;
}

.stats-panel {
    background: #1a1a2e;
    margin: 20px;
    padding: 20px;
    border-radius: 20px;
    border: 1px solid #00ffc3;
}
.stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 12px;
}
.stat-card {
    text-align: center;
    background: #2a2a3e;
    padding: 12px;
    border-radius: 16px;
}
.chart-bars {
    margin-top: 20px;
}
.chart-bar-item {
    margin: 8px 0;
    display: flex;
    align-items: center;
    gap: 10px;
}
.bar-label {
    width: 50px;
    font-size: 0.8rem;
}
.bar-fill {
    flex: 1;
    height: 25px;
    background: #333;
    border-radius: 12px;
    overflow: hidden;
}
.bar {
    height: 100%;
    background: linear-gradient(90deg, #00ffc3, #00b894);
    transition: width 0.5s;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 8px;
    color: #000;
    font-weight: bold;
    font-size: 0.8rem;
}
.badges {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}
.badge {
    background: linear-gradient(135deg, #ffd700, #ffaa00);
    padding: 6px 14px;
    border-radius: 30px;
    font-size: 0.8rem;
    font-weight: bold;
    color: #000;
}
.toast {
    position: fixed;
    bottom: 30%;
    left: 50%;
    transform: translateX(-50%);
    background: #00ffc3;
    color: #000;
    padding: 12px 24px;
    border-radius: 50px;
    font-weight: bold;
    z-index: 2000;
    animation: fadeOut 1.5s forwards;
}
@keyframes fadeOut {
    0% { opacity: 1; bottom: 30%; }
    70% { opacity: 1; }
    100% { opacity: 0; bottom: 40%; display: none; }
}
.hidden { display: none; }
.timer-box {
    position: fixed;
    bottom: 200px;
    right: 20px;
    background: #0a0a0a;
    border: 2px solid #00ffc3;
    border-radius: 20px;
    padding: 15px;
    text-align: center;
    z-index: 200;
    min-width: 130px;
}
.timer-num {
    font-size: 32px;
    font-weight: bold;
    font-family: monospace;
}
.timer-buttons {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    justify-content: center;
}
.timer-btn {
    background: #2a2a3e;
    border: none;
    padding: 5px 10px;
    border-radius: 20px;
    color: #00ffc3;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="app-header">
    <h1>🔥 FITNESS PRO ULTIMATE</h1>
    <button class="mode-toggle" id="soundToggle">🔊 Ses Açık</button>
</div>

<div id="homeGrid" class="grid"></div>

<div id="statsPanel" class="stats-panel">
    <h3>📊 Haftalık İlerleme</h3>
    <div class="stats-grid">
        <div class="stat-card">🏋️ Toplam Set<br><span id="totalSets">0</span></div>
        <div class="stat-card">💧 Toplam Su<br><span id="totalWater">0</span> bardak</div>
        <div class="stat-card">⭐ En İyi Gün<br><span id="bestDay">-</span></div>
        <div class="stat-card">🔥 Toplam XP<br><span id="totalXP">0</span></div>
    </div>
    <div id="weeklyChart" class="chart-bars"></div>
    <div id="badgesContainer" class="badges"></div>
</div>

<div id="dayView" class="day-view hidden">
    <div class="day-header">
        <button class="back-btn" onclick="closeDay()">← Geri</button>
        <div class="day-title" id="dayTitle"></div>
        <div style="width: 60px;"></div>
    </div>
    <div id="dayItems"></div>
</div>

<div class="bottom-quest">
    <div class="quest-title">✨ GÜNLÜK GÖREVLER ✨</div>
    <div class="quest-grid">
        <div class="quest-item"><div class="quest-icon">💧</div><div class="quest-progress" id="questWater">0/8</div></div>
        <div class="quest-item"><div class="quest-icon">🍽️</div><div class="quest-progress" id="questMeal">0/12</div></div>
        <div class="quest-item"><div class="quest-icon">🏋️</div><div class="quest-progress" id="questSet">0/20</div></div>
        <div class="quest-item"><div class="quest-icon">⭐</div><div class="quest-progress" id="questScore">0/100</div></div>
    </div>
    <div class="daily-score">🎯 Günlük Puan: <span id="dailyScoreText">0</span>/100
        <div class="score-bar"><div class="score-fill" id="scoreFill" style="width:0%"></div></div>
    </div>
</div>

<div id="timerBox" class="timer-box" style="display:none;">
    <div class="timer-num" id="timerNum">90</div>
    <div>⏱️ Dinlenme</div>
    <div class="timer-buttons">
        <button class="timer-btn" onclick="stopTimer()">Kapat</button>
        <button class="timer-btn" onclick="customTimer()">Ayarla</button>
    </div>
</div>

<script>
// ==================== ORİJİNAL İÇERİK (TAMAMI) ====================
const data = {
"Pazartesi":["07:00 Kahve + Omega-3","💧 2 bardak","07:30 Skyr 500g + chia + keten","1 muz","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı + lavaş + zeytinyağı","💧 2 bardak","14:00 Pirinç + tavuk/kebap + salata","💧 2 bardak","14:45 Whey","15:30 Kahve + EAA","💧 2 bardak","18:00 Yoğurt + muz","💧 2 bardak","🏋️ GÖĞÜS + TRİCEPS",{ex:"Dumbbell Bench Press",sets:4},{ex:"Incline Dumbbell Press",sets:4},{ex:"Dumbbell Fly",sets:3},{ex:"Cable Crossover",sets:3},{ex:"Rope Pushdown",sets:4},{ex:"Overhead DB Extension",sets:3},{ex:"Dips",sets:3},"💧 2 bardak","21:00 Whey + skyr + yulaf","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
"Salı":["07:00 Kahve + Omega-3","💧 2 bardak","07:30 Skyr + muz + chia","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı + lavaş","💧 2 bardak","14:00 Pirinç + tavuk","💧 2 bardak","14:45 Whey","15:30 Kahve + EAA","💧 2 bardak","18:00 Skyr + meyve","💧 2 bardak","🏋️ SIRT + BİCEPS",{ex:"Lat Pulldown",sets:4},{ex:"Seated Row",sets:4},{ex:"Dumbbell Row",sets:3},{ex:"Straight Arm Pulldown",sets:3},{ex:"Face Pull",sets:3},{ex:"DB Curl",sets:4},{ex:"Hammer Curl",sets:3},{ex:"Incline Curl",sets:3},"💧 2 bardak","21:00 Whey + skyr + yulaf","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
"Çarşamba":["07:30 Skyr + keten + muz","💧 2 bardak","09:30 Yoğurt + meyve","💧 2 bardak","12:30 Ton balığı + lavaş","💧 2 bardak","14:00 Tavuk + az pirinç","💧 2 bardak","18:00 Skyr","💧 2 bardak","20:00 Et + salata + zeytinyağı","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
"Perşembe":["07:00 Kahve + Omega-3","💧 2 bardak","07:30 Skyr + muz","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı + lavaş","💧 2 bardak","14:00 Pirinç + tavuk","💧 2 bardak","14:45 Whey","15:30 Kahve + EAA","💧 2 bardak","18:00 Yoğurt + muz","💧 2 bardak","🏋️ BACAK",{ex:"Leg Press",sets:4},{ex:"Squat",sets:3},{ex:"Leg Curl",sets:3},{ex:"Leg Extension",sets:3},{ex:"Calf Raise",sets:4},"💧 2 bardak","21:00 Whey + skyr + yulaf","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
"Cuma":["07:00 Kahve + Omega-3","💧 2 bardak","07:30 Skyr + chia","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı + lavaş","💧 2 bardak","14:00 Pirinç + kebap","💧 2 bardak","14:45 Whey","15:30 Kahve + EAA","💧 2 bardak","18:00 Skyr + muz","💧 2 bardak","🏋️ OMUZ + TRİCEPS",{ex:"Shoulder Press",sets:4},{ex:"Lateral Raise",sets:4},{ex:"Rear Delt Fly",sets:3},{ex:"Upright Row",sets:3},{ex:"Pushdown",sets:3},{ex:"Dips",sets:2},"💧 2 bardak","21:00 Whey + skyr + yulaf","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
"Cumartesi":["07:30 Skyr + muz","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı + lavaş","💧 2 bardak","14:00 Tavuk + pirinç","💧 2 bardak","18:00 Skyr","💧 2 bardak","20:00 Et + salata","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
"Pazar":["08:00 Kahve + Omega-3","💧 2 bardak","08:30 Skyr + muz","💧 2 bardak","11:00 Yoğurt + meyve","💧 2 bardak","14:00 Tavuk + az pirinç","💧 2 bardak","18:00 Skyr","💧 2 bardak","20:00 Et + salata","💧 2 bardak","22:30 Skyr","💧 2 bardak","🧘 AKTİF DİNLENME (Yürüyüş / Esneme)"]
};

// ==================== DEĞİŞKENLER ====================
let doneState = {};
let waterIntake = {};
let totalSetCount = 0;
let soundEnabled = true;
let currentTimer = null;
let timerActive = false;
let currentDayOpen = null;

// ==================== TIMER FONKSİYONLARI ====================
function beep() {
    if(!soundEnabled) return;
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.connect(ctx.destination);
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, 200);
    } catch(e) {}
}

function stopTimer() {
    if(currentTimer) clearInterval(currentTimer);
    timerActive = false;
    document.getElementById("timerBox").style.display = "none";
}

function startTimer(seconds) {
    stopTimer();
    let timerSeconds = seconds;
    const timerBox = document.getElementById("timerBox");
    const timerNum = document.getElementById("timerNum");
    timerBox.style.display = "block";
    timerNum.innerText = timerSeconds;
    timerActive = true;
    currentTimer = setInterval(() => {
        if(timerSeconds <= 1) {
            stopTimer();
            beep();
            showToast("🔔 Dinlenme bitti! Devam et! 🔥");
        } else {
            timerSeconds--;
            timerNum.innerText = timerSeconds;
        }
    }, 1000);
}

function customTimer() {
    let sec = prompt("Dinlenme süresi (saniye):", "90");
    if(sec && !isNaN(parseInt(sec)) && parseInt(sec) > 0) {
        startTimer(parseInt(sec));
    }
}

// ==================== LOCALSTORAGE ====================
function loadData() {
    let saved = localStorage.getItem("fitnessDoneUltimate");
    if(saved) doneState = JSON.parse(saved);
    let savedWater = localStorage.getItem("fitnessWaterUltimate");
    if(savedWater) waterIntake = JSON.parse(savedWater);
    let savedSets = localStorage.getItem("fitnessSetsUltimate");
    if(savedSets) totalSetCount = JSON.parse(savedSets);
}

function saveData() {
    localStorage.setItem("fitnessDoneUltimate", JSON.stringify(doneState));
    localStorage.setItem("fitnessWaterUltimate", JSON.stringify(waterIntake));
    localStorage.setItem("fitnessSetsUltimate", JSON.stringify(totalSetCount));
}

// ==================== GÜN İSTATİSTİKLERİ ====================
function getDayStats(day) {
    let total = 0, completed = 0;
    const items = data[day];
    items.forEach((item, idx) => {
        if(typeof item === "string") {
            total++;
            if(doneState[`${day}|meal|${idx}`]) completed++;
        } else if(item && typeof item === "object" && item.sets) {
            for(let s = 1; s <= item.sets; s++) {
                total++;
                if(doneState[`${day}|set|${item.ex}|${s}`]) completed++;
            }
        }
    });
    return { total, completed, percent: total === 0 ? 0 : (completed/total)*100 };
}

// ==================== ANA EKRAN ====================
function buildHome() {
    const grid = document.getElementById("homeGrid");
    grid.innerHTML = "";
    Object.keys(data).forEach(day => {
        const stats = getDayStats(day);
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <h3>${day}</h3>
            <div class="progress-bar"><div class="progress-fill" style="width:${stats.percent}%"></div></div>
            <small>${stats.completed}/${stats.total} tamamlandı</small>
        `;
        card.onclick = () => openDay(day);
        grid.appendChild(card);
    });
}

// ==================== GÜN GÖRÜNÜMÜ ====================
function openDay(day) {
    currentDayOpen = day;
    document.getElementById("homeGrid").style.display = "none";
    document.getElementById("statsPanel").style.display = "none";
    document.getElementById("dayView").classList.remove("hidden");
    document.getElementById("dayTitle").innerText = day;
    renderDayItems(day);
}

function closeDay() {
    stopTimer();
    document.getElementById("dayView").classList.add("hidden");
    document.getElementById("homeGrid").style.display = "grid";
    document.getElementById("statsPanel").style.display = "block";
    updateAllStats();
    buildHome();
}

function renderDayItems(day) {
    const container = document.getElementById("dayItems");
    container.innerHTML = "";
    const items = data[day];
    
    items.forEach((item, idx) => {
        if(typeof item === "string") {
            const div = document.createElement("div");
            div.className = "item";
            div.innerHTML = `<span>${item}</span>`;
            const key = `${day}|meal|${idx}`;
            if(doneState[key]) div.classList.add("done");
            
            div.onclick = () => {
                if(doneState[key]) {
                    delete doneState[key];
                    div.classList.remove("done");
                    showToast("❌ İşaret kaldırıldı");
                } else {
                    doneState[key] = true;
                    div.classList.add("done");
                    showToast(item.includes("💧") ? "💧 +2 bardak su!" : "✅ Tamamlandı!");
                    if(item.includes("💧")) {
                        const waterKey = `${day}_water`;
                        waterIntake[waterKey] = (waterIntake[waterKey] || 0) + 2;
                    }
                }
                saveData();
                updateQuests(day);
                updateAllStats();
                buildHome();
            };
            container.appendChild(div);
        } 
        else if(item && typeof item === "object" && item.ex) {
            const title = document.createElement("div");
            title.className = "ex-title";
            title.innerText = `💪 ${item.ex}`;
            container.appendChild(title);
            
            for(let s = 1; s <= item.sets; s++) {
                const setDiv = document.createElement("div");
                setDiv.className = "set";
                setDiv.innerHTML = `<span>Set ${s}</span><span style="font-size:12px;">⏱️ Dinlenme</span>`;
                const setKey = `${day}|set|${item.ex}|${s}`;
                if(doneState[setKey]) setDiv.classList.add("done");
                
                setDiv.onclick = () => {
                    if(doneState[setKey]) {
                        delete doneState[setKey];
                        setDiv.classList.remove("done");
                        totalSetCount--;
                        showToast("❌ Set iptal edildi");
                    } else {
                        doneState[setKey] = true;
                        setDiv.classList.add("done");
                        totalSetCount++;
                        showToast(`✅ Set ${s} tamamlandı! +30 XP 🔥`);
                        startTimer(90);
                    }
                    saveData();
                    updateQuests(day);
                    updateAllStats();
                    buildHome();
                };
                container.appendChild(setDiv);
            }
        }
    });
    updateQuests(day);
}

// ==================== GÖREV VE PUAN SİSTEMİ ====================
function updateQuests(day) {
    let water = 0, meals = 0, sets = 0;
    
    Object.keys(doneState).forEach(key => {
        if(key.includes(day)) {
            if(key.includes("meal")) {
                meals++;
                const idx = parseInt(key.split("|")[2]);
                const itemText = data[day][idx];
                if(typeof itemText === "string" && itemText.includes("💧")) water += 2;
            }
            if(key.includes("set")) sets++;
        }
    });
    
    const waterKey = `${day}_water`;
    const totalWater = (waterIntake[waterKey] || 0) + water;
    
    document.getElementById("questWater").innerHTML = `${Math.min(totalWater,8)}/8`;
    document.getElementById("questMeal").innerHTML = `${Math.min(meals,12)}/12`;
    document.getElementById("questSet").innerHTML = `${Math.min(sets,20)}/20`;
    
    let score = Math.min(totalWater * 5 + meals * 3 + sets * 2, 100);
    document.getElementById("dailyScoreText").innerText = score;
    document.getElementById("scoreFill").style.width = score + "%";
}

// ==================== TÜM İSTATİSTİKLER ====================
function updateAllStats() {
    let totalSets = totalSetCount;
    let totalWater = 0;
    Object.values(waterIntake).forEach(v => totalWater += v);
    
    let bestDayScore = 0, bestDayName = "";
    Object.keys(data).forEach(day => {
        let dayScore = 0;
        Object.keys(doneState).forEach(key => {
            if(key.includes(day)) {
                if(key.includes("set")) dayScore += 2;
                if(key.includes("meal")) dayScore += 1;
            }
        });
        if(dayScore > bestDayScore) { bestDayScore = dayScore; bestDayName = day; }
    });
    
    document.getElementById("totalSets").innerText = totalSets;
    document.getElementById("totalWater").innerText = totalWater;
    document.getElementById("bestDay").innerText = bestDayName || "-";
    document.getElementById("totalXP").innerText = totalSets * 30;
    
    // Rozetler
    const badgesDiv = document.getElementById("badgesContainer");
    let badges = [];
    if(totalSets >= 20) badges.push("🔥 Alev Rozeti");
    if(totalSets >= 50) badges.push("💪 Demir Rozet");
    if(totalSets >= 100) badges.push("👑 Efsane Rozeti");
    if(totalSets >= 200) badges.push("⚡ Spor Tanrısı");
    if(badges.length === 0) badges.push("🔒 20 set yaparak ilk rozeti kazan!");
    badgesDiv.innerHTML = badges.map(b => `<div class="badge">${b}</div>`).join('');
    
    // Haftalık grafik
    const chartDiv = document.getElementById("weeklyChart");
    chartDiv.innerHTML = "<h4>📈 Haftalık Set Grafiği</h4>";
    Object.keys(data).forEach(day => {
        let setsDone = 0;
        Object.keys(doneState).forEach(key => {
            if(key.includes(day) && key.includes("set")) setsDone++;
        });
        const maxSets = 25;
        const width = Math.min((setsDone / maxSets) * 100, 100);
        chartDiv.innerHTML += `
            <div class="chart-bar-item">
                <div class="bar-label">${day}</div>
                <div class="bar-fill"><div class="bar" style="width:${width}%">${setsDone}</div></div>
            </div>
        `;
    });
}

// ==================== TOAST VE SES ====================
function showToast(msg) {
    const toast = document.createElement("div");
    toast.className = "toast";
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 1600);
}

function toggleSound() {
    soundEnabled = !soundEnabled;
    const btn = document.getElementById("soundToggle");
    btn.innerText = soundEnabled ? "🔊 Ses Açık" : "🔇 Ses Kapalı";
    showToast(soundEnabled ? "Ses açıldı 🔔" : "Ses kapatıldı 🔇");
}

// ==================== BAŞLAT ====================
loadData();
buildHome();
updateAllStats();
document.getElementById("soundToggle").onclick = toggleSound;
</script>
