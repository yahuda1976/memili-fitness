<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Fitness Pro | Antrenman Takibi</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background: #0a0c0f;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, sans-serif;
            color: #eef5ff;
            padding-bottom: 20px;
        }

        .app-header {
            text-align: center;
            padding: 20px 16px 8px;
        }

        .app-header h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #B2F0E0, #00E0FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0,255,200,0.1);
        }

        .sub {
            font-size: 0.8rem;
            color: #7e8a98;
            margin-top: 6px;
        }

        /* ana grid (gün kartları) */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
            padding: 20px 16px;
        }

        .day-card {
            background: #12161c;
            border-radius: 32px;
            padding: 20px 12px;
            text-align: center;
            font-weight: bold;
            font-size: 1.3rem;
            backdrop-filter: blur(2px);
            transition: all 0.1s ease;
            cursor: pointer;
            border: 1px solid #2a2f36;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            color: #d6e6ff;
        }

        .day-card:active {
            transform: scale(0.96);
            background: #1e2a2f;
            border-color: #00e0ff;
        }

        /* gün detay sayfası */
        .day-detail {
            padding: 16px;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            background: #0f1319;
            padding: 12px 16px;
            border-radius: 48px;
        }

        .back-btn {
            background: #2a1e2c;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 40px;
            color: #ffb347;
            cursor: pointer;
            transition: 0.1s linear;
        }

        .summary-btn {
            background: #16212b;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            color: #7df9ff;
            font-weight: bold;
            cursor: pointer;
        }

        .day-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin: 5px 0 20px;
            background: linear-gradient(120deg, #B9FBC0, #8EECF5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* öğün & su kartları */
        .meal-card, .set-card {
            background: #11161e;
            margin: 12px 0;
            padding: 16px 18px;
            border-radius: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.08s linear;
            border-left: 5px solid #2ecc71;
            box-shadow: 0 3px 6px #00000030;
        }

        .meal-card:active, .set-card:active {
            transform: scale(0.98);
            background: #1d2a2f;
        }

        .meal-card.done, .set-card.done {
            background: #0a2f1f;
            text-decoration: line-through;
            opacity: 0.7;
            border-left-color: #f1c40f;
        }

        .water-badge {
            background: #1f6e8c;
            border-radius: 30px;
            padding: 5px 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .set-info {
            display: flex;
            gap: 12px;
            align-items: baseline;
        }

        .rest-tag {
            background: #2c3e44;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
        }

        .ex-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 24px 0 8px 6px;
            color: #FFD966;
            border-left: 4px solid #00e0ff;
            padding-left: 14px;
        }

        /* timer panel */
        .timer-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #000000cc;
            backdrop-filter: blur(12px);
            border-radius: 36px;
            padding: 12px 18px;
            text-align: center;
            border: 1px solid cyan;
            box-shadow: 0 0 20px cyan;
            z-index: 200;
            min-width: 140px;
        }

        .timer-number {
            font-size: 36px;
            font-weight: bold;
            font-family: monospace;
        }

        .timer-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 8px;
        }

        .timer-btn {
            background: #1e2a36;
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
        }

        .summary-panel {
            background: #0e1620;
            margin: 16px 8px;
            padding: 14px;
            border-radius: 36px;
            text-align: center;
            font-size: 0.9rem;
            border: 1px solid #2ecc71;
        }

        .toast-msg {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172aee;
            backdrop-filter: blur(8px);
            border: 1px solid #2ecc71;
            padding: 12px 24px;
            border-radius: 60px;
            color: #ccffdd;
            font-weight: bold;
            z-index: 999;
            animation: fadeOut 1.4s forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; bottom: 28%;}
            100% { opacity: 0; bottom: 38%; display: none;}
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="app-header">
    <h1>🏋️ FITNESS PRO</h1>
    <div class="sub">set bazlı antrenman + beslenme</div>
</div>

<!-- ana ekran (günler) -->
<div id="homeScreen" class="days-grid"></div>

<!-- gün detay ekranı -->
<div id="dayScreen" class="day-detail hidden">
    <div class="detail-header">
        <button class="back-btn" id="backToHomeBtn">← Geri</button>
        <button class="summary-btn" id="toggleSummaryBtn">📊 Gün Özeti</button>
    </div>
    <div id="dayTitle" class="day-title"></div>
    <div id="dayContent"></div>
    <div id="summaryBox" class="summary-panel hidden"></div>
</div>

<!-- timer kutucuğu -->
<div id="timerWidget" class="timer-panel hidden">
    <div id="timerDisplay" class="timer-number">90</div>
    <div style="font-size: 12px;">⏱️ Dinlenme</div>
    <div class="timer-buttons">
        <button class="timer-btn" id="closeTimerBtn">✖ Kapat</button>
        <button class="timer-btn" id="customTimerBtn">⚙ 60-180sn</button>
    </div>
</div>

<script>
    // ---------- TAM VERİ (EN GÜNCEL, HATASIZ, SÜPER VERSİYON) ----------
    const programData = {
        "Pazartesi": [
            "07:00 Kahve + Omega-3", "💧 2 bardak", "07:30 Skyr 500g + chia + keten", "1 muz", "💧 2 bardak",
            "09:30 Yoğurt", "💧 2 bardak", "12:30 Ton balığı + lavaş + zeytinyağı", "💧 2 bardak",
            "14:00 Pirinç + tavuk/kebap + salata", "💧 2 bardak", "14:45 Whey", "15:30 Kahve + EAA", "💧 2 bardak",
            "18:00 Yoğurt + muz", "💧 2 bardak",
            "🏋️ GÖĞÜS + TRİCEPS",
            { ex: "Dumbbell Bench Press", sets: 4 }, { ex: "Incline Dumbbell Press", sets: 4 },
            { ex: "Dumbbell Fly", sets: 3 }, { ex: "Cable Crossover", sets: 3 },
            { ex: "Rope Pushdown", sets: 4 }, { ex: "Overhead DB Extension", sets: 3 }, { ex: "Dips", sets: 3 },
            "💧 2 bardak", "21:00 Whey + skyr + yulaf", "💧 2 bardak", "22:30 Skyr", "💧 2 bardak"
        ],
        "Salı": [
            "07:00 Kahve + Omega-3", "💧 2 bardak", "07:30 Skyr + muz + chia", "💧 2 bardak", "09:30 Yoğurt", "💧 2 bardak",
            "12:30 Ton balığı + lavaş", "💧 2 bardak", "14:00 Pirinç + tavuk", "💧 2 bardak", "14:45 Whey",
            "15:30 Kahve + EAA", "💧 2 bardak", "18:00 Skyr + meyve", "💧 2 bardak",
            "🏋️ SIRT + BİCEPS",
            { ex: "Lat Pulldown", sets: 4 }, { ex: "Seated Row", sets: 4 }, { ex: "Dumbbell Row", sets: 3 },
            { ex: "Straight Arm Pulldown", sets: 3 }, { ex: "Face Pull", sets: 3 }, { ex: "DB Curl", sets: 4 },
            { ex: "Hammer Curl", sets: 3 }, { ex: "Incline Curl", sets: 3 },
            "💧 2 bardak", "21:00 Whey + skyr + yulaf", "💧 2 bardak", "22:30 Skyr", "💧 2 bardak"
        ],
        "Çarşamba": [
            "07:30 Skyr + keten + muz", "💧 2 bardak", "09:30 Yoğurt + meyve", "💧 2 bardak", "12:30 Ton balığı + lavaş",
            "💧 2 bardak", "14:00 Tavuk + az pirinç", "💧 2 bardak", "18:00 Skyr", "💧 2 bardak",
            "20:00 Et + salata + zeytinyağı", "💧 2 bardak", "22:30 Skyr", "💧 2 bardak"
        ],
        "Perşembe": [
            "07:00 Kahve + Omega-3", "💧 2 bardak", "07:30 Skyr + muz", "💧 2 bardak", "09:30 Yoğurt", "💧 2 bardak",
            "12:30 Ton balığı + lavaş", "💧 2 bardak", "14:00 Pirinç + tavuk", "💧 2 bardak", "14:45 Whey",
            "15:30 Kahve + EAA", "💧 2 bardak", "18:00 Yoğurt + muz", "💧 2 bardak",
            "🏋️ BACAK",
            { ex: "Leg Press", sets: 4 }, { ex: "Squat", sets: 3 }, { ex: "Leg Curl", sets: 3 },
            { ex: "Leg Extension", sets: 3 }, { ex: "Calf Raise", sets: 4 },
            "💧 2 bardak", "21:00 Whey + skyr + yulaf", "💧 2 bardak", "22:30 Skyr", "💧 2 bardak"
        ],
        "Cuma": [
            "07:00 Kahve + Omega-3", "💧 2 bardak", "07:30 Skyr + chia", "💧 2 bardak", "09:30 Yoğurt", "💧 2 bardak",
            "12:30 Ton balığı + lavaş", "💧 2 bardak", "14:00 Pirinç + kebap", "💧 2 bardak", "14:45 Whey",
            "15:30 Kahve + EAA", "💧 2 bardak", "18:00 Skyr + muz", "💧 2 bardak",
            "🏋️ OMUZ + TRİCEPS",
            { ex: "Shoulder Press", sets: 4 }, { ex: "Lateral Raise", sets: 4 }, { ex: "Rear Delt Fly", sets: 3 },
            { ex: "Upright Row", sets: 3 }, { ex: "Pushdown", sets: 3 }, { ex: "Dips", sets: 2 },
            "💧 2 bardak", "21:00 Whey + skyr + yulaf", "💧 2 bardak", "22:30 Skyr", "💧 2 bardak"
        ],
        "Cumartesi": [
            "07:30 Skyr + muz", "💧 2 bardak", "09:30 Yoğurt", "💧 2 bardak", "12:30 Ton balığı + lavaş", "💧 2 bardak",
            "14:00 Tavuk + pirinç", "💧 2 bardak", "18:00 Skyr", "💧 2 bardak", "20:00 Et + salata", "💧 2 bardak",
            "22:30 Skyr", "💧 2 bardak"
        ],
        "Pazar": [
            "08:00 Kahve + Omega-3", "💧 2 bardak", "08:30 Skyr + muz", "💧 2 bardak", "11:00 Yoğurt + meyve",
            "💧 2 bardak", "14:00 Tavuk + az pirinç", "💧 2 bardak", "18:00 Skyr", "💧 2 bardak",
            "20:00 Et + salata", "💧 2 bardak", "22:30 Skyr", "💧 2 bardak",
            "🧘 AKTİF DİNLENME (Yürüyüş / Esneme)"
        ]
    };

    // state
    let completedState = {};   // "day|type|id" -> true
    let waterTracker = {};

    // yardımcı
    function showMessage(text) {
        let toast = document.createElement('div');
        toast.className = 'toast-msg';
        toast.innerText = text;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 1500);
    }

    // ses (basit)
    function beepShort() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            gain.gain.value = 0.2;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.6);
            osc.stop(audioCtx.currentTime + 0.6);
            setTimeout(() => audioCtx.close(), 700);
        } catch(e) { console.log("ses hatası yok"); }
    }

    // timer
    let activeTimer = null;
    let timerActive = false;
    const timerWidget = document.getElementById('timerWidget');
    const timerDisplaySpan = document.getElementById('timerDisplay');

    function stopTimerUI() {
        if (activeTimer) clearInterval(activeTimer);
        timerWidget.classList.add('hidden');
        timerActive = false;
    }

    function startTimer(seconds = 90) {
        stopTimerUI();
        let remaining = seconds;
        timerDisplaySpan.innerText = remaining;
        timerWidget.classList.remove('hidden');
        timerActive = true;
        activeTimer = setInterval(() => {
            remaining--;
            timerDisplaySpan.innerText = remaining >= 0 ? remaining : 0;
            if (remaining <= 0) {
                clearInterval(activeTimer);
                beepShort();
                showMessage('🔔 Dinlenme tamamlandı! Devam et.');
                timerWidget.classList.add('hidden');
                timerActive = false;
            }
        }, 1000);
    }

    // localStorage
    function persistState() {
        localStorage.setItem('fitness_completed_v2', JSON.stringify(completedState));
        localStorage.setItem('fitness_water_v2', JSON.stringify(waterTracker));
    }

    function loadPersisted() {
        let saved = localStorage.getItem('fitness_completed_v2');
        if (saved) completedState = JSON.parse(saved);
        let waterSaved = localStorage.getItem('fitness_water_v2');
        if (waterSaved) waterTracker = JSON.parse(waterSaved);
    }

    // su ekleme
    function addWaterForDay(day, amount = 2) {
        let key = day + '_water';
        waterTracker[key] = (waterTracker[key] || 0) + amount;
        persistState();
        if (window.currentRenderedDay === day) {
            renderDayDetails(day);
        }
        showMessage(`💧 +${amount} bardak su (toplam: ${waterTracker[key]})`);
    }

    function getWaterTotal(day) {
        return waterTracker[day + '_water'] || 0;
    }

    // özet güncelle
    function updateSummaryBox(day) {
        const summaryDiv = document.getElementById('summaryBox');
        if (!summaryDiv) return;
        let totalMeals = 0, doneMeals = 0, totalSets = 0, doneSets = 0;
        const arr = programData[day];
        if (!arr) return;
        arr.forEach((item, idx) => {
            if (typeof item === 'string') {
                totalMeals++;
                let key = `${day}|meal|${idx}`;
                if (completedState[key]) doneMeals++;
            } else if (item && typeof item === 'object' && item.sets) {
                for (let i = 1; i <= item.sets; i++) {
                    totalSets++;
                    let setKey = `${day}|set|${item.ex}|${i}`;
                    if (completedState[setKey]) doneSets++;
                }
            }
        });
        const water = getWaterTotal(day);
        summaryDiv.innerHTML = `📊 GÜN ÖZETİ | 💧 Su: ${water} bardak | 🥗 Öğün: ${doneMeals}/${totalMeals} | 🏋️ Set: ${doneSets}/${totalSets}`;
    }

    // gün detay render
    function renderDayDetails(day) {
        const container = document.getElementById('dayContent');
        if (!container) return;
        container.innerHTML = '';
        const items = programData[day];
        if (!items) return;

        items.forEach((entry, index) => {
            if (typeof entry === 'string') {
                const mealDiv = document.createElement('div');
                mealDiv.className = 'meal-card';
                const isWater = entry.includes('💧');
                mealDiv.innerHTML = `<span>${entry}</span>${isWater ? '<span class="water-badge">+2 su</span>' : ''}`;
                const mealKey = `${day}|meal|${index}`;
                if (completedState[mealKey]) mealDiv.classList.add('done');
                mealDiv.onclick = (e) => {
                    e.stopPropagation();
                    if (isWater) {
                        addWaterForDay(day, 2);
                    } else {
                        if (completedState[mealKey]) {
                            delete completedState[mealKey];
                            mealDiv.classList.remove('done');
                            showMessage('❌ İşlem geri alındı');
                        } else {
                            completedState[mealKey] = true;
                            mealDiv.classList.add('done');
                            showMessage('✅ Tamamlandı!');
                        }
                        persistState();
                        updateSummaryBox(day);
                    }
                };
                container.appendChild(mealDiv);
            }
            else if (entry && typeof entry === 'object' && entry.ex) {
                const exTitle = document.createElement('div');
                exTitle.className = 'ex-title';
                exTitle.innerText = `💪 ${entry.ex}`;
                container.appendChild(exTitle);
                for (let s = 1; s <= entry.sets; s++) {
                    const setDiv = document.createElement('div');
                    setDiv.className = 'set-card';
                    setDiv.innerHTML = `<span><strong>Set ${s}</strong></span><span class="rest-tag">⏱️ 90 sn dinlenme</span>`;
                    const setKey = `${day}|set|${entry.ex}|${s}`;
                    if (completedState[setKey]) setDiv.classList.add('done');
                    setDiv.onclick = () => {
                        if (completedState[setKey]) {
                            delete completedState[setKey];
                            setDiv.classList.remove('done');
                            showMessage(`Set ${s} iptal`);
                        } else {
                            completedState[setKey] = true;
                            setDiv.classList.add('done');
                            showMessage(`✅ Set ${s} tamamlandı! 💪`);
                            startTimer(90);
                        }
                        persistState();
                        updateSummaryBox(day);
                    };
                    container.appendChild(setDiv);
                }
            }
        });
        updateSummaryBox(day);
    }

    let currentDayOpen = null;

    function openDay(day) {
        currentDayOpen = day;
        window.currentRenderedDay = day;
        document.getElementById('homeScreen').classList.add('hidden');
        document.getElementById('dayScreen').classList.remove('hidden');
        document.getElementById('dayTitle').innerText = day;
        renderDayDetails(day);
    }

    function closeDay() {
        stopTimerUI();
        document.getElementById('homeScreen').classList.remove('hidden');
        document.getElementById('dayScreen').classList.add('hidden');
        currentDayOpen = null;
    }

    // ana ekran oluştur
    function buildHomeGrid() {
        const grid = document.getElementById('homeScreen');
        grid.innerHTML = '';
        Object.keys(programData).forEach(dayName => {
            const card = document.createElement('div');
            card.className = 'day-card';
            card.innerText = dayName;
            card.addEventListener('click', () => openDay(dayName));
            grid.appendChild(card);
        });
    }

    // eventler
    document.getElementById('backToHomeBtn').addEventListener('click', closeDay);
    document.getElementById('toggleSummaryBtn').addEventListener('click', () => {
        const sb = document.getElementById('summaryBox');
        if (sb) sb.classList.toggle('hidden');
    });
    document.getElementById('closeTimerBtn').addEventListener('click', stopTimerUI);
    document.getElementById('customTimerBtn').addEventListener('click', () => {
        let val = prompt('Dinlenme süresi (saniye):', '90');
        let sec = parseInt(val);
        if (!isNaN(sec) && sec > 0 && sec <= 300) startTimer(sec);
        else showMessage('10-300 saniye arası girin');
    });

    loadPersisted();
    buildHomeGrid();
</script>
</body>
</html>
