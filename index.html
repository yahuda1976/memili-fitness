<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>💪 Günlük Antrenman | 90 Saniye Dinlenme</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0b0f1a;
      font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: #edf2ff;
      padding: 1rem 0.8rem 5rem;
      line-height: 1.4;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* başlık */
    .baslik {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .baslik h1 {
      font-size: 1.9rem;
      font-weight: 800;
      background: linear-gradient(135deg, #facc15, #ef4444);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }
    .baslik p {
      font-size: 0.8rem;
      color: #9ca3af;
      margin-top: 5px;
    }

    /* gün sekmeleri */
    .gun-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      background: #0f1422cc;
      backdrop-filter: blur(4px);
      padding: 0.6rem;
      border-radius: 60px;
      margin-bottom: 1.5rem;
    }
    .gun-btn {
      background: #1e293b;
      border: none;
      color: #cbd5e6;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.45rem 1rem;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.2s;
    }
    .gun-btn.active {
      background: #dc2626;
      color: white;
      box-shadow: 0 2px 10px rgba(220,38,38,0.3);
    }
    .gun-btn.rest {
      background: #2d3a4e;
      color: #a0b3d9;
    }

    /* kartlar */
    .kart {
      background: #111827;
      border-radius: 32px;
      margin-bottom: 1.8rem;
      border: 1px solid #283044;
      overflow: hidden;
    }
    .kart-baslik {
      background: #0e1622;
      padding: 0.7rem 1rem;
      font-weight: 700;
      font-size: 1.1rem;
      border-bottom: 1px solid #2d3a5a;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .yemek-listesi {
      padding: 0.8rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .yemek-satir {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.5rem;
      font-size: 0.85rem;
      border-bottom: 1px dashed #2d3a60;
      padding-bottom: 0.4rem;
    }
    .yemek-saat {
      font-weight: 700;
      background: #1e293b;
      padding: 0.2rem 0.7rem;
      border-radius: 30px;
      min-width: 60px;
      text-align: center;
      color: #facc15;
    }
    .yemek-aciklama {
      flex: 1;
      color: #cbd5f0;
    }
    .su {
      color: #7aa2f7;
      font-weight: 500;
    }

    /* egzersiz */
    .egzersiz {
      margin-bottom: 1.2rem;
      border-bottom: 1px solid #1f2a44;
      padding-bottom: 0.5rem;
    }
    .egzersiz-header {
      padding: 0.8rem 1rem 0.2rem;
    }
    .egzersiz-isim {
      font-size: 1.2rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.5rem;
    }
    .rep-etiket {
      background: #ef444430;
      padding: 0.2rem 0.7rem;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 500;
      color: #facc15;
    }
    .action-butonlar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0.5rem 0 0.2rem;
    }
    .action-btn {
      background: #1f2a44;
      border: none;
      font-size: 0.7rem;
      color: #cad2ff;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      cursor: pointer;
    }
    .set-list {
      padding: 0.2rem 1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .set-row {
      background: #0f172f;
      border-radius: 28px;
      padding: 0.5rem 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.6rem;
      border: 1px solid #26304a;
    }
    .set-numarasi {
      font-weight: 700;
      min-width: 60px;
      font-size: 0.85rem;
    }
    .weight-input {
      background: #010514;
      border: 1px solid #3b4870;
      padding: 0.45rem 0.7rem;
      border-radius: 36px;
      width: 105px;
      color: white;
      text-align: center;
      font-size: 0.85rem;
    }
    .rest-btn {
      background: #2a3655;
      border: none;
      padding: 0.4rem 1.1rem;
      border-radius: 40px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .rest-btn:active {
      background: #dc2626;
      transform: scale(0.96);
    }

    /* boş gün */
    .rest-mesaj {
      background: #0f172a;
      text-align: center;
      padding: 2rem;
      border-radius: 48px;
      color: #cbd5e1;
      border: 1px dashed #facc1555;
    }

    /* timer sabit altta */
    .timer-global {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #030614dd;
      backdrop-filter: blur(12px);
      border-top: 1px solid #ef444466;
      padding: 0.6rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.6rem;
      z-index: 100;
    }
    .timer-label {
      font-weight: 600;
      font-size: 0.8rem;
    }
    .timer-sayi {
      font-size: 1.9rem;
      font-weight: 800;
      font-family: monospace;
      letter-spacing: 3px;
      background: #000000aa;
      padding: 0 0.8rem;
      border-radius: 60px;
      color: #facc15;
    }
    .timer-btn {
      background: #334155;
      border: none;
      color: white;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 500;
    }

    footer {
      font-size: 0.7rem;
      text-align: center;
      color: #4b5679;
      margin-top: 1rem;
    }
    @media (max-width: 550px) {
      .set-row {
        flex-direction: column;
        align-items: stretch;
      }
      .timer-sayi {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="baslik">
    <h1>🔥 DEMİR GÜNLÜĞÜ</h1>
    <p>set arası 90 saniye • her set sonrası "DİNLENME" butonu</p>
  </div>

  <div class="gun-tabs" id="gunTabs"></div>
  <div id="gunIcerik"></div>
  <footer>📝 Not / 1RM / Video / Link / Alternatif butonları çalışır. Ağırlık gir ve dinlenme butonuna tıkla.</footer>
</div>

<div class="timer-global">
  <div class="timer-label">⏱️ DİNLENME SÜRESİ</div>
  <div class="timer-sayi" id="timerDisplay">01:30</div>
  <div>
    <button class="timer-btn" id="stopTimerBtn">Durdur</button>
    <button class="timer-btn" id="resetTimerBtn">Sıfırla</button>
  </div>
</div>

<script>
  // ----------------------------- TÜM VERİ (GÜN + YEMEKLER + HAREKETLER) ---------------------------------
  // Yemek verileri (her gün)
  const yemekler = {
    pazartesi: [
      { saat: "07:45", metin: "Overnight oats (yulaf + süt + Skyr + muz) + Omega-3", su: "500 ml" },
      { saat: "09:30", metin: "Ekmek + peynir", su: "400 ml" },
      { saat: "12:30", metin: "Su", su: "500 ml" },
      { saat: "14:00", metin: "Tavuk + pilav + yoğurt", su: "400 ml" },
      { saat: "16:30", metin: "Su", su: "400 ml" },
      { saat: "18:00", metin: "Whey + Kreatin (5g)", su: "300 ml" },
      { saat: "19:00", metin: "🏋️ ANTRENMAN" },
      { saat: "20:30", metin: "Whey", su: "300 ml" },
      { saat: "21:00", metin: "Tavuk + patates + salata + Skyr", su: "400 ml" }
    ],
    sali: [
      { saat: "07:45", metin: "Oats + Omega-3", su: "500 ml" },
      { saat: "09:30", metin: "Ton balığı + ekmek", su: "400 ml" },
      { saat: "14:00", metin: "Et döner + pilav", su: "500 ml" },
      { saat: "18:00", metin: "Whey + Kreatin", su: "300 ml" },
      { saat: "19:00", metin: "🏋️ ANTRENMAN" },
      { saat: "20:30", metin: "Whey" },
      { saat: "21:00", metin: "Yumurta + ekmek + Skyr", su: "400 ml" }
    ],
    carsamba: [
      { saat: "07:45", metin: "Hafif oats + Omega-3", su: "500 ml" },
      { saat: "09:30", metin: "Meyve + kuruyemiş", su: "" },
      { saat: "14:00", metin: "Ton balığı + salata", su: "" },
      { saat: "18:00", metin: "Su", su: "500 ml" },
      { saat: "20:30", metin: "Yumurta + yoğurt", su: "" },
      { saat: "22:00", metin: "20-30 dk yürüyüş", su: "" }
    ],
    persembe: [
      { saat: "07:45", metin: "Oats + Omega-3", su: "500 ml" },
      { saat: "09:30", metin: "Ekmek + peynir", su: "" },
      { saat: "14:00", metin: "Tavuk + pilav", su: "" },
      { saat: "18:00", metin: "Whey + Kreatin", su: "300 ml" },
      { saat: "19:00", metin: "🏋️ ANTRENMAN" },
      { saat: "20:30", metin: "Whey" },
      { saat: "21:00", metin: "Köfte + patates + Skyr", su: "400 ml" }
    ],
    cuma: [
      { saat: "07:45", metin: "Enerji oats + Omega-3", su: "500 ml" },
      { saat: "09:30", metin: "Peynir + ekmek", su: "" },
      { saat: "14:00", metin: "Et + pilav", su: "" },
      { saat: "18:00", metin: "Whey + Kreatin", su: "300 ml" },
      { saat: "19:00", metin: "🏋️ ANTRENMAN" },
      { saat: "20:30", metin: "Whey" },
      { saat: "21:00", metin: "Tavuk + patates + yoğurt", su: "400 ml" }
    ],
    cumartesi: [
      { saat: "07:45", metin: "Oats + Omega-3", su: "500 ml" },
      { saat: "09:30", metin: "Ton balığı + ekmek", su: "400 ml" },
      { saat: "14:00", metin: "Tavuk + pilav", su: "" },
      { saat: "18:00", metin: "Whey + Kreatin", su: "300 ml" },
      { saat: "19:00", metin: "🏋️ ANTRENMAN" },
      { saat: "20:30", metin: "Whey" },
      { saat: "21:00", metin: "Yumurta + peynir + Skyr", su: "400 ml" }
    ],
    pazar: [
      { saat: "07:45", metin: "Hafif oats + Omega-3", su: "500 ml" },
      { saat: "09:30", metin: "Meyve", su: "" },
      { saat: "14:00", metin: "Tavuk + salata", su: "" },
      { saat: "20:30", metin: "Yumurta + yoğurt", su: "" }
    ]
  };

  // HAREKETLER (güncel liste, aynen son verdiğin gibi)
  const hareketler = {
    pazartesi: [
      { ad: "🏋️ Incline Dumbbell Press (30-45°)", set: 4, tekrar: "6-8", not: "3 sn indir" },
      { ad: "🏋️ Dumbbell Bench Press", set: 3, tekrar: "6-10", not: "Kürek kemikleri sık" },
      { ad: "🔻 Chest Dip (öne eğilerek)", set: 3, tekrar: "8-12", not: "Alt göğüs odak" },
      { ad: "🎯 Cable Chest Fly", set: 3, tekrar: "12-15", not: "Sıkıştır" },
      { ad: "🔥 Triceps Pushdown (Rope)", set: 3, tekrar: "10-12", not: "Dirsek sabit" },
      { ad: "💪 Overhead Triceps Extension", set: 3, tekrar: "10-12", not: "Gerilimi hisset" }
    ],
    sali: [
      { ad: "🔵 Lat Pulldown (göğse)", set: 4, tekrar: "8-12", not: "Arkaya çekme" },
      { ad: "🔵 Barbell Row", set: 3, tekrar: "6-10", not: "Bel sabit" },
      { ad: "🔵 Seated Cable Row", set: 3, tekrar: "10-12", not: "Kürek sık" },
      { ad: "📌 Straight Arm Cable Pulldown", set: 3, tekrar: "12-15", not: "Lat odak" },
      { ad: "🎯 Face Pull", set: 3, tekrar: "12-15", not: "Arka omuz" },
      { ad: "💪 Barbell Curl", set: 3, tekrar: "8-12", not: "Sallama yok" },
      { ad: "💪 Hammer Curl", set: 3, tekrar: "10-12", not: "Kontrol" }
    ],
    carsamba: [],
    persembe: [
      { ad: "🎯 Dumbbell Shoulder Press", set: 4, tekrar: "6-10", not: "Bel boşluk verme" },
      { ad: "🎯 Dumbbell Lateral Raise", set: 4, tekrar: "12-15", not: "Omuz hizası" },
      { ad: "🎯 Reverse Pec Deck", set: 3, tekrar: "12-15", not: "Arka omuz" },
      { ad: "🎯 Cable Lateral Raise", set: 3, tekrar: "12-15", not: "Sabit" },
      { ad: "💪 Cable Curl (pump)", set: 2, tekrar: "12-15", not: "Yavaş" },
      { ad: "💪 Hammer Curl (pump)", set: 2, tekrar: "12-15", not: "Kontrol" }
    ],
    cuma: [
      { ad: "🏋️ Barbell Back Squat", set: 4, tekrar: "6-8", not: "Derin squat" },
      { ad: "🦵 Seated Leg Curl", set: 3, tekrar: "12-15", not: "" },
      { ad: "🦵 Leg Extension", set: 3, tekrar: "12-15", not: "" },
      { ad: "🏋️ Romanian Deadlift", set: 3, tekrar: "8-12", not: "Kalçadan kır" },
      { ad: "🏃 Walking Lunge", set: 3, tekrar: "10-12 (her bacak)", not: "" },
      { ad: "🦵 Standing Calf Raise", set: 4, tekrar: "15-20", not: "" }
    ],
    cumartesi: [
      { ad: "📌 Incline Chest Press Machine", set: 3, tekrar: "10-12", not: "" },
      { ad: "🎯 Low to High Cable Fly", set: 3, tekrar: "12-15", not: "" },
      { ad: "🦾 Pec Deck Machine", set: 3, tekrar: "12-15", not: "" },
      { ad: "💪 Push-Up", set: 2, tekrar: "failure", not: "son sete kadar" },
      { ad: "🔥 Triceps Pushdown (Rope)", set: 2, tekrar: "12-15", not: "" },
      { ad: "🔥 Cable Overhead Triceps Extension", set: 2, tekrar: "12-15", not: "" }
    ],
    pazar: []
  };

  const gunSirasi = ["pazartesi", "sali", "carsamba", "persembe", "cuma", "cumartesi", "pazar"];
  const gunAdlari = { pazartesi:"PZT", sali:"SAL", carsamba:"ÇAR", persembe:"PER", cuma:"CUM", cumartesi:"CMT", pazar:"PAZ" };
  let aktifGun = "pazartesi";

  // timer değişkenleri
  let timerInterval = null;
  let kalanSaniye = 90;
  const timerSpan = document.getElementById("timerDisplay");

  function timerGuncelle() {
    const dak = Math.floor(kalanSaniye / 60);
    const sn = kalanSaniye % 60;
    timerSpan.textContent = `${dak.toString().padStart(2,'0')}:${sn.toString().padStart(2,'0')}`;
  }

  function durdurTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  function baslatTimer(saniye = 90) {
    durdurTimer();
    kalanSaniye = saniye;
    timerGuncelle();
    timerInterval = setInterval(() => {
      if (kalanSaniye <= 1) {
        durdurTimer();
        kalanSaniye = 0;
        timerGuncelle();
      } else {
        kalanSaniye--;
        timerGuncelle();
      }
    }, 1000);
  }

  function sifirlaTimer() {
    durdurTimer();
    kalanSaniye = 90;
    timerGuncelle();
  }

  // yemek HTML
  function yemekHtml(gunKey) {
    const liste = yemekler[gunKey] || [];
    if (liste.length === 0) return '<div class="kart"><div class="kart-baslik">🍽️ Beslenme</div><div class="yemek-listesi">Bugün için plan yok</div></div>';
    let html = `<div class="kart"><div class="kart-baslik">🍱 GÜNLÜK BESLENME & SU</div><div class="yemek-listesi">`;
    for (let o of liste) {
      const suMetin = o.su ? `<span class="su">💧 ${o.su}</span>` : '';
      html += `<div class="yemek-satir"><span class="yemek-saat">${o.saat}</span><span class="yemek-aciklama">${o.metin} ${suMetin ? ` ${suMetin}` : ''}</span></div>`;
    }
    html += `</div></div>`;
    return html;
  }

  // hareketler HTML
  function hareketHtml(gunKey) {
    const hareketDizi = hareketler[gunKey] || [];
    if (hareketDizi.length === 0) {
      return `<div class="rest-mesaj">🧘‍♂️ AKTİF DİNLENME GÜNÜ<br>Yürüyüş / esneme | Standart beslenme uygulanır</div>`;
    }
    let html = `<div class="kart"><div class="kart-baslik">🏋️ ANTRENMAN</div>`;
    for (let exIdx = 0; exIdx < hareketDizi.length; exIdx++) {
      const ex = hareketDizi[exIdx];
      const repText = ex.tekrar === "failure" ? "failure" : `${ex.tekrar} tekrar`;
      html += `
        <div class="egzersiz" data-exidx="${exIdx}">
          <div class="egzersiz-header">
            <div class="egzersiz-isim">
              <span>${ex.ad}</span>
              <span class="rep-etiket">🎯 ${repText}</span>
            </div>
            <div class="action-butonlar">
              <button class="action-btn" data-action="not" data-name="${ex.ad}">📝 Not</button>
              <button class="action-btn" data-action="1rm" data-name="${ex.ad}">📊 1RM</button>
              <button class="action-btn" data-action="video" data-name="${ex.ad}">🎥 Video</button>
              <button class="action-btn" data-action="link" data-name="${ex.ad}">🔗 Link</button>
              <button class="action-btn" data-action="alternatif" data-name="${ex.ad}">🔄 Alternatif</button>
            </div>
            ${ex.not ? `<div style="font-size:0.7rem; margin-top:4px; color:#b9c8ff;">💡 ${ex.not}</div>` : ''}
          </div>
          <div class="set-list" id="setler-${gunKey}-${exIdx}">
      `;
      for (let s = 1; s <= ex.set; s++) {
        html += `
          <div class="set-row">
            <div class="set-numarasi">Set ${s}</div>
            <input type="text" class="weight-input" placeholder="Ağırlık (kg)" autocomplete="off">
            <button class="rest-btn" data-gun="${gunKey}" data-ex="${ex.ad}" data-setno="${s}">⏱️ 90sn Dinlen</button>
          </div>
        `;
      }
      html += `</div></div>`;
    }
    html += `</div>`;
    return html;
  }

  function tumGunuOlustur(gunKey) {
    return `<div id="panel-${gunKey}" class="gun-paneli">${yemekHtml(gunKey)}${hareketHtml(gunKey)}</div>`;
  }

  // tüm panelleri oluştur
  function renderTumGunler() {
    const container = document.getElementById("gunIcerik");
    let allPanels = '';
    for (let g of gunSirasi) {
      allPanels += tumGunuOlustur(g);
    }
    container.innerHTML = allPanels;
    // aktif paneli göster
    for (let g of gunSirasi) {
      const panel = document.getElementById(`panel-${g}`);
      if (panel) {
        if (g === aktifGun) panel.style.display = "block";
        else panel.style.display = "none";
      }
    }
    attachDinlenmeEventleri();
    attachActionEventleri();
  }

  // dinlenme butonlarına event
  function attachDinlenmeEventleri() {
    document.querySelectorAll('.rest-btn').forEach(btn => {
      btn.removeEventListener('click', restHandler);
      btn.addEventListener('click', restHandler);
    });
  }
  function restHandler(e) {
    e.stopPropagation();
    baslatTimer(90);
  }

  // action butonları
  function attachActionEventleri() {
    document.querySelectorAll('.action-btn').forEach(btn => {
      btn.removeEventListener('click', actionHandler);
      btn.addEventListener('click', actionHandler);
    });
  }
  function actionHandler(e) {
    const act = e.currentTarget.getAttribute('data-action');
    const exName = e.currentTarget.getAttribute('data-name');
    if (act === 'not') {
      const notMetin = prompt(`📝 "${exName}" için not ekle:`, "Örn: 3 saniye iniş");
      if (notMetin) alert(`Not: ${notMetin}`);
    } else if (act === '1rm') {
      let kg = prompt(`🏋️ "${exName}" için tahmini 1RM ağırlık (kg):`, "100");
      if (kg) alert(`1RM tahmini: ${kg} kg`);
    } else if (act === 'video') {
      alert(`🎥 "${exName}" için video önerisi: YouTube'da “${exName} form” ara.`);
    } else if (act === 'link') {
      alert(`🔗 "${exName}" için örnek link: https://exrx.net/search`);
    } else if (act === 'alternatif') {
      alert(`🔄 "${exName}" alternatif hareket: Dumbell / kablo / makine varyasyonu deneyebilirsin.`);
    }
  }

  // tab butonlarını oluştur
  function tablariOlustur() {
    const tabContainer = document.getElementById("gunTabs");
    tabContainer.innerHTML = '';
    for (let g of gunSirasi) {
      const isRest = (hareketler[g] && hareketler[g].length === 0);
      const btn = document.createElement("button");
      btn.textContent = gunAdlari[g];
      btn.classList.add("gun-btn");
      if (isRest) btn.classList.add("rest");
      if (g === aktifGun) btn.classList.add("active");
      btn.addEventListener("click", () => {
        aktifGun = g;
        document.querySelectorAll('.gun-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.gun-paneli').forEach(panel => panel.style.display = 'none');
        const aktifPanel = document.getElementById(`panel-${g}`);
        if (aktifPanel) aktifPanel.style.display = "block";
        durdurTimer();
        sifirlaTimer();
      });
      tabContainer.appendChild(btn);
    }
  }

  // timer düğmeleri
  document.getElementById("stopTimerBtn").addEventListener("click", () => durdurTimer());
  document.getElementById("resetTimerBtn").addEventListener("click", () => {
    durdurTimer();
    sifirlaTimer();
  });

  // BAŞLAT
  renderTumGunler();
  tablariOlustur();
  sifirlaTimer();
</script>
</body>
</html>
