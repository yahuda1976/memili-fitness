<!DOCTYPE html><html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fitness Pro App</title>  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
    }

    h1 {
      text-align: center;
      padding: 10px;
      margin: 0;
      color: #00ffcc;
    }

    /* HOME GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      padding: 10px;
    }

    .card {
      background: linear-gradient(145deg, #1f1f1f, #141414);
      border: 1px solid #2a2a2a;
      padding: 15px 5px;
      text-align: center;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      color: #00ff99;
    }

    .card:hover {
      transform: scale(1.05);
      background: #222;
    }

    /* DAY VIEW */
    .hidden { display: none; }

    .topbar {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      align-items: center;
    }

    .btn {
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      border: none;
    }

    .back {
      background: #ff0055;
      color: white;
    }

    .timerBtn {
      background: #00bfff;
      color: white;
    }

    .dayTitle {
      text-align: center;
      font-size: 20px;
      color: #00ffcc;
    }

    .progress {
      text-align: center;
      margin: 10px;
      color: #ffaa00;
    }

    .item {
      background: #1e1e1e;
      margin: 6px 10px;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .item.done {
      background: #003d2a;
      text-decoration: line-through;
      opacity: 0.5;
    }

    /* TIMER */
    .timerBox {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #111;
      border: 2px solid #00ffcc;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      display: none;
    }

    .timerNum {
      font-size: 24px;
      color: #00ffcc;
    }
  </style></head>
<body><h1>💪 FITNESS PRO APP</h1><!-- HOME --><div id="home" class="grid"></div><!-- DAY VIEW --><div id="dayView" class="hidden">  <div class="topbar">
    <button class="btn back" onclick="goBack()">⬅ Geri</button>
    <button class="btn timerBtn" onclick="startTimer(150)">⏱ 150 sn Dinlenme</button>
  </div>  <div class="dayTitle" id="dayTitle"></div>
  <div class="progress" id="progress"></div>
  <div id="items"></div>
</div><!-- TIMER --><div class="timerBox" id="timerBox">
  <div class="timerNum" id="timerNum">150</div>
  <div>Dinlenme</div>
</div><script>
const data = {
  "Pzt": ["Kahve","Skyr","Yoğurt","Ton balığı","Pirinç","Whey","EAA","Antrenman"],
  "Sal": ["Kahve","Skyr","Yoğurt","Ton balığı","Pirinç","Whey","EAA","Antrenman"],
  "Çar": ["Dinlenme"],
  "Per": ["Bacak"],
  "Cum": ["Omuz"],
  "Cts": ["Aktif"],
  "Paz": ["Dinlenme"]
};

const home = document.getElementById("home");
const dayView = document.getElementById("dayView");
const items = document.getElementById("items");
const progress = document.getElementById("progress");

let currentDay = null;

// LOCAL STORAGE
function saveState(day, index) {
  localStorage.setItem(day + "_" + index, "done");
}

function loadState(day, index) {
  return localStorage.getItem(day + "_" + index) === "done";
}

// HOME
Object.keys(data).forEach(day => {
  const div = document.createElement("div");
  div.className = "card";
  div.innerText = day;
  div.onclick = () => openDay(day);
  home.appendChild(div);
});

function openDay(day) {
  currentDay = day;
  home.style.display = "none";
  dayView.classList.remove("hidden");

  document.getElementById("dayTitle").innerText = day;

  renderDay();
}

function renderDay() {
  items.innerHTML = "";

  let list = data[currentDay];
  let done = 0;

  list.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = t;

    if (loadState(currentDay, i)) {
      div.classList.add("done");
      done++;
    }

    div.onclick = () => {
      div.classList.toggle("done");
      saveState(currentDay, i);
      renderDay();
    };

    items.appendChild(div);
  });

  let percent = Math.round((done / list.length) * 100);
  progress.innerText = "Tamamlama: %" + percent;

  // streak
  localStorage.setItem(currentDay + "_percent", percent);
}

function goBack() {
  dayView.classList.add("hidden");
  home.style.display = "grid";
}

// TIMER
let timer;
function startTimer(sec) {
  let box = document.getElementById("timerBox");
  let num = document.getElementById("timerNum");

  box.style.display = "block";
  let time = sec;

  clearInterval(timer);

  timer = setInterval(() => {
    num.innerText = time;
    time--;

    if (time < 0) {
      clearInterval(timer);
      box.style.display = "none";
      alert("Dinlenme bitti 🔥");
    }
  }, 1000);
}

</script></body>
</html>
