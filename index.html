<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Fitness Pro - Kesin Makro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: system-ui, sans-serif; font-size: 17px; padding-bottom: 160px; font-weight: 500; }
        .app-header { background: #000; padding: 16px 20px; text-align: center; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .app-header h1 { font-size: 1.8rem; background: linear-gradient(135deg,#007aff,#5856d6); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 16px; padding: 20px; max-width: 550px; margin: 0 auto; }
        .card { background: #1C1C1E; border-radius: 14px; padding: 20px 12px; text-align: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
        .card:active { transform: scale(0.97); background: #2C2C2E; }
        .card h3 { font-size: 1.3rem; font-weight: 700; color: #FF3B30; margin-bottom: 8px; }
        .card.settings-card h3 { color: #007AFF; }
        .progress-bar { width: 100%; height: 4px; background: #2C2C2E; border-radius: 4px; overflow: hidden; margin-top: 12px; }
        .progress-fill { height: 100%; background: #34C759; transition: width 0.3s; }
        small { font-size: 0.75rem; color: #8E8E93; display: block; margin-top: 8px; }
        .day-view { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 1000; overflow-y: auto; padding-bottom: 120px; }
        .day-header { background: #000; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .back-btn, .add-item-btn { background: #007AFF; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 600; font-size: 1rem; color: white; cursor: pointer; }
        .day-title { font-size: 1.4rem; font-weight: 700; }
        .item, .set { background: #1C1C1E; margin: 10px 16px; padding: 14px; border-radius: 14px; display: flex; align-items: center; gap: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .set { cursor: pointer; border-left: 4px solid #34C759; }
        .set.done, .item.done { background: #007AFF; text-decoration: line-through; opacity: 0.9; }
        .set.done::after, .item.done::after { content: "✓"; margin-left: 8px; }
        .set span, .item span { font-weight: 600; flex: 1; color: #fff; }
        .ex-title { background: #1C1C1E; border-radius: 12px; padding: 12px 16px; margin: 16px 16px 8px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .ex-title > span { flex: 1; font-weight: 600; color: #34C759; font-size: 1.1rem; }
        .ex-title-buttons { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; width: 100%; margin-top: 8px; }
        .ex-title-buttons button { background: #2C2C2E; border: 1px solid rgba(255,255,255,0.2); padding: 8px 0; border-radius: 40px; color: #FFCC33; font-size: 0.7rem; font-weight: 700; cursor: pointer; }
        .move-buttons { display: flex; flex-direction: column; gap: 4px; }
        .move-btn { background: rgba(255,255,255,0.15); border: none; font-size: 1rem; cursor: pointer; padding: 4px 6px; border-radius: 10px; color: #FFF; }
        .bottom-quest { position: fixed; bottom: 0; left: 0; right: 0; background: #1C1C1E; padding: 12px 20px; border-top: 0.5px solid rgba(255,255,255,0.1); }
        .quest-title { font-size: 0.9rem; font-weight: 600; text-align: center; color: #007AFF; }
        .quest-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin: 10px 0; }
        .quest-item { text-align: center; background: #2C2C2E; padding: 8px; border-radius: 12px; }
        .quest-icon { font-size: 1.3rem; }
        .quest-progress { font-size: 0.8rem; font-weight: 600; }
        .daily-score { text-align: center; font-size: 0.8rem; color: #8E8E93; }
        .score-bar { width: 100%; height: 4px; background: #2C2C2E; border-radius: 4px; margin-top: 6px; overflow: hidden; }
        .score-fill { height: 100%; background: #34C759; }
        .stats-panel { background: #1C1C1E; margin: 16px; padding: 20px; border-radius: 14px; }
        .stats-panel h3 { font-size: 1.1rem; font-weight: 600; }
        .stats-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; margin-top: 12px; }
        .stat-card { text-align: center; background: #2C2C2E; padding: 14px; border-radius: 12px; font-size: 0.85rem; color: #007AFF; }
        .stat-card span { display: block; font-size: 1.4rem; font-weight: 700; color: #FFF; margin-top: 4px; }
        .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
        .badge { background: #2C2C2E; padding: 6px 14px; border-radius: 20px; font-size: 0.7rem; color: #007AFF; }
        .macro-bar { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; background: #1C1C1E; border-radius: 14px; padding: 12px; margin: 12px 16px; border: 1px solid rgba(255,255,255,0.1); }
        .macro-item { text-align: center; }
        .macro-item span { font-size: 1.2rem; display: block; }
        .macro-item b { display: block; font-size: 1rem; font-weight: 700; margin: 2px 0; color: #FFF; }
        .macro-item small { color: #8E8E93; font-size: 0.6rem; text-transform: uppercase; }
        .recovery-panel { background: #1C1C1E; border-radius: 14px; padding: 12px; margin: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; }
        .recovery-item { flex: 1; text-align: center; padding: 8px; border-radius: 12px; font-weight: 600; font-size: 0.75rem; }
        .recovery-red { background: rgba(255,59,48,0.2); color: #FF3B30; }
        .recovery-orange { background: rgba(255,149,0,0.2); color: #FF9500; }
        .recovery-green { background: rgba(52,199,89,0.2); color: #34C759; }
        .modal { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.95); z-index:3000; display:flex; align-items:center; justify-content:center; padding:20px; }
        .modal-content { background:#1C1C1E; border-radius:20px; padding:24px; max-width:400px; width:100%; color:white; }
        .modal-content input, .modal-content select { width:100%; padding:12px; margin:8px 0; background:#2C2C2E; border:none; border-radius:10px; color:white; font-size:1rem; }
        .modal-buttons { display:flex; gap:12px; margin-top:20px; }
        .modal-btn { flex:1; padding:12px; border:none; border-radius:40px; font-weight:600; cursor:pointer; }
        .modal-btn.confirm { background:#007AFF; color:white; }
        .modal-btn.cancel { background:#FF3B30; color:white; }
        .timer-box { position:fixed; bottom:180px; right:20px; background:rgba(28,28,30,0.98); border-radius:20px; padding:16px 20px; text-align:center; z-index:2000; min-width:140px; }
        .timer-num { font-size:40px; font-weight:700; font-family:monospace; color:#007AFF; }
        .timer-buttons { display:flex; gap:12px; margin-top:10px; justify-content:center; }
        .timer-btn { background:#3a3a3c; border:none; padding:6px 16px; border-radius:20px; font-weight:600; color:#007AFF; cursor:pointer; }
        .stop-sound-btn { background:#FF3B30; color:white; border:none; padding:6px 12px; border-radius:20px; font-size:0.7rem; cursor:pointer; margin-top:8px; }
        .hidden { display:none; }
        .toast { position:fixed; bottom:30%; left:50%; transform:translateX(-50%); background:#1c1c1e; color:white; padding:12px 24px; border-radius:60px; font-weight:600; z-index:2000; animation:fadeOut 1.5s forwards; }
        @keyframes fadeOut { 0% { opacity:1; } 70% { opacity:1; } 100% { opacity:0; display:none; } }
        .input-number-only { width:100%; padding:12px; text-align:center; background:#2C2C2E; color:white; border:none; border-radius:10px; }
        .set-info { font-size:0.8rem; color:#FF9500; background:#2C2C2E; padding:4px 10px; border-radius:20px; margin-left:8px; }
        .chart-tabs { display:flex; gap:12px; margin-bottom:16px; }
        .chart-tab { flex:1; background:#2C2C2E; border:none; padding:10px; border-radius:10px; font-weight:600; color:#007AFF; cursor:pointer; }
        .chart-tab.active { background:#007AFF; color:white; }
        .chart-bar-item { margin:10px 0; display:flex; align-items:center; gap:12px; }
        .bar-label { width:45px; font-size:0.75rem; }
        .bar-fill { flex:1; height:28px; background:#2C2C2E; border-radius:8px; overflow:hidden; }
        .bar { height:100%; background:#007AFF; transition:width 0.5s; display:flex; align-items:center; justify-content:flex-end; padding-right:10px; color:white; font-weight:600; font-size:0.7rem; }
        .water-chart, .set-chart { background:#1C1C1E; border-radius:14px; padding:16px; margin-bottom:20px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
<div id="appContent">
    <div class="app-header"><h1>🔥 FITNESS PRO</h1></div>
    <div id="homeGrid" class="grid"></div>
    <div id="statsPanel" class="stats-panel">
        <h3>🏆 BAŞARILARIM</h3>
        <div class="stats-grid">
            <div class="stat-card">🏋️ Toplam Set<br><span id="totalSets">0</span></div>
            <div class="stat-card">💧 Toplam Su<br><span id="totalWater">0</span></div>
            <div class="stat-card">⭐ En İyi Gün<br><span id="bestDay">-</span></div>
            <div class="stat-card">🔥 Toplam XP<br><span id="totalXP">0</span></div>
        </div>
        <div id="badgesContainer" class="badges"></div>
    </div>
    <div id="dayView" class="day-view hidden">
        <div class="day-header">
            <button class="back-btn" onclick="closeDay()">← Geri</button>
            <div class="day-title" id="dayTitle"></div>
            <button class="add-item-btn" onclick="showAddItemToDay()">+ Ekle</button>
        </div>
        <div id="recoveryPanel" class="recovery-panel"></div>
        <div id="dayItems"></div>
    </div>
    <div id="settingsView" class="day-view hidden">
        <div class="day-header">
            <button class="back-btn" onclick="closeSettings()">← Geri</button>
            <div class="day-title">AYARLAR</div>
            <div style="width:50px;"></div>
        </div>
        <div style="padding:16px;">
            <div class="water-chart"><h3 style="color:#007AFF;">💧 SU TAKİP GRAFİĞİ</h3><div class="chart-tabs"><button class="chart-tab active" onclick="setWaterChartType('daily')">📅 Günlük</button><button class="chart-tab" onclick="setWaterChartType('weekly')">📆 Haftalık</button><button class="chart-tab" onclick="setWaterChartType('monthly')">📊 Aylık</button></div><div id="waterChartContainer"></div><div id="waterChartMessage" style="margin-top:12px; text-align:center; font-size:0.8rem;"></div></div>
            <div class="set-chart"><h3 style="color:#007AFF;">📈 HAFTALIK SET GRAFİĞİ</h3><div id="weeklyChartContainer"></div></div>
            <div style="background:#1C1C1E; border-radius:14px; padding:16px; margin-bottom:20px;">
                <h3 style="color:#FF9500;">🚀 GELİŞMİŞ ÖZELLİKLER</h3>
                <div style="display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-top: 12px;">
                    <button onclick="showMostTrainedMuscle()" style="background:#2C2C2E; border:none; padding:12px; border-radius:12px; color:#fff;">💪 En Çok Çalışılan Kas</button>
                    <button onclick="showTotalWorkoutTime()" style="background:#2C2C2E; border:none; padding:12px; border-radius:12px; color:#fff;">⏱️ Toplam Antrenman Süresi</button>
                    <button onclick="openPlannerModal()" style="background:#2C2C2E; border:none; padding:12px; border-radius:12px; color:#fff;">📅 Antrenman Planlayıcı</button>
                    <button onclick="openMealPlannerModal()" style="background:#2C2C2E; border:none; padding:12px; border-radius:12px; color:#fff;">🍽️ Yemek Planlayıcı</button>
                    <button onclick="openWarmupModal()" style="background:#2C2C2E; border:none; padding:12px; border-radius:12px; color:#fff;">🧘 Isınma / Soğuma</button>
                    <button onclick="exportReportPDF()" style="background:#2C2C2E; border:none; padding:12px; border-radius:12px; color:#fff;">📄 PDF Rapor</button>
                    <button onclick="exportToExcelFull()" style="background:#2C2C2E; border:none; padding:12px; border-radius:12px; color:#fff;">📊 Excel Rapor</button>
                    <button onclick="openBarcodeFoodModal()" style="background:#2C2C2E; border:none; padding:12px; border-radius:12px; color:#fff;">📷 Barkod ile Besin Ekle</button>
                </div>
            </div>
            <div style="background:#1C1C1E; border-radius:14px; padding:16px; margin-bottom:20px;">
                <h3 style="color:#FF3B30;">🎥 VİDEO KÜTÜPHANESİ</h3>
                <input type="text" id="videoExName" placeholder="Hareket adı" style="width:100%; padding:12px; background:#2C2C2E; border:none; border-radius:10px; margin-bottom:8px; color:white;">
                <input type="text" id="videoExLink" placeholder="YouTube linki" style="width:100%; padding:12px; background:#2C2C2E; border:none; border-radius:10px; margin-bottom:8px; color:white;">
                <button onclick="addVideoToLibrary()" style="width:100%; background:#FF3B30; border:none; padding:12px; border-radius:12px; color:white; font-weight:600;">➕ Kütüphaneye Ekle</button>
                <div id="videoLibraryList" style="margin-top:12px;"></div>
            </div>
            <div style="background:#1C1C1E; border-radius:14px; padding:16px; margin-bottom:20px;">
                <h3 style="color:#007AFF;">💾 VERİ YEDEKLEME</h3>
                <button onclick="backupData()" style="width:100%; background:#007AFF; border:none; padding:14px; border-radius:12px; color:white; font-weight:600; margin-bottom:8px;">💾 YEDEK AL</button>
                <button onclick="restoreData()" style="width:100%; background:#34C759; border:none; padding:14px; border-radius:12px; color:white; font-weight:600;">📂 GERİ YÜKLE</button>
            </div>
        </div>
    </div>
    <div class="bottom-quest">
        <div class="quest-title">✨ GÜNLÜK GÖREVLER ✨</div>
        <div class="quest-grid">
            <div class="quest-item"><div class="quest-icon">💧</div><div class="quest-progress" id="questWater">0/8</div></div>
            <div class="quest-item"><div class="quest-icon">🍽️</div><div class="quest-progress" id="questMeal">0/12</div></div>
            <div class="quest-item"><div class="quest-icon">🏋️</div><div class="quest-progress" id="questSet">0/20</div></div>
            <div class="quest-item"><div class="quest-icon">⭐</div><div class="quest-progress" id="questScore">0/100</div></div>
        </div>
        <div class="daily-score">🎯 Günlük Puan: <span id="dailyScoreText">0</span>/100
            <div class="score-bar"><div class="score-fill" id="scoreFill" style="width:0%"></div></div>
        </div>
    </div>
    <div id="timerBox" class="timer-box" style="display:none;">
        <div class="timer-num" id="timerNum">90</div>
        <div style="font-size:10px;">⏱️ Dinlenme</div>
        <div class="timer-buttons">
            <button class="timer-btn" id="timerCloseBtn">Kapat</button>
            <button class="timer-btn" id="timerCustomBtn">Ayarla</button>
            <button class="stop-sound-btn" id="stopSoundBtn">🔇 Sesi Durdur</button>
        </div>
    </div>
</div>

<script>
    // ========== KESİN MAKRO AYRIŞTIRICI ==========
    // Bu fonksiyon "Kalori: 420 | Protein: 30 g | Karb: 55 g | Yag: 10 g" formatını kesin olarak okur.
    function parseFoodMacros(text) {
        let kcal = 0, prot = 0, carb = 0, fat = 0;
        let kcalMatch = text.match(/Kalori:\s*(\d+)/i);
        if (kcalMatch) kcal = parseInt(kcalMatch[1]);
        let protMatch = text.match(/Protein:\s*(\d+)\s*g/i);
        if (protMatch) prot = parseInt(protMatch[1]);
        let carbMatch = text.match(/Karb:\s*(\d+)\s*g/i);
        if (carbMatch) carb = parseInt(carbMatch[1]);
        let fatMatch = text.match(/Yag:\s*(\d+)\s*g/i);
        if (fatMatch) fat = parseInt(fatMatch[1]);
        return { cal: kcal, p: prot, k: carb, f: fat };
    }

    // ========== YEMEK LİSTELERİ (BİREBİR SENİN VERDİĞİN RAKAMLARLA) ==========
    const plan1Meals = [
        "07:00 Yulaf + sut + muz + whey + Skyr | Kalori: 420 | Protein: 30 g | Karb: 55 g | Yag: 10 g",
        "09:00 Skyr + chia + meyve | Kalori: 250 | Protein: 20 g | Karb: 30 g | Yag: 8 g",
        "14:00 Tavuk + pirinc + zeytinyagi + salata | Kalori: 550 | Protein: 40 g | Karb: 60 g | Yag: 15 g",
        "17:00 Tavuk + pirinc | Kalori: 400 | Protein: 30 g | Karb: 45 g | Yag: 8 g",
        "18:15 Muz + lavas | Kalori: 250 | Protein: 5 g | Karb: 55 g | Yag: 2 g",
        "20:15 Whey + meyve | Kalori: 200 | Protein: 25 g | Karb: 20 g | Yag: 2 g",
        "21:00 Kiyma + patates + salata | Kalori: 500 | Protein: 35 g | Karb: 40 g | Yag: 18 g",
        "23:00 Skyr | Kalori: 150 | Protein: 15 g | Karb: 10 g | Yag: 5 g"
    ];
    const plan2Meals = [
        "07:00 Yulaf + sut + whey | Kalori: 420 | Protein: 30 g | Karb: 50 g | Yag: 10 g",
        "09:00 Skyr + keten + meyve | Kalori: 260 | Protein: 20 g | Karb: 30 g | Yag: 8 g",
        "14:00 Kiyma + pirinc + zeytinyagi | Kalori: 600 | Protein: 35 g | Karb: 60 g | Yag: 20 g",
        "17:00 Tavuk + pirinc | Kalori: 400 | Protein: 30 g | Karb: 45 g | Yag: 8 g",
        "18:15 Ton baligi + lavas + meyve | Kalori: 300 | Protein: 25 g | Karb: 40 g | Yag: 5 g",
        "20:15 Whey + meyve | Kalori: 200 | Protein: 25 g | Karb: 20 g | Yag: 2 g",
        "21:00 Tavuk + kinoa + salata | Kalori: 400 | Protein: 35 g | Karb: 35 g | Yag: 10 g",
        "23:00 Skyr | Kalori: 150 | Protein: 15 g | Karb: 10 g | Yag: 5 g"
    ];
    const offMeals = [
        "07:00 Yulaf + sut + Skyr | Kalori: 350 | Protein: 25 g | Karb: 40 g | Yag: 8 g",
        "09:00 Skyr + keten + meyve | Kalori: 220 | Protein: 20 g | Karb: 25 g | Yag: 7 g",
        "14:00 Tavuk + salata + zeytinyagi | Kalori: 350 | Protein: 40 g | Karb: 10 g | Yag: 15 g",
        "17:00 Ton baligi + salata | Kalori: 250 | Protein: 30 g | Karb: 5 g | Yag: 10 g",
        "18:30 2 yumurta | Kalori: 150 | Protein: 12 g | Karb: 2 g | Yag: 10 g",
        "21:00 Tavuk + salata | Kalori: 400 | Protein: 35 g | Karb: 10 g | Yag: 15 g",
        "23:00 Skyr | Kalori: 150 | Protein: 15 g | Karb: 10 g | Yag: 5 g"
    ];

    // ========== EGZERSİZ PLANLARI (KISA) ==========
    const workoutPlans = {
        "PAZARTESI": { title: "🏋️ AĞIR GÖĞÜS + TRICEPS", muscleGroups: [
            { name: "🟥 GÖĞÜS", exercises: [{ ex: "Incline Dumbbell Press", sets: 4 }, { ex: "Flat Dumbbell Press", sets: 4 }, { ex: "Cable Crossover", sets: 3 }, { ex: "Chest Press", sets: 3 }] },
            { name: "🔥 TRICEPS", exercises: [{ ex: "Pushdown", sets: 3 }, { ex: "Overhead Extension", sets: 3 }] }
        ] },
        "SALI": { title: "🏋️ SIRT + TRAPEZ", muscleGroups: [
            { name: "🔵 SIRT", exercises: [{ ex: "Lat Pulldown", sets: 4 }, { ex: "Seated Row", sets: 3 }, { ex: "One-Arm Row", sets: 3 }, { ex: "Face Pull", sets: 3 }, { ex: "Shrug", sets: 4 }, { ex: "Rack Pull", sets: 3 }] }
        ] },
        "CARSAMBA": { title: "🏋️ BACAK", muscleGroups: [
            { name: "🟦 BACAK", exercises: [{ ex: "Squat", sets: 4 }, { ex: "Deadlift", sets: 3 }, { ex: "Leg Extension", sets: 3 }, { ex: "Leg Curl", sets: 3 }, { ex: "Calf Raise", sets: 4 }] }
        ] },
        "PERSEMBE": { title: "🏋️ GÖĞÜS 2 + TRICEPS", muscleGroups: [
            { name: "🟪 GÖĞÜS", exercises: [{ ex: "Incline Fly", sets: 3 }, { ex: "Neutral Press", sets: 3 }, { ex: "Pec Deck", sets: 3 }, { ex: "Chest Press", sets: 3 }] },
            { name: "🔥 TRICEPS", exercises: [{ ex: "Close-Grip Press", sets: 3 }, { ex: "Skull Crusher", sets: 3 }] }
        ] },
        "CUMA": { title: "🏋️ OMUZ + BICEPS", muscleGroups: [
            { name: "🟩 OMUZ", exercises: [{ ex: "Lateral Raise", sets: 4 }, { ex: "Bent-Over Raise", sets: 3 }, { ex: "Cable Raise", sets: 3 }, { ex: "Face Pull", sets: 3 }] },
            { name: "💪 BICEPS", exercises: [{ ex: "Barbell Curl", sets: 3 }, { ex: "Incline Curl", sets: 3 }, { ex: "Hammer Curl", sets: 3 }] }
        ] }
    };

    // ========== GÜN İÇERİKLERİNİ OLUŞTUR ==========
    let data = {};
    const workoutDays = ["PAZARTESI", "SALI", "CARSAMBA", "PERSEMBE", "CUMA"];
    const planOrder = [plan1Meals, plan1Meals, plan1Meals, plan2Meals, plan1Meals];
    for (let i = 0; i < workoutDays.length; i++) {
        let day = workoutDays[i];
        let meals = planOrder[i];
        let workout = workoutPlans[day];
        let dayItems = [];
        for (let j = 0; j < meals.length; j++) {
            dayItems.push(meals[j]);
            if (!meals[j].includes("23:00")) dayItems.push("💧 1 bardak su");
            if (meals[j].includes("18:15")) {
                dayItems.push(workout.title);
                for (let g of workout.muscleGroups) {
                    dayItems.push(g.name);
                    for (let ex of g.exercises) dayItems.push({ ex: ex.ex, sets: ex.sets, link: "", notes: "" });
                }
            }
        }
        dayItems.push("💧 4 bardak su");
        data[day] = dayItems;
    }
    for (let day of ["CUMARTESI", "PAZAR"]) {
        let dayItems = [];
        for (let m of offMeals) {
            dayItems.push(m);
            if (!m.includes("23:00")) dayItems.push("💧 1 bardak su");
        }
        dayItems.push("💧 4 bardak su");
        data[day] = dayItems;
    }

    // ========== STATE ==========
    let doneState = {};
    let waterIntake = {};
    let totalSetCount = 0;
    let timerInterval = null;
    let currentDayOpen = null;
    let currentChartType = 'daily';
    let currentSound = null;
    let soundStopFlag = false;
    let setLogs = {};
    let muscleLastTrained = {};
    let db = null;
    let exerciseVideos = {};
    let oneRMHistory = {};
    let workoutPlan = {};
    let dailyMacros = { cal: 0, p: 0, k: 0, f: 0 };

    // ========== MAKRO HESAPLAMA (SADECE İŞARETLİ YEMEKLER) ==========
    function updateDailyMacros() {
        if (!currentDayOpen) return;
        let total = { cal: 0, p: 0, k: 0, f: 0 };
        let items = data[currentDayOpen];
        items.forEach((item, idx) => {
            let key = `${currentDayOpen}|meal|${idx}`;
            if (doneState[key] && typeof item === "string" && !item.includes("💧")) {
                let m = parseFoodMacros(item);
                total.cal += m.cal;
                total.p += m.p;
                total.k += m.k;
                total.f += m.f;
            }
        });
        dailyMacros = total;
        renderMacroBar();
    }

    function renderMacroBar() {
        let bar = document.getElementById("macroBar");
        if (!bar) {
            bar = document.createElement("div");
            bar.id = "macroBar";
            bar.className = "macro-bar";
            let dh = document.getElementById("dayView");
            if (dh && dh.querySelector(".day-header")) dh.querySelector(".day-header").after(bar);
        }
        bar.innerHTML = `<div class="macro-item"><span>🔥</span><b>${Math.round(dailyMacros.cal)}</b><small>Kalori</small></div>
        <div class="macro-item"><span>💪</span><b>${Math.round(dailyMacros.p)}g</b><small>Protein</small></div>
        <div class="macro-item"><span>🌾</span><b>${Math.round(dailyMacros.k)}g</b><small>Karb</small></div>
        <div class="macro-item"><span>🥑</span><b>${Math.round(dailyMacros.f)}g</b><small>Yağ</small></div>`;
    }

    // ========== DİĞER FONKSİYONLAR (KISA) ==========
    function showToast(msg) { let t = document.createElement("div"); t.className="toast"; t.innerText=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1600); }
    function playBeep() { try { let ctx = new (window.AudioContext||window.webkitAudioContext)(); let o = ctx.createOscillator(); o.frequency.value=880; let g = ctx.createGain(); g.gain.value=0.1; o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.1); ctx.resume(); } catch(e){} }
    function stopTimer() { if(timerInterval) clearInterval(timerInterval); let tb=document.getElementById("timerBox"); if(tb) tb.style.display="none"; if(currentSound) currentSound.close(); soundStopFlag=false; }
    function startTimer(sec) { stopTimer(); let rem=sec; let tb=document.getElementById("timerBox"), tn=document.getElementById("timerNum"); if(!tb||!tn) return; tb.style.display="block"; tn.innerText=rem; timerInterval=setInterval(()=>{ if(rem<=1){ clearInterval(timerInterval); tb.style.display="none"; playLongBeep(); showToast("🔔 Dinlenme bitti!"); } else { rem--; tn.innerText=rem; } },1000); }
    function playLongBeep() { if(soundStopFlag) return; try { if(currentSound) currentSound.close(); const ctx = new (window.AudioContext||window.webkitAudioContext)(); currentSound=ctx; const dur=10,int=0.4; let start=ctx.currentTime; const osc=ctx.createOscillator(); const gain=ctx.createGain(); osc.type="square"; osc.frequency.value=880; gain.gain.value=0.18; osc.connect(gain); gain.connect(ctx.destination); osc.start(); for(let i=0;i<dur/int;i++){ let t=start+i*int; gain.gain.setValueAtTime(0.18,t); gain.gain.setValueAtTime(0.00001,t+0.15); } osc.stop(start+dur); ctx.resume(); currentSound={close:()=>{ try{ osc.stop(); ctx.close(); } catch(e){} } }; } catch(e){} }
    function customTimer() { let s=prompt("Saniye:","90"); if(s && !isNaN(parseInt(s)) && parseInt(s)>0) startTimer(parseInt(s)); }
    function getSetLog(day,ex,setNo){ return setLogs[day]?.[ex]?.[setNo]||null; }
    function saveSetLog(day,ex,setNo,weight,reps){ if(!setLogs[day]) setLogs[day]={}; if(!setLogs[day][ex]) setLogs[day][ex]={}; setLogs[day][ex][setNo]={weight,reps}; localStorage.setItem("fitnessSetLogs",JSON.stringify(setLogs)); let m=muscleGroupMap[ex]; if(m){ muscleLastTrained[m]=new Date().toISOString(); localStorage.setItem("muscleLastTrained",JSON.stringify(muscleLastTrained)); renderRecoveryPanel(); } }
    function promptWeightAndReps(day,ex,setNo,defaultW,defaultR,onSave){ let sugg=getSetLog(day,ex,setNo); let defW=defaultW||(sugg?sugg.weight:0); let defR=defaultR||(sugg?sugg.reps:8); let modal=document.createElement("div"); modal.className="modal"; modal.innerHTML=`<div class="modal-content"><h3>⚡ ${ex} - Set ${setNo}</h3><div><label>Tekrar</label><input type="number" id="repsInput" class="input-number-only" value="${defR}"></div><div><label>Ağırlık (kg)</label><input type="number" id="weightInput" class="input-number-only" value="${defW}"></div><div class="modal-buttons"><button class="modal-btn confirm" id="saveBtn">Kaydet</button><button class="modal-btn cancel" onclick="this.closest('.modal').remove()">İptal</button></div></div>`; document.body.appendChild(modal); modal.querySelector("#saveBtn").onclick=()=>{ let w=parseInt(modal.querySelector("#weightInput").value)||0; let r=parseInt(modal.querySelector("#repsInput").value)||1; saveSetLog(day,ex,setNo,w,r); modal.remove(); if(onSave) onSave(w,r); showToast(`✅ Set ${setNo}: ${r} tekrar x ${w} kg`); let setKey=`${day}|set|${ex}|${setNo}`; if(!doneState[setKey]){ doneState[setKey]=true; totalSetCount++; saveDataToLocal(); updateAllStats(); if(currentDayOpen===day) renderDayItems(day); buildHome(); startTimer(90); showToast(`✅ Set ${setNo} tamamlandı! +30 XP`); } else { saveDataToLocal(); if(currentDayOpen===day) renderDayItems(day); } }; }
    function saveDataToLocal(){ localStorage.setItem("fitnessData",JSON.stringify(data)); localStorage.setItem("doneState",JSON.stringify(doneState)); localStorage.setItem("waterIntake",JSON.stringify(waterIntake)); localStorage.setItem("setLogs",JSON.stringify(setLogs)); localStorage.setItem("muscleLastTrained",JSON.stringify(muscleLastTrained)); localStorage.setItem("exerciseVideos",JSON.stringify(exerciseVideos)); localStorage.setItem("oneRMHistory",JSON.stringify(oneRMHistory)); localStorage.setItem("workoutPlan",JSON.stringify(workoutPlan)); }
    function loadDataFromLocal(){ try{ let d=localStorage.getItem("fitnessData"); if(d) data=JSON.parse(d); let ds=localStorage.getItem("doneState"); if(ds) doneState=JSON.parse(ds); let wi=localStorage.getItem("waterIntake"); if(wi) waterIntake=JSON.parse(wi); let sl=localStorage.getItem("setLogs"); if(sl) setLogs=JSON.parse(sl); let ml=localStorage.getItem("muscleLastTrained"); if(ml) muscleLastTrained=JSON.parse(ml); let ev=localStorage.getItem("exerciseVideos"); if(ev) exerciseVideos=JSON.parse(ev); let orm=localStorage.getItem("oneRMHistory"); if(orm) oneRMHistory=JSON.parse(orm); let wp=localStorage.getItem("workoutPlan"); if(wp) workoutPlan=JSON.parse(wp); } catch(e){} }
    function updateAllStats(){ let totalWater=Object.values(waterIntake).reduce((a,b)=>a+b,0); let bestDayScore=0,bestDayName=""; Object.keys(data).forEach(day=>{ let ds=0; Object.keys(doneState).forEach(k=>{ if(k.includes(day)){ if(k.includes("set")) ds+=2; if(k.includes("meal")) ds+=1; } }); if(ds>bestDayScore){ bestDayScore=ds; bestDayName=day; } }); document.getElementById("totalSets").innerText=totalSetCount; document.getElementById("totalWater").innerText=totalWater; document.getElementById("bestDay").innerText=bestDayName||"-"; document.getElementById("totalXP").innerText=totalSetCount*30; let badges=[]; if(totalSetCount>=20) badges.push("🔥 Alev"); if(totalSetCount>=50) badges.push("💪 Demir"); if(totalSetCount>=100) badges.push("👑 Efsane"); if(badges.length===0) badges.push("🔒 20 set yap"); document.getElementById("badgesContainer").innerHTML=badges.map(b=>`<div class="badge">${b}</div>`).join(''); }
    function getDayStats(day){ let total=0,comp=0; let items=data[day]; if(!items) return {total,comp,percent:0}; items.forEach((item,idx)=>{ if(typeof item==="string"){ total++; if(doneState[`${day}|meal|${idx}`]) comp++; } else if(item&&typeof item==="object"&&item.sets){ for(let s=1;s<=item.sets;s++){ total++; if(doneState[`${day}|set|${item.ex}|${s}`]) comp++; } } }); return {total,comp,percent:total===0?0:(comp/total)*100}; }
    function buildHome(){ let grid=document.getElementById("homeGrid"); grid.innerHTML=""; for(let day in data){ let stats=getDayStats(day); let card=document.createElement("div"); card.className="card"; card.innerHTML=`<h3>${day}</h3><div class="progress-bar"><div class="progress-fill" style="width:${stats.percent}%"></div></div><small>${stats.completed}/${stats.total} tamamlandı</small>`; card.onclick=()=>openDay(day); grid.appendChild(card); } let setCard=document.createElement("div"); setCard.className="card settings-card"; setCard.innerHTML=`<h3>AYARLAR</h3><div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div><small>Yönetim & Yedekleme</small>`; setCard.onclick=()=>openSettings(); grid.appendChild(setCard); }
    function openDay(day){ currentDayOpen=day; document.getElementById("homeGrid").style.display="none"; document.getElementById("statsPanel").style.display="none"; document.getElementById("dayView").classList.remove("hidden"); document.getElementById("settingsView").classList.add("hidden"); document.getElementById("dayTitle").innerText=day; renderDayItems(day); updateDailyMacros(); renderRecoveryPanel(); }
    function closeDay(){ stopTimer(); document.getElementById("dayView").classList.add("hidden"); document.getElementById("homeGrid").style.display="grid"; document.getElementById("statsPanel").style.display="block"; updateAllStats(); buildHome(); }
    function openSettings(){ stopTimer(); document.getElementById("homeGrid").style.display="none"; document.getElementById("statsPanel").style.display="none"; document.getElementById("dayView").classList.add("hidden"); document.getElementById("settingsView").classList.remove("hidden"); updateWaterChart(); updateWeeklyChart(); }
    function closeSettings(){ document.getElementById("settingsView").classList.add("hidden"); document.getElementById("homeGrid").style.display="grid"; document.getElementById("statsPanel").style.display="block"; buildHome(); }
    function renderRecoveryPanel(){ let p=document.getElementById("recoveryPanel"); if(!p) return; let muscles=["Göğüs","Sırt","Omuz","Biceps","Triceps","Bacak"]; p.innerHTML=muscles.map(m=>{ let l=muscleLastTrained[m]; let s=l ? ((new Date()-new Date(l))/(1000*3600)<24?"red":(new Date()-new Date(l))/(1000*3600)<48?"orange":"green") : "green"; return `<div class="recovery-item recovery-${s}">${m}${l?` (${Math.floor((new Date()-new Date(l))/(1000*3600))}s)`:" (yok)"}</div>`; }).join(''); }
    function updateQuests(day){ let water=0,meals=0,sets=0; for(let k in doneState){ if(k.includes(day)){ if(k.includes("meal")){ meals++; let idx=parseInt(k.split("|")[2]); let txt=data[day]?.[idx]; if(typeof txt==="string" && txt.includes("💧")) water++; } if(k.includes("set")) sets++; } } let wk=`${day}_water`; let totalWater=(waterIntake[wk]||0)+water; document.getElementById("questWater").innerHTML=`${Math.min(totalWater,8)}/8`; document.getElementById("questMeal").innerHTML=`${Math.min(meals,12)}/12`; document.getElementById("questSet").innerHTML=`${Math.min(sets,20)}/20`; let score=Math.min(totalWater*5+meals*3+sets*2,100); document.getElementById("dailyScoreText").innerText=score; document.getElementById("scoreFill").style.width=score+"%"; document.getElementById("questScore").innerHTML=`${score}/100`; }
    function moveItemUp(day,idx){ if(idx>0){ [data[day][idx],data[day][idx-1]]=[data[day][idx-1],data[day][idx]]; saveDataToLocal(); if(currentDayOpen===day) renderDayItems(day); buildHome(); showToast("⬆️ Taşındı"); } }
    function moveItemDown(day,idx){ if(idx<data[day].length-1){ [data[day][idx],data[day][idx+1]]=[data[day][idx+1],data[day][idx]]; saveDataToLocal(); if(currentDayOpen===day) renderDayItems(day); buildHome(); showToast("⬇️ Taşındı"); } }
    function showAddItemToDay(){ if(!currentDayOpen) return; let modal=document.createElement("div"); modal.className="modal"; modal.innerHTML=`<div class="modal-content"><h3>➕ ${currentDayOpen}</h3><select id="itemTypeSelect"><option value="meal">🍽️ Yemek</option><option value="exercise">💪 Hareket</option></select><input id="itemNameInput" placeholder="Ad"><div id="setsContainer" style="display:none"><input id="itemSetsInput" type="number" placeholder="Set sayısı"></div><div class="modal-buttons"><button class="modal-btn confirm" onclick="addItemToCurrentDay()">Ekle</button><button class="modal-btn cancel" onclick="this.closest('.modal').remove()">İptal</button></div></div>`; document.body.appendChild(modal); let typeSel=document.getElementById("itemTypeSelect"), setsCont=document.getElementById("setsContainer"); typeSel.onchange=()=>{ setsCont.style.display=typeSel.value==="exercise"?"block":"none"; }; }
    function addItemToCurrentDay(){ let type=document.getElementById("itemTypeSelect").value, name=document.getElementById("itemNameInput").value; if(!name){ showToast("Ad girin"); return; } if(type==="meal"){ data[currentDayOpen].push(name); showToast(`✅ "${name}" eklendi`); } else { let sets=parseInt(document.getElementById("itemSetsInput").value); if(!sets){ showToast("Set sayısı girin"); return; } data[currentDayOpen].push({ex:name, sets:sets, link:"", notes:""}); showToast(`✅ "${name} (${sets} set)" eklendi`); } saveDataToLocal(); renderDayItems(currentDayOpen); buildHome(); document.querySelector(".modal").remove(); }
    function resetWeek(){ if(confirm("Tüm haftayı sıfırla? İşaretler gider.")){ doneState={}; waterIntake={}; totalSetCount=0; saveDataToLocal(); if(currentDayOpen) renderDayItems(currentDayOpen); buildHome(); updateAllStats(); updateWaterChart(); updateWeeklyChart(); showToast("Hafta sıfırlandı"); } }
    function getWaterData(){ let days=["PAZARTESI","SALI","CARSAMBA","PERSEMBE","CUMA","CUMARTESI","PAZAR"]; return days.map(d=>({day:d.substring(0,3), amount:waterIntake[`${d}_water`]||0})); }
    function setWaterChartType(t){ currentChartType=t; if(event && event.target) event.target.classList.add("active"); updateWaterChart(); }
    function updateWaterChart(){ let cont=document.getElementById("waterChartContainer"), msg=document.getElementById("waterChartMessage"); if(!cont) return; if(currentChartType==='daily'){ let wd=getWaterData(), maxW=Math.max(...wd.map(d=>d.amount),1); cont.innerHTML='<h4>📊 Günlük Su (bardak)</h4>'; wd.forEach(d=>{ let p=(d.amount/maxW)*100; cont.innerHTML+=`<div class="chart-bar-item"><div class="bar-label">${d.day}</div><div class="bar-fill"><div class="bar" style="width:${p}%">${d.amount}</div></div></div>`; }); msg.innerHTML=`💧 Toplam: ${wd.reduce((a,b)=>a+b.amount,0)} bardak`; } else if(currentChartType==='weekly'){ let tot=Object.values(waterIntake).reduce((a,b)=>a+b,0); cont.innerHTML='<h4>📆 Haftalık Su</h4><div class="chart-bar-item"><div class="bar-label">Bu Hafta</div><div class="bar-fill"><div class="bar" style="width:${Math.min((tot/100)*100,100)}%">${tot}</div></div></div>'; msg.innerHTML=`💧 Bu hafta: ${tot} bardak`; } else { let tot=Object.values(waterIntake).reduce((a,b)=>a+b,0); cont.innerHTML='<h4>📊 Aylık Su</h4><div class="chart-bar-item"><div class="bar-label">Bu Ay</div><div class="bar-fill"><div class="bar" style="width:${Math.min((tot/200)*100,100)}%">${tot}</div></div></div>'; msg.innerHTML=`💧 Bu ay: ${tot} bardak`; } }
    function updateWeeklyChart(){ let cont=document.getElementById("weeklyChartContainer"); if(!cont) return; let days=["PAZARTESI","SALI","CARSAMBA","PERSEMBE","CUMA","CUMARTESI","PAZAR"]; cont.innerHTML="<h4>📈 Haftalık Set Grafiği</h4>"; days.forEach(day=>{ let sets=0; for(let k in doneState) if(k.includes(day) && k.includes("set")) sets++; let w=Math.min((sets/20)*100,100); cont.innerHTML+=`<div class="chart-bar-item"><div class="bar-label">${day.substring(0,3)}</div><div class="bar-fill"><div class="bar" style="width:${w}%">${sets}</div></div></div>`; }); }
    function backupData(){ let exp={data,doneState,waterIntake,totalSetCount,setLogs,muscleLastTrained,exerciseVideos,oneRMHistory,workoutPlan}; let str=JSON.stringify(exp); let a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([str])); a.download=`backup_${Date.now()}.json`; a.click(); showToast("Yedek alındı"); }
    function restoreData(){ let inp=document.createElement("input"); inp.type="file"; inp.accept="application/json"; inp.onchange=e=>{ let file=e.target.files[0]; if(!file) return; let reader=new FileReader(); reader.onload=ev=>{ try{ let imp=JSON.parse(ev.target.result); if(imp.data) data=imp.data; if(imp.doneState) doneState=imp.doneState; if(imp.waterIntake) waterIntake=imp.waterIntake; if(imp.totalSetCount!==undefined) totalSetCount=imp.totalSetCount; if(imp.setLogs) setLogs=imp.setLogs; if(imp.muscleLastTrained) muscleLastTrained=imp.muscleLastTrained; if(imp.exerciseVideos) exerciseVideos=imp.exerciseVideos; if(imp.oneRMHistory) oneRMHistory=imp.oneRMHistory; if(imp.workoutPlan) workoutPlan=imp.workoutPlan; saveDataToLocal(); if(currentDayOpen) renderDayItems(currentDayOpen); buildHome(); updateAllStats(); updateWaterChart(); updateWeeklyChart(); updateDailyMacros(); showToast("Yedek yüklendi"); } catch(err){ alert("Hata"); } }; reader.readAsText(file); }; inp.click(); }
    function addVideoToLibrary(){ let n=document.getElementById("videoExName").value.trim(), l=document.getElementById("videoExLink").value.trim(); if(!n||!l){ showToast("Ad ve link gir"); return; } exerciseVideos[n]=l; saveDataToLocal(); renderVideoLibrary(); showToast("Video eklendi"); }
    function renderVideoLibrary(){ let list=document.getElementById("videoLibraryList"); if(!list) return; let html=""; for(let ex in exerciseVideos) html+=`<div style="background:#2C2C2E; padding:10px; border-radius:10px; margin-bottom:6px;"><strong>${ex}</strong><br>${exerciseVideos[ex]}<button onclick="deleteVideoFromLibrary('${ex}')" style="margin-left:10px; background:#c0392b; border:none; padding:4px 10px; border-radius:20px;">Sil</button></div>`; list.innerHTML=html||"Kütüphane boş"; }

    async function addLocalVideo(ex,day,idx){ let input=document.createElement("input"); input.type="file"; input.accept="video/*"; input.onchange=async(e)=>{ let file=e.target.files[0]; if(file){ let id=`${day}_${ex}_${idx}`; try{ let db=await openDB(); let tx=db.transaction("videos","readwrite"); tx.objectStore("videos").put({id:id, video:file}); showToast("Video kaydedildi"); } catch(e){ showToast("Hata"); } } }; input.click(); }
    async function playLocalVideo(ex,day,idx){ let id=`${day}_${ex}_${idx}`; try{ let db=await openDB(); let res=await new Promise(r=>db.transaction("videos").objectStore("videos").get(id).onsuccess=e=>r(e.target.result)); if(res && res.video){ let url=URL.createObjectURL(res.video); let modal=document.createElement("div"); modal.className="modal"; modal.innerHTML=`<div class="modal-content"><video controls src="${url}" style="width:100%"></video><button onclick="this.closest('.modal').remove()">Kapat</button></div>`; document.body.appendChild(modal); } else showToast("Video yok"); } catch(e){ showToast("Hata"); } }

    function setVideoLink(ex,day,idx){ let link=prompt("YouTube linki:", data[day][idx].link||""); if(link!==null){ data[day][idx].link=link; saveDataToLocal(); if(currentDayOpen===day) renderDayItems(day); showToast("Link kaydedildi"); } }
    function showOneRMForExercise(ex){ let last=null; for(let day in setLogs) for(let e in setLogs[day]) if(e===ex){ let maxSet=Object.values(setLogs[day][e]).reduce((a,b)=>b.weight>a.weight?b:a,{weight:0}); if(maxSet.weight>0) last=maxSet; } if(last && last.weight>0){ let oneRM=Math.round(last.weight*(36/(37-last.reps))); showToast(`1RM: ${oneRM} kg (${last.reps} tekrar × ${last.weight} kg)`); } else showToast("Ağırlık kaydı yok"); }

    function showExerciseNote(ex,day,idx){ let note=data[day][idx].notes||""; let modal=document.createElement("div"); modal.className="modal"; modal.innerHTML=`<div class="modal-content"><h3>📝 ${ex}</h3><textarea id="noteText" rows="4">${note}</textarea><div class="modal-buttons"><button class="modal-btn confirm" onclick="saveNote('${day}',${idx},'${ex}')">Kaydet</button><button class="modal-btn cancel" onclick="this.closest('.modal').remove()">İptal</button></div></div>`; document.body.appendChild(modal); }

    function showMostTrainedMuscle(){ let mc={}; for(let day in setLogs) for(let ex in setLogs[day]){ let m=muscleGroupMap[ex]; if(m) mc[m]=(mc[m]||0)+Object.keys(setLogs[day][ex]).length; } let top=Object.entries(mc).sort((a,b)=>b[1]-a[1])[0]; alert(top?`En çok ${top[0]} (${top[1]} set)`:"Veri yok"); }
    function showTotalWorkoutTime(){ let totalSec=totalSetCount*90; let h=Math.floor(totalSec/3600), m=Math.floor((totalSec%3600)/60); alert(`Toplam antrenman süresi (yakl.): ${h} saat ${m} dakika`); }
    function openPlannerModal(){ let today=new Date(); let year=today.getFullYear(), month=today.getMonth(); let first=new Date(year,month,1); let last=new Date(year,month+1,0); let days=[]; for(let i=0;i<first.getDay();i++) days.push(null); for(let i=1;i<=last.getDate();i++) days.push(new Date(year,month,i)); let html=`<div class="modal-content"><h3>📅 Planlayıcı (${year}-${month+1})</h3><div class="calendar-grid" style="display:grid; grid-template-columns:repeat(7,1fr); gap:5px;">`; ["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"].forEach(w=>html+=`<div style="text-align:center">${w}</div>`); for(let d of days){ if(!d) html+=`<div></div>`; else{ let ds=d.toISOString().split('T')[0]; let plan=workoutPlan[ds]; let cls="calendar-day"; if(plan) cls+= plan.rest?" rest":" workout"; if(ds===today.toISOString().split('T')[0]) cls+=" today"; html+=`<div class="${cls}" style="background:#2C2C2E; padding:8px; text-align:center; border-radius:12px; cursor:pointer;" onclick="setPlan('${ds}')">${d.getDate()}</div>`; } } html+=`</div><button class="modal-btn confirm" onclick="this.closest('.modal').remove()">Kapat</button></div>`; let modal=document.createElement("div"); modal.className="modal"; modal.innerHTML=html; document.body.appendChild(modal); }
    function setPlan(dateStr){ let type=prompt("Plan: 1 Antrenman (kas), 2 Dinlenme, 3 Sil", "1"); if(type==="1"){ let muscle=prompt("Kas grubu:"); if(muscle) workoutPlan[dateStr]={ type:muscle, rest:false }; } else if(type==="2") workoutPlan[dateStr]={ rest:true }; else delete workoutPlan[dateStr]; saveDataToLocal(); document.querySelector(".modal").remove(); openPlannerModal(); }
    function openMealPlannerModal(){ let modal=document.createElement("div"); modal.className="modal"; modal.innerHTML=`<div class="modal-content"><h3>🍽️ Haftalık Menü</h3><div id="weeklyMealPlan"></div><input id="calGoal" placeholder="Günlük kalori hedefi"><button onclick="suggestMeal()">Öneri</button><button class="modal-btn cancel" onclick="this.closest('.modal').remove()">Kapat</button></div>`; document.body.appendChild(modal); renderWeeklyMeal(); }
    function renderWeeklyMeal(){ let cont=document.getElementById("weeklyMealPlan"); if(!cont) return; let html=""; for(let [day,items] of Object.entries(data)){ let meals=items.filter(i=>typeof i==="string" && !i.includes("💧") && !i.includes("🏋️")); html+=`<strong>${day}</strong><ul>${meals.map(m=>`<li>${m}</li>`).join('')}</ul>`; } cont.innerHTML=html; }
    function suggestMeal(){ let goal=parseInt(document.getElementById("calGoal")?.value)||2500; alert(`${goal} kcal için örnek menü: Kahvaltı 400, Öğle 550, Ara 250, Akşam 500, Gece 150 -> toplam 1850, kalan için atıştırmalık.`); }
    function openWarmupModal(){ alert("🔥 Dinamik Isınma (5 dk): Kol çevirme, bacak sallama, yerinde yürüme, kedi-deve\n❄️ Soğuma (5 dk): Hamstring esneme, quad esneme, göğüs açma, omuz esneme"); }
    async function exportReportPDF(){ let el=document.getElementById("statsPanel").cloneNode(true); html2pdf().from(el).save(); }
    function exportToExcelFull(){ let rows=[["Gün","Tip","Ad"]]; for(let day in data) for(let it of data[day]) rows.push([day, typeof it==="string"?"Yemek":"Egzersiz", typeof it==="string"?it:it.ex]); let ws=XLSX.utils.aoa_to_sheet(rows); let wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Rapor"); XLSX.writeFile(wb,`rapor_${new Date().toISOString().slice(0,10)}.xlsx`); }
    function openBarcodeFoodModal(){ let modal=document.createElement("div"); modal.className="modal"; modal.innerHTML=`<div class="modal-content"><h3>📷 Barkod ile Besin Ekle</h3><input id="barcodeInput" placeholder="Barkod"><button onclick="fetchBarcode()">Ara</button><div id="barcodeResult"></div><button class="modal-btn cancel" onclick="this.closest('.modal').remove()">Kapat</button></div>`; document.body.appendChild(modal); }
    async function fetchBarcode(){ let barcode=document.getElementById("barcodeInput").value.trim(); if(!barcode) return; try{ let res=await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`); let data=await res.json(); if(data.status===1){ let p=data.product; let name=p.product_name||"Bilinmiyor"; let nut=p.nutriments||{}; let kcal=nut["energy-kcal"]||0; let prot=nut.proteins||0; let carb=nut.carbohydrates||0; let fat=nut.fat||0; document.getElementById("barcodeResult").innerHTML=`✅ ${name}<br>🔥 ${kcal} kcal, 💪 ${prot}g, 🌾 ${carb}g, 🥑 ${fat}g<br><button onclick="addBarcodeFood('${name}',${kcal},${prot},${carb},${fat})">Güne Ekle</button>`; } else document.getElementById("barcodeResult").innerHTML="❌ Bulunamadı"; } catch(e){ document.getElementById("barcodeResult").innerHTML="Hata"; } }
    function addBarcodeFood(name,kcal,prot,carb,fat){ if(!currentDayOpen) return; let newItem = `${name} | Kalori: ${kcal} | Protein: ${prot} g | Karb: ${carb} g | Yag: ${fat} g`; data[currentDayOpen].push(newItem); saveDataToLocal(); renderDayItems(currentDayOpen); updateDailyMacros(); showToast(`${name} eklendi`); document.querySelector(".modal").remove(); }

    const muscleGroupMap = { "Incline Dumbbell Press":"Göğüs","Flat Dumbbell Press":"Göğüs","Cable Crossover":"Göğüs","Chest Press":"Göğüs","Pushdown":"Triceps","Overhead Extension":"Triceps","Lat Pulldown":"Sırt","Seated Row":"Sırt","One-Arm Row":"Sırt","Face Pull":"Omuz","Shrug":"Sırt","Rack Pull":"Sırt","Squat":"Bacak","Deadlift":"Bacak","Leg Extension":"Bacak","Leg Curl":"Bacak","Calf Raise":"Bacak","Incline Fly":"Göğüs","Neutral Press":"Göğüs","Pec Deck":"Göğüs","Close-Grip Press":"Triceps","Skull Crusher":"Triceps","Lateral Raise":"Omuz","Bent-Over Raise":"Omuz","Cable Raise":"Omuz","Barbell Curl":"Biceps","Incline Curl":"Biceps","Hammer Curl":"Biceps" };

    function renderDayItems(day){
        let cont=document.getElementById("dayItems");
        cont.innerHTML="";
        let items=data[day];
        if(!items) return;
        items.forEach((item,idx)=>{
            if(typeof item==="string"){
                let div=document.createElement("div");
                div.className="item";
                div.innerHTML=`<div class="move-buttons"><button class="move-btn" onclick="moveItemUp('${day}',${idx})">⬆️</button><button class="move-btn" onclick="moveItemDown('${day}',${idx})">⬇️</button></div><span>${item}</span>`;
                let key=`${day}|meal|${idx}`;
                if(doneState[key]) div.classList.add("done");
                div.onclick=(e)=>{
                    if(e.target.classList.contains('move-btn')) return;
                    if(doneState[key]){
                        delete doneState[key];
                        div.classList.remove("done");
                        showToast("❌ Kaldırıldı");
                    } else {
                        doneState[key]=true;
                        div.classList.add("done");
                        if(item.includes("💧")){
                            let wk=`${day}_water`;
                            waterIntake[wk]=(waterIntake[wk]||0)+1;
                            updateWaterChart();
                            updateWeeklyChart();
                            showToast("💧 +1 su");
                        } else showToast("✅ Tamamlandı");
                    }
                    saveDataToLocal();
                    updateQuests(day);
                    updateAllStats();
                    buildHome();
                    updateDailyMacros();
                };
                cont.appendChild(div);
            } else if(item && typeof item==="object" && item.ex){
                let titleDiv=document.createElement("div");
                titleDiv.className="ex-title";
                titleDiv.innerHTML=`<span>💪 ${item.ex}</span><div class="ex-title-buttons">
                    <button onclick="openExerciseVideo('${item.ex}','${item.link||""}')">📹 Video</button>
                    <button onclick="addLocalVideo('${item.ex}','${day}',${idx})">📂 Yerel Ekle</button>
                    <button onclick="playLocalVideo('${item.ex}','${day}',${idx})">▶️ Yerel Oynat</button>
                    <button onclick="removeLocalVideo('${item.ex}','${day}',${idx})">🗑️ Yerel Sil</button>
                    <button onclick="setVideoLink('${item.ex}','${day}',${idx})">🔗 Link</button>
                    <button onclick="showAlternatives('${item.ex}')">Diğer</button>
                    <button onclick="showExerciseNote('${item.ex}','${day}',${idx})">Not</button>
                    <button onclick="showOneRMForExercise('${item.ex}')">1RM</button>
                </div>`;
                cont.appendChild(titleDiv);
                for(let s=1;s<=item.sets;s++){
                    let setDiv=document.createElement("div");
                    setDiv.className="set";
                    let log=getSetLog(day,item.ex,s);
                    let weightInfo=log?`${log.reps} tekrar × ${log.weight} kg`:"Ağırlık gir";
                    setDiv.innerHTML=`<div class="move-buttons"><button class="move-btn" onclick="moveItemUp('${day}',${idx})">⬆️</button><button class="move-btn" onclick="moveItemDown('${day}',${idx})">⬇️</button></div><span>Set ${s}</span><span class="set-info">${weightInfo}</span><span>⏱️ Dinlenme</span>`;
                    let setKey=`${day}|set|${item.ex}|${s}`;
                    if(doneState[setKey]) setDiv.classList.add("done");
                    setDiv.onclick=(function(snum,exName){
                        return function(ev){
                            if(ev.target.classList.contains('move-btn')) return;
                            if(doneState[setKey]){
                                if(confirm("Set iptal?")){
                                    delete doneState[setKey];
                                    totalSetCount--;
                                    saveDataToLocal();
                                    updateAllStats();
                                    renderDayItems(day);
                                    buildHome();
                                    updateDailyMacros();
                                    showToast("Set iptal");
                                }
                                return;
                            }
                            let existing=getSetLog(day,exName,snum);
                            promptWeightAndReps(day,exName,snum,existing?.weight,existing?.reps||8,()=>{
                                renderDayItems(day);
                                updateAllStats();
                                buildHome();
                                updateDailyMacros();
                            });
                        };
                    })(s,item.ex);
                    cont.appendChild(setDiv);
                }
            }
        });
        updateQuests(day);
    }

    loadDataFromLocal();
    buildHome();
    updateAllStats();
    updateWaterChart();
    updateWeeklyChart();
    document.getElementById("timerCloseBtn").onclick=stopTimer;
    document.getElementById("timerCustomBtn").onclick=customTimer;
    document.getElementById("stopSoundBtn").onclick=()=>{ soundStopFlag=true; if(currentSound) currentSound.close(); };
</script>
</body>
