<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Fitness Pro - Günlük Takip</title>
<style>
* {
    box-sizing: border-box;
    user-select: none;
}
html, body {
    height: 100%;
    margin: 0;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: #0b0b0b;
    color: #eee;
}
h1 {
    text-align: center;
    color: #00ffc3;
    margin: 10px 0;
    font-size: 1.8rem;
}
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 12px;
}
.card {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #1f1f1f, #121212);
    border-radius: 24px;
    text-align: center;
    cursor: pointer;
    color: #00ff99;
    font-weight: bold;
    font-size: 1.3rem;
    padding: 20px;
    min-height: 100px;
}
.card:active {
    transform: scale(0.97);
    background: #2a2a2a;
}
.hidden {
    display: none;
}
.topbar {
    display: flex;
    justify-content: space-between;
    padding: 12px;
    gap: 10px;
}
.btn {
    padding: 10px 20px;
    border: none;
    border-radius: 40px;
    font-weight: bold;
    cursor: pointer;
}
.back {
    background: #ff0055;
    color: white;
}
.summary-btn {
    background: #2c2c2c;
    color: #00ffc3;
}
.dayTitle {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    color: #00ffc3;
    margin: 10px;
}
.item, .set {
    background: #1e1e1e;
    margin: 8px 12px;
    padding: 14px;
    border-radius: 20px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
}
.item.done, .set.done {
    background: #003d2a;
    text-decoration: line-through;
}
.ex-title {
    color: #00ffc3;
    margin: 12px 12px 0 12px;
    font-size: 1.2rem;
    border-left: 4px solid #00ffc3;
    padding-left: 10px;
}
.timerBox {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #111;
    padding: 15px;
    border-radius: 24px;
    border: 2px solid #00ffc3;
    text-align: center;
}
.timerNum {
    font-size: 32px;
    font-weight: bold;
}
.toast {
    position: fixed;
    bottom: 30%;
    left: 50%;
    transform: translateX(-50%);
    background: #00ffc3;
    color: black;
    padding: 10px 20px;
    border-radius: 50px;
    z-index: 999;
}
</style>
</head>
<body>

<h1>💪 FITNESS PRO</h1>

<div id="home" class="grid"></div>

<div id="dayView" class="hidden">
    <div class="topbar">
        <button class="btn back" id="backBtn">⬅ Geri</button>
        <button class="btn summary-btn" id="showSummaryBtn">📊 Özet</button>
    </div>
    <div id="dayTitle" class="dayTitle"></div>
    <div id="items"></div>
    <div id="summaryPanel" class="hidden" style="background:#1a1a1a; margin:12px; padding:12px; border-radius:20px;"></div>
</div>

<div class="timerBox" id="timerBox" style="display:none;">
    <div id="timerNum" class="timerNum">90</div>
    <button id="timerCloseBtn" style="margin-top:5px;">Kapat</button>
</div>

<script>
// GÜNLER VE İÇERİKLERİ
const data = {
    "Pazartesi": ["07:00 Kahve", "💧 Su", "09:00 Yumurta", "🏋️ Göğüs Antrenmanı", {ex:"Bench Press", sets:3}],
    "Salı": ["07:00 Kahve", "💧 Su", "09:00 Yulaf", "🏋️ Sırt Antrenmanı", {ex:"Lat Pulldown", sets:3}],
    "Çarşamba": ["07:00 Kahve", "💧 Su", "09:00 Muz", "🏃 Kardiyo"],
    "Perşembe": ["07:00 Kahve", "💧 Su", "09:00 Yumurta", "🏋️ Bacak Antrenmanı", {ex:"Squat", sets:3}],
    "Cuma": ["07:00 Kahve", "💧 Su", "09:00 Yulaf", "🏋️ Omuz Antrenmanı", {ex:"Shoulder Press", sets:3}],
    "Cumartesi": ["07:00 Kahve", "💧 Su", "09:00 Muz", "🏃 Aktif Dinlenme"],
    "Pazar": ["08:00 Kahve", "💧 Su", "10:00 Brunch", "🧘 Dinlenme"]
};

let doneState = {};

function saveData() {
    localStorage.setItem("fitnessDone", JSON.stringify(doneState));
}

function loadData() {
    let saved = localStorage.getItem("fitnessDone");
    if(saved) doneState = JSON.parse(saved);
}

function showToast(msg) {
    let t = document.createElement("div");
    t.className = "toast";
    t.innerText = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 1500);
}

function renderDay(day) {
    let container = document.getElementById("items");
    container.innerHTML = "";
    let items = data[day];
    
    items.forEach((item, idx) => {
        if(typeof item === "string") {
            let div = document.createElement("div");
            div.className = "item";
            div.innerHTML = `<span>${item}</span>`;
            let key = day + "|" + idx;
            if(doneState[key]) div.classList.add("done");
            div.onclick = () => {
                if(doneState[key]) {
                    delete doneState[key];
                    div.classList.remove("done");
                } else {
                    doneState[key] = true;
                    div.classList.add("done");
                    if(item.includes("💧")) showToast("💧 Su içildi +1");
                    else showToast("✅ Tamamlandı");
                }
                saveData();
            };
            container.appendChild(div);
        }
        else if(item.ex) {
            let title = document.createElement("div");
            title.className = "ex-title";
            title.innerText = item.ex;
            container.appendChild(title);
            
            for(let i=1; i<=item.sets; i++) {
                let setDiv = document.createElement("div");
                setDiv.className = "set";
                setDiv.innerHTML = `<span>Set ${i}</span><span>⏱️ 60sn</span>`;
                let setKey = day + "|set|" + item.ex + "|" + i;
                if(doneState[setKey]) setDiv.classList.add("done");
                setDiv.onclick = () => {
                    if(doneState[setKey]) {
                        delete doneState[setKey];
                        setDiv.classList.remove("done");
                    } else {
                        doneState[setKey] = true;
                        setDiv.classList.add("done");
                        showToast(`Set ${i} tamamlandı!`);
                        // Timer göster
                        document.getElementById("timerBox").style.display = "block";
                        let sec = 60;
                        let timerNum = document.getElementById("timerNum");
                        let interval = setInterval(() => {
                            sec--;
                            timerNum.innerText = sec;
                            if(sec <= 0) {
                                clearInterval(interval);
                                document.getElementById("timerBox").style.display = "none";
                                showToast("🔔 Dinlenme bitti!");
                            }
                        }, 1000);
                        setTimeout(() => {
                            clearInterval(interval);
                            document.getElementById("timerBox").style.display = "none";
                        }, 60000);
                    }
                    saveData();
                };
                container.appendChild(setDiv);
            }
        }
    });
    
    // Özet göster
    let summary = document.getElementById("summaryPanel");
    let total = items.length;
    let done = 0;
    items.forEach((item, idx) => {
        let key = day + "|" + idx;
        if(doneState[key]) done++;
    });
    summary.innerHTML = `📊 Tamamlanan: ${done}/${total}`;
}

let currentDay = null;

function openDay(day) {
    currentDay = day;
    document.getElementById("home").style.display = "none";
    document.getElementById("dayView").classList.remove("hidden");
    document.getElementById("dayTitle").innerText = day;
    renderDay(day);
}

function goBack() {
    document.getElementById("home").style.display = "grid";
    document.getElementById("dayView").classList.add("hidden");
}

// Ana ekran
function buildHome() {
    let homeDiv = document.getElementById("home");
    homeDiv.innerHTML = "";
    for(let day in data) {
        let card = document.createElement("div");
        card.className = "card";
        card.innerText = day;
        card.onclick = () => openDay(day);
        homeDiv.appendChild(card);
    }
}

document.getElementById("backBtn").onclick = goBack;
document.getElementById("showSummaryBtn").onclick = () => {
    let panel = document.getElementById("summaryPanel");
    panel.classList.toggle("hidden");
};
document.getElementById("timerCloseBtn").onclick = () => {
    document.getElementById("timerBox").style.display = "none";
};

loadData();
buildHome();
</script>
</body>
</html>
