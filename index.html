<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Fitness Pro</title>
    <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js">
    </script>
    <style>
        :root {
            --green: #2ecc51;
            --blue: #2e8aff;
            --yellow: #FFCC00;
            --orange: #FF9500;
            --red: #FF3B30;
            --bg: #000;
            --card: #1C1C1E;
            --card2: #2C2C2E;
            --text: #fff;
            --text2: #8E8E93;
            --radius: 14px;
            --radius-sm: 10px;
            --radius-full: 22px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            font-size: 16px;
            min-height: 100vh;
            font-weight: 500;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 20px;
        }
        .app-header {
            background: #000;
            padding: 12px 16px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
        }
        .app-header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #2e8aff, #5ba0ff, #1a6fff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(46, 138, 255, 0.6);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 14px;
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .card:active {
            transform: scale(0.97);
            background: #2C2C2E;
        }
        .card h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #2ecc51;
        }
        .card.settings-card h3 {
            color: #007AFF;
        }
        .progress-bar {
            width: 100%;
            height: 5px;
            background: #2C2C2E;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-fill {
            height: 100%;
            background: #34C759;
            transition: width 0.3s;
            border-radius: 8px;
        }
        small {
            font-size: 0.7rem;
            color: #8E8E93;
            display: block;
            margin-top: 6px;
        }
        .day-view {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 1000;
            overflow-y: auto;
            padding-bottom: 120px;
            max-width: 500px;
            margin: 0 auto;
        }
        .day-header {
            background: #000;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
        }
        .back-btn,
        .add-item-btn {
            background: #34C759;
            border: none;
            padding: 8px 16px;
            border-radius: 22px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #000;
            cursor: pointer;
        }
        .day-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #FFF;
        }
        .hedef-card {
            background: #1C1C1E;
            border-radius: 12px;
            padding: 12px 14px;
            margin: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .hedef-card .hedef-baslik {
            font-weight: 700;
            font-size: 0.85em;
            text-align: center;
            color: #fff;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .hedef-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 5px;
            font-size: 0.8em;
        }
        .hedef-label {
            width: 50px;
            text-align: right;
            font-weight: 600;
            color: #FFCC00;
            flex-shrink: 0;
        }
        .hedef-bar-wrap {
            flex: 1;
            height: 13px;
            background: #2C2C2E;
            border-radius: 8px;
            overflow: hidden;
        }
        .hedef-bar-fill {
            height: 100%;
            border-radius: 8px;
            transition: width 0.4s;
        }
        .hedef-bar-fill.protein {
            background: #34C759;
        }
        .hedef-bar-fill.karb {
            background: #FF9500;
        }
        .hedef-bar-fill.yag {
            background: #FF3B30;
        }
        .hedef-bar-fill.kalori {
            background: #007AFF;
        }
        .hedef-val {
            width: 85px;
            font-size: 0.75em;
            font-weight: 700;
            color: #FFCC00;
            flex-shrink: 0;
            text-align: left;
            white-space: nowrap;
        }
        .hedef-uyari {
            font-size: 0.7em;
            color: #FF9500;
            text-align: center;
            margin-top: 4px;
        }
        .kas-durum-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 8px 12px 0;
        }
        .kas-durum-item {
            background: #1C1C1E;
            border-radius: 10px;
            padding: 10px 4px;
            text-align: center;
            font-size: 0.78em;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #FFCC00;
        }
        .kas-durum-item .saat {
            font-weight: 700;
            font-size: 0.85em;
        }
        .item,
        .set {
            background: #1C1C1E;
            margin: 6px 12px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.85em;
        }
        .set {
            cursor: pointer;
            border-left: 3px solid #34C759;
        }
        .set.done,
        .item.done {
            background: #1a3a26;
            border-color: #34C759;
            color: #34C759;
            text-decoration: line-through;
        }
        .set.done::after,
        .item.done::after {
            content: " ✓";
            color: #34C759;
            font-weight: 600;
        }
        .set span,
        .item span {
            font-weight: 600;
            color: #FFF;
            flex: 1;
        }
        .ex-title {
            background: #1C1C1E;
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            margin: 8px 12px 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .ex-title>span {
            flex: 1;
            font-weight: 600;
            color: #34C759;
            font-size: 0.9rem;
        }
        .ex-buttons-row {
            display: grid;
            gap: 5px;
            width: 100%;
            margin-top: 4px;
        }
        .ex-buttons-row.top-row {
            grid-template-columns: repeat(2, 1fr);
        }
        .ex-buttons-row.bottom-row {
            grid-template-columns: repeat(3, 1fr);
        }
        .ex-buttons-row button {
            background: #000;
            border: 1px solid rgba(255, 204, 0, 0.4);
            padding: 8px 0;
            border-radius: 20px;
            color: #FFCC00;
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
        }
        .ex-buttons-row button:active {
            background: #1a1a00;
            border-color: #FFCC00;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }
        .move-buttons {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .move-btn {
            background: rgba(255, 255, 255, 0.12);
            border: none;
            font-size: 0.85rem;
            cursor: pointer;
            padding: 3px 5px;
            border-radius: 8px;
            color: #FFF;
        }
        .set-info {
            font-size: 0.7rem;
            font-weight: 600;
            color: #FF9500;
            background: #2C2C2E;
            padding: 3px 8px;
            border-radius: 16px;
            margin-left: 4px;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(8px);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background: #1C1C1E;
            border-radius: 18px;
            padding: 20px;
            max-width: 450px;
            width: 100%;
            color: white;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content input,
        .modal-content select,
        .modal-content textarea {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            background: #2C2C2E;
            border: none;
            border-radius: 22px;
            color: white;
            font-family: inherit;
            font-size: 0.9em;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 22px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9em;
        }
        .modal-btn.confirm {
            background: #34C759;
            color: #000;
        }
        .modal-btn.cancel {
            background: #FF3B30;
            color: white;
        }
        .hidden {
            display: none !important;
        }
        .toast {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: #1c1c1e;
            color: white;
            padding: 10px 20px;
            border-radius: 22px;
            font-weight: 600;
            z-index: 2000;
            animation: fadeOut 1.5s forwards;
            font-size: 0.8rem;
            border: 1px solid #34C759;
        }
        @keyframes fadeOut {
            0% {
                opacity: 1;
                bottom: 30%;
            }
            70% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                bottom: 40%;
                display: none;
            }
        }
        .input-number-only {
            width: 100%;
            padding: 12px;
            font-size: 0.95rem;
            text-align: center;
            background: #2C2C2E;
            color: white;
            border: none;
            border-radius: 22px;
        }
        .timer-box {
            position: fixed;
            bottom: 100px;
            right: 16px;
            background: rgba(28, 28, 30, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 14px 18px;
            text-align: center;
            z-index: 2000;
            min-width: 120px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .timer-num {
            font-size: 36px;
            font-weight: 700;
            font-family: monospace;
            color: #FFCC00;
        }
        .timer-buttons {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            justify-content: center;
        }
        .timer-btn {
            background: #3a3a3c;
            border: none;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
            color: #FFCC00;
            cursor: pointer;
            font-size: 0.75em;
        }
        .stop-sound-btn {
            background: #FF3B30;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.65em;
            cursor: pointer;
            margin-top: 6px;
        }
        .body-stats {
            background: #1C1C1E;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .body-stats h3 {
            color: #FFCC00;
            font-size: 0.85em;
            margin-bottom: 6px;
        }
        .measure-input {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 7px 0;
        }
        .measure-input label {
            flex: 1;
            font-weight: 600;
            font-size: 0.8em;
            color: #FFCC00;
        }
        .measure-input input {
            flex: 2;
            padding: 8px;
            background: #2C2C2E;
            border: none;
            border-radius: 20px;
            color: white;
            text-align: center;
            font-size: 0.82em;
        }
        .photo-upload {
            display: flex;
            gap: 8px;
        }
        .photo-upload button {
            background: #34C759;
            border: none;
            padding: 8px 10px;
            border-radius: 20px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.78em;
            flex: 1;
        }
        .before-after {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
        .before-after div {
            text-align: center;
            background: #2C2C2E;
            border-radius: 10px;
            padding: 8px;
            font-size: 0.75em;
        }
        .before-after img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 4px;
        }
        .settings-card {
            background: #1C1C1E;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .settings-card h3 {
            color: #34C759;
            font-size: 0.82em;
            text-align: center;
            margin-bottom: 8px;
        }
        .settings-btn {
            padding: 10px;
            border-radius: 22px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-size: 0.82em;
            width: 100%;
            margin-top: 5px;
        }
        .settings-btn.green {
            background: #34C759;
            color: #000;
        }
        .settings-btn.blue {
            background: #007AFF;
            color: #fff;
        }
        .settings-btn.red {
            background: #FF3B30;
            color: #fff;
        }
        .settings-input {
            width: 100%;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #1f1f1f;
            color: #fff;
            font-size: 0.82em;
            outline: none;
            margin-bottom: 5px;
            text-align: center;
        }
        .settings-input:focus {
            border-color: #34C759;
            box-shadow: 0 0 6px rgba(52, 199, 89, 0.3);
        }
        .liste-item {
            background: #2C2C2E;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82em;
        }
        .takviye-row {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #1f1f1f;
            border-radius: 20px;
            padding: 6px 6px 6px 12px;
            margin-bottom: 4px;
            font-size: 0.8em;
        }
        .takviye-ad {
            flex: 1;
            color: #ddd;
        }
        .takviye-zaman {
            color: #34C759;
            font-weight: 600;
            margin-right: 2px;
            font-size: 0.75em;
        }
        .sil-btn {
            background: transparent;
            border: none;
            color: #FF3B30;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.75em;
        }
        .urun-card {
            background: #2C2C2E;
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
        }
        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        video {
            width: 100%;
            border-radius: 16px;
            margin-top: 10px;
            background: #000;
        }
        .hafta-btn {
            display: block;
            width: calc(100% - 28px);
            margin: 6px 14px 14px;
            background: #FFCC00;
            border: none;
            padding: 12px;
            border-radius: 22px;
            color: #000;
            font-weight: 700;
            font-size: 0.9em;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
        }
        .hafta-btn:active {
            transform: scale(0.97);
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div id="appContent">
        <div class="app-header"><h1>🔥 FITNESS PRO</h1></div>
        <div id="homeGrid" class="grid"></div>
        <button class="hafta-btn" onclick="alert('Geçmiş haftalar: Tarayıcı deposunda kayıtlı.')">📅 HAFTA GEÇMİŞİ</button>

        <div id="dayView" class="day-view hidden">
            <div class="day-header">
                <button class="back-btn" onclick="closeDay()">← Geri</button>
                <div class="day-title" id="dayTitle"></div>
                <button class="add-item-btn" onclick="showAddItemToDay()">+ Ekle</button>
            </div>
            <div id="dayHedefKart" class="hedef-card"></div>
            <div id="dayKasDurum" class="kas-durum-grid"></div>
            <div id="dayItems"></div>
        </div>

        <div id="timerBox" class="timer-box" style="display:none;">
            <div class="timer-num" id="timerNum">90</div>
            <div style="font-size:10px;color:#aaa;">⏱️ Dinlenme</div>
            <div class="timer-buttons">
                <button class="timer-btn" onclick="stopTimer()">Kapat</button>
                <button class="timer-btn" onclick="customTimer()">Ayarla</button>
            </div>
            <button class="stop-sound-btn" onclick="stopSound()">🔇 Sesi Durdur</button>
        </div>

        <div id="settingsView" class="day-view hidden">
            <div class="day-header">
                <button class="back-btn" onclick="closeSettings()">← Geri</button>
                <div class="day-title">AYARLAR</div>
                <div style="width:50px;"></div>
            </div>
            <div style="padding:12px;">
                <div class="settings-card">
                    <h3>📋 YEMEK LİSTEM</h3>
                    <div id="listeContainer"></div>
                    <button id="yeniListeBtn" class="settings-btn blue">➕ Yeni Liste</button>
                    <div id="aktifGosterge" style="margin-top:8px;padding:6px;background:#2C2C2E;border-radius:20px;text-align:center;font-size:0.8em;"></div>
                </div>
                <div class="settings-card">
                    <h3>📷 KAMERA İLE BARKOD OKU</h3>
                    <button id="kameraAcBtn" class="settings-btn blue">📷 Kamerayı Aç</button>
                    <button id="kameraKapatBtn" class="settings-btn red hidden">⏹️ Kamerayı Kapat</button>
                    <video id="barcodeVideo" autoplay playsinline style="display:none;margin-top:8px;"></video>
                    <div id="kameraDurum" style="font-size:11px;color:#FF9500;margin-top:6px;"></div>
                    <div id="urunSonuc" style="margin-top:8px;"></div>
                </div>
                <div class="settings-card">
                    <h3>🍽️ SEÇİLİ LİSTEDEKİLER</h3>
                    <div id="secilenUrunler"></div>
                    <div id="secilenToplam" style="margin-top:8px;font-size:11px;color:#aaa;"></div>
                </div>
                <div class="settings-card">
                    <h3>🎯 GÜNLÜK HEDEFLER</h3>
                    <div><label style="color:#FFCC00;font-size:0.78em;font-weight:600;">Protein (g)</label><input type="number" id="targetProtein" value="160" class="settings-input"></div>
                    <div><label style="color:#FFCC00;font-size:0.78em;font-weight:600;">Karbonhidrat (g)</label><input type="number" id="targetCarbs" value="250" class="settings-input"></div>
                    <div><label style="color:#FFCC00;font-size:0.78em;font-weight:600;">Yağ (g)</label><input type="number" id="targetFat" value="70" class="settings-input"></div>
                    <div><label style="color:#FFCC00;font-size:0.78em;font-weight:600;">Kalori</label><input type="number" id="targetCal" value="2500" class="settings-input"></div>
                    <button id="hedefKaydetBtn" class="settings-btn green">💾 Kaydet</button>
                </div>
                <div class="body-stats">
                    <h3>📏 VÜCUT ÖLÇÜLERİ</h3>
                    <div class="measure-input"><label>Kilo (kg)</label><input type="number" id="bodyWeight" step="0.1" placeholder="kg"></div>
                    <div class="measure-input"><label>Bel (cm)</label><input type="number" id="bodyWaist" step="0.5" placeholder="cm"></div>
                    <div class="measure-input"><label>Göğüs (cm)</label><input type="number" id="bodyChest" step="0.5" placeholder="cm"></div>
                    <div class="measure-input"><label>Kol (cm)</label><input type="number" id="bodyArm" step="0.5" placeholder="cm"></div>
                    <div class="measure-input"><label>Bacak (cm)</label><input type="number" id="bodyLeg" step="0.5" placeholder="cm"></div>
                    <button onclick="saveBodyMeasurements()" class="settings-btn green">💾 Kaydet</button>
                    <h3 style="margin-top:14px;">📸 FOTOĞRAF TAKİBİ</h3>
                    <div class="photo-upload">
                        <button onclick="uploadPhoto('before')">📷 ÖNCE</button>
                        <button onclick="uploadPhoto('after')">📷 SONRA</button>
                    </div>
                    <div class="before-after" id="photoContainer">
                        <div><strong>📸 ÖNCE</strong><br><small>Fotoğraf yok</small></div>
                        <div><strong>📸 SONRA</strong><br><small>Fotoğraf yok</small></div>
                    </div>
                    <div id="sliderContainer" style="margin-top:8px;"></div>
                </div>
                <div class="settings-card">
                    <h3>💊 SUPPLEMENT</h3>
                    <div id="supplementList" style="margin-bottom:8px;"></div>
                    <input type="text" id="newSupplementName" placeholder="Takviye adı" class="settings-input">
                    <input type="text" id="newSupplementTime" placeholder="Zaman" class="settings-input">
                    <button onclick="addSupplement()" class="settings-btn green">+ Ekle</button>
                </div>
                <div class="settings-card">

        function stopSound() { soundStopFlag = true; if (currentSound) { try { currentSound.close(); } catch (e) {} currentSound =
                null; } }

        function playLongBeep() {
            if (soundStopFlag) return;
            stopSound();
            try {
                const ctx = new(window.AudioContext || window.webkitAudioContext)();
                currentSound = ctx;
                const dur = 12,
                    interval = 0.3;
                let start = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "square";
                osc.frequency.value = 880;
                gain.gain.value = 0.18;
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                for (let i = 0; i < dur / interval; i++) {
                    let t = start + i * interval;
                    gain.gain.setValueAtTime(0.18, t);
                    gain.gain.setValueAtTime(0.00001, t + 0.12);
                }
                osc.stop(start + dur);
                ctx.resume();
                currentSound = { close: () => { try { osc.stop();
                        ctx.close(); } catch (e) {} } };
            } catch (e) {}
        }

        // IndexedDB
        function openDB() { return new Promise((res, rej) => { let req = indexedDB.open("FitVideoDB3", 1);
                req.onerror = rej;
                req.onsuccess = e => { res(e.target.result); };
                req.onupgradeneeded = e => { e.target.result.createObjectStore("videos", { keyPath: "id" }); }; }); }
        async function saveVideoToDB(id, blob) { let db = await openDB(); return new Promise((res, rej) => { let tx = db
                    .transaction("videos", "readwrite");
                tx.objectStore("videos").put({ id, video: blob }).onsuccess = res;
                tx.onerror = rej; }); }
        async function getVideoFromDB(id) { let db = await openDB(); return new Promise(res => { db.transaction("videos",
                    "readonly").objectStore("videos").get(id).onsuccess = e => res(e.target.result?.video ||
                null); }); }
        async function deleteVideoFromDB(id) { let db = await openDB(); return new Promise(res => { db.transaction("videos",
                    "readwrite").objectStore("videos").delete(id).onsuccess = res; }); }

                        await saveVideoToDB(`${day}_${ex}`, file);
                        showToast("✅ Video kaydedildi"); } catch (err) { showToast("Hata!"); } } else {
                    showToast("Geçerli video seçin"); } };
            inp.click(); }
        async function playLocalVideo(ex, day, idx) { let blob = await getVideoFromDB(`${day}_${ex}`); if (blob) { let url =
                    URL.createObjectURL(blob); let modal = document.createElement("div");
                modal.className = "modal";
                modal.innerHTML =
                    `<div class="modal-content"><video controls autoplay src="${url}" style="width:100%;border-radius:12px;"></video><button class="modal-btn cancel" onclick="this.closest('.modal').remove();URL.revokeObjectURL('${url}');">Kapat</button></div>`;
                document.body.appendChild(modal);
                modal.addEventListener('click', function(e) { if (e.target === modal) { modal.remove();
                        URL.revokeObjectURL(url); } }); } else { showToast("Kayıtlı video yok"); } }
        async function removeLocalVideo(ex, day, idx) { let existing = await getVideoFromDB(`${day}_${ex}`); if (!existing) {
                showToast("Video yok"); return; } if (confirm("Sil?")) { await deleteVideoFromDB(`${day}_${ex}`);

        const urunSonuc = document.getElementById("urunSonuc");

        async function kamerayiBaslat() {
            if (!aktifListeId) { kameraDurum.innerHTML = "❌ Önce bir liste seçin!"; return; }
            kameraAcBtn.classList.add("hidden");
            kameraKapatBtn.classList.remove("hidden");
            video.style.display = "block";
            kameraDurum.innerHTML = "📱 Barkodu göster... otomatik okunacak";
            urunSonuc.innerHTML = "";
            try {
                scanner = new ZXing.BrowserMultiFormatReader();
                await scanner.decodeFromVideoDevice(null, video, async (result, err) => {
                    if (result) {
                        let barcode = result.getText();
                        kameraDurum.innerHTML = `✅ Barkod: ${barcode} - Ürün aranıyor...`;
                        urunSonuc.innerHTML =
                            '<div style="color:#FF9500;">⏳ OpenFoodFacts aranıyor...</div>';
                        try {
                            let res = await fetch(
                                `https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
                            let data = await res.json();
                            if (data.status === 1 && data.product) {
                                let p = data.product;
                                let isim = p.product_name || "Ürün adı yok";
                                let nut = p.nutriments || {};
                                let kalori = Math.round(nut['energy-kcal'] || nut['energy_value'] || 0);
                                let protein = Math.round(nut.proteins || nut['proteins_value'] || 0);
                                let karbonhidrat = Math.round(nut.carbohydrates || nut[
                                    'carbohydrates_value'] || 0);
                                let yag = Math.round(nut.fat || nut['fat_value'] || 0);
                                urunSonuc.innerHTML = `
                            <div class="urun-card">
                                <strong>📦 ${isim}</strong><br>
                                🔥 ${kalori} kcal | 💪 ${protein}g | 🌾 ${karbonhidrat}g | 🥑 ${yag}g
                                <div class="button-group">
                                    <button id="ekleBtnKamera" class="settings-btn green">✅ Listeye Ekle</button>
                                    <button id="iptalBtnKamera" class="settings-btn red">❌ İptal</button>
                                </div>
                            </div>
                        `;
                                document.getElementById("ekleBtnKamera")?.addEventListener("click",
                                    () => {
                                        urunEkle(aktifListeId, { isim, kalori, protein,
                                            karbonhidrat, yag });
                                        urunSonuc.innerHTML =
                                            `<div style="color:#34C759;">✅ "${isim}" eklendi!</div>`;
                                        setTimeout(() => { if (urunSonuc.innerHTML.includes(
                                                'eklendi')) urunSonuc.innerHTML = ''; }, 2000);
                                    });
                                document.getElementById("iptalBtnKamera")?.addEventListener("click",
                                    () => {
                                        urunSonuc.innerHTML =
                                            `<div style="color:#FF9500;">❌ İptal edildi</div>`;
                                        setTimeout(() => { if (urunSonuc.innerHTML.includes(
                                                'İptal')) urunSonuc.innerHTML = ''; }, 1500);
                                    });
                            } else { urunSonuc.innerHTML =
                            `<div style="color:#FF3B30;">❌ Ürün bulunamadı: ${barcode}</div>`; }
                        } catch (e) { urunSonuc.innerHTML = `<div style="color:#FF3B30;">⚠️ Bağlantı hatası</div>`; }
                    }
                });
            } catch (e) { kameraDurum.innerHTML = "❌ Kamera izni gerekli";
                kamerayiKapat(); }
        }

        function kamerayiKapat() {
            if (scanner) { try { scanner.reset(); } catch (e) {} scanner = null; }
            video.style.display = "none";
            kameraAcBtn.classList.remove("hidden");
            kameraKapatBtn.classList.add("hidden");
            kameraDurum.innerHTML = "";
        }
        kameraAcBtn?.addEventListener("click", kamerayiBaslat);
        kameraKapatBtn?.addEventListener("click", kamerayiKapat);

        document.getElementById("hedefKaydetBtn")?.addEventListener("click", () => { dailyTargets = { protein: parseInt(
                    document.getElementById("targetProtein").value) || 160, carbs: parseInt(document.getElementById(
                    "targetCarbs").value) || 250, fat: parseInt(document.getElementById("targetFat").value) || 70, calories: parseInt(
                    document.getElementById("targetCal").value) || 2500 };
            localStorage.setItem("dailyTargets", JSON.stringify(dailyTargets));
            showToast("✅ Hedefler kaydedildi"); if (currentDayOpen) renderDayHedefKart(currentDayOpen); });

        loadDataFromLocal();
        initListeler();
        updateBodyMeasurementsUI();
        buildHome();
    </script>
</body>
</html>
