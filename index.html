<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Fitness Pro Premium | Rozetler & İstatistik</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0a0f1e, #03060c);
            font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #eef5ff;
            padding-bottom: 95px;
            min-height: 100vh;
        }

        /* HEADER */
        .glow-header {
            text-align: center;
            padding: 24px 20px 12px;
            background: rgba(0, 20, 30, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 200, 0.3);
        }
        .glow-header h1 {
            font-size: 2.1rem;
            background: linear-gradient(135deg, #C0FFB0, #2AF598, #00E0FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 12px #00ffc355;
            letter-spacing: -0.5px;
        }
        .sub {
            font-size: 0.75rem;
            color: #8aaec0;
            margin-top: 6px;
        }

        /* ANA GRID (günler) */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
            padding: 24px 18px;
        }
        .day-card {
            background: linear-gradient(145deg, #141e2a, #0b1119);
            border-radius: 32px;
            padding: 22px 8px;
            text-align: center;
            font-weight: 800;
            font-size: 1.35rem;
            backdrop-filter: blur(4px);
            cursor: pointer;
            border: 1px solid #2c3e44;
            transition: all 0.2s ease;
            color: #d6eeff;
            box-shadow: 0 10px 20px -8px rgba(0,0,0,0.6);
        }
        .day-card:active {
            transform: scale(0.95);
            background: #1e2f3c;
            border-color: #2ef7b0;
            box-shadow: 0 0 15px #00ffc366;
        }

        /* GÜN DETAY SAYFASI */
        .day-detail {
            padding: 18px 14px 100px;
        }
        .detail-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 24px;
        }
        .glass-btn {
            background: rgba(20, 30, 45, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid #2ecc71;
            border-radius: 60px;
            padding: 12px 22px;
            font-weight: bold;
            color: #ccffdd;
            cursor: pointer;
            transition: 0.1s linear;
        }
        .glass-btn:active { transform: scale(0.96); background: #2ecc7133; }
        .day-title {
            text-align: center;
            font-size: 2.3rem;
            font-weight: 800;
            margin: 5px 0 20px;
            background: linear-gradient(120deg, #FFE5B4, #A0F0FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* item kartları (yemek, set) */
        .item-card, .set-card {
            background: linear-gradient(115deg, #111a24, #0e1620);
            margin: 12px 0;
            padding: 16px 20px;
            border-radius: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.08s linear;
            border-left: 6px solid #2ecc71;
            box-shadow: 0 6px 12px #00000040;
        }
        .item-card:active, .set-card:active { transform: scale(0.98); background: #1a2a34; }
        .item-card.done, .set-card.done {
            background: #0a2f1fcc;
            text-decoration: line-through;
            border-left-color: #F4D03F;
        }
        .badge {
            background: #0f6b8c;
            border-radius: 40px;
            padding: 5px 14px;
            font-size: 0.75rem;
        }
        .set-badge-rest {
            background: #1f6e43;
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 0.7rem;
        }
        .ex-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 20px 0 5px 8px;
            color: #FFD966;
            border-left: 4px solid cyan;
            padding-left: 14px;
        }

        /* ALT MENÜ (yeni butonlar) */
        .bottom-menu {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(5, 15, 22, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 12px 16px 22px;
            border-top: 1px solid #2ecc71;
            z-index: 200;
        }
        .menu-icon-btn {
            background: #0f212e;
            border: none;
            border-radius: 48px;
            padding: 12px 20px;
            color: #c0ffee;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.1s;
        }
        .menu-icon-btn:active { transform: scale(0.94); background: #2ecc71; color: black; }
        .menu-icon-btn span:first-child { font-size: 1.5rem; }

        /* MADALYA & ÖZET PANELİ (ana ekranda) */
        .stats-achievement {
            background: linear-gradient(125deg, #0f1824, #07111c);
            margin: 20px 18px;
            padding: 18px;
            border-radius: 44px;
            border: 1px solid gold;
        }
        .medals-area {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .medal {
            background: #2c2a24;
            border-radius: 60px;
            padding: 8px 16px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
        }
        .earned {
            background: #f7b32b;
            color: #1e2a1f;
            box-shadow: 0 0 8px gold;
        }
        .progress-text {
            font-size: 0.8rem;
            color: #bbffdd;
        }

        /* modal ekleme penceresi */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000000dd;
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-card {
            background: #111d2b;
            width: 80%;
            border-radius: 48px;
            padding: 24px;
            text-align: center;
            border: 1px solid cyan;
        }
        .modal-card input, .modal-card select {
            width: 90%;
            padding: 12px;
            margin: 12px 0;
            border-radius: 60px;
            border: none;
            background: #2c3e44;
            color: white;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 15px;
        }
        .hidden {
            display: none;
        }
        .toast {
            position: fixed;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            background: #0f212e;
            border: 1px solid #2ecc71;
            padding: 10px 24px;
            border-radius: 60px;
            z-index: 1100;
            animation: fadeOut 1.6s forwards;
        }
        @keyframes fadeOut {
            0% { opacity: 1; bottom: 25%;}
            100% { opacity: 0; bottom: 15%; display: none;}
        }
        .timer-panel {
            position: fixed;
            bottom: 100px;
            right: 20px;
            background: #000000cc;
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 12px;
            text-align: center;
            border: 1px solid cyan;
        }
    </style>
</head>
<body>

<div class="glow-header">
    <h1>💎 FITNESS PRO</h1>
    <div class="sub">Premium | Rozetler & İstatistik</div>
</div>

<!-- ANA EKRAN (günler + gelişim/madalya) -->
<div id="homeScreen">
    <div class="days-grid" id="daysGridContainer"></div>
    
    <!-- GELİŞİM ÖZETİ + MADALYALAR -->
    <div class="stats-achievement" id="statsArea">
        <div style="display: flex; justify-content: space-between;">
            <span>🏆 BAŞARILAR</span>
            <span id="totalMedalCount">0</span>
        </div>
        <div id="medalsList" class="medals-area"></div>
        <div class="progress-text" id="progressSummary">Tamamlanan setler: 0</div>
    </div>
</div>

<!-- GÜN DETAY EKRANI -->
<div id="dayScreen" class="day-detail hidden">
    <div class="detail-header">
        <button class="glass-btn" id="backHomeBtn">◀ Geri</button>
        <button class="glass-btn" id="daySummaryBtn">📊 Özet</button>
    </div>
    <div id="dayTitle" class="day-title"></div>
    <div id="dayContent"></div>
    <div id="summaryBox" class="stats-achievement hidden"></div>
</div>

<!-- ALT MENU (ekleme butonları) -->
<div class="bottom-menu">
    <button class="menu-icon-btn" id="openMealModalBtn"><span>🍽️</span><span>Yemek</span></button>
    <button class="menu-icon-btn" id="openExerciseModalBtn"><span>💪</span><span>Egzersiz</span></button>
    <button class="menu-icon-btn" id="openSuppModalBtn"><span>💊</span><span>Supplement</span></button>
</div>

<!-- MODAL (ekleme pencereleri) -->
<div id="modal" class="modal hidden">
    <div class="modal-card">
        <h3 id="modalTitle">Yeni Ekle</h3>
        <input type="text" id="modalInput" placeholder="İsim">
        <div id="extraSetDiv" style="display:none;"><input type="number" id="modalSets" placeholder="Set sayısı"></div>
        <div class="modal-buttons">
            <button class="glass-btn" id="modalConfirmBtn">Ekle</button>
            <button class="glass-btn" id="modalCancelBtn">İptal</button>
        </div>
    </div>
</div>

<div id="timerWidget" class="timer-panel hidden">
    <div id="timerNumber" style="font-size:28px;font-weight:bold;">90</div>
    <div>⏱️ Dinlenme</div>
    <button id="closeTimerBtn" style="background: cyan; border:none; border-radius:30px;">Kapat</button>
</div>

<script>
    // ---------- ANA VERİLER ----------
    let programData = {
        "Pazartesi": ["07:00 Kahve + Omega-3","💧 2 bardak","07:30 Skyr 500g + chia + keten","1 muz","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı + lavaş","💧 2 bardak","14:00 Pirinç + tavuk/kebap","💧 2 bardak","14:45 Whey","15:30 Kahve + EAA","💧 2 bardak","18:00 Yoğurt + muz","💧 2 bardak","🏋️ GÖĞÜS + TRİCEPS",{ex:"Dumbbell Bench Press",sets:4},{ex:"Incline Press",sets:4},{ex:"Fly",sets:3},{ex:"Rope Pushdown",sets:4},"💧 2 bardak","21:00 Whey + skyr","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
        "Salı": ["07:00 Kahve","💧 2 bardak","07:30 Skyr + muz","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı","💧 2 bardak","14:00 Pirinç + tavuk","💧 2 bardak","14:45 Whey","15:30 Kahve","💧 2 bardak","18:00 Skyr","💧 2 bardak","🏋️ SIRT + BİCEPS",{ex:"Lat Pulldown",sets:4},{ex:"Row",sets:4},{ex:"DB Curl",sets:4},"💧 2 bardak","21:00 Whey + yulaf","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
        "Çarşamba": ["07:30 Skyr + keten","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı","💧 2 bardak","14:00 Tavuk + pirinç","💧 2 bardak","18:00 Skyr","💧 2 bardak","20:00 Et + salata","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
        "Perşembe": ["07:00 Kahve","💧 2 bardak","07:30 Skyr","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı","💧 2 bardak","14:00 Pirinç + tavuk","💧 2 bardak","14:45 Whey","15:30 Kahve","💧 2 bardak","18:00 Yoğurt + muz","💧 2 bardak","🏋️ BACAK",{ex:"Leg Press",sets:4},{ex:"Squat",sets:3},{ex:"Leg Curl",sets:3},"💧 2 bardak","21:00 Whey + skyr","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
        "Cuma": ["07:00 Kahve + Omega","💧 2 bardak","07:30 Skyr + chia","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı + lavaş","💧 2 bardak","14:00 Pirinç + kebap","💧 2 bardak","14:45 Whey","15:30 Kahve","💧 2 bardak","18:00 Skyr + muz","💧 2 bardak","🏋️ OMUZ",{ex:"Shoulder Press",sets:4},{ex:"Lateral Raise",sets:4},"💧 2 bardak","21:00 Whey + skyr","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
        "Cumartesi": ["07:30 Skyr + muz","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı","💧 2 bardak","14:00 Tavuk + pirinç","💧 2 bardak","18:00 Skyr","💧 2 bardak","20:00 Et + salata","💧 2 bardak","22:30 Skyr","💧 2 bardak"],
        "Pazar": ["08:00 Kahve","💧 2 bardak","08:30 Skyr","💧 2 bardak","11:00 Yoğurt","💧 2 bardak","14:00 Tavuk + az pirinç","💧 2 bardak","18:00 Skyr","💧 2 bardak","20:00 Et + salata","💧 2 bardak","22:30 Skyr","💧 2 bardak","🧘 AKTİF DİNLENME"]
    };

    // STATE
    let completedState = {};   // key: day|type|id
    let waterIntake = {};

    // BAŞARI MADALYALARI
    let medalsEarned = [];

    // ---------- YARDIMCILAR ----------
    function showToast(msg) {
        let t = document.createElement("div");
        t.className = "toast";
        t.innerText = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 1500);
    }

    function beep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.type = "sine";
            osc.frequency.value = 880;
            osc.connect(ctx.destination);
            osc.start();
            setTimeout(() => { osc.stop(); ctx.close(); }, 200);
        } catch(e) {}
    }

    // Timer
    let timerInterval = null;
    const timerWidget = document.getElementById("timerWidget");
    const timerNumberSpan = document.getElementById("timerNumber");
    function stopTimer() { if(timerInterval) clearInterval(timerInterval); timerWidget.classList.add("hidden"); }
    function startTimer(sec) {
        stopTimer();
        let remaining = sec;
        timerNumberSpan.innerText = remaining;
        timerWidget.classList.remove("hidden");
        timerInterval = setInterval(() => {
            remaining--;
            timerNumberSpan.innerText = remaining;
            if (remaining <= 0) {
                stopTimer();
                beep();
                showToast("🔔 Dinlenme tamam!");
                timerWidget.classList.add("hidden");
            }
        }, 1000);
    }
    document.getElementById("closeTimerBtn").onclick = stopTimer;

    // LocalStorage
    function persistAll() {
        localStorage.setItem("fit_completed", JSON.stringify(completedState));
        localStorage.setItem("fit_water", JSON.stringify(waterIntake));
        localStorage.setItem("fit_medals", JSON.stringify(medalsEarned));
        localStorage.setItem("fit_program", JSON.stringify(programData));
    }
    function loadAll() {
        let c = localStorage.getItem("fit_completed");
        if(c) completedState = JSON.parse(c);
        let w = localStorage.getItem("fit_water");
        if(w) waterIntake = JSON.parse(w);
        let m = localStorage.getItem("fit_medals");
        if(m) medalsEarned = JSON.parse(m);
        let p = localStorage.getItem("fit_program");
        if(p) programData = JSON.parse(p);
    }

    function getWater(day) { return waterIntake[day+"_water"] || 0; }
    function addWater(day, amt=2) {
        let key = day+"_water";
        waterIntake[key] = (waterIntake[key]||0) + amt;
        persistAll();
        if(currentDay === day) renderDayDetails(day);
        updateStatsAndMedals();
        showToast(`💧 +${amt} su (toplam: ${waterIntake[key]})`);
    }

    // Madalya kontrol ve istatistik
    function calculateStats() {
        let totalSets = 0, doneSets = 0, totalMeals = 0, doneMeals = 0;
        for(let day in programData) {
            let arr = programData[day];
            arr.forEach((item, idx) => {
                if(typeof item === "string") {
                    totalMeals++;
                    if(completedState[`${day}|meal|${idx}`]) doneMeals++;
                } else if(item && item.sets) {
                    for(let i=1;i<=item.sets;i++) {
                        totalSets++;
                        if(completedState[`${day}|set|${item.ex}|${i}`]) doneSets++;
                    }
                }
            });
        }
        return { totalSets, doneSets, totalMeals, doneMeals };
    }

    function updateMedals() {
        const { doneSets, totalSets, doneMeals } = calculateStats();
        const medalsDiv = document.getElementById("medalsList");
        if(!medalsDiv) return;
        let newMedals = [];
        if(doneSets >= 10 && !medalsEarned.includes("10_set")) { medalsEarned.push("10_set"); newMedals.push("🏅 10 Set Tamamlandı"); showToast("🏆 Yeni madalya: 10 SET!"); }
        if(doneSets >= 30 && !medalsEarned.includes("30_set")) { medalsEarned.push("30_set"); newMedals.push("🏅 30 Set Kahramanı"); showToast("🏆 MADALYA: 30 SET!"); }
        if(doneMeals >= 20 && !medalsEarned.includes("20_meal")) { medalsEarned.push("20_meal"); newMedals.push("🍽️ 20 Öğün Ustası"); showToast("🏆 MADALYA: 20 Öğün!"); }
        persistAll();
        medalsDiv.innerHTML = "";
        medalsEarned.forEach(m => {
            let medalDiv = document.createElement("div");
            medalDiv.className = "medal earned";
            medalDiv.innerHTML = m.includes("Set") ? `🏋️ ${m}` : `🍽️ ${m}`;
            medalsDiv.appendChild(medalDiv);
        });
        if(medalsEarned.length===0) medalsDiv.innerHTML = "<span style='opacity:0.6'>Henüz madalya yok, set tamamla!</span>";
        document.getElementById("totalMedalCount").innerText = medalsEarned.length;
    }

    function updateStatsAndMedals() {
        const { doneSets, totalSets, doneMeals, totalMeals } = calculateStats();
        let summaryDiv = document.getElementById("progressSummary");
        if(summaryDiv) summaryDiv.innerHTML = `📊 Toplam Set: ${doneSets}/${totalSets}  |  Öğün: ${doneMeals}/${totalMeals}`;
        updateMedals();
    }

    // GÜN DETAY RENDER
    let currentDay = null;
    function renderDayDetails(day) {
        const container = document.getElementById("dayContent");
        container.innerHTML = "";
        const items = programData[day];
        items.forEach((item, idx) => {
            if(typeof item === "string") {
                const div = document.createElement("div");
                div.className = "item-card";
                let isWater = item.includes("💧");
                div.innerHTML = `<span>${item}</span>${isWater ? '<span class="badge">💧+2</span>' : ''}`;
                let key = `${day}|meal|${idx}`;
                if(completedState[key]) div.classList.add("done");
                div.onclick = () => {
                    if(isWater) addWater(day,2);
                    else {
                        if(completedState[key]) delete completedState[key];
                        else completedState[key]=true;
                        persistAll();
                        renderDayDetails(day);
                        updateStatsAndMedals();
                        showToast(completedState[key] ? "✅ Tamamlandı" : "❌ Geri alındı");
                    }
                };
                container.appendChild(div);
            } 
            else if(item && item.ex) {
                let title = document.createElement("div");
                title.className = "ex-title";
                title.innerText = `💪 ${item.ex}`;
                container.appendChild(title);
                for(let s=1;s<=item.sets;s++) {
                    let setDiv = document.createElement("div");
                    setDiv.className = "set-card";
                    setDiv.innerHTML = `<span>Set ${s}</span><span class="set-badge-rest">⏱️ 90sn dinlenme</span>`;
                    let setKey = `${day}|set|${item.ex}|${s}`;
                    if(completedState[setKey]) setDiv.classList.add("done");
                    setDiv.onclick = () => {
                        if(completedState[setKey]) delete completedState[setKey];
                        else { completedState[setKey]=true; startTimer(90); }
                        persistAll();
                        renderDayDetails(day);
                        updateStatsAndMedals();
                        showToast(completedState[setKey] ? `Set ${s} tamam!` : "Set iptal");
                    };
                    container.appendChild(setDiv);
                }
            }
        });
        let summaryBox = document.getElementById("summaryBox");
        if(summaryBox && !summaryBox.classList.contains("hidden")) updateDaySummary(day);
    }

    function updateDaySummary(day) {
        let box = document.getElementById("summaryBox");
        let total=0, done=0;
        programData[day].forEach((item,idx)=>{
            if(typeof item === "string") { total++; if(completedState[`${day}|meal|${idx}`]) done++; }
            else if(item.sets) { for(let i=1;i<=item.sets;i++) { total++; if(completedState[`${day}|set|${item.ex}|${i}`]) done++; } }
        });
        box.innerHTML = `📋 Gün Özeti: ${done}/${total} tamamlandı | 💧 Su: ${getWater(day)} bardak`;
        box.classList.remove("hidden");
    }

    function openDay(day) {
        currentDay = day;
        document.getElementById("homeScreen").classList.add("hidden");
        document.getElementById("dayScreen").classList.remove("hidden");
        document.getElementById("dayTitle").innerText = day;
        renderDayDetails(day);
        stopTimer();
    }
    function closeDay() { stopTimer(); document.getElementById("homeScreen").classList.remove("hidden"); document.getElementById("dayScreen").classList.add("hidden"); currentDay=null; updateStatsAndMedals(); }

    // ANA EKRAN GÜNLERİ
    function buildHome() {
        const grid = document.getElementById("daysGridContainer");
        grid.innerHTML = "";
        Object.keys(programData).forEach(day => {
            let card = document.createElement("div");
            card.className = "day-card";
            card.innerText = day;
            card.onclick = () => openDay(day);
            grid.appendChild(card);
        });
        updateStatsAndMedals();
    }

    // MODAL EKLEME (yemek / egzersiz / supplement)
    let modalType = "";
    function openModal(type) {
        modalType = type;
        document.getElementById("modalTitle").innerText = type === "meal" ? "➕ Yemek Ekle" : (type === "exercise" ? "🏋️ Egzersiz Ekle" : "💊 Supplement Ekle");
        let extraDiv = document.getElementById("extraSetDiv");
        if(type === "exercise") extraDiv.style.display = "block";
        else extraDiv.style.display = "none";
        document.getElementById("modalInput").value = "";
        document.getElementById("modalSets").value = "3";
        document.getElementById("modal").classList.remove("hidden");
    }
    function closeModal() { document.getElementById("modal").classList.add("hidden"); }
    function confirmModal() {
        let name = document.getElementById("modalInput").value.trim();
        if(!name) { showToast("İsim girin!"); return; }
        if(modalType === "meal") {
            for(let day in programData) programData[day].push(name);
            showToast(`🍽️ ${name} tüm günlere eklendi`);
        } else if(modalType === "exercise") {
            let sets = parseInt(document.getElementById("modalSets").value);
            if(isNaN(sets)) sets=3;
            for(let day in programData) programData[day].push({ex:name, sets:sets});
            showToast(`💪 ${name} (${sets} set) tüm günlere eklendi`);
        } else if(modalType === "supp") {
            for(let day in programData) programData[day].push(`💊 ${name}`);
            showToast(`💊 ${name} supplement eklendi`);
        }
        persistAll();
        if(currentDay && !document.getElementById("homeScreen").classList.contains("hidden")===false) renderDayDetails(currentDay);
        else buildHome();
        closeModal();
    }

    document.getElementById("openMealModalBtn").onclick = () => openModal("meal");
    document.getElementById("openExerciseModalBtn").onclick = () => openModal("exercise");
    document.getElementById("openSuppModalBtn").onclick = () => openModal("supp");
    document.getElementById("modalConfirmBtn").onclick = confirmModal;
    document.getElementById("modalCancelBtn").onclick = closeModal;
    document.getElementById("backHomeBtn").onclick = closeDay;
    document.getElementById("daySummaryBtn").onclick = () => { if(currentDay) updateDaySummary(currentDay); let sb=document.getElementById("summaryBox"); sb.classList.toggle("hidden"); };

    loadAll();
    buildHome();
</script>
</body>
</html>
