<!DOCTYPE html><html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Haftalık Fitness Takip</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #fff;
      margin: 0;
      padding: 20px;
    }h1 {
  text-align: center;
}

/* HOME GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  margin-top: 20px;
}

.card {
  background: #1c1c1c;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  cursor: pointer;
  transition: 0.2s;
  font-weight: bold;
  color: #00ff99;
}

.card:hover {
  transform: scale(1.03);
}

/* DAY VIEW */
.hidden {
  display: none;
}

.day {
  background: #1c1c1c;
  margin-top: 15px;
  border-radius: 12px;
  padding: 15px;
}

.item {
  padding: 10px;
  margin: 6px 0;
  background: #2a2a2a;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
  user-select: none;
}

.item.done {
  opacity: 0.35;
  text-decoration: line-through;
  background: #004d3a;
}

.back {
  margin-top: 10px;
  padding: 10px;
  background: #333;
  border-radius: 8px;
  cursor: pointer;
  display: inline-block;
}

  </style>
</head>
<body><h1>💪 Fitness App</h1><!-- HOME --><div id="home">
  <div class="grid">
    <div class="card" onclick="openDay('Pazartesi')">Pazartesi</div>
    <div class="card" onclick="openDay('Salı')">Salı</div>
    <div class="card" onclick="openDay('Çarşamba')">Çarşamba</div>
    <div class="card" onclick="openDay('Perşembe')">Perşembe</div>
    <div class="card" onclick="openDay('Cuma')">Cuma</div>
    <div class="card" onclick="openDay('Cumartesi')">Cumartesi</div>
    <div class="card" onclick="openDay('Pazar')">Pazar</div>
  </div>
</div><!-- DAY VIEW --><div id="dayView" class="hidden">
  <div class="back" onclick="goBack()">⬅ Geri</div>
  <h2 id="dayTitle"></h2>
  <div id="items"></div>
</div><script>
const data = {
  "Pazartesi": [
    "07:00 Kahve + Omega-3",
    "07:30 Skyr + chia + muz",
    "09:30 Yoğurt",
    "12:30 Ton balığı + lavaş",
    "14:00 Pirinç + tavuk",
    "14:45 Whey",
    "15:30 Kahve + EAA",
    "18:00 Yoğurt + muz",
    "19:30 Göğüs + Triceps",
    "21:00 Whey + skyr + yulaf",
    "22:30 Skyr"
  ],
  "Salı": [
    "07:00 Kahve + Omega-3",
    "07:30 Skyr + muz",
    "09:30 Yoğurt",
    "12:30 Ton balığı + lavaş",
    "14:00 Pirinç + tavuk",
    "14:45 Whey",
    "15:30 Kahve + EAA",
    "18:00 Skyr + meyve",
    "19:30 Sırt + Biceps",
    "21:00 Whey + skyr + yulaf",
    "22:30 Skyr"
  ],
  "Çarşamba": ["Dinlenme günü"],
  "Perşembe": ["Bacak antrenmanı"],
  "Cuma": ["Omuz + Triceps"],
  "Cumartesi": ["Aktif toparlanma"],
  "Pazar": ["Dinlenme"]
};

function openDay(day) {
  document.getElementById("home").classList.add("hidden");
  document.getElementById("dayView").classList.remove("hidden");
  document.getElementById("dayTitle").innerText = day;

  const container = document.getElementById("items");
  container.innerHTML = "";

  (data[day] || []).forEach(text => {
    const div = document.createElement("div");
    div.className = "item";
    div.textContent = text;

    div.onclick = () => {
      div.classList.toggle("done");
    };

    container.appendChild(div);
  });
}

function goBack() {
  document.getElementById("home").classList.remove("hidden");
  document.getElementById("dayView").classList.add("hidden");
}
</script></body>
</html>
