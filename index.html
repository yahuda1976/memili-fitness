<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Fitness Pro 🔥</title>
<style>
/* Orijinal CSS'in tamamı buraya geliyor */
* {margin:0;padding:0;box-sizing:border-box}
body {font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;background:#000;color:#fff;min-height:100vh;padding-bottom:160px;font-weight:600}
.app-header {background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);padding:12px 16px;text-align:center;position:sticky;top:0;z-index:100;border-bottom:0.5px solid rgba(255,255,255,0.1)}
.app-header h1 {font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#007aff,#5856d6);-webkit-background-clip:text;color:transparent}
.grid {display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:20px;max-width:500px;margin:0 auto}
.card {background:#e8e6e1;border-radius:28px;padding:20px 12px;text-align:center;cursor:pointer;transition:0.2s}
.card:active {transform:scale(0.96)}
.card h3 {font-size:1.2rem;font-weight:900;color:#d93f3f}
.day-view {position:fixed;inset:0;background:#000;z-index:1000;overflow-y:auto}
.day-header {background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.back-btn,.add-item-btn {background:#ff3b30;border:none;padding:12px 24px;border-radius:40px;color:#fff;font-weight:800;cursor:pointer}
.item,.set {background:#e8e6e1;margin:10px 16px;padding:14px;border-radius:20px;cursor:pointer;color:#1c1c1e}
.item.done,.set.done {background:#a8d5a8;text-decoration:line-through;opacity:0.8}
.ex-title {padding:16px 20px 8px;font-weight:900;color:#ff3b30}
.toast {position:fixed;bottom:30%;left:50%;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:14px 26px;border-radius:60px;z-index:2000}
.hidden {display:none}
</style>
</head>
<body>

<div id="appContent">
  <div class="app-header"><h1>🔥 FITNESS PRO</h1></div>
  <div id="homeGrid" class="grid"></div>
</div>

<div id="dayView" class="day-view hidden">
  <div class="day-header">
    <button class="back-btn" onclick="closeDay()">← Geri</button>
    <div id="dayTitle" style="font-size:1.4rem;font-weight:800"></div>
    <button class="add-item-btn" onclick="alert('Ekleme yakında...')">+ Ekle</button>
  </div>
  <div id="dayItems"></div>
</div>

<script>
// Orijinal verilerin tamamı
let data = {
"PAZARTESI": ["07:00 Yulaf + süt + kahve - Whey (1 ölçek) - Omega 3 + çörek otu yağı","💧 1 bardak","07:30 💧 1 bardak","08:00 💧 1 bardak","09:00 Skyr + chia","💧 1 bardak","🏋️ GÖĞÜS + TRICEPS (HEAVY)",{ex:"Incline Dumbbell Press",sets:4},{ex:"Dumbbell Bench Press",sets:4},{ex:"Dips",sets:3},{ex:"Triceps Pushdown",sets:3},"20:15 Whey + Kreatin"],
"SALI": ["07:00 Yulaf","🏋️ SIRT + BICEPS",{ex:"Lat Pulldown",sets:4},{ex:"Dumbbell Curl",sets:3}],
"CARSAMBA": ["07:00 Yulaf","🏋️ BACAK",{ex:"Leg Press",sets:4}],
"PERSEMBE": ["07:00 Yulaf","🏋️ OMUZ",{ex:"Shoulder Press",sets:4}],
"CUMA": ["07:00 Yulaf","🏋️ GÖĞÜS + KOL",{ex:"Machine Chest Press",sets:3}],
"CUMARTESI": ["Rest Day"],
"PAZAR": ["Rest Day"]
};

let doneState = {};
let currentDayOpen = null;

function buildHome() {
  const grid = document.getElementById("homeGrid");
  grid.innerHTML = "";
  Object.keys(data).forEach(day => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<h3>${day}</h3><small>Antrenman günü</small>`;
    card.onclick = () => openDay(day);
    grid.appendChild(card);
  });
}

function openDay(day) {
  currentDayOpen = day;
  document.getElementById("appContent").style.display = "none";
  document.getElementById("dayView").classList.remove("hidden");
  document.getElementById("dayTitle").textContent = day;
  renderDayItems(day);
}

function closeDay() {
  document.getElementById("dayView").classList.add("hidden");
  document.getElementById("appContent").style.display = "block";
}

function renderDayItems(day) {
  const cont = document.getElementById("dayItems");
  cont.innerHTML = "";

  data[day].forEach((item, idx) => {
    if (typeof item === "string") {
      const div = document.createElement("div");
      div.className = "item";
      div.textContent = item;
      const key = `\( {day}| \){idx}`;
      if (doneState[key]) div.classList.add("done");
      div.onclick = () => {
        if (doneState[key]) delete doneState[key];
        else doneState[key] = true;
        renderDayItems(day);
      };
      cont.appendChild(div);
    } else if (item && item.ex) {
      const title = document.createElement("div");
      title.className = "ex-title";
      title.textContent = `💪 \( {item.ex} ( \){item.sets} set)`;
      cont.appendChild(title);

      for (let s = 1; s <= item.sets; s++) {
        const setDiv = document.createElement("div");
        setDiv.className = "set";
        setDiv.textContent = `Set ${s}`;
        const setKey = `\( {day}|set| \){item.ex}|${s}`;
        if (doneState[setKey]) setDiv.classList.add("done");
        setDiv.onclick = () => {
          if (doneState[setKey]) delete doneState[setKey];
          else doneState[setKey] = true;
          renderDayItems(day);
        };
        cont.appendChild(setDiv);
      }
    }
  });
}

// Başlangıç
buildHome();
</script>
</body>
</html>
