<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Fitness Pro Ultra | Alarm & Günlük Ekleme</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #0c111f 0%, #03070f 100%);
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            color: #f0f3fa;
            padding-bottom: 20px;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            text-align: center;
            padding: 24px 20px 16px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #ff884d;
        }
        .header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #FFD966, #FFA559, #FF6B6B);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .sub {
            font-size: 0.7rem;
            color: #ffb347;
        }

        /* ANA GRID (günler) - ALTIN SARI ZEMİN + KALIN MAVİ YAZI */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 18px;
            padding: 30px 20px;
        }
        .day-card {
            background: #F4C542;  /* güzel altın sarısı */
            border-radius: 36px;
            padding: 22px 8px;
            text-align: center;
            font-weight: 900;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.1s linear;
            color: #004e92;  /* canlı koyu mavi */
            box-shadow: 0 12px 18px -8px rgba(0,0,0,0.5);
            border: none;
            letter-spacing: 0.5px;
        }
        .day-card:active {
            transform: scale(0.96);
            background: #FFB347;
        }

        /* GÜN DETAY */
        .day-detail {
            padding: 18px 16px 100px;
        }
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            border-radius: 60px;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            background: #1f6392;
            color: white;
        }
        .btn:active { transform: scale(0.96); }
        .add-day-btn {
            background: #2ecc71;
            font-size: 1.2rem;
            padding: 8px 18px;
        }
        .day-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin: 5px 0 20px;
            color: #FFD966;
        }

        /* item kartları */
        .item-card, .set-card {
            background: #14232e;
            margin: 12px 0;
            padding: 16px 20px;
            border-radius: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-left: 6px solid #FFB347;
        }
        .item-card:active, .set-card:active { transform: scale(0.98); background: #1f3a48; }
        .item-card.done, .set-card.done {
            background: #1c6d3fcc;
            text-decoration: line-through;
            border-left-color: gold;
        }
        .ex-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin: 20px 0 5px 8px;
            color: #FFB347;
            border-left: 4px solid cyan;
            padding-left: 14px;
        }

        /* AYARLAR BUTONU (CANLI KIRMIZI) */
        .settings-big-btn {
            background: #E63946;
            margin: 8px 20px 16px;
            border-radius: 60px;
            padding: 16px;
            text-align: center;
            font-weight: bold;
            font-size: 1.3rem;
            cursor: pointer;
            color: white;
            box-shadow: 0 6px 12px black;
        }
        .settings-big-btn:active { transform: scale(0.97); background: #ff4d6d; }

        /* AYARLAR PANELİ */
        .settings-panel {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000000dd;
            backdrop-filter: blur(16px);
            z-index: 1000;
            padding: 24px;
            overflow-y: auto;
        }
        .settings-card {
            background: #0f1a24;
            border-radius: 48px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .settings-card h3 { color: #FFB347; margin-bottom: 12px; }
        .custom-item {
            background: #1e2f3c;
            margin: 8px 0;
            padding: 10px 14px;
            border-radius: 50px;
            display: flex;
            justify-content: space-between;
        }
        .small-btn {
            background: #2ecc71;
            border: none;
            border-radius: 40px;
            padding: 6px 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .delete-btn {
            background: #e67e22;
            border: none;
            border-radius: 40px;
            padding: 4px 12px;
            cursor: pointer;
        }

        /* MODAL (gün içi ekleme) */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000000cc;
            backdrop-filter: blur(12px);
            z-index: 1100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-card {
            background: #0f1a24;
            width: 85%;
            border-radius: 48px;
            padding: 24px;
            text-align: center;
        }
        .modal-card input, .modal-card select {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 60px;
            border: none;
            background: #2c3e44;
            color: white;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 16px;
        }

        /* ALARM PANELİ */
        .alarm-panel {
            background: #0f1a24;
            margin: 20px;
            border-radius: 48px;
            padding: 16px;
        }
        .alarm-item {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            align-items: center;
        }

        .timer-panel {
            position: fixed;
            bottom: 100px;
            right: 16px;
            background: #000000bb;
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 10px 18px;
            text-align: center;
            border: 1px solid #FFB347;
        }
        .hidden { display: none; }
        .toast {
            position: fixed;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2a36;
            border: 1px solid #2ecc71;
            padding: 10px 24px;
            border-radius: 60px;
            z-index: 1200;
            animation: fadeOut 1.4s forwards;
        }
        @keyframes fadeOut {
            0% { opacity: 1; bottom: 25%;}
            100% { opacity: 0; bottom: 15%; display: none;}
        }
        .badge-icon {
            background: #2ecc71;
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 0.7rem;
        }
        .footer-stats {
            background: #0a111acc;
            margin: 20px 16px 10px;
            padding: 12px;
            border-radius: 48px;
            text-align: center;
        }
        .medals-area { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
        .medal { background: #2c2a24; border-radius: 40px; padding: 4px 12px; font-size: 0.7rem; }
        .earned { background: #f7b32b; color: #1e2a1f; }
    </style>
</head>
<body>

<div class="header">
    <h1><span>🏋️</span> FITNESS PRO ULTRA</h1>
    <div class="sub">Alarm | Günlük Özel Ekleme</div>
</div>

<!-- ANA EKRAN -->
<div id="homeScreen">
    <div class="days-grid" id="daysGrid"></div>
    <div class="settings-big-btn" id="openSettingsBtn">⚙️ TÜM AYARLAR</div>
    
    <!-- SU ALARM BÖLÜMÜ -->
    <div class="alarm-panel">
        <div style="display: flex; justify-content: space-between;">
            <span>💧 SU İÇME ALARMI</span>
            <button class="small-btn" id="addAlarmBtn">+ Alarm Ekle</button>
        </div>
        <div id="alarmsList"></div>
        <div style="font-size: 0.7rem; margin-top: 8px;">Not: Alarm saati gelince bildirim gösterir (izin verirseniz)</div>
    </div>

    <!-- BAŞARILAR -->
    <div class="footer-stats">
        <div>🏆 BAŞARILARIM <span id="medalCount">0</span></div>
        <div id="medalsList" class="medals-area"></div>
        <div id="progressText" style="font-size:0.7rem;">Setler: 0/0</div>
    </div>
</div>

<!-- GÜN DETAY EKRANI -->
<div id="dayScreen" class="day-detail hidden">
    <div class="detail-header">
        <button class="btn" id="backHomeBtn">◀ Geri</button>
        <button class="btn add-day-btn" id="openDayAddModalBtn">➕ GÜNE EKLE</button>
        <button class="btn" id="daySummaryBtn">📊 Özet</button>
    </div>
    <div id="dayTitle" class="day-title"></div>
    <div id="dayContent"></div>
    <div id="summaryBox" class="hidden" style="background:#0f1a24; margin-top:16px; padding:14px; border-radius:36px;"></div>
</div>

<!-- MODAL (güne özel ekleme) -->
<div id="addModal" class="modal hidden">
    <div class="modal-card">
        <h3 id="modalTitle">Güne Ekle</h3>
        <select id="modalTypeSelect">
            <option value="meal">🍽️ Yemek</option>
            <option value="exercise">💪 Egzersiz</option>
            <option value="supp">💊 Supplement</option>
        </select>
        <input type="text" id="modalItemName" placeholder="İsim">
        <div id="modalSetsDiv" style="display:none;">
            <input type="number" id="modalSets" placeholder="Set sayısı" value="3">
        </div>
        <div class="modal-buttons">
            <button class="small-btn" id="confirmModalBtn">Ekle</button>
            <button class="delete-btn" id="cancelModalBtn">İptal</button>
        </div>
    </div>
</div>

<!-- AYARLAR PANELİ (global silme) -->
<div id="settingsPanel" class="settings-panel hidden">
    <div style="text-align:right;"><button class="btn" id="closeSettingsBtn">Kapat</button></div>
    <div class="settings-card"><h3>🍽️ Tüm Yemekler</h3><div id="globalMealsList"></div></div>
    <div class="settings-card"><h3>💪 Tüm Egzersizler</h3><div id="globalExList"></div></div>
    <div class="settings-card"><h3>💊 Tüm Supplementler</h3><div id="globalSuppList"></div></div>
</div>

<div id="timerPanel" class="timer-panel hidden">
    <div id="timerNumber" style="font-size:28px;">90</div>
    <div>⏱️ Dinlenme</div>
    <div><button class="small-btn" id="closeTimerBtn">Kapat</button></div>
</div>

<script>
    // ========== VERİLER ==========
    let programData = {
        "Pazartesi": ["07:00 Kahve","💧 2 bardak","07:30 Skyr","💧 2 bardak","09:30 Yoğurt","💧 2 bardak","12:30 Ton balığı","💧 2 bardak","14:00 Tavuk","💧 2 bardak","🏋️ GÖĞÜS",{ex:"Bench Press",sets:3},"💧 2 bardak","21:00 Whey","💧 2 bardak"],
        "Salı": ["07:00 Kahve","💧 2 bardak","07:30 Skyr","💧 2 bardak","12:30 Ton balığı","💧 2 bardak","14:00 Pirinç","💧 2 bardak","🏋️ SIRT",{ex:"Lat Pulldown",sets:3},"💧 2 bardak","21:00 Whey","💧 2 bardak"],
        "Çarşamba": ["07:30 Skyr","💧 2 bardak","12:30 Ton balığı","💧 2 bardak","14:00 Tavuk","💧 2 bardak","18:00 Skyr","💧 2 bardak","20:00 Et","💧 2 bardak"],
        "Perşembe": ["07:00 Kahve","💧 2 bardak","07:30 Skyr","💧 2 bardak","12:30 Ton balığı","💧 2 bardak","🏋️ BACAK",{ex:"Leg Press",sets:3},"💧 2 bardak","21:00 Whey","💧 2 bardak"],
        "Cuma": ["07:00 Kahve","💧 2 bardak","07:30 Skyr","💧 2 bardak","12:30 Ton balığı","💧 2 bardak","🏋️ OMUZ",{ex:"Shoulder Press",sets:3},"💧 2 bardak","21:00 Whey","💧 2 bardak"],
        "Cumartesi": ["07:30 Skyr","💧 2 bardak","12:30 Ton balığı","💧 2 bardak","14:00 Tavuk","💧 2 bardak","18:00 Skyr","💧 2 bardak","20:00 Et","💧 2 bardak"],
        "Pazar": ["08:00 Kahve","💧 2 bardak","08:30 Skyr","💧 2 bardak","11:00 Yoğurt","💧 2 bardak","14:00 Tavuk","💧 2 bardak","18:00 Skyr","💧 2 bardak","20:00 Et","💧 2 bardak","🧘 DİNLENME"]
    };

    let completedState = {};
    let waterIntake = {};
    let medalsEarned = [];
    let alarms = []; // { hour, minute }

    // Alarm kontrolü
    function checkAlarms() {
        let now = new Date();
        let currentHour = now.getHours();
        let currentMinute = now.getMinutes();
        alarms.forEach(alarm => {
            if(alarm.hour === currentHour && alarm.minute === currentMinute) {
                showToast("💧 SU İÇME VAKTİ! 💧");
                if(navigator.vibrate) navigator.vibrate(1000);
                try {
                    let ctx = new (window.AudioContext || window.webkitAudioContext)();
                    let osc = ctx.createOscillator();
                    osc.type = "sine";
                    osc.frequency.value = 880;
                    osc.connect(ctx.destination);
                    osc.start();
                    setTimeout(() => { osc.stop(); ctx.close(); }, 1500);
                } catch(e) {}
            }
        });
    }
    setInterval(checkAlarms, 30000); // her 30 saniye kontrol
    function saveAlarms() { localStorage.setItem("fit_alarms", JSON.stringify(alarms)); }
    function loadAlarms() { let a = localStorage.getItem("fit_alarms"); if(a) alarms = JSON.parse(a); renderAlarms(); }
    function renderAlarms() {
        let div = document.getElementById("alarmsList");
        if(!div) return;
        div.innerHTML = "";
        alarms.sort((a,b)=> (a.hour*60+a.minute) - (b.hour*60+b.minute));
        alarms.forEach((al, idx) => {
            let alarmDiv = document.createElement("div");
            alarmDiv.className = "custom-item";
            alarmDiv.innerHTML = `<span>🕒 ${al.hour.toString().padStart(2,'0')}:${al.minute.toString().padStart(2,'0')}</span>
                                  <button class="delete-btn" data-alarm-idx="${idx}">Sil</button>`;
            div.appendChild(alarmDiv);
        });
        document.querySelectorAll("[data-alarm-idx]").forEach(btn => {
            btn.onclick = () => {
                let idx = parseInt(btn.dataset.alarmIdx);
                alarms.splice(idx,1);
                saveAlarms();
                renderAlarms();
            };
        });
    }
    document.getElementById("addAlarmBtn").onclick = () => {
        let saat = prompt("Saat (0-23):", "12");
        let dk = prompt("Dakika (0-59):", "0");
        let h = parseInt(saat), m = parseInt(dk);
        if(!isNaN(h) && !isNaN(m) && h>=0 && h<24 && m>=0 && m<60) {
            alarms.push({hour:h, minute:m});
            saveAlarms();
            renderAlarms();
            showToast("Alarm eklendi");
        } else showToast("Geçersiz saat");
    };

    // Ses & titreşim
    function playStrongBeep() {
        try {
            let ctx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = ctx.createOscillator();
            let gain = ctx.createGain();
            osc.type = "square";
            osc.frequency.value = 880;
            gain.gain.value = 0.3;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.8);
            osc.stop(ctx.currentTime + 0.8);
            setTimeout(() => ctx.close(), 900);
        } catch(e) {}
        if(navigator.vibrate) navigator.vibrate(400);
    }

    let timerInt = null;
    function stopTimer() { if(timerInt) clearInterval(timerInt); document.getElementById("timerPanel").classList.add("hidden"); }
    function startTimer(sec) {
        stopTimer();
        let remaining = sec;
        let timerNum = document.getElementById("timerNumber");
        timerNum.innerText = remaining;
        let panel = document.getElementById("timerPanel");
        panel.classList.remove("hidden");
        timerInt = setInterval(() => {
            remaining--;
            timerNum.innerText = remaining;
            if(remaining <= 0) {
                clearInterval(timerInt);
                playStrongBeep();
                panel.classList.add("hidden");
            }
        }, 1000);
    }
    document.getElementById("closeTimerBtn").onclick = stopTimer;

    function persist() {
        localStorage.setItem("fit_prog", JSON.stringify(programData));
        localStorage.setItem("fit_done", JSON.stringify(completedState));
        localStorage.setItem("fit_water", JSON.stringify(waterIntake));
        localStorage.setItem("fit_medals", JSON.stringify(medalsEarned));
    }
    function loadAll() {
        let p = localStorage.getItem("fit_prog"); if(p) programData = JSON.parse(p);
        let d = localStorage.getItem("fit_done"); if(d) completedState = JSON.parse(d);
        let w = localStorage.getItem("fit_water"); if(w) waterIntake = JSON.parse(w);
        let m = localStorage.getItem("fit_medals"); if(m) medalsEarned = JSON.parse(m);
    }

    function calcStats() {
        let totalSets=0, doneSets=0, totalMeals=0, doneMeals=0;
        for(let day in programData) {
            programData[day].forEach((item, idx) => {
                if(typeof item === "string") {
                    totalMeals++;
                    if(completedState[`${day}|meal|${idx}`]) doneMeals++;
                } else if(item.sets) {
                    for(let i=1;i<=item.sets;i++) {
                        totalSets++;
                        if(completedState[`${day}|set|${item.ex}|${i}`]) doneSets++;
                    }
                }
            });
        }
        return { totalSets, doneSets, totalMeals, doneMeals };
    }
    function updateMedals() {
        let { doneSets } = calcStats();
        if(doneSets >= 3 && !medalsEarned.includes("3_set")) { medalsEarned.push("3_set"); showToast("🏅 3 Set!"); }
        if(doneSets >= 10 && !medalsEarned.includes("10_set")) { medalsEarned.push("10_set"); showToast("🏅 10 Set!"); }
        if(doneSets >= 25 && !medalsEarned.includes("25_set")) { medalsEarned.push("25_set"); showToast("🏆 25 SET!"); }
        persist();
        let medalsDiv = document.getElementById("medalsList");
        if(medalsDiv) {
            medalsDiv.innerHTML = medalsEarned.map(m => `<div class="medal earned">🏋️ ${m}</div>`).join("");
            document.getElementById("medalCount").innerText = medalsEarned.length;
        }
        let { doneSets:ds, totalSets:ts, doneMeals:dm, totalMeals:tm } = calcStats();
        document.getElementById("progressText").innerHTML = `🏋️ Set: ${ds}/${ts} &nbsp; 🍽️ Öğün: ${dm}/${tm}`;
    }

    function addWater(day, amt=2) {
        let key = day+"_water";
        waterIntake[key] = (waterIntake[key]||0)+amt;
        persist();
        if(currentDay===day) renderDayDetails(day);
        updateMedals();
        showToast(`💧 +${amt} su`);
    }

    let currentDay = null;
    function renderDayDetails(day) {
        let container = document.getElementById("dayContent");
        container.innerHTML = "";
        programData[day].forEach((item, idx) => {
            if(typeof item === "string") {
                let div = document.createElement("div");
                div.className = "item-card";
                let isWater = item.includes("💧");
                div.innerHTML = `<span>${item}</span>${isWater ? '<span class="badge-icon">+2 su</span>' : ''}`;
                let key = `${day}|meal|${idx}`;
                if(completedState[key]) div.classList.add("done");
                div.onclick = () => {
                    if(isWater) addWater(day,2);
                    else {
                        if(completedState[key]) delete completedState[key];
                        else completedState[key]=true;
                        persist();
                        renderDayDetails(day);
                        updateMedals();
                        showToast(completedState[key]?"✅ Tamam":"❌ Geri");
                    }
                };
                container.appendChild(div);
            } else if(item.ex) {
                let title = document.createElement("div");
                title.className = "ex-title";
                title.innerText = `💪 ${item.ex}`;
                container.appendChild(title);
                for(let s=1;s<=item.sets;s++) {
                    let setDiv = document.createElement("div");
                    setDiv.className = "set-card";
                    setDiv.innerHTML = `<span>Set ${s}</span><span class="badge-icon">⏱️ dinlen</span>`;
                    let setKey = `${day}|set|${item.ex}|${s}`;
                    if(completedState[setKey]) setDiv.classList.add("done");
                    setDiv.onclick = () => {
                        if(completedState[setKey]) delete completedState[setKey];
                        else { completedState[setKey]=true; startTimer(90); playStrongBeep(); }
                        persist();
                        renderDayDetails(day);
                        updateMedals();
                        showToast(completedState[setKey]?`Set ${s} tamam`:"Set iptal");
                    };
                    container.appendChild(setDiv);
                }
            }
        });
        let sumDiv = document.getElementById("summaryBox");
        if(!sumDiv.classList.contains("hidden")) updateDaySummary(day);
    }
    function updateDaySummary(day) {
        let total=0, done=0;
        programData[day].forEach((item,idx)=>{
            if(typeof item === "string") { total++; if(completedState[`${day}|meal|${idx}`]) done++; }
            else if(item.sets) { for(let i=1;i<=item.sets;i++) { total++; if(completedState[`${day}|set|${item.ex}|${i}`]) done++; } }
        });
        document.getElementById("summaryBox").innerHTML = `📊 Gün: ${done}/${total} tamam | 💧 Su: ${waterIntake[day+"_water"]||0}`;
    }

    function openDay(day) {
        currentDay=day;
        document.getElementById("homeScreen").classList.add("hidden");
        document.getElementById("dayScreen").classList.remove("hidden");
        document.getElementById("dayTitle").innerText=day;
        renderDayDetails(day);
        stopTimer();
    }
    function closeDay() { stopTimer(); document.getElementById("homeScreen").classList.remove("hidden"); document.getElementById("dayScreen").classList.add("hidden"); updateMedals(); }

    function buildHome() {
        let grid = document.getElementById("daysGrid");
        grid.innerHTML = "";
        Object.keys(programData).forEach(day => {
            let card = document.createElement("div");
            card.className = "day-card";
            card.innerText = day;
            card.onclick = () => openDay(day);
            grid.appendChild(card);
        });
        updateMedals();
    }

    // MODAL (güne özel ekleme)
    function openAddModal() {
        document.getElementById("addModal").classList.remove("hidden");
        document.getElementById("modalSetsDiv").style.display = "none";
        document.getElementById("modalItemName").value = "";
    }
    document.getElementById("openDayAddModalBtn").onclick = openAddModal;
    document.getElementById("confirmModalBtn").onclick = () => {
        let type = document.getElementById("modalTypeSelect").value;
        let name = document.getElementById("modalItemName").value.trim();
        if(!name) { showToast("İsim girin"); return; }
        if(type === "meal") {
            programData[currentDay].push(name);
            showToast(`🍽️ ${name} eklendi (sadece ${currentDay})`);
        } else if(type === "exercise") {
            let sets = parseInt(document.getElementById("modalSets").value);
            if(isNaN(sets)) sets=3;
            programData[currentDay].push({ex:name, sets});
            showToast(`💪 ${name} (${sets} set) eklendi`);
        } else if(type === "supp") {
            programData[currentDay].push(`💊 ${name}`);
            showToast(`💊 ${name} eklendi`);
        }
        persist();
        renderDayDetails(currentDay);
        document.getElementById("addModal").classList.add("hidden");
    };
    document.getElementById("cancelModalBtn").onclick = () => document.getElementById("addModal").classList.add("hidden");
    document.getElementById("modalTypeSelect").onchange = () => {
        let show = document.getElementById("modalTypeSelect").value === "exercise";
        document.getElementById("modalSetsDiv").style.display = show ? "block" : "none";
    };

    // GLOBAL AYARLAR (silme)
    function refreshGlobalSettings() {
        let mealsDiv = document.getElementById("globalMealsList");
        let allMeals = new Set();
        for(let day in programData) {
            programData[day].forEach(i => { if(typeof i === "string" && !i.includes("💧") && !i.includes("🏋️") && !i.includes("🧘")) allMeals.add(i); });
        }
        mealsDiv.innerHTML = "";
        [...allMeals].forEach(meal => {
            let div = document.createElement("div"); div.className="custom-item";
            div.innerHTML = `<span>🍽️ ${meal}</span><button class="delete-btn" data-type="meal" data-value="${meal}">Sil</button>`;
            mealsDiv.appendChild(div);
        });
        let exDiv = document.getElementById("globalExList");
        let allEx = new Set();
        for(let day in programData) {
            programData[day].forEach(i => { if(i.ex) allEx.add(JSON.stringify({name:i.ex, sets:i.sets})); });
        }
        exDiv.innerHTML = "";
        [...allEx].forEach(exStr => {
            let ex = JSON.parse(exStr);
            let div = document.createElement("div"); div.className="custom-item";
            div.innerHTML = `<span>💪 ${ex.name} (${ex.sets} set)</span><button class="delete-btn" data-type="ex" data-name="${ex.name}">Sil</button>`;
            exDiv.appendChild(div);
        });
        let suppDiv = document.getElementById("globalSuppList");
        let allSupp = new Set();
        for(let day in programData) {
            programData[day].forEach(i => { if(typeof i === "string" && i.includes("💊")) allSupp.add(i); });
        }
        suppDiv.innerHTML = "";
        [...allSupp].forEach(supp => {
            let div = document.createElement("div"); div.className="custom-item";
            div.innerHTML = `<span>💊 ${supp}</span><button class="delete-btn" data-type="supp" data-value="${supp}">Sil</button>`;
            suppDiv.appendChild(div);
        });
        document.querySelectorAll(".delete-btn").forEach(btn => {
            btn.onclick = () => {
                let type = btn.dataset.type;
                let val = btn.dataset.value || btn.dataset.name;
                for(let day in programData) {
                    if(type === "meal") programData[day] = programData[day].filter(i => !(typeof i === "string" && i===val));
                    if(type === "ex") programData[day] = programData[day].filter(i => !(i.ex && i.ex===val));
                    if(type === "supp") programData[day] = programData[day].filter(i => !(typeof i === "string" && i===val));
                }
                persist();
                refreshGlobalSettings();
                if(currentDay && !document.getElementById("homeScreen").classList.contains("hidden")===false) renderDayDetails(currentDay);
                else buildHome();
                showToast("Silindi!");
            };
        });
    }

    function showToast(msg) {
        let t = document.createElement("div"); t.className="toast"; t.innerText=msg; document.body.appendChild(t);
        setTimeout(()=>t.remove(),1500);
    }

    document.getElementById("openSettingsBtn").onclick = () => { document.getElementById("settingsPanel").classList.remove("hidden"); refreshGlobalSettings(); };
    document.getElementById("closeSettingsBtn").onclick = () => document.getElementById("settingsPanel").classList.add("hidden");
    document.getElementById("backHomeBtn").onclick = closeDay;
    document.getElementById("daySummaryBtn").onclick = () => { if(currentDay) updateDaySummary(currentDay); let sb=document.getElementById("summaryBox"); sb.classList.toggle("hidden"); };

    loadAll();
    loadAlarms();
    buildHome();
    updateMedals();
</script>
</body>
</html>
